# 実装基盤とアプリケーション形態
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'platform'
domain_title = '実装基盤とアプリケーション形態'
prefix = 'TR-PLT'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Unknown] 対応 OS の判断根拠が存在しない。** 調査 PDF は出典の説明に OS が調査項目であったことを明記しているが、本文・図・付録のいずれにも OS 分布の数値が載っていない。**Windows / macOS / Linux への投資配分という最も後戻りしにくい決定が、測定値なしで下されている。** 原典記事の OS 分布を確認するのが、この領域で最も費用対効果の高い次の一手。',
  '**[Risk] Windows と macOS でインストールの段差をゼロにできる度合いが非対称で、これを埋める手がない。** Mac App Store で同等にするには App Sandbox が必要で、UTAU 音源フォルダへの自由な書き出しと外部 resampler の実行が制約を受ける。Developer ID + notarization を選ぶと、macOS Sequoia 以降は「システム設定 > プライバシーとセキュリティ」を経由する手順が残り、しかも「開くことを許可」ボタンは起動失敗後1時間しか出ない。**ミナに相当する macOS ユーザーの初回起動体験は、Windows より確実に悪い状態で出荷することになる。**',
  '**[Unknown] Azure Artifact Signing を日本から契約できるかが、Microsoft の2つの公式ページで矛盾している。** Artifact Signing の quickstart は Public Trust 証明書の提供対象に日本の組織を含め、リージョンにも Japan East を挙げる。一方 Windows の code-signing-options は対象を米国・カナダ・EU・英国とし日本を含めない。個人開発者は両ページとも米国・カナダのみで一致。**使えない場合は OV 証明書＋ハードウェアトークン運用となり、CI での自動署名を諦めることになる。**',
  '**[Fact] 文字コード判定は自前実装で両方の MPL-1.1 部品を落とせる。** UTF.Unknown は MPL-1.1 / GPL-2.0+ / LGPL-2.1+ のトライライセンスで、法的には MPL-1.1 を選べば同梱できるが、MPL-1.1 はファイル単位のコピーレフトで、当該ファイルを改変した場合はそのソースの公開義務が生じる。文字コード判定は KOERU が扱う対象に合わせて調整したくなる箇所であり、改変しない運用を維持できる保証がない。uchardet も MPL-1.1 で同じ性質。**KOERU が判定すべきなのは汎用の文字コード検出ではなく、UTF-8 BOM の有無 / UTF-8 として妥当なバイト列か / CP932 として妥当なバイト列か、の3分岐だけである**（扱うファイル種別が固定されているため）。100行程度で書けて誤判定の挙動も自分で決められる。',
  '**[Fact] Unknown ライセンスは「調査中」ではなく「全権利留保」として扱う。** 要調査という中間状態を実装計画上は不適と同義に扱い、調査完了までは代替を前提に設計する。加えて、クローズドソースの既存ツール（moresampler / resampler.exe）については、参照してよいのを「公開文書に書かれた機能仕様」「ユーザーの証言による到達水準」「入出力のファイル形式」に限定し、**バイナリの逆コンパイル、および出力の系統的な観察からアルゴリズムを再現する行為を明示的に禁止する。** setParam については GPL の Tcl ソースを読まずに、UI 文字列と公開されたキーバインド一覧という機能的事実からのみ互換基準を定める。TR-EDT-27 の一括編集12種が setParam / KiraOtoToolbox（GPL-3.0）/ vLabeler の交差から決められている点は、機能リストという事実の抽出であって問題にならないが、**実装は独立に行う旨を要件に書き添える。**',
]

[[requirement]]
id = 'TR-PLT-01'
title = '対応 OS の範囲と最小バージョン'
confidence = 'Assumption'
needs_component = false
depends_on = []
statement = 'Windows x64 を第一級の対応環境とし全機能が動作する。macOS（Apple Silicon）を第二の対応環境とし同一機能セットを提供する。Linux x64 は録音・原音設定・書き出しの中核機能のみを対象とし、配布形態と保証水準を分けて明示する。UTAU 本体の同梱・起動は行わない'
notes = [
  '[Risk] OS 分布が [Unknown] のまま3 OS に投資すると、Linux 対応の工数が使われない機能に消える。逆に Windows 単独に絞ると、vLabeler / RecStar / OpenUtau がすべてクロスプラットフォームである環境で唯一の Windows 専用ツールになり、ハルの乗り換え判断で不利になる。',
  '[Risk] Linux の保証水準を下げる判断は、Linux ユーザーが実は無視できない比率だった場合に取り返しづらい（配布後に対応を追加するより、最初から入れる方が安い）。',
]

[[requirement]]
id = 'TR-PLT-02'
title = 'CPU アーキテクチャ別ビルドの範囲'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-01',
]
statement = 'win-x64、osx-arm64、osx-x64、linux-x64 の4構成をリリース資産として出すこと。win-arm64 は Windows on ARM 上の x64 エミュレーションで録音・試唱・原音設定編集が動作することを確認した上で、専用ビルドを出さない判断を許容する。x86（32bit）ビルドは出さない。macOS は universal2 単一バイナリではなく arm64 / x64 別ビルドとし、ダウンロードサイズを増やさないこと。'
notes = [
  '[Risk] win-arm64 でネイティブ音声 I/O ライブラリがエミュレーション下で期待通り動かない場合、録音という中核機能が黙って壊れる。エミュレーション動作確認を出荷前チェックに入れないと発見が公開後になる。',
]

[[requirement]]
id = 'TR-PLT-03'
title = 'GUI 基盤が満たすべき条件'
confidence = 'Fact'
depends_on = [
  'TR-PLT-01',
]
statement = 'GUI 基盤は **(a) ライセンスが許諾表記のみで単一ネイティブアプリに同梱・再配布できる**ことを必須条件とし、残る条件を候補間の比較軸として用いる。比較軸は (b) Windows / macOS / Linux のデスクトップを一つのコードベースで対象にできる、(c) 任意のネイティブ共有ライブラリ（`.dll` / `.dylib` / `.so`）を追加ランタイムなしで直接呼べる、(d) 60fps を維持できる自前描画面をアプリ側から直接持てる、(e) OS 標準の日本語 IME で音源名・エイリアス・規約本文を入力でき、変換中の文字列が入力位置に表示される、(f) ランタイムを内包した単一の配布物を生成でき、エンドユーザーに別途ランタイムのインストールを要求しない、の5点とする。**採用は Tauri。** フロントは WebView、描画は Canvas / WebGL、ネイティブ側は Rust から FFI で共有ライブラリを直接呼ぶ。日本語 IME と OS のアクセシビリティ API への対応が最も確実である点が、(e) とアクセシビリティ要件の両方に効く。'
notes = [
  '[Risk] WebView 上の日本語 IME は、変換中文字列の表示位置と再変換（確定済み文字列の再編集）の挙動が OS とエンジンに依存する。テキスト入力量は少ないが、規約本文の編集で露出する。実機で3 OS 分を確認する。',
]

[[requirement]]
id = 'TR-PLT-04'
title = '波形・スペクトログラム描画の実装方式'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-03',
]
statement = '波形とスペクトログラムは、GUI フレームワークの標準コントロールを組み合わせずに、アプリが所有する単一の描画面へ直接描くこと。表示は「可視域のみ計算・可視域のみ描画」を原則とし、ズーム倍率が変わっても表示中の画素数に比例した計算量に収まること。波形はサンプル数がピクセル数を超える倍率で min/max 包絡のミップマップを事前構築して使い、スペクトログラムは STFT 結果をテクスチャ／ビットマップとしてキャッシュし、パン・ズーム中は再計算せず再サンプルのみ行うこと。素材ファイル全体の STFT を一括で先行計算する実装にしないこと。'
notes = [
  '[Risk] 多音階連続音では素材ファイル数が数百に達し、エントリ切替ごとに STFT キャッシュを捨てるとキャッシュミスが操作感を殺す。キャッシュのライフサイクル設計を後回しにすると、素材が増えた段階で初めて破綻が見える。',
]

[[requirement]]
id = 'TR-PLT-05'
title = '音声入出力の実装方式'
confidence = 'Fact'
depends_on = [
  'TR-PLT-03',
]
statement = '録音入力と再生出力は GUI ランタイム付属の音声 API に依存せず、OS ネイティブ音声 API（WASAPI / CoreAudio / ALSA・PulseAudio）を叩くネイティブライブラリ経由で実装する。デバイス列挙・レートとビット深度の選択・抜き差し検知を3 OS で同一 API で扱う。最低 44.1kHz / 16bit を保証し 48kHz / 24bit を選択できる'
notes = [
  '[Risk] 録音品質のリアルタイム判定は初期スコープ外と決まっているため、入力レベルの異常はユーザーには試唱まで見えない。音声 I/O 層が入力レベルを取れない実装だと、後からスコープに入れる際に層を作り直すことになる。',
  '[Risk] Linux は ALSA / PulseAudio / PipeWire の3系統が混在しており、ネイティブライブラリ側のバックエンド選択が環境依存で外れると「Linux では録音できない」が起きる。',
]

[[requirement]]
id = 'TR-PLT-06'
title = 'ネイティブライブラリとの FFI 境界'
confidence = 'Fact'
depends_on = [
  'TR-PLT-03',
  'TR-PLT-05',
]
statement = '音声解析・合成・推論のネイティブライブラリはプロセス内で呼べる共有ライブラリとして同梱し、GUI 言語から直接 FFI で呼ぶ。境界を跨ぐデータは PCM バッファとパラメータ構造体に限定し、ファイル経由やプロセス間 IPC を通さない。3 OS × 対象アーキテクチャ分をリリース資産に同梱し実行時ダウンロードしない'

[[requirement]]
id = 'TR-PLT-07'
title = 'スクリプト言語ランタイムを配布物に含めない'
confidence = 'Fact'
depends_on = [
  'TR-PLT-06',
]
statement = '配布物に Python / Conda 環境、Node.js ランタイム、外部パッケージマネージャの導入を要求する依存を含めない。アライメント処理はネイティブ共有ライブラリまたは ONNX 推論としてプロセス内で実行できる形に落とせるものだけを採用する。Conda 経由の Kaldi バイナリ前提の実装、PyTorch ランタイムを要する実装は精度が良くても採用しない'
notes = [
  '[Risk] この要件は自動原音設定の技術選択肢を強く絞る。MFA が日本語話声で平均境界誤差 10.1ms という最良値を出している一方、それを同梱可能な形に持ち込めるかは未確認。持ち込めなければ精度で劣る手法を選ぶか、単一ネイティブアプリの前提を曲げるかの二択になる。',
]

[[requirement]]
id = 'TR-PLT-08'
title = 'CP932（Shift-JIS）の読み書き'
confidence = 'Fact'
depends_on = []
statement = 'oto.ini、character.txt、prefix.map、readme 等の UTAU 音源ファイルは CP932（Shift-JIS）で書き出せること。書き出し文字コードは UTF-8 と CP932 から選べ、既定は UTAU 本体互換の CP932 とすること。既存音源フォルダを読み込む際は文字コードを推定し、推定に失敗した場合は文字化けした状態で黙って読み込まず、ユーザーに文字コードを指定させる経路を出すこと。CP932 で表現できない文字（絵文字、一部の異体字）を音源名やエイリアスに入力された場合は、書き出し前に検出して代替を促すこと。ファイル名とフォルダ名も同じ制約下で扱うこと。'
notes = [
  '[Risk] UTF.Unknown は MPL-1.1 / GPL-2.0+ / LGPL-2.1+ の三択ライセンスであり、MPL-1.1 を選ぶ場合は当該ファイルを改変したときにそのソースを公開する義務が生じる。同梱自体は可能だが、無条件の許諾表記だけで済む部品ではない。',
  '[Risk] macOS / Linux で作った音源フォルダを Windows の UTAU に渡す経路で、`._` 付きの AppleDouble ファイルや NFD 正規化されたファイル名が混入する。この後始末を配布パッケージ生成に組み込まないと、受け取った側で壊れる。',
]

[[requirement]]
id = 'TR-PLT-09'
title = '日本語 IME での入力'
confidence = 'Fact'
depends_on = [
  'TR-PLT-03',
]
statement = '音源名、エイリアス、利用規約本文、クレジット、コメントの各入力欄で、OS 標準の日本語 IME による入力が成立すること。具体的には、変換候補ウィンドウがカーソル位置に出る、変換中の未確定文字列が入力欄に表示される、確定・取り消しが期待通り効く、ダイアログ上の入力欄でも同じ挙動になる、の4点を Windows / macOS / Linux それぞれで出荷前に確認すること。確認できない挙動がある場合は、その入力欄を IME を必要としない入力（候補選択、英数のみ）に置き換えるか、OS 側の対応が済むまでその機能を出さないこと。'
notes = [
  '[Risk] KOERU は日本語話者向けの日本語ファーストな製品であるにもかかわらず、採用候補のどれも日本語 IME を完全にはサポートしていない。この確認をリリース基準に入れないと、ミナが最初に触る「音源名の入力欄」で製品の第一印象が壊れる。',
]

[[requirement]]
id = 'TR-PLT-10'
title = 'OpenUtau は仕様として参照するだけで、コードを取り込まない'
confidence = 'Fact'
depends_on = [
  'TR-PLT-03',
]
statement = 'UTAU 音源形式の読み書き、phonemizer、resampler 呼び出し、かな／ローマ字変換、文字コード検出は、**すべて自前実装とする。OpenUtau のソースを vendoring / submodule / 移植の形で取り込まない。** OpenUtau は**公開された仕様と振る舞いの参照先**として扱う。**KOERU は Rust であり OpenUtau は C# なので、コード再利用と呼べる形が実際には存在しない。** 移植は結局のところ仕様を読んで書き直す作業であり、由来の明示と上流追従のコストだけが残る。**互換性の保証は CI に置く。** (1) 生成した音源が OpenUtau の最新リリースで読み込めること、(2) 同一の USTX・同一の音源・同一の合成エンジンに対して OpenUtau と KOERU の出力が一致すること、の2つを検証する。**(2) が、試唱が嘘をつかないことの唯一の実質的な担保になる。** エイリアス解決順（TR-SYN-12）とカバレッジ判定（TR-RCL-20）が OpenUtau の候補探索順と一致することも、仕様参照として保つ'
notes = [
  '[Risk] OpenUtau の作者・コミュニティから見て KOERU が競合に見えると、エコシステム内での受容が下がる（personas U5）。ライブラリとして依存し出力互換を保証する姿勢は、この摩擦を下げる方向にも効くが、保証はない。',
]

[[requirement]]
id = 'TR-PLT-11'
title = 'vLabeler / RecStar との部品共有の範囲'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-03',
  'TR-PLT-10',
]
statement = 'vLabeler と RecStar からは、コードを流用せず、次の3点を仕様として参照すること。(a) oto.ini の5値編集におけるキーバインドの割り当てと操作単位、(b) 録音セッションの構造（録音リスト、ガイド BGM、連続収録、コメント）、(c) labeler 相当の「方式ごとのパラメータ定義」の抽象。参照した結果として KOERU が持つショートカットは、vLabeler の既定と衝突しない、または同一の意味を持つように割り当てること。Apache-2.0 のソースを取り込む場合は、同一言語スタックを選択した場合に限り、NOTICE ファイルの同梱と改変箇所の明示を行うこと。'
notes = [
  '[Risk] 「vLabeler と同等の編集機能」を仕様参照だけで達成しようとすると、実装量が丸ごと残る。ここが必須要件であることは確定方針に含まれているため、工数を過小に見積もると上級モードが最初のリリースに入らず、ハルは部分利用に落ちる。',
]

[[requirement]]
id = 'TR-PLT-12'
title = 'Windows の主配布経路'
confidence = 'Fact'
depends_on = [
  'TR-PLT-01',
  'TR-PLT-03',
]
statement = 'Windows の主配布経路を**直接ダウンロード**とする。実行ファイルとインストーラは Microsoft Trusted Root Program の CA に連なる証明書で Authenticode 署名し、無署名・自己署名で配布しない。署名 ID はリリースをまたいで同一にする。EV 証明書を SmartScreen 回避目的で購入しない。**WebView2 は固定バージョンを同梱し、実行環境のランタイム有無に依存しない**（配布サイズは約180MB 増える）。マイク使用は OS のプライバシー設定にアプリ単位の項目として現れるようにする。**Microsoft Store（MSIX）経路は取らない。** AGPL-3.0 および LGPL 部品と Store の再署名・改ざん保護が両立しないためで、これは配布形態の選択ではなくライセンス上の帰結である。'
notes = [
  '[Risk] スマホの検索結果から Store のアプリページへ辿り、PC 側の Store アプリを開くまでの導線自体が段差になる。Store が段差ゼロにするのはインストール実行時の警告だけで、Store に到達させるまでの摩擦は消えない。',
  '[Risk] WebView2 の固定バージョン同梱で配布サイズが約180MB 増える。120MB のダウンロードサイズ予算はこの構成では成立しないため、予算側を積み直す必要がある。',
  '[Risk] 直接ダウンロードでは初期リリースで SmartScreen の警告が出る。署名の実績が貯まるまで解消しないため、配布ページで実際の画面を事前に見せる前提で設計する。',
]

[[requirement]]
id = 'TR-PLT-13'
title = 'Windows の直接ダウンロード経路と署名'
confidence = 'Fact'
depends_on = [
  'TR-PLT-12',
]
statement = '直接ダウンロードを**主配布経路**とする。実行ファイルとインストーラは Microsoft Trusted Root Program の CA に連なる証明書で Authenticode 署名する。無署名・自己署名で配布しない。署名 ID はリリースをまたいで同一にする。EV 証明書を SmartScreen 回避目的で購入しない。初期リリースで警告が出ることを前提に、配布ページで両経路の実際の画面を事前に見せる'
notes = [
  '[Risk] 直接ダウンロード経路が主経路になってしまうと、ミナは「Windows によって PC が保護されました」に当たる。この経路を併設すること自体が、Store 経路の優位を薄める可能性がある。',
  '[Risk] Azure Artifact Signing（旧 Trusted Signing、月額約9.99ドル、ハードウェアトークン不要）の日本からの利用可否について、Microsoft の2つの公式ページが矛盾した記述をしている。使えない場合は OV 証明書＋ハードウェアトークンの運用が必要で、CI での自動署名が難しくなる。',
]

[[requirement]]
id = 'TR-PLT-14'
title = 'macOS の配布と Gatekeeper'
confidence = 'Fact'
depends_on = [
  'TR-PLT-01',
  'TR-PLT-03',
  'TR-PLT-18',
]
statement = 'macOS 版は Developer ID Application 証明書で署名し、Hardened Runtime を有効にし、notarization を通し、ticket を DMG に staple して配布する。Info.plist の NSMicrophoneUsageDescription を日本語で設定し、マイク入力エンタイトルメントを付与する。ダブルクリック起動でマイク許可ダイアログが実際に出ることを毎リリース確認する'
notes = [
  '[Risk] Windows は Store で第一印象の段差をゼロにできるが、macOS で同等にするには Mac App Store が必要で、App Sandbox 下では UTAU 音源フォルダへの自由な書き出しと外部 resampler 実行が制約を受ける。結果として「Windows は段差ゼロ・macOS は段差あり」という非対称が残る。',
  '[Risk] 「開くことを許可」ボタンの1時間の表示期限は、初めて触る人が手順を調べている間に消える。macOS 側の初回起動体験は Windows より確実に悪い。',
]

[[requirement]]
id = 'TR-PLT-15'
title = 'Linux の配布形態'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-01',
  'TR-PLT-05',
]
statement = 'Linux は **Flatpak の1形態で配布する。** WebKitGTK のディストリビューション依存を Flatpak runtime に吸収できることが理由で、Tauri を選んだ以上ここが最大のリスクになる。deb / AppImage / rpm を初期リリースで併載しない。**[Risk]** AppImage 形式を採らないため、Flatpak を使わない利用者には配布経路が無い。Linux が中核機能のみの第三対応環境である位置づけと整合するが、比率が読めていないことは残る。ランタイムを内包し追加パッケージの導入を要求しないこと、音声バックエンドは PulseAudio / PipeWire 経由で動くことは変わらない。'

[[requirement]]
id = 'TR-PLT-16'
title = '自動更新'
confidence = 'Fact'
depends_on = [
  'TR-PLT-12',
  'TR-PLT-13',
  'TR-PLT-20',
]
statement = 'Store 経由でインストールされた場合は Store の更新機構に委ね、アプリ独自の更新チェックを行わないこと。直接ダウンロード経路でインストールされた場合は、appcast 形式の更新情報を取得して更新の有無を通知し、ユーザーの明示的な同意の上で差し替えること。更新チェックの通信は「更新の有無」の問い合わせに限り、声のデータ・プロジェクト内容・利用状況を送らないこと。ネットワークに繋がらない環境で更新チェックが失敗しても、アプリの全機能が制限なく動作すること。更新のダウンロードは録音中・解析中には開始せず、次回起動時に持ち越すこと。'
notes = [
  '[Risk] product-vision の「利用計測を実装するか」が未決のまま更新機構を実装すると、後から計測を追加する際にプライバシー方針の説明をやり直すことになる。更新チェックの通信仕様は計測の可否と一緒に決める必要がある。',
]

[[requirement]]
id = 'TR-PLT-17'
title = '発見から着手までの段差の最小化'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-PLT-12',
  'TR-PLT-18',
  'TR-PLT-19',
]
formalized_as = [
  'REQ-PLT-001',
  'REQ-PLT-004',
  'INV-PLT-001',
  'AC-PLT-001',
  'FB-PLT-002',
]
statement = 'スマホで見つけて PC で録るという端末の分断に対し、次の3点を満たすこと。(a) 公式配布ページは、アクセスした端末が対応 OS を持つ PC でない場合に「この端末では録れない」ではなく「PC でここを開く」の一手を提示し、短い URL または QR コードで PC 側に受け渡せること。(b) PC 側の配布ページは、OS とアーキテクチャを自動判定して1つのダウンロードボタンだけを出し、複数の資産を選ばせないこと。(c) インストール完了から最初のフレーズが画面に出るまでに、ユーザーの操作を「起動」「音源名の入力（既定値のまま通過可）」「方式の選択」「マイクの許可」の4つだけに限ること。アカウント作成、サインイン、利用規約への同意、初回設定ウィザードを、この4つの前に挟まないこと。'
notes = [
  '[Risk] 「規約への同意を4つの前に挟まない」は、Store 提出時のプライバシー方針表示要件やマイク使用の説明責任と衝突しうる。',
]

[[requirement]]
id = 'TR-PLT-18'
title = 'マイク権限の取得と拒否からの回復'
confidence = 'Fact'
depends_on = [
  'TR-PLT-05',
  'TR-PLT-14',
]
formalized_as = [
  'REQ-PLT-002',
  'REQ-PLT-003',
  'INV-PLT-002',
  'INV-PLT-003',
  'AC-PLT-002',
  'FB-PLT-001',
  'FB-PLT-003',
]
statement = 'マイク権限は、初回の録音画面に入る直前の1回だけ要求すること。起動時やプロジェクト作成時には要求しないこと。権限が拒否された場合、またはOS 側の全体設定で無効化されている場合は、無音のまま録音が進む状態にせず、「マイクが使えない」ことと、その OS における具体的な解除手順（Windows: 設定 > プライバシーとセキュリティ > マイク、macOS: システム設定 > プライバシーとセキュリティ > マイク）を画面内に提示し、設定画面を開くボタンを出すこと。権限が付与されたあと、アプリを再起動せずに録音を再開できること。'

[[requirement]]
id = 'TR-PLT-19'
title = '配布サイズと推論モデルの同梱方針'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-06',
  'TR-PLT-07',
  'TR-PLT-20',
]
statement = '推論モデルとネイティブライブラリは既定構成のインストーラに同梱し、初回起動後の追加ダウンロードをゼロにする。ONNX Runtime は CPU 実行プロバイダのみとし GPU（CUDA / DirectML）プロバイダを含めない。**三者トレードオフ（サイズ／オフライン完結／精度）の優先順位を「オフライン完結 ＞ 精度 ＞ サイズ」とし、サイズが溢れた場合の逃げは初回ダウンロードではなく方式の絞り込みと量子化に取る**'
notes = [
  '[Risk] 自動原音設定に必要なモデルの実サイズが未知。数百MB規模なら 120MB の予算は成立せず、初回ダウンロードが必須になる。その場合、深夜に初めて触る人に対して「ダウンロードを待つ」段差が一つ増える。',
  '[Risk] GPU プロバイダを同梱しない判断は、自動原音設定の処理時間を CPU 性能に縛る。ミナの想定端末（学生・可処分所得が低い前提）で試唱までの待ち時間が許容範囲を超えると、中核体験が崩れる。',
]

[[requirement]]
id = 'TR-PLT-20'
title = 'オフライン完結性'
confidence = 'Fact'
needs_component = false
depends_on = []
statement = '録音・自動原音設定・即時試唱・原音設定編集・配布パッケージ生成のすべてがネットワーク接続なしで完結する。ネットワークを使うのは更新チェックとユーザーが明示的に開いた外部リンクのみ。起動時・プロジェクト作成時・録音開始時に到達性確認を置かない。声の波形・プロジェクト・音源名・規約本文が外へ送出されないことを、通信の発生箇所の棚卸しで示せる'
notes = [
  '[Risk] TR-PLT-19 で初回ダウンロードを許容せざるを得なくなった場合、「オフラインで動く」は初回起動時だけ成立しない。この一点の例外を方針違反と見るか初期セットアップと見るかは、まだ決まっていない。',
]

[[requirement]]
id = 'TR-PLT-21'
title = '単一アプリケーションとして完結する'
confidence = 'Assumption'
depends_on = [
  'TR-PLT-03',
  'TR-PLT-06',
  'TR-PLT-20',
]
statement = 'KOERU は**単一のアプリケーションとして完結する。** (a) 独自の常駐デーモン・バックグラウンドサービスを持たない、(b) ローカル HTTP サーバを立てない、(c) 利用者が自分で管理する外部ランタイム（Python / Conda / Node.js など）を要求しない、(d) 解析・推論・合成をネットワーク越しに逃がさない。**OS 上のプロセス数が1つであることは要求しない。** GUI 基盤に Tauri を採ったため WebView は別プロセスで動き、これは避けられない（メモリ予算はこの前提で積む）。UI スレッドは描画と入力処理のみを持ち、解析・推論・書き出しはワーカースレッドへ逃がし、録音中および試唱の再生中に UI が応答不能にならないこと。外部プロセスの起動は、利用者が明示的に選んだ外部ツールの起動に限ること。'

[[requirement]]
id = 'TR-PLT-22'
title = '第三者ライセンスの同梱と表記'
confidence = 'Fact'
depends_on = [
  'TR-PLT-06',
  'TR-PLT-10',
  'TR-PLT-11',
]
statement = '同梱するすべての第三者コード・モデル・データのライセンス種別と原著作者を列挙した一覧をアプリ内から参照でき、ライセンス本文を配布物に同梱する。Apache-2.0 の NOTICE を保持する。**台帳検証は「SPDX 式に GPL/LGPL/AGPL の語が出たら失敗」ではなく「台帳に選択したライセンスを1つ明記させ、それが許諾リストに入っているかを検証する」形にする。**（トライライセンス部品で正当に許諾的な選択をした場合に弾かれないため。選択の記録を台帳の必須欄にする）'

[[requirement]]
id = 'TR-PLT-23'
title = 'プロジェクトデータの配置と可搬性'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PLT-08',
]
statement = 'プロジェクトは1フォルダに自己完結し、WAV・パラメータ・方式とカバレッジ状態・音源メタをすべてその中に置く。フォルダをコピー・別 OS へ移動してもパス書き換えなしに開ける。絶対パスを保存しない。アプリ設定・キャッシュ・ログは OS 標準の場所に置きプロジェクトに混ぜない'

[[requirement]]
id = 'TR-PLT-24'
title = 'ショートカット中心操作の OS 差の吸収'
confidence = 'Fact'
depends_on = [
  'TR-PLT-04',
  'TR-PLT-11',
]
statement = '原音設定の上級モードは、キーボードだけで5値の編集、エントリ間の移動、再生範囲の指定、ズームを完結できること。修飾キーは OS の慣習に合わせて割り当て（Windows / Linux の Ctrl に対して macOS は Command）、同一の意味を持つ操作が OS をまたいで同一のキーに見えること。キーバインドはユーザーが変更でき、変更内容がプロジェクトではなくアプリ設定として保存されること。'

[[requirement]]
id = 'TR-PLT-25'
title = 'WCAG 2.2 Level AA を適合水準とし、除外項目は理由とともに記録する'
confidence = 'Fact'
depends_on = ['TR-PLT-24']
statement = '適合水準を WCAG 2.2 Level AA とする。**適用できない達成基準は「対象外」ではなく「なぜ適用されないか」を記録する。** 現時点で適用されないのは、アカウントもログインも持たないため 3.3.8 アクセシブルな認証（最低限）、および収録した音声そのものがコンテンツではなく本人の成果物であるため 1.2 系の時間依存メディア（ガイド BGM を除く）。適合は宣言ではなく検査で担保し、自動検査（軸: 名前・役割・値、コントラスト、フォーカス順序）を CI に載せ、自動で測れない基準（キーボード完結、ドラッグの代替、状態通知の妥当性）は手順書に基づく手動確認とする'
notes = [
  'Tauri の WebView は OS のアクセシビリティ API へ公開する。WebView2 は UI Automation、WKWebView は NSAccessibility、WebKitGTK は AT-SPI。**3経路とも同じ実装で満たせるかは実測が要る**',
  'FSL では形式化しない。到達してはいけない状態がある性質ではなく、UI 表面の構造的性質なので、状態機械に載せても中身が空になる',
]

[[requirement]]
id = 'TR-PLT-26'
title = 'すべての機能にキーボードだけで到達でき、閉じ込められない'
confidence = 'Fact'
depends_on = ['TR-PLT-24', 'TR-PLT-25']
statement = '収録・原音設定・試唱・書き出しを含むすべての機能を、キーボードだけで開始し完了できる（WCAG 2.1.1）。どの要素からも Tab / Shift+Tab と Esc で抜けられ、閉じ込めを作らない（2.1.2）。**単一文字のショートカットは、無効化・再割り当て・フォーカス時のみ有効のいずれかを提供する**（2.1.4）。KOERU はショートカット中心の設計なので、この項目が最も広く効く。キーバインドの変更はアプリ設定として保存する（TR-PLT-24）'

[[requirement]]
id = 'TR-PLT-27'
title = 'フォーカスは常に見え、順序が意味に沿い、他の要素に隠れない'
confidence = 'Fact'
depends_on = ['TR-PLT-25', 'TR-PLT-26']
statement = 'キーボードフォーカスの位置が常に視覚的に判別できる（WCAG 2.4.7）。移動順序が意味と操作の順序に沿う（2.4.3）。**フォーカスされた要素が、固定ヘッダ・ツールバー・再生バーなどに完全に隠されない**（2.4.11、WCAG 2.2 で追加）。原音設定の波形上でも、いま選択している境界がどれかをフォーカス表示で示す'

[[requirement]]
id = 'TR-PLT-28'
title = '文字と UI 部品のコントラストを満たす。波形と境界線も対象にする'
confidence = 'Fact'
depends_on = ['TR-PLT-25']
statement = '文字と背景のコントラスト比を 4.5:1 以上（大きい文字は 3:1 以上）とする（WCAG 1.4.3）。UI 部品の境界と、意味を持つ図形のコントラスト比を 3:1 以上とする（1.4.11）。**波形・スペクトログラム上に重ねる境界線、選択範囲、確認待ちの印はこの 1.4.11 の対象。** 色だけで意味を伝えない（1.4.1）。確認待ち・違反・確定の区別は、色に加えて形または文字で示す'

[[requirement]]
id = 'TR-PLT-29'
title = '名前・役割・値を支援技術へ公開し、状態の変化を通知する'
confidence = 'Fact'
depends_on = ['TR-PLT-25']
statement = 'すべての UI 部品が、名前・役割・値・状態を OS のアクセシビリティ API へ公開する（WCAG 4.1.2）。**録音中・テイク確定・確認待ちの残り・書き出しの進行と完了・エラーは、フォーカスを奪わずに読み上げへ届く状態メッセージとして通知する**（4.1.3）。エラーは何が問題かを文字で示し、直し方が分かるなら提案する（3.3.1 / 3.3.3）'

[[requirement]]
id = 'TR-PLT-30'
title = 'ドラッグでしかできない操作を作らない'
confidence = 'Fact'
needs_component = false
depends_on = ['TR-PLT-25', 'TR-PLT-26']
statement = 'ドラッグで行える操作は、すべて単一ポインタの操作またはキーボードでも行える（WCAG 2.5.7、WCAG 2.2 で追加）。**原音設定の境界設定、波形のズームとスクロール、再生範囲の指定が直接の対象。** TR-EDT-44 がドラッグとキーの両方を持つので、**キー経路がドラッグと同じ範囲に到達できることを検査で担保する。** 数値の直接入力も同等の経路として数える'

[[requirement]]
id = 'TR-PLT-31'
title = '操作対象の大きさを 24×24 CSS ピクセル以上にする'
confidence = 'Fact'
depends_on = ['TR-PLT-25']
statement = 'ポインタで操作する対象の大きさを 24×24 CSS ピクセル以上とする（WCAG 2.5.8、WCAG 2.2 で追加）。満たせない場合は、対象の中心どうしが 24 ピクセル以上離れているか、同等の操作が別の場所にあることで代替する。**波形上の境界ハンドルはこの例外に当たりやすい。** 密集する場合はズームで間隔を広げられることを代替とし、キー経路（TR-PLT-30）を必ず併置する'

[[requirement]]
id = 'TR-PLT-32'
title = '波形とスペクトログラムに、見なくても判断できる代替を持たせる'
confidence = 'Fact'
needs_component = false
depends_on = ['TR-PLT-25', 'TR-PLT-29']
statement = '波形とスペクトログラムは装飾ではなく判断材料なので、非テキストコンテンツとして代替を持つ（WCAG 1.1.1）。代替は3つを併置する。(1) **区間再生**——選択中の境界の前後を鳴らして耳で確かめられること。(2) **数値**——oto の5値と、境界位置をミリ秒で読み上げられる形で提示すること。(3) **要約**——そのエントリが確認待ちである理由（確信度が低い、制約違反が残っている）を文字で示すこと。**KOERU は音を扱う製品なので、(1) が最も本質的な代替になる**'

[[requirement]]
id = 'TR-PLT-33'
title = '時間制限を調整でき、動きと点滅で妨げない'
confidence = 'Fact'
needs_component = false
depends_on = ['TR-PLT-25']
statement = '収録のカウントダウン、ガイド BGM の進行、自動で次へ送る挙動など、時間で切れるものは延長・停止・無効化のいずれかができる（WCAG 2.2.1）。**録音そのものの長さは本人の発声が決めるので時間制限ではない。** 自動再生する動きは停止できる（2.2.2）。1秒あたり3回を超える点滅を出さない（2.3.1）。OS の「動きを減らす」設定（`prefers-reduced-motion`）を尊重し、波形のスクロールアニメーションと画面遷移を抑える'

[[requirement]]
id = 'TR-PLT-34'
title = '文字の拡大と行間の変更で、内容が失われない'
confidence = 'Fact'
needs_component = false
depends_on = ['TR-PLT-25']
statement = '文字を 200% まで拡大しても、内容と機能が失われない（WCAG 1.4.4）。行間・段落間・文字間・単語間を指定の値まで変えても、内容が切れたり重なったりしない（1.4.12）。ホバーまたはフォーカスで出る追加内容は、消さずに読め、Esc で閉じられ、ポインタを乗せても消えない（1.4.13）。**波形と数値テーブルが並ぶ画面は、拡大時に数値テーブル側を優先して残す**'
