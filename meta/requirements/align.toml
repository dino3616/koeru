# 自動原音設定（強制アライメントと oto 推定）
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

domain = 'align'
domain_title = '自動原音設定（強制アライメントと oto 推定）'
prefix = 'TR-ALN'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Unknown] 確信度4成分の合成重みを決める根拠がない。** 内部評価ハーネスで参照データを作るまで恣意的な値になり、確認キューの構成品質が測れない。',
  '**[Unknown] 持続母音（単独音の1秒級の「あ」）に対して、話声で学習したアライナがどう振る舞うかを評価した文献が見つからない。** 母音内のフレームが均質で境界の手がかりが薄いため、境界推定が破綻する可能性も、逆に境界が2つだけで容易である可能性も、どちらも根拠がない。',
  '**[Unknown] 無声破裂音（k / t / p）で始まるモーラのオフセット・オーバーラップの規約が、コミュニティ内で「0」と「マイナス」の両方で語られており、既定値を機械的に決める根拠がない。** CVVC の VC では固定範囲と右ブランクを無音部に置くという別分岐も入るため、子音クラス判定の誤りが規約適用そのものを誤らせる。→ TR-ALN-16 / 17 の事後検証で閉じる。',
  '**[Risk] 逐次推定と話者内一貫性補正が構造的に衝突する。** 序盤のテイクでは集団統計が立たず、後から値が動く。確認済みの箇所を後から動かさないための境界をどう引くかが未決（TR-ALN-30 の値単位固定がその一部を担う）。',
  '**[Risk] 「録音品質のリアルタイム判定はスコープ外」と「確信度が低い箇所だけ確認させる」が部分的に衝突する。** 確信度が下がる主要因は録音品質であり、確信度提示は録音品質の問題を事後に露出させる。このとき oto の数値をどう直しても音は良くならないため、確認 UI は必然的に「録り直し」を提案する経路を持つことになり、それは録音品質判定を遅延した形でスコープに引き込むことに等しい。**判定を録音時に行わない代わりに確認時に行うのか、それも行わないのかを決める必要がある。**',
]

[[requirement]]
id = 'TR-ALN-01'
title = '実行時ランタイム境界'
confidence = 'Fact'
depends_on = []
statement = '自動原音設定の実行経路に Python インタプリタ、conda 環境、外部データベースサーバ、常駐する別プロセス、ユーザーによる追加インストールを一切含めない。インストール直後・ネットワーク切断状態で、追加取得なしに全方式の推定が動作する'
notes = [
  'この境界を守ると、精度が最良と実測されている MFA のランタイムを使えなくなる',
  '将来より良いアライナが Python 前提で登場した場合、移植工数を毎回払うことになる',
]

[[requirement]]
id = 'TR-ALN-02'
title = 'アライナの実装形態と同梱予算'
confidence = 'Fact'
depends_on = [
  'TR-ALN-01',
]
statement = 'アライナは **(a) アプリ本体と同じ言語でのネイティブ実装を既定とする。** (b) ONNX Runtime を同梱した推論は、将来 ONNX を必要とする別の機能が入った場合にのみ再検討する。同梱物（モデル重み＋辞書）の合計を 50MB 以下、ピークメモリを **64MB 程度**（プロセス全体予算からの配分。B5 参照）に収める。**[Fact] CPU 単体・50MB 以内という制約下で日本語に使える既存の学習済みモデルは snfa 級（約1MB）と Julius 級（約3.6MB）しか存在せず、20〜60MB 級の中間帯は空である。したがって精度は既存モデルの差し替えでは改善できない**'
notes = [
  '歌声向けアライナ（HubertFA）を採る場合、モデルだけで 244MB あり 50MB 予算を守れない',
  'ONNX Runtime を同梱すると、プラットフォームごとのネイティブライブラリ配布・署名の手間が増える',
]

[[requirement]]
id = 'TR-ALN-03'
title = 'アライメント本体の候補と、精度を宣言しない条件'
confidence = 'Assumption'
depends_on = [
  'TR-ALN-02',
]
statement = 'アライメント本体の第一候補を **Julius セグメンテーションキット**（TR-ALN-04）とし、小型フレーム分類アライナ（snfa 参照の CTC* 構造＋線形 HMM Viterbi の自前移植）は対抗候補として位置づける。**[Fact] snfa の日本語重みは Common Voice ja 20.0 に対する CTC 損失＋メル再構成損失のみで学習されており、境界の教師信号を持たない。公開された境界精度の数値は存在せず、README の MFA comparable は著者の未検証の主張である。** したがって snfa を移植したときの境界精度は **[Unknown]** であり、これを前提に到達水準を宣言しない。いずれの実装も emission 行列（フレーム×音素の事後確率）を呼び出し側に返し、TR-ALN-24 の確信度計算に使えること。snfa 系を採る場合、`phone_set` に撥音 N がなく無声化母音を区別しない点を制約として明記し、撥音・促音・長音を UTAU 録音リストの記法から 38 音素へ写像する規則と、その写像で失われる区別を確信度低下要因として扱う。'
notes = [
  'snfa の日本語重みは Common Voice（話声）で学習されており、UTAU 単独音のような1秒級の持続母音での挙動が未検証',
  'README の「MFA comparable alignment quality」は著者の主張で、公開された数値比較が存在しない',
  'hop=160（10ms）はフレーム分解能が粗く、TR-ALN-06 を満たすには補間か再学習が必要',
]

[[requirement]]
id = 'TR-ALN-04'
title = 'Julius セグメンテーションキットを一次経路として実装する'
confidence = 'Fact'
depends_on = [
  'TR-ALN-01',
  'TR-ALN-06',
]
statement = '**Julius セグメンテーションキットを一次経路として実装する。** 日本語音響モデル（`hmmdefs_monof_mix16_gid.binhmm` 464KB / `hmmdefs_ptm_gid.binhmm` 2.9MB / `logicalTri` 239KB、リポジトリ全体が MIT）と libjulius（BSD-3-Clause、C 実装、Linux / Windows / macOS 対応）を組み込む。Perl スクリプト（`segment_julius.pl`）は使わず、libjulius を直接リンクして 10ms 丸めを回避する。**[Unknown] License.md は対象を "the Software" と定義するだけで、同梱の `.binhmm` を明示的に含んでいない。学習コーパスの出所も未確認。** これはブロッカーではなく、記録して残す気になる点として扱う（→ まだ決めていないこと）。'
notes = [
  'CSJ の数値は自発音声のもので、UTAU の読み上げ収録での実力は未知だが、それでも MFA との差は大きい',
  'libjulius の C API を直接叩く実装は、Perl スクリプト経由よりも工数が読みにくい',
  'PTM トライフォンモデルを使う場合、logicalTri の三音素展開を自前で扱う必要がある',
]

[[requirement]]
id = 'TR-ALN-05'
title = 'MFA はランタイムとして採らず、モデル流用の条件を明文化する'
confidence = 'Assumption'
depends_on = [
  'TR-ALN-01',
]
statement = '**MFA 日本語音響モデルは出荷物に同梱しない。** 研究・評価の基準線としてのみ用い、精度比較の対照として数値を引用する。辞書 v3.0.0（CC BY 4.0、499,793 語 / 61 音素）の流用は帰属表示付きで維持してよい。MFA をサブプロセスとしても同梱しない'
notes = [
  'Kaldi 互換デコーダの自前実装工数が [Unknown]。特徴パイプライン（MFCC / CMVN / LDA+MLLT）とトランジションモデルの解釈を誤ると精度が出ない',
  'モデルカードは特徴を MFCC と記すだけで、LDA+MLLT や話者適応の有無を明示していないため、必要な変換行列の同定に調査が必要',
  '同じベンチマーク論文が「言語内でのモデル適応の改善は無視できる程度」と報告しており、ユーザーごとの適応で精度を稼ぐ余地は小さい',
]

[[requirement]]
id = 'TR-ALN-06'
