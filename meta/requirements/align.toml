]
statement = '右ブランクは方式別に導出する。連続音・CVVC では「次の音素境界（次モーラの子音開始、または CVVC の VC では次の子音と母音の間）」から導く。単独音では「母音の定常区間終端」から導く。oto.ini への書き出しでは、負値表現（オフセットからの相対ミリ秒 × −1）を既定とし、ファイル末尾基準の正値表現は使わない。'
notes = [
  '負値表現に対応しない古い外部ツールがあると、書き出したパッケージが受け手側で壊れる',
  '単独音の「母音の定常区間終端」は録音のフェードアウトやノイズに引っ張られやすい',
]

[[requirement]]
id = 'TR-ALN-19'
title = 'CVVC の VC 切り出しを独立した規約セットとして持つ'
confidence = 'Fact'
depends_on = [
  'TR-ALN-15',
