statement = '全エントリに対して書き出し前に次を検証し、違反があれば規約の範囲内で自動修復する。修復できない場合はそのエントリを確認キューへ回し書き出しをブロックする。(1) 右ブランクの位置と子音部の間隔が 1ms 以上、(2) オフセット・先行発声・子音部が 0 以上、(3) 先行発声 ≦ 子音部、(4) 子音部の位置 < 右ブランクの位置、(5) 切り出し範囲が WAV 長を超えない、(6) 同一 WAV 内でエイリアスが重複しない'
notes = [
  '自動修復が規約値を歪めて、検証は通るが音は悪いエントリを黙って作る',
  'OpenUtau と UTAU 本体で許容範囲が異なる可能性があり、片方で通って片方で落ちる',
]

[[requirement]]
id = 'TR-ALN-21'
