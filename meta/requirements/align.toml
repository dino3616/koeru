  'TR-ALN-18',
]
statement = 'CVVC 方式では CV エントリと VC エントリを別の規約セットで生成する。VC エントリは、前モーラの母音区間から次モーラの子音区間にまたがる範囲を1エントリとして切り出し、(a) 先行発声 = 前モーラの母音の終わり、(b) 右ブランク = 次モーラの子音と母音の間、(c) 子音部 = 先行発声と右ブランクの中点、(d) 左ブランクとオーバーラップは既定では調整しない、を既定規約とする。無声破裂音の VC は TR-ALN-17 の分岐に従う。VC エントリのエイリアス命名規則は録音リストのデータから生成する。'
notes = [
  '既存の自動推定が実用水準に達していない領域であり、KOERU の自動が届く保証がない',
  'CVVC の VC は確認件数が最も多くなる方式で、確認キューの件数上限（TR-ALN-25）を破る可能性が高い',
]

[[requirement]]
id = 'TR-ALN-20'
title = 'oto.ini の妥当性検証と自動修復'
