[[requirement]]
id = 'TR-ALN-08'
title = '収録グリッドをプロジェクトに記録し事前分布として使う'
confidence = 'Assumption'
depends_on = []
statement = '収録時に「ガイド音の各拍の絶対時刻」「プロンプト表示時刻」「収録テンポ」「1ファイル内の想定モーラ数と想定発声開始位置」を記録する。**グリッドは Viterbi の遷移コストに加算するソフトな事前分布として与え、探索空間そのものは制限しない**（グリッド無視の解が音響的に十分に優勢なら選ばれるようにする）。二段アライメントの一段目でのみグリッドを強く効かせ、二段目は一段目の解の周辺で制限を外して再探索する。グリッド解と非制限解のスコア差が閾値を超えたテイクは**グリッド逸脱として確信度を下げ、非制限解を採用する**'
notes = [
  'setParam の解説自身が自動推定を『あくまで土台なので手動で調整し仕上げていく必要があります』と書いており、グリッドだけでは足りない',
  'ユーザーがガイドに遅れて発声する、8モーラのうち1モーラだけ言い直すといった実収録の逸脱で、グリッド事前分布が正しい解を排除する危険がある',
  '探索制限を強くしすぎると、逸脱時に破綻的に外れる（緩く外すより悪い失敗になる）',
]

[[requirement]]
id = 'TR-ALN-09'
title = 'テキスト逸脱時の挙動を定義する'
confidence = 'Assumption'
depends_on = [
  'TR-ALN-03',
  'TR-ALN-24',
]
statement = '強制アライメント（発話内容を既知として線形鎖に固定）を既定とし、加えて (a) 前後の無音区間の長さを自由にする、(b) 想定音素列の前後に任意長の非音声を許す、(c) 音素列全体の尤度が閾値を下回った場合に「テキスト逸脱」として強制アライメント結果を採用せずフラグを立てる、の3点を実装する。逸脱と判定したテイクは oto を自動確定させず、確認キューへ回す。'
notes = [
  '尤度の絶対値は録音条件（マイク・部屋の残響・音量）で大きく動くため、閾値をユーザー横断で固定できない可能性がある',
  '録音品質のリアルタイム判定が初期スコープ外であるため、逸脱の発見が録音完了後まで遅れる',
]

[[requirement]]
id = 'TR-ALN-10'
title = 'テイク単位の逐次推定'
confidence = 'Fact'
depends_on = [
  'TR-ALN-02',
  'TR-ALN-11',
]
statement = 'アライメントと oto 推定は1テイクを単位として録音完了直後に即座に実行する。全件バッチ推定は差分再計算とし、未変更テイクの結果はキャッシュから再利用する。バッチ処理は中断・再開可能で、進行中もユーザー操作をブロックしない。**[Fact] snfa 相当の推論経路（620,032 MAC/フレーム）の実測は4秒テイクで 13.5ms、RTF 0.0034 であり、300ms 予算に対して20倍、全件再推定の 10分予算に対して16倍の余裕がある。この予算はモデル選定の制約として機能していない**'
notes = [
  '1テイクずつでは、TR-ALN-12 の話者内一貫性補正に必要な集団統計が序盤に揃わない。序盤の推定値が後から動くことをユーザーにどう見せるかが未解決',
  'テイク単位の推定時間予算（TR-ALN-10 は 300ms を要求）が、モデルサイズの上限を強く縛る',
]

[[requirement]]
id = 'TR-ALN-11'
title = '単独音は専用経路で処理する'
confidence = 'Assumption'
depends_on = [
  'TR-ALN-03',
  'TR-ALN-08',
]
statement = '単独音方式では、1ファイルに1モーラしか含まれないことを使い、(1) 無音区間トリミングとオンセット検出で発声開始を求め、(2) 音素列を [pau, C, V, pau] または [pau, V, pau] の2〜3境界に限定してアライメントし、(3) 母音の定常区間終端を別途推定する、という専用経路を実装する。汎用の連続音アライメント経路を単独音に流用しない。'
notes = [
  '1秒級の持続母音は母音内フレームが均質で、話声で学習したモデルが母音区間の終端を決められない可能性がある',
  '無声破裂音（k / t / p）で始まるモーラは、閉鎖区間が無音と区別できずオンセット検出が破裂点を取り違える',
]

[[requirement]]
id = 'TR-ALN-12'
title = '話者内一貫性による外れ値補正'
confidence = 'Fact'
depends_on = [
  'TR-ALN-10',
  'TR-ALN-24',
]
statement = '同一プロジェクト内で、(a) 同一エイリアス、(b) 同一音素、(c) 同一音階、の3つの集団ごとに、先行発声位置・子音長・母音長の中央値と四分位範囲を算出し、各テイクの推定値の集団からの逸脱を検出して補正候補を出す。連続音・CVVC では、ファイル内の連続する先行発声位置の差分の中央値から標準拍長を推定し、期待位置からの逸脱を拍単位で評価する。'
notes = [
  '集団統計は逐次推定（TR-ALN-10）と衝突する。序盤のテイクでは統計が立たない',
  '声質が意図的に変わる方式（表情音源、高音階での発声変化）では、正常な変動を外れ値と誤判定する',
  '多音階でセッションをまたぐと、音階間で声質と発声速度が不連続になり集団統計を音階内に閉じる必要がある',
