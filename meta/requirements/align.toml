confidence = 'Fact'
depends_on = []
statement = 'oto.ini は1行 `ファイル名.wav=エイリアス名,オフセット,子音部,ブランク,先行発声,オーバーラップ` の形式で出力する。オフセットはファイル先頭からのミリ秒、子音部・先行発声・オーバーラップはオフセットからの相対ミリ秒、ブランクは符号で基準が変わる値として書く。数値は小数第3位までとする。文字コードは Shift-JIS を既定とし、UTF-8（BOM なし）を選択可能にする。読み込み時は Shift-JIS / UTF-8 の両方を受け付ける。'
notes = [
  'Shift-JIS 既定は、エイリアスに Shift-JIS で表現できない文字が入ると壊れる',
  '受け手側の環境（UTAU 本体か OpenUtau か）で文字コードの扱いが違い、KOERU 側で正解を選べない',
