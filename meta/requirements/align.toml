[[requirement]]
id = 'TR-ALN-07'
title = '実行時に g2p を持たない'
confidence = 'Fact'
depends_on = []
statement = '実行時に日本語 g2p（形態素解析・読み推定）を持ち込まない。録音リストは、各収録項目に対して「表示テキスト」「エイリアス列」「音素列」「モーラ境界」を明示的に持つデータとしてアプリに同梱し、アライナへ渡す音素列はこのデータから直接構成する。仮名から音素への写像は辞書ファイル（例: `ka → k a`）としてリソースに置き、コードに埋め込まない。'
notes = [
  'ユーザーが独自の録音リストを持ち込む場合、音素列が付いていない。持ち込みを許すなら g2p か手作業のマッピングが必要になる',
  '方式ごとの音素セットとアライナの音素セットの不一致（外来音 kwa / 撥音 N / 促音 cl の扱い）の突き合わせが必要',
