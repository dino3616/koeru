[[requirement]]
id = 'TR-ALN-24'
title = '確信度の定義'
confidence = 'Assumption'
depends_on = [
  'TR-ALN-03',
  'TR-ALN-08',
  'TR-ALN-12',
]
statement = '各エントリの確信度を4成分から算出した合成スコアとして定義し、成分ごとの値も保持する。(1) 経路確信度、(2) 境界鋭さ（境界周辺の事後確率の集中度と次善解とのスコア差）、(3) 事前分布逸脱（収録グリッド期待位置と集団中央値からの逸脱）、(4) 音響異常度（クリッピング、レベル不足、推定 SNR、F0 の不連続、想定モーラ長からの継続長逸脱）。合成スコアは機械導出群にのみ付与する。**[Fact] 単独音では成分 (3) のうちグリッド由来の項が存在せず、集団中央値からの逸脱のみが使える（実質3成分）**'
notes = [
  '経路確信度は系列長と音素数に依存して分布が変わるため、テイク間の比較に正規化が必要',
  '4成分の合成重みを決める根拠がなく、内部評価ハーネス（TR-ALN-32）が立ち上がるまで恣意的になる',
  '音響異常度は録音品質のリアルタイム判定が初期スコープ外である一方、確信度の主要な低下要因でもあり、スコープの線引きと衝突する',
]

[[requirement]]
id = 'TR-ALN-25'
title = '確信度の校正と確認キューの運用'
confidence = 'Assumption'
