[[requirement]]
id = 'TR-ALN-13'
title = '5値の導出源を機械導出と規約に分離する'
confidence = 'Fact'
depends_on = [
  'TR-ALN-14',
  'TR-ALN-15',
  'TR-ALN-16',
  'TR-ALN-17',
  'TR-ALN-18',
]
statement = '5値の導出源を**三分法**で分ける。【機械導出群】オフセット / 先行発声 / 右ブランク — アライメント境界から導き、合成確信度を付与する。【派生規約群】オーバーラップ — 機械導出群からの比率で決まる。固有の確信度は持たないが、基準区間の確信度を伝播させて表示する。【混合群】子音部（固定範囲）— 単独音・CV では母音定常区間の音響推定を含むため機械導出群と同じ確信度を付与し、CVVC の VC では先行発声と右ブランクの中点という比率規約なので派生規約群として扱う'
notes = [
  '規約群を確信度対象外にすると、子音クラスの判定ミスに起因する規約適用の誤りが誰にも検出されないまま残る',
  'コミュニティ内で規約に幅がある（1/3 と 1/2 の両方が慣例として語られる）ため、既定値の選択が音源の印象を決めてしまう',
]

