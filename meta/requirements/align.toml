statement = 'oto の各値の出力時間分解能を 2ms 以下にする。アライナのフレーム分解能がこれより粗い場合は、境界近傍のフレーム事後確率を用いたサブフレーム補間で境界位置を連続値として推定する。oto.ini への書き出しは小数第3位まで許す'
