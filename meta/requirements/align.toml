statement = '確信度の閾値は絶対値で固定せず、確認キューの運用で切る。**切り方を「件数」から「確認の合計所要時間の上限」に変える**（通常モードは合計5分ぶんまで）。方式ごとに件数を持たずに済み、多音階で上限が膨らむ問題が消える。上限を超える件数が低確信度と判定された場合は「個別確認」ではなく「まとめて確認」または「録り直し提案」に切り替える。**この定義を ALN 側に一本化し、editor 側は参照だけにする**'
notes = [
  '件数上限で切ると、上限外に残った真の誤りが誰にも見られないまま書き出される',
  '相対閾値は「全部そこそこ悪い」録音で何も検出しない',
  '上限件数の妥当な値に根拠がない',
]

[[requirement]]
