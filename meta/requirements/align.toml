  'TR-ALN-23',
]
statement = 'オーバーラップは規約値として算出する。CV（単独音・連続音の語頭・CVVC の CV）では「オフセットから先行発声までの区間の 1/3」を既定とし、無声破裂音（k / t / p / ky / ty / py 等）では 0 または負値とする。連続音および CVVC の VC では「先行発声の 1/3」を既定とする。子音クラス別の係数表を規約プリセットとして外部化し、上級モードで編集可能にする。オーバーラップは負値を許す。**確信度の扱いは3群に分ける。【機械導出群】オフセット / 先行発声 / 右ブランクはアライメント境界から導き、合成確信度を付与する。【派生規約群】オーバーラップは機械導出群からの比率で決まるため固有の確信度を持たないが、基準区間の確信度を伝播させて表示する。【混合群】子音部（固定範囲）は TR-ALN-17 のとおり方式で群が変わる。** さらに、**無声破裂音の分岐（オーバーラップ 0 / 負値）を適用したエントリは、該当区間が実際に低エネルギーの閉鎖区間であることを短時間パワーで事後検証し、一致しない場合は分岐不一致フラグを立てて確認キューに載せる。確信度対象外にしてよいのは、この事後検証に通った分岐だけとする。**'
notes = [
  '子音クラスの分岐が規約の適用先を決めるため、クラス判定を誤ると規約通りに計算しても誤った値になる',
  '「1/3 から 1/2」という幅があり、既定値の選択が音源のクロスフェードの印象を決める',
  '破裂音での 0 / 負値の使い分けの基準がコミュニティ内で一意でない',
]

[[requirement]]
id = 'TR-ALN-17'
title = '子音部（固定範囲）の導出規約'
confidence = 'Fact'
depends_on = [
  'TR-ALN-15',
  'TR-ALN-18',
  'TR-ALN-23',
]
statement = '子音部（固定範囲）は方式別の規約で算出する。単独音・CV では「先行発声 + 母音定常マージン」とし、母音の定常区間開始をアライメント結果と短時間スペクトル変動から推定して下限を与える。CVVC の VC では「先行発声と右ブランクの中点（1/2）」とする。無声破裂音の VC では固定範囲と右ブランクをともに閉鎖の無音部に置く。子音部は常に 0 以上、かつ先行発声より右にあることを保証する。**確信度の扱いは方式で変わる。単独音・CV は母音定常区間の音響推定を含むため機械導出群と同じ確信度を付与し、CVVC の VC は比率規約なので派生規約群として基準区間の確信度を伝播させる**（TR-ALN-16）。**無声破裂音の分岐（固定範囲と右ブランクの無音部配置）を適用したエントリは、該当区間が実際に低エネルギーの閉鎖区間であることを短時間パワーで事後検証し、一致しない場合は分岐不一致フラグを立てて確認キューに載せる。** これにより、子音クラスの判定ミスに起因する規約適用の誤りが検出されないまま残ることを防ぐ。'
notes = [
  '「音程が安定して少し過ぎた位置」は主観的な指針で、機械的な定義への落とし込みが検証されていない',
  '無声破裂音の分岐を誤ると子音が二重に鳴るという、聴いてすぐ分かる破綻になる',
]

[[requirement]]
id = 'TR-ALN-18'
title = '右ブランクの導出規約'
confidence = 'Fact'
depends_on = [
