[[requirement]]
id = 'TR-SYN-30'
title = '課題曲データの形式と権利'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-19',
]
statement = '課題曲は KOERU 内部形式（音符の開始位置 / 長さ / 音高 / 歌詞、テンポ、既定ピッチベンド）で持つ。**UST / USTX は読み込みの入口であって内部形式ではない。** 読み込み時に内部形式へ変換する。同梱する課題曲は、権利処理済みのオリジナル、またはパブリックドメインの旋律に限り、**最小限（1〜2曲）にとどめる**（TR-RCL-12）。**本人が持ち込んだ曲は本人の手元にとどまり、配布パッケージにも利用計測にも載せない**（TR-PKG-31 / TR-PKG-53）'

[[requirement]]
