[[requirement]]
id = 'TR-SYN-33'
title = '試唱レイテンシの目標'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-03',
  'TR-SYN-04',
  'TR-SYN-25',
]
statement = '試唱レイテンシの目標を3ケースに分ける。(1) **初回試唱（直前の録音の前処理を含む）**: 中央値 6秒 / p95 10秒。(2) 2回目以降・前処理完了済み・キャッシュ無し: 中央値 1.5秒 / p95 5秒。(3) 追加録音後の差分再試唱: 中央値 0.5秒、同一条件の再再生: 0.1秒。**初回に限り「録音終了 → 試唱ボタン活性化」の間に前処理完了を待つ明示的な進捗状態を置き、無言の待ち時間にしない**'
notes = [
  '許容範囲が未検証のため、目標値そのものが的外れである可能性がある',
]

[[requirement]]
id = 'TR-SYN-34'
title = '録音直後のバックグラウンド前処理'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-21',
  'TR-SYN-04',
]
statement = '録音1件の確定から次の録音項目の表示までの間に (a) WAV 保存、(b) **前処理段（ハイパス / ノイズ低減 / レベル正規化、既定オフ、パラメータをプロジェクトに記録）**、(c) 自動原音設定、(d) 周波数表と amp 系列の生成、(e) 該当フレーズのプリレンダを開始する。**完了期限は「次の録音項目まで」ではなく「試唱押下まで」とし、キューを持って録音セッション全体または休止中に消化する。** 録音入力より低い優先度で実行する。**ワーカプール全体の優先度を「録音直後の前処理 > 試唱の要求 > 全件再推定 > チャート事前計算」と明示する。** 録音入力パスは録音中にヒープ確保を行わない（バッファのプール化）。解析・合成ワーカは録音入力とは別のスレッドで動かす。**Rust には GC が無いため停止要因は確保・解放とロックに限られる。** 録音入力スレッドではアロケータとロックを使わず、停止時間を実測で確認する'
notes = [
  '前処理が録音の合間に終わらないと、試唱押下時の予算が中央値 1.5 秒から最悪 30 秒へ跳ねる',
]

[[requirement]]
id = 'TR-SYN-35'
title = '本人がローカルに持っている resampler を指して試唱できる'
confidence = 'Fact'
depends_on = [
  'TR-SYN-05',
  'TR-SYN-08',
  'TR-PLT-10',
  'TR-PLT-20',
]
statement = '本人が選んだローカルの実行可能ファイルを resampler として呼び出せる。引数は TR-SYN-08 の構造体を UTAU classic resampler の順序で並べたものとし、KOERU 独自の引数を足さない。**KOERU は候補を探索せず、自動導入もせず、更新もしない。** 指すのは常に本人の明示的な操作とする。**外部 resampler を使っている間は、そのことを試唱画面に表示する。** どのエンジンで鳴っているか分からないまま声を評価させない。実行可能ファイルはプロジェクトに絶対パスで記録せず、アプリ設定として持つ。**プロジェクトを別のマシンや別の OS で開いたとき、外部指定が解決できなければ既定のコアへ戻し、そのことを提示する。** 黙って別の音で鳴らさない'
notes = [
  '**[Risk] UTAU の resampler の大半は Windows 専用の .exe。** macOS / Linux では選べる候補が実質的に存在せず、同じプロジェクトが OS によって別の音になる。これは受け入れる。KOERU が Wine を用意して埋めることはしない',
  '**外部エンジンは配布パッケージに含まれない。** 音源を受け取った側が同じ音を得られるとは限らない。これは UTAU の既存の性質と同じで、KOERU が新しく作る問題ではない',
  'ローカルのファイルを指すだけなので TR-PLT-20 のオフライン完結は保たれる。ライセンス上の判定（DEC-ALL-002）は KOERU が配る場合の話で、本人が持っているものを指す経路には及ばない',
]

[[requirement]]
id = 'TR-SYN-36'
title = 'phonemizer を差し替えられる形に保つ'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-10',
  'TR-SYN-11',
  'TR-SYN-12',
]
statement = '既定の phonemizer は同梱の自前実装とする（TR-SYN-11）。**あわせて、利用者が別の phonemizer を接続できる差し替え点を持つ。** 差し替えの単位は「直前・直後の音符を参照して音素列とエイリアス候補列を返す」という抽象そのものとし、エイリアス解決順（TR-SYN-12）とカバレッジ判定（TR-RCL-20）が同じ差し替え結果を通ることを保証する。**片方だけが差し替わると、歌える判定と実際に鳴る音がずれる。** 差し替えの具体的な機構は未決（Q-SYN-004）'
notes = [
  '**[Unknown] OpenUtau の phonemizer は C# プラグインなので、KOERU がそのまま読み込むことはできない。** 取り得る形は、規則テーブルによるデータ定義、共有ライブラリの ABI、WASM のいずれか。TR-PLT-07 がスクリプト言語ランタイムの同梱を禁じているため、埋め込みインタプリタの経路は取れない',
]
