# 即時試唱と合成エンジン
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'synth'
domain_title = '即時試唱と合成エンジン'
prefix = 'TR-SYN'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Unknown] イヤホンマイク・家庭環境・通常の声量で録った素材が WORLD 系合成コアで嬉しい品質になるかは未検証で、この領域の全要件がその上に乗っている。** 劣化の機構も未特定（想定される劣化経路は3つあるが、実測なしに断定しない）。**この領域で最初にやる実測は前処理あり／なしの主観比較である。**',
  '**[Unknown] Harvest の RTF が未実測で、E2E 予算の中で最も外れやすい項である。** synth の予算は「4秒 WAV・F0 下限 55Hz で 1.0 秒」＝ RTF 0.25 だが、basis 自身が未実測と自認している。**この [Fact] の引き当てが誤っている**: WORLD が実時間で動くと報告されているのは **DIO + StoneMask** の経路であり、Harvest は品質を優先した別系統の推定器で、実時間では動かないという整理が上流の一般的な説明である（正確な倍率は一次資料で確認できず **[Unknown]**）。かつ F0 探索下限 55Hz は Harvest の候補帯域数を増やす方向に働く。連続音のテイクは4秒ではなく約6〜7秒（8モーラ×0.6秒＋前後マージン300ms×2＋プリロール500ms）なので、RTF 0.25 でも 1.5〜1.75秒、RTF 1.0 なら **6〜7秒**。後者では周波数表生成の1工程だけで「録音1件の前処理完了 5秒」の枠を単独で破る。→ **Harvest / DIO+StoneMask の RTF を、想定端末に相当する実機で下限 55Hz と話者音域確定後（下限 100Hz 前後）の両方について測る作業を、要件確定より前のベンチマーク項目として立てる。** 予算の basis から「WORLD は査読論文で実時間処理に足る速度と報告されている」という Harvest への引き当てを削除し **[Unknown]** と書く。',
  '**[Unknown] F0 下限 55Hz は CheapTrick の FFT 長を 2048 から 4096 に倍加させ、まさに初回試唱の瞬間にそれが起きる。** 予算表では「1音符あたりの合成 80ms」の条件が **FFT 長 2048**、「周波数表生成 1.0 秒」の条件が **F0 下限 55Hz** で、同じパイプラインの2つの予算が異なる FFT 長を前提にしている。実際の初回試唱は録音がまだ8件しかなく話者音域が確定していない時点なので**必ず 55Hz / FFT4096 側で走る。** → 音域確定を試唱まで待たず、入力レベル校正と最初の数テイクから F0 の粗い下限を推定して**初回試唱の前に**下限を引き上げる。単独音の1〜2テイクで下限を「推定最低音 − 3半音」に置けば、多くの話者で 71Hz 以上になり FFT 2048 に落ちる。予算表の両行に前提の FFT 長と F0 下限を明示的に併記する。',
  '**[Unknown] 「1音符 80ms」の係数自体が未実測である。** E2E 予算全体がこの1つの未実測係数に乗っている。**Harvest の RTF とあわせて、この2つが E2E 予算のうち唯一の未実測項目であり、測れば予算表は確定する。**',
  '**[Risk] 「録音品質のリアルタイム判定はスコープ外」と「試唱が中核体験」の組み合わせにより、音量不足・クリッピング・環境ノイズを含む素材でもそのまま試唱に出る。** 結果として試唱が事実上の品質判定の場になるが、TR-SYN-20 で評価軸を出さないため、ユーザーは「なんか変」と感じても原因が分からない。**原因を示さずに録り直しへ誘導する手段が要る。**',
  '**[Risk] 自動原音設定が試唱の前提工程になるため、自動アライメントが失敗した素材の扱いを決める必要がある。** 選択肢は (a) 試唱から除外して欠損扱い、(b) 粗い推定値で鳴らす、(c) 確信度が閾値を下回った項目だけ即時に確認を求める。(c) は UC-F04-02 と整合するが、**初回試唱の直前に確認作業を挟むことになり、報酬を先に届ける設計と衝突する。**',
  '**[Unknown] F0 推定手法（Harvest / DIO / pYIN / CREPE）を KOERU の録音条件で比較した実測が無い。** 周波数表は試唱と配布の両方に効くため、ここの精度が外れると影響範囲が広い。',
  '**[Unknown] 上位方式（連続音）で録った素材から下位方式（単独音）相当のエイリアスを切り出して試唱にも使うかが未決。** 使えば序盤のカバレッジが上がる。使わなければ連続音を選んだユーザーの初回試唱が遠くなる。',
  '**[Unknown] moresampler が生成する `.mrq` が音源ディレクトリに増える扱いが未決。** 同梱候補からは platform 制約で外れるが、「KOERU で録った音源を moresampler で鳴らす人がいる」ことは想定される。配布パッケージへ含めない／生成物として無視する、のいずれかを決める。',
  '**[Risk] 利用計測を実装しない方針の場合、TR-SYN-33 の目標レイテンシが実環境で達成できているかを知る経路が存在しない。**',
]

[[requirement]]
id = 'TR-SYN-01'
title = '試唱パイプラインの工程定義とローカル完結'
confidence = 'Fact'
needs_component = false
depends_on = []
statement = '試唱は「課題曲（音符列＋歌詞）→ 音素列生成 → エイリアス解決 → サンプル選択 → タイミング算出 → resample → クロスフェード連結 → 再生」の7工程で構成し、全工程を KOERU プロセス内で実行する。外部プロセス（.exe、Wine、Python インタプリタ）の起動とネットワーク通信を一切行わない'
notes = [
  '外部 resampler を後から差せる口を残すと、ユーザーが moresampler を入れた場合の挙動差をサポートすることになる',
]

[[requirement]]
id = 'TR-SYN-02'
title = 'フレーズ中間表現とキャッシュキー'
confidence = 'Fact'
depends_on = [
  'TR-SYN-01',
]
statement = 'エイリアス解決以降の入力を「フレーズ」単位の不変な中間表現にまとめ、その内容（サンプルのファイル識別子と内容ハッシュ、oto 5値、音高列、フラグ、合成コアのバージョン）から 64bit ハッシュを算出する。合成結果はこのハッシュをキーにメモリ LRU とディスクの二段でキャッシュする'

[[requirement]]
id = 'TR-SYN-03'
title = 'ストリーミング再生'
confidence = 'Assumption'
depends_on = [
  'TR-SYN-02',
]
formalized_as = [
  'REQ-SYN-104',
  'FB-SYN-103',
]
statement = '押下から最初の音が鳴るまでの時間を、曲全体のレンダリング完了時間から切り離す。先頭フレーズの合成が終わった時点で再生を開始し、残りは再生と並行して合成する。合成スレッドは再生位置より常に2秒以上先行してバッファを保つ。先行を保てない見込みのときは途中で途切れさせるのではなく再生開始を遅らせる'

[[requirement]]
id = 'TR-SYN-04'
title = '録音中のプリレンダリング'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-02',
  'TR-SYN-34',
]
statement = '録音セッション中、直前に録り終えたサンプルを含む課題曲のフレーズを、ユーザー操作を待たずにバックグラウンドで合成しておく。プリレンダは録音入力ストリームより低い優先度で実行し、録音のオーディオコールバックを妨げない。'
notes = [
  '解析・合成の CPU 負荷が録音のドロップアウトを起こすと、素材そのものが壊れる',
]

[[requirement]]
id = 'TR-SYN-05'
title = '既定の合成コアを同梱し、外部エンジンは本人が指したものだけを使う'
confidence = 'Fact'
depends_on = [
  'TR-SYN-01',
]
statement = '既定の合成コアはアプリ本体と同一の配布物に同梱し、**何も選ばなくても試唱できる状態から始める。** KOERU が外部エンジンを配布・同梱・実行時ダウンロードすることはない。**ただし、本人がローカルに持っている resampler を指して使うことはできる**（TR-SYN-35）。既定のまま使う経路と、外部を指す経路の両方を持つ。Wine を KOERU が用意することはしない'

[[requirement]]
id = 'TR-SYN-06'
title = '合成コアの選定とライセンス条件'
confidence = 'Fact'
depends_on = [
  'TR-SYN-05',
]
statement = '合成コアは WORLD（BSD-3-Clause）を基礎とする。**`@spline` の除去と自前実装は不要になった**（AGPL-3.0 を選んだため worldline の GPL-2.0-or-later をそのまま取り込める）。**F0 推定のみ WORLD の Harvest から SwiftF0 に差し替える**（学習コーパスのライセンス監査を前提条件とし、不合格なら Harvest に戻る）。CheapTrick・D4C・合成は WORLD のまま。ニューラルボコーダへの置き換えは採らない'
notes = [
  'spline を差し替えるとテンション処理の音が変わる可能性がある',
  '「MIT の OpenUtau から持ってくれば安全」という前提で設計を進めると、配布直前に作り直しが発生する',
]

[[requirement]]
id = 'TR-SYN-07'
title = '合成コアの推移的依存のライセンス台帳'
confidence = 'Fact'
depends_on = [
  'TR-SYN-06',
]
statement = '同梱する合成コアの推移的依存を、ソースの実物で確認したライセンスの一覧として保持し**ビルド時に検証する。検証はソースの依存リストの目視ではなく、リンク済みバイナリの依存グラフに対する CI チェックとして実装し、`@spline` の再混入でビルドを失敗させる。台帳は `//worldline/classic:resampler` と `//worldline/f0` の推移的依存もターゲット単位で含める**'

[[requirement]]
id = 'TR-SYN-08'
title = 'resampler 内部インタフェース'
confidence = 'Fact'
depends_on = [
  'TR-SYN-06',
]
statement = '合成コアの呼び出し口を、UTAU classic resampler の引数一式を渡せる構造体インタフェースとして定義する。含めるもの: サンプル（44100 Hz / 倍精度配列）、収録音高 tone、offset / consonant / cutoff、required_length、con_vel、volume、modulation、tempo、ピッチベンド列、周波数表バイト列。周波数表は任意とし、長さ0で「無し」を表す。無い場合は合成コア側が F0 を推定する。この構造体は**外部 resampler の呼び出し規約でもある**（TR-SYN-35）。同梱コアと外部エンジンが同じ引数で呼ばれることが、試唱と配布の音を一致させる前提になる'

[[requirement]]
id = 'TR-SYN-09'
title = '試唱でのフラグ固定'
confidence = 'Assumption'
depends_on = [
  'TR-SYN-08',
]
statement = '試唱では音色フラグ（g / Mt / Mb / Mv / P / O 相当）を既定値に固定し UI に露出しない。試唱の設定値を oto や配布パッケージへ書き込むこともしない'

[[requirement]]
id = 'TR-SYN-10'
title = 'phonemizer の入力正規化'
confidence = 'Fact'
depends_on = []
statement = '日本語歌詞（ひらがな・カタカナ・長音「ー」・促音「っ」・撥音「ん」・拗音）を入力に、選択中の方式に対応する音素列とエイリアス候補列を生成する。入力は Unicode 正規化（NFC）したうえで扱い、サロゲートペアと結合文字を1文字として数える。'

[[requirement]]
id = 'TR-SYN-11'
title = 'phonemizer は仕様を参照して自前実装し、差し替え可能な形に保つ'
confidence = 'Fact'
depends_on = [
  'TR-SYN-10',
]
statement = '単独音 / 連続音(VCV) / CVVC の日本語 phonemizer は、**OpenUtau の公開された振る舞いを仕様として参照し、自前実装する。**コードは移植しない（TR-PLT-10）。**「直前・直後の音符を参照して音素列とエイリアス候補列を返す」という抽象の形は保つ。** この形を保つのは、OpenUtau と同じ入力に同じ出力を返すことを検証できるようにするためであり、同時に**利用者が別の phonemizer を接続する差し替え点にもなる**（TR-SYN-35）'

[[requirement]]
id = 'TR-SYN-12'
title = 'エイリアス解決のフォールバック順序'
confidence = 'Fact'
depends_on = [
  'TR-SYN-11',
  'TR-SYN-13',
]
statement = "**エイリアス解決のフォールバック順序の単一の定義。** 単独音: 「{歌詞}」→ 見つからなければ当該音符を欠損として扱う。連続音(VCV): 直前音符がある場合「{直前の末尾母音} {歌詞}」→「\\* {歌詞}」→「{歌詞}」→「- {歌詞}」、直前音符が無い場合「- {歌詞}」→「{歌詞}」。CVVC: CV は「- {歌詞}」→「{歌詞}」、VC は該当エイリアスが無ければ VC 音素を出力せず CV のみで繋ぐ。いずれの候補も音高（prefix.map / subbank）と voice color を加味した検索でヒット判定する。**カバレッジ判定（TR-RCL-20）と書き出しはこの定義を参照し、同じコードパスを通る**"

[[requirement]]
id = 'TR-SYN-13'
title = 'prefix.map と subbank'
confidence = 'Fact'
needs_component = false
depends_on = []
statement = '音源ディレクトリ直下の prefix.map（タブ区切り3列: 音名 / prefix / suffix）を読み、prefix と suffix の組ごとに音域レンジを持つ subbank へ展開する。対象音域は MIDI 24〜108 とする。エイリアス検索は素のエイリアスではなく「prefix + エイリアス + suffix」で行う。prefix.map が無い音源は全音域を覆う単一 subbank として扱う。'

[[requirement]]
id = 'TR-SYN-14'
title = '収録音高の自動決定'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-SYN-13',
  'TR-SYN-21',
]
statement = '各サンプルの収録音高は (1) 割り当てられた subbank の音域から決まる代表音高、(2) 周波数表の平均 F0 から推定した音高、の順で決める。ユーザーに収録音高の入力を求めない。'

[[requirement]]
id = 'TR-SYN-15'
title = 'ピッチシフト量の制御と自動移調'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-14',
]
statement = '試唱では、各音符の音高と、その音符に割り当てたサンプルの収録音高との差について、最大シフト量が ±7 半音以内、かつ全音符の二乗平均シフト量が 4 半音以内に収まるよう、課題曲全体を半音単位で自動移調する。ユーザーにキーを選ばせない。移調してもこの条件を満たせない課題曲は、試唱の選択肢に出さない。'
notes = [
  '±7 半音が実際には広すぎ、単一音階音源での初回試唱が不自然に聞こえる可能性がある',
  '課題曲の音域を狭く作りすぎると、曲としての魅力が落ちる',
]

[[requirement]]
id = 'TR-SYN-16'
title = '多音階音源での subbank 切り替え'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-13',
]
statement = '多音階音源では、音符ごとに subbank の音域レンジで引き当てる。subbank の切り替えは音符境界でのみ行い、1 音符の途中で切り替えない。フレーズ内で切り替わった位置は記録し、原音設定側の確認対象として参照できるようにする。'

[[requirement]]
id = 'TR-SYN-17'
title = '課題曲ごとの必要エイリアス集合とカバレッジ'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-12',
]
formalized_as = [
  'REQ-SYN-001',
  'REQ-SYN-101',
  'INV-SYN-103',
]
statement = '課題曲ごとに、TR-SYN-10〜13 の解決処理を「録音済みサンプルが1件も無い状態」で走らせ、必要エイリアス集合を事前に算出して曲データへ埋め込む。録音の進行にあわせ、必要エイリアス集合と録音済みエイリアス集合の差分から、曲ごとの充足率と不足エイリアス一覧を更新する。この更新は録音1件の確定ごとに 100 ms 以内に完了する。'

[[requirement]]
id = 'TR-SYN-18'
title = '欠損時の挙動'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-17',
]
formalized_as = [
  'REQ-SYN-001',
  'REQ-SYN-107',
  'INV-SYN-101',
  'AC-SYN-105',
  'FB-SYN-101',
]
statement = '必要エイリアスが欠けている課題曲は (1) フォールバックで解決できるなら解決して鳴らす、(2) 解決できない音符があるフレーズはフレーズ単位で曲から除外し残りだけを繋いだ短縮版として鳴らす（**除外した位置に無音・別音・代替音を挿入しない**）、(3) 除外の結果、連続して鳴らせる長さが閾値未満になる曲は試唱の選択肢に出さない。**[Unknown] (3) の閾値（現行 4 秒）には根拠がない。「自分の声だ」と認識できる最短長は未検証であり、この値が動けば必要な先頭項目数と課題曲設計が丸ごと変わる**（→ Q-SYN-001）'
notes = [
  '短縮版が短すぎて、曲として認識されない可能性がある',
]

[[requirement]]
id = 'TR-SYN-19'
title = '録る順は曲バンク優先と被覆効率の2つを持ち、切り替えは可逆にする'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-17',
  'TR-SYN-18',
]
statement = '**録音リストの提示順に2つのモードを持つ。** (1) **曲バンク優先** — 本人の曲バンク（TR-RCL-12）の未収録単位を最も少ない行数で被覆する順。(2) **被覆効率** — 方式全体の未収録単位を最も少ない行数で被覆する順で、連続する行の収録単位が近くなるようにまとめる（子音行が揃う、母音環境が続く）。声質はセッション内でも移ろうので、近い単位を離して録らない。**曲バンク優先から被覆効率へ切り替わる条件は2つ。** (a) **曲バンクの全曲が「完全」になったとき**（必要単位がすべて収録済み。TR-RCL-19 の3段階の (1)）。バンクが空なら初めから被覆効率で始まる。(b) **本人がいつでも明示的に切り替えられる。** **切り替えは可逆とする。** 被覆効率から曲バンク優先へも本人の操作で戻せる。曲バンクに曲を足しても順序は自動では戻さず、バンクが満たされていないことを提示するにとどめる。**どちらのモードでいるかを常に表示する。** **どちらのモードも、録音リストの正準順（TR-RCL-27）とカバレッジ台帳の行集合（TR-RCL-18）を書き換えない。** 変わるのは「次に何を録るか」の並びだけで、生成したリストそのものは同じプリセットから常にバイト単位で同一である。**収録済みの行が提示から外れても、台帳からは消えない。** カバレッジは単調なので（FSL の CoverageIsMonotone、および TakesAreNeverLost）、いったん被覆された単位が未被覆へ戻ることはない。**提示対象の集合を変えうるのは、行の除外とその解除、およびインベントリ更新によるリスト再生成（TR-RCL-27）だけ。** モードの切り替えでは変わらない'
notes = [
  '連続音・CVVC では、最初の試唱に到達するまでの録音量が単独音より大きくなり、方式ごとに「報酬が来るまでの投資」が変わる',
]

[[requirement]]
id = 'TR-SYN-20'
title = '不足の提示と評価軸の排除'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-SYN-17',
]
statement = '不足エイリアスは「エイリアス名の一覧」ではなく「あと N 項目録ると『曲名』が歌えるようになる」という形で提示する。**試唱結果に対する品質スコア、良し悪しの判定、他音源との比較、上達度の表示を一切行わない**'

[[requirement]]
id = 'TR-SYN-21'
title = '周波数表の生成（試唱用）'
confidence = 'Fact'
depends_on = [
  'TR-SYN-08',
]
statement = '録音1件が確定した直後にその WAV の F0 を推定して FREQ0003 形式の周波数表を生成し `{ファイル名}_wav.frq` として保存する。ホップサイズ 256 サンプル、サンプリング周波数 44100 Hz 固定。生成はバックグラウンドで行い録音操作をブロックしない。**あわせて WAV 全長にわたる amp 系列（フレーム内絶対値平均 × 2^15）も算出して DB に保存し、書き出し時に WAV を再走査しない。無声・無音フレームの f0 は 0 とし、合成用の補間済み連続 F0 とは別系列として保持する**（録音時に作ると決めたため）'

[[requirement]]
id = 'TR-SYN-22'
title = 'F0 推定は WORLD の DIO+StoneMask と Harvest の二段構えにする'
confidence = 'Assumption'
depends_on = [
  'TR-SYN-21',
]
statement = '周波数表の F0 推定は **WORLD の DIO+StoneMask と Harvest の二段構え**とする。**SwiftF0 は採らない**（DEC-SYN-004。学習コーパスに非商用限定が含まれ、AGPL-3.0-or-later の配布に取り込めない）。**最初の数テイクは DIO+StoneMask で即座に `.frq` を確定し、話者音域が判明して下限が引き上がった後に Harvest で静かに引き直す。** `.frq` が要求するのは F0 と平均振幅だけで、初期テイクの試唱には DIO の精度で足りる。**試唱と配布用 `.frq` で解析条件を分ける。** 試唱は速度優先で FFT 2048 固定、`.frq` とパッケージ書き出しは品質優先で 55Hz / 4096 とする。**この選択で ONNX Runtime を積む理由が消える。** アライナは自前実装が既定（TR-ALN-02）なので、推論ランタイムを同梱せずに済み、配布サイズが縮む'
notes = [
  'イヤホンマイク＋家庭の環境ノイズ下で F0 推定が外れると、周波数表が誤ったまま試唱と配布の両方に効く',
]

[[requirement]]
id = 'TR-SYN-23'
title = '周波数表の同梱（配布用）'
confidence = 'Fact'
depends_on = [
  'TR-SYN-21',
]
statement = '配布パッケージには全サンプルぶんの `_wav.frq` を同梱する。他エンジン固有の周波数表（moresampler の .mrq、vs4u の .vs4ufrq 等）は生成も同梱もしない'

[[requirement]]
id = 'TR-SYN-24'
title = '周波数表の用途の分離'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-SYN-21',
]
statement = '周波数表は (a) 合成時の F0 推定の代替、(b) 原音の音程ゆらぎを合成へ再現する処理（modulation）、の 2 用途で使う。(b) では oto の offset / consonant / cutoff で切り出した区間の F0 と平均 F0 との差を音高差として保持し、子音部と伸縮部を分けて扱う。'

[[requirement]]
id = 'TR-SYN-25'
title = '解析結果のキャッシュ方針'
confidence = 'Fact'
depends_on = [
  'TR-SYN-02',
  'TR-SYN-21',
]
statement = '永続化するのは周波数表（F0 と amp）だけとする。スペクトル包絡と非周期性指標は永続化せず、音符ごとに必要区間だけ算出する。算出結果はメモリ上の上限付き LRU に保持し、フレーズ単位の合成済み波形をディスクへキャッシュする'

[[requirement]]
id = 'TR-SYN-26'
title = 'キャッシュの無効化範囲'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-02',
]
formalized_as = [
  'REQ-SYN-105',
  'REQ-SYN-106',
  'AC-SYN-101',
  'AC-SYN-102',
  'AC-SYN-104',
]
statement = 'サンプルの内容（録り直し）、oto の5値、prefix.map / subbank、課題曲の音符列、合成コアのバージョンのいずれかが変わったフレーズのキャッシュを破棄する。破棄は該当フレーズ単位に限り曲全体を再合成しない。**破棄はするが再構築は遅延・オンデマンドとする**（次に試唱されたときに行う。要件どうしの衝突の全件再推定を参照）'

[[requirement]]
id = 'TR-SYN-27'
title = '合成のキャンセル'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-SYN-04',
]
formalized_as = [
  'REQ-SYN-103',
  'AC-SYN-103',
]
statement = '試唱の停止操作、課題曲の切り替え、次の録音の開始のいずれかで、進行中の合成を 200 ms 以内に中断できる。中断済みフレーズの部分結果は破棄し、キャッシュへ書き込まない。'

[[requirement]]
id = 'TR-SYN-28'
title = '音声出力バックエンド'
confidence = 'Fact'
depends_on = [
  'TR-SYN-05',
]
statement = '試唱の再生は録音と同一のオーディオバックエンド（miniaudio）で行い、録音デバイスを保持したまま再生できる。出力デバイスの切り替え・喪失時は再生を停止して復帰し、アプリケーションを落とさない。'

[[requirement]]
id = 'TR-SYN-29'
title = '試唱の音量'
confidence = 'Assumption'
