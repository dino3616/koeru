  '音高ごとに部分的に揃った状態でフォールバック（下の音高で代用）を許すと、進捗が見かけ上早く進むが音質が破綻する',
]

[[requirement]]
id = 'TR-RCL-27'
title = '録音リスト生成を決定的にし、同じプリセットとインベントリからは常に同一のリストを得る'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-01',
  'TR-RCL-18',
]
statement = '録音リスト生成（TR-RCL-03 / 04 / 05）は決定的でなければならない。同じプリセット ID、同じインベントリバージョン、同じ乱数シード（固定値）から生成した録音リストは、行の順序を含めて常にバイト単位で同一になること。生成器のバージョンを上げてリストが変わる場合は、既存プロジェクトのインベントリバージョンとプリセットを尊重して旧リストを再生成し、収録済みの行が無効化されないことを保証する。'
notes = [
  '決定性を優先すると生成アルゴリズムの改善（行数削減）を既存プロジェクトに適用できない',
]
