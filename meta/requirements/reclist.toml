[[requirement]]
id = 'TR-RCL-26'
title = '多音階のカバレッジを音高ごとに独立管理し、進捗表示では音高を跨いだ最小値で扱う'
confidence = 'Fact'
depends_on = [
  'TR-RCL-06',
  'TR-RCL-18',
  'TR-RCL-19',
  'TR-RCL-20',
]
formalized_as = [
  'REQ-RCL-002',
  'INV-RCL-002',
  'AC-RCL-001',
]
statement = '多音階プリセットでは、収録音高ごとに独立した行集合と台帳を持つ。収録済み単位は (エイリアス, 収録音高) の組で管理する。課題曲の「歌える」判定は、その曲の各ノートが要求する収録音高（floor 割り当てで解決）ごとに必要単位が揃っているかで行うため、1 音高だけ録り終えても音域の広い曲は歌えない。進捗表示では「いま歌える曲の数」を音高を跨いだ実際の判定結果で出し、音高ごとの消化率は詳細表示に置く。'
