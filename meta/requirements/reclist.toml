statement = '**曲先行のミニ音源は、フルリストの行の部分集合として選ぶ。** 詰め直し（必要単位専用の行の再生成）は採らない。単独音は1項目＝1モーラなので部分集合で無条件に最小であり、連続音のみ詰め直し版に対して数分の増加を受け入れる。これによりフル方式への継続性が定義上保証される'
notes = [
  '詰め直した行は既製リストと非互換になり、フル方式へ拡張するときに行の境界が合わず再録音が発生する',
  'ミニ音源の行とフルリストの行を両立させる制約が、どちらの最小性も壊す',
]

[[requirement]]
id = 'TR-RCL-17'
title = '「あと何フレーズ録れば次の曲が歌えるか」を、収録済み単位からの増分被覆として算出する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-15',
  'TR-RCL-16',
  'TR-RCL-18',
]
statement = "収録済み単位集合 R と課題曲の必要単位集合 S_j に対し、未収録集合 S_j \\ R を被覆する追加行数を TR-RCL-16 と同じ生成器で算出し、行数と推定所要時間（TR-RCL-09 の式）を課題曲ごとに提示する。未収録が 0 の曲は「いま歌える」に分類する。収録済み単位が増えるたび（1 テイク保存ごと）に全課題曲の値を再計算する。追加行数が同じ曲が複数ある場合は総モーラ数の少ない順に並べる。"
notes = [
  '追加行数が同じ曲が並ぶと選ぶ意味が失われ、進捗表現としての効果が落ちる',
]

[[requirement]]
id = 'TR-RCL-18'
title = 'カバレッジ台帳を行単位の状態と録音実体の対応表として持ち、ファイル名で突き合わせる'
confidence = 'Fact'
depends_on = [
  'TR-RCL-08',
]
formalized_as = [
  'INV-REC-001',
  'INV-REC-002',
  'INV-REC-003',
]
statement = 'プリセットから生成した全行について (a) 行 ID、(b) 行のテキスト、(c) その行が生む収録単位の一覧、(d) 収録音高、(e) 状態（未録音 / 録音済み / 要録り直し / 除外）、(f) テイク一覧と採用テイク、を保持する台帳を持つ。収録済み単位集合は「採用テイクを持つ行の単位の和集合」として台帳から導出し二重に保持しない。**台帳と録音実体の突き合わせは行 ID で行う**（ファイル名依存は起動時の孤児検出という弱い用途に限る）'
notes = [
  'ファイル名を主キーにすると、ユーザーがファイルをリネームした瞬間に対応が壊れる',
]

[[requirement]]
id = 'TR-RCL-19'
title = '進捗を「歌える曲の数」で表示し、歌える状態を 3 段階で定義する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-15',
  'TR-RCL-20',
]
formalized_as = [
  'REQ-RCL-003',
  'INV-RCL-001',
]
statement = '進捗の主指標を「いま歌える曲の数」とし、行の消化率を主指標にしない。曲の状態を3段階で定義する。(1) 完全: 必要単位がすべて収録済み。(2) 代替あり: 一部が未収録だがフォールバック規則で解決すれば全ノートが鳴る。(3) 不可: フォールバックでも解決できない、または音域が範囲外。表示では (1) と (2) を「歌える」に含めてよいが、(2) は音のつながりが粗くなることを1行で説明する。**完成の判定に公開の有無を含めない**'
notes = [
  '段階を出すと「完全ではない」ことが未完成として見え、非公開完成を正規の完成形として残す方針と衝突する',
]

[[requirement]]
id = 'TR-RCL-20'
title = '未収録単位のフォールバック解決規則を、OpenUtau の候補探索順と一致させる'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
  'TR-RCL-06',
]
statement = '未収録単位のフォールバック解決規則は **TR-SYN-12 の順序を参照する**（同一の定義を2箇所に持たない）。カバレッジ判定・パッケージ書き出し・試唱が同じコードパスを通ることを実装制約として明記する。多音階は prefix.map の floor 割り当てで1段下の収録音高 → さらに下 → 最低音高。解決した単位は台帳上「代替」として記録し収録済みと区別する。**OpenUtau（MIT）から移植する箇所は著作権表示を保持する**'
notes = [
  'OpenUtau の探索順は将来変わり得るため、一致が保証されない',
]

[[requirement]]
id = 'TR-RCL-21'
title = '上位方式から下位方式への書き出し可能性を、生成リストの構成として保証し、可能性を台帳から判定する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-04',
  'TR-RCL-18',
  'TR-RCL-20',
]
formalized_as = [
  'INV-PKG-105',
  'INV-PKG-106',
]
statement = '連続音・多音階連続音のプリセットで生成するリストは語頭 CV エイリアス（`- CV`）を全 CV について必ず含める。これにより連続音プロジェクトから単独音パッケージを書き出せることを構成上保証する。**ただし書き出し時の値の流用（`- CV` を素の `CV` として複製）は行わない。下位方式の規約プリセットで5値を再導出する**（下記 align の TR-ALN 新設要件を参照）。単独音から連続音・CVVC、CVVC から連続音への書き出しは不可能として提示し経路を用意しない'
notes = [
  '連続音の語頭 CV はサステインが 1 拍（100BPM で 0.6 秒）しかないため、長いノートで UTAU の伸縮に依存し、単独音として使ったときの品質が実用に足るかは未検証',
  '語頭 CV を全種含めると行数の下限が L ≥ 141 に固定され、語頭を諦めた 91 行のリストに比べて所要時間が約 1.7 倍になる',
]

[[requirement]]
id = 'TR-RCL-22'
title = '課題曲の音域と収録音高の整合を判定し、必要シフト量が範囲外なら曲またはプリセットの側で提示する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-06',
  'TR-RCL-12',
  'TR-RCL-15',
]
statement = '課題曲の最低音・最高音と、プリセットの収録音高から、各ノートに必要なピッチシフト量（半音）を floor 割り当てで算出する。上方シフトは +7 半音まで、下方シフトは -3 半音までを許容範囲とし、これを超えるノートが曲全体の 10% を超える場合はその曲を「音域外」として TR-RCL-19 の (3) に分類する。単一音高プリセットでは、収録音高を課題曲群の最低音の近傍に置くことを既定とし、収録音高をユーザーが選べる場合は歌える曲数が最大になる音高を推奨値として提示する。多音階では音高を追加したときに音域外から外れる曲の数を提示する。'
notes = [
  '+7 / -3 という閾値が実際の劣化と対応せず、歌えると判定した曲が聴くに堪えない、または歌えないと判定した曲が実は問題ない',
  '収録音高の推奨をアプリが決めると、本人が出せない音高を要求してしまう',
]

[[requirement]]
id = 'TR-RCL-23'
