# 録音リスト生成とカバレッジ管理
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'reclist'
domain_title = '録音リスト生成とカバレッジ管理'
prefix = 'TR-RCL'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '[Unknown] 権利上同梱できる日本語の課題曲をどこから何本調達するかが未決。 パブリックドメインの伝承曲は権利上安全だが、ミナが最初に聴いて「私の声だ」と思う曲としての魅力が足りない可能性がある。オリジナル曲を制作するか、ユーザーが持ち込む UST / USTX に依存するかも未決。曲が無いと、ミニ音源の設計（→ Q-RCL-001）の実測が始まらない。',
  '[Unknown] 録り直し率の実測値がない。 イヤホンマイク程度の機材と家庭の環境で、初回制作者の録り直し率がどれくらいになるかのデータが必要。この値が所要時間表示を左右する。',
  '[Unknown] 単一音高で録った素材のピッチシフト許容幅（半音何個まで実用に足るか）が未確認。 実務上「UTAU は上方向のシフトに強く下方向に弱い」ことと、prefix.map の切り替え間隔が 7〜9 半音であることは確認できたが、resampler ごとの劣化量を測定した公開データは見つからなかった。TR-RCL-22 の +7 / -3 半音は推定値である。',
  '[Unknown] 収録音高を録音の途中から追加できるようにすべきかが未決。 作成時に本人が選ぶ形にした（DEC-RCL-014）ので自動決定の論点は閉じたが、TR-REC-25 が「収録音高の集合はプロジェクト作成時に確定させ、収録途中に増減させない」と定めている。1本で始めて足りないと分かったとき、作り直す以外の道が無い。',
  '[Unknown] 録音リストのモーラ長を 5 モーラと 8 モーラのどちらでプリセットするかが未決。 8 モーラの方が総時間は短いが、実務上は「長ければ長いほど読み間違いが発生しやすく、結果的に収録時間が無駄に伸びる」とされ、初心者には 5〜6 モーラが推奨されている。ミナ向けとハル向けで違うモーラ長を出すべきかも未決。',
  '[Unknown] 連続音の語頭 CV を単独音として書き出したときのサステイン不足。 語頭 CV はガイド 100BPM で 0.6 秒しか伸びていないため、長いノートでは UTAU の伸縮に依存する。実用に足る品質になるかは未検証であり、これが崩れると下位方式書き出し（UC-F05-02）が成立しない。この論点は行数コストとは独立であり、所有者を reclist に寄せて実測項目1件に統合する。',
  '[Risk] 多音階では1音高を録り終えた時点で「歌える曲」がゼロのままになりうる。 1曲を歌わせるのに複数の収録音高が揃う必要があるため。音高を跨いだフォールバック（下の音高で代用）を許すかの決定が必要。許すと進捗が見かけ上早く進むが音質が破綻する。',
  '[Risk] 「歌える」の3段階を画面に出すことと、非公開のままの完成を正規の完成形として残すことの整合が未検討。 段階を出すと「完全ではない」ことが未完成として読まれる。',
  '[Unknown] 促音「っ」「無声化母音」「長音の連続」など特殊モーラの扱いが OpenUtau 側の phonemizer と一致しているかの検証が未了。 ずれるとカバレッジ判定で「歌える」とした曲が実際には音を欠く。',
]

[[requirement]]
id = 'TR-RCL-01'
title = '方式プリセットを「方式 × モーラ長 × 音素インベントリ」の単一データとして定義し、収録音高は別に選ばせる'
confidence = 'Fact'
needs_component = false
depends_on = []
statement = 'プリセットを方式名ではなくプリセット ID で管理し、各プリセットが (a) 収録方式（CV / VCV / CVVC）、(b) 1行あたり最大モーラ数、(c) 音素インベントリのバージョン、(d) 語頭 CV を含めるか を必須フィールドとして持つ。表示用の所要時間と到達点は値として持たず、プリセットと収録音高の本数から導出する。 収録音高はプリセットに含めず、プロジェクト作成時に本人が選ぶ（DEC-RCL-014）。 本数にも音高にも制約を置かず、prefix.map が覆う範囲（TR-RCL-06 の C1〜B7）の外、重複、0 本だけを拒む。 推奨値は提示するが選択を止めない。 音高は録音リストの中身を変えない（多音階は同じリストを音高の数だけ録る。TR-RCL-26）ので、所要時間だけが本数に比例する。録音リスト・所要時間表示・カバレッジ台帳・書き出し可能方式の判定はすべてこのプリセットと収録音高から導出し、同じ値を二重に持たない'
notes = [
  'プリセットを後から変更すると、公開済みの所要時間表示と既存プロジェクトのカバレッジ台帳が食い違う',
  '収録音高を自由に選ばせると、2 半音差を 3 本といった、録る量の割に得るものが少ない構成を作れてしまう',
  'プリセット数を増やすと選択画面の判断コストが上がり、方式選択を所要時間で簡単にするという狙いが崩れる',
]

[[requirement]]
id = 'TR-RCL-02'
title = '日本語の収録単位インベントリを自前のデータテーブルとして持ち、第三者の録音リストファイルを同梱しない'
confidence = 'Fact'
depends_on = [
  'TR-RCL-01',
]
statement = '母音クラス 7 種（a / i / u / e / o / n / N）、子音記号 30 種、CV 単位のインベントリを KOERU 自身が保持する1個のテーブルとして定義する。録音リストはこのテーブルからアルゴリズムで生成し、OREMO・NHP・その他の配布リストのファイルを同梱・再配布しない。インベントリはバージョン番号を持ち、プロジェクトは作成時のバージョンを記録する。各エントリに導出根拠の欄を持たせ、日本語のモーラ体系と OpenUtau の presamp 既定値（母音 7 / 子音 30、MIT）から機械的に導出する手順として書く。 実用セットとして単位を除外する場合は、除外理由を音韻的な根拠（難読・現代日本語で出現しない拍など）として個別に書き、既存リストの構成をそのまま写した形にしない'
notes = [
  '自前生成したリストが既存リストと行境界で非互換になり、既存音源の追加録音に流用できない',
]

[[requirement]]
id = 'TR-RCL-03'
title = '単独音の録音リストを、1行あたり最大単位数の制約下で子音行を揃えて生成する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
]
statement = '単独音プリセットでは、インベントリの CV 単位を 1 行あたり最大 N 単位（既定 5、上限 8）でグルーピングした録音リストを生成する。同一行内の単位は子音行が揃うように並べる（例: か き く け こ）。件数はインベントリの導出結果から決まる（DEC-RCL-004。中核 102 / 拡張 144）。以前は 141 / 168 と断言していたが、その数の出どころが追えなかった。 TR-RCL-02 の導出手順のほうを正本にする。行数は単位数と子音行の数から決まる。行の途中で子音が変わらないことを生成時に保証する'
notes = [
  '行内の単位数を増やすと 1 ファイルに多数の音が入り、自動切り出しの失敗が 1 ファイル単位で伝播する',
]

[[requirement]]
id = 'TR-RCL-04'
title = '連続音の録音リストを有向グラフの辺被覆パス分解として生成し、語頭 CV を必ず全種含める'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
  'TR-RCL-07',
]
statement = '連続音は必要エイリアス集合を「先行母音クラス × CV 単位」の有向辺集合とみなし、1行 = 最大モーラ数 M 以下の有向路として全辺を被覆する路の集合を生成する。先行母音クラスは、インベントリに実在する単位が持つものだけを採る（a / i / u / e / o / n の6種。DEC-RCL-009）。 presamp の体系が持つ7種（TR-RCL-02）をそのまま回すと、どの単位も持たない N を始点にした辺を要求し、録音では決して埋まらない。行の先頭モーラは `- CV` エイリアスを生む唯一の位置であるため、語頭 CV を全種収録する要件から行数の下限は語頭 CV 種類数以上になる。母音クラス n から出る辺は、到達手段が「ん」を行頭に置くことしかない（「ん」へ入る辺は母音クラスの数しかないのに、出る辺は CV の種類数ある）。そのぶん行数が増える。 拡張セット・M=8 での実測は 312 行 / 1176 モーラで、遷移の数だけ言えば無駄が1つも無い。 [Fact] 語頭 CV を全種含む設計は連続音リストの標準的な効率設計であり（各子音セクションに最低5行、1行7エイリアス、8モーラが最高効率）、下位方式書き出しを構成上保証することに追加の時間コストはほぼ生じない'
notes = [
  '最大モーラ数を増やすと理論上の総時間は縮むが読み間違いが増えて実測時間が伸びる',
  '辺被覆の最適化に時間をかけすぎるとプロジェクト作成が待たされる',
]

[[requirement]]
id = 'TR-RCL-05'
title = 'CVVC の録音リストを CV・VC・語尾の 3 種のエイリアスを同時に回収する行として生成する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-02',
  'TR-RCL-07',
]
statement = 'CVVC プリセットでは、CV 単位（インベントリの導出結果。中核 102 / 拡張 144。TR-RCL-02）、VC 単位（先行母音クラス 6 種 a/i/u/e/o/n × 子音 30 種 = 180 種）、語尾（V- 6 種）を被覆する行を生成する。CV は語頭形（- CV）と素の CV の2綴りを要求する（DEC-SYN-011）。拡張セットなら 288 + 180 + 6 = 474 エイリアス。 件数はインベントリから導き、条文に数を固定しない（DEC-RCL-004 / DEC-RCL-009）。1 行 n モーラは語頭 CV を 1 種、素の CV を最大 n-1 種、隣接遷移由来の VC を最大 n-1 種、語尾を 1 種与える。行数の下限は語頭 CV の種類数で決まる（DEC-RCL-009）。 語頭 CV は行の先頭にしか出ないので、CV が 144 種なら行は 144 本以上要る。拡張セット・M=8 での実測は 173 行 / 468 モーラ。VC の代用による軽量モードは持たない（DEC-RCL-009）。 どの子音の VC を代用してよいかは音質に直接効き、実測が無いまま決められない。'
notes = [
  '口蓋化 VC の代用は音質を落とすため、軽量モードを既定にすると品質面の期待を裏切る',
  'CVVC は 1 行の読み上げ難易度が最も高く（例のような無意味音列になる）、所要時間の見積もりが読み間違いで崩れやすい',
]

[[requirement]]
id = 'TR-RCL-06'
title = '多音階の収録音高の推奨値を示し、prefix.map を floor 割り当てで生成する'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-RCL-01',
  'TR-RCL-22',
]
statement = '多音階の推奨値は 3 音高（女声 G3 / D4 / A4、男声 C3 / A3 / E4）。推奨値であって制約ではなく、本数も音高も本人が決める（TR-RCL-01）。音高の間隔に上限も下限も設けず、間隔を理由に警告しない（実用に足るピッチシフト幅を測った公開データが無く、閾値の根拠が無いため）。prefix.map は C1 から B7 の 84 半音すべてに1行を持つタブ区切り（音名 / prefix / suffix）で出力し、各半音に「その音以下で最も高い収録音高」に対応する接尾辞を割り当てる（floor 割り当て。最低音高は自分より下の全音域も担当）'
notes = [
  '最低収録音高より下の音域は必ず下方シフトになり、劣化が避けられない',
  '間隔の警告を落としたので、2 半音差の音高を 3 本といった、被覆の割に得るものが少ない構成を止めない',
  '音高を本人の声域から自動決定するには録音前に声域測定が必要で、Create before configure と衝突する',
]

[[requirement]]
id = 'TR-RCL-07'
title = '生成した行に読み上げ可能性の制約を課し、行ごとに読み間違いリスクを評価する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-02',
]
statement = '録音リストの各行に対し、(a) モーラ数がプリセットの上限以下、(b) 同一 CV の 3 連続を作らない、(c) 撥音「ん」の連続を作らない、の 3 制約を満たす。ただし被覆が制約に優先する（DEC-RCL-009）。 その制約を守ると覆えなくなる辺があるときは、その辺を含む行に限って緩める。撥音の連続がその例で、母音クラス n を持つ単位は「ん」だけなので、辺「n ん」は「ん」を連続させないと覆えない。行内の難読音の個数は制約にしない。 拗音どうしの遷移は両方を同じ行に隣接させないと覆えないので、個数で縛ると TR-RCL-04 の全辺被覆と両立しない。加えて行ごとに読み間違いリスクスコア（難読音数、拗音数、モーラ数から算出）を持ち、録音画面でモーラ境界を視覚的に区切って提示する。制約を満たす解が存在しない場合はモーラ上限を 1 下げて再生成する。'
notes = [
  '制約を強めると理論上の最小行数に届かず所要時間が伸びる',
  '読み間違いリスクの閾値が実際の発生率と対応しない',
]

[[requirement]]
id = 'TR-RCL-08'
title = '録音リストの各行を CP932 で符号化可能かつファイル名として安全な一意文字列にする'
confidence = 'Fact'
depends_on = [
  'TR-RCL-03',
  'TR-RCL-04',
  'TR-RCL-05',
]
statement = '録音リストの各行は、読み上げるテキストとしては日本語のまま持つ。**ファイル名は行 ID から ASCII で生成する**（DEC-PKG-004。書き出しは ASCII 固定）。生成したファイル名は (a) ASCII 英数字・ハイフン・アンダースコアだけで構成、(b) Windows / macOS のファイル名禁止文字を含まない、(c) Windows 予約名と一致しない、(d) リスト内で一意、(e) 拡張子を含めて 255 バイト以内、の5条件をすべて満たすことを生成時に検証する。失敗した行は生成をやり直し、失敗を黙って通さない。多音階では音高ごとにフォルダを分けて同名の行を許す。**行テキストが CP932 で符号化できるかは、oto.ini のエイリアスとして書けるかの検査として別に残す**（TR-PKG-17）。'
notes = [
  '外来音を増やすと CP932 で表現できない文字に当たる',
]

[[requirement]]
id = 'TR-RCL-09'
title = '所要時間を「行数 × 行オーバーヘッド + 総モーラ数 × 単位発声時間 × (1 + 録り直し率) × 音高数」で算出する'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-RCL-01',
  'TR-RCL-03',
  'TR-RCL-04',
  'TR-RCL-05',
]
statement = '所要時間の算出式を2本に分ける。(1) 単独音は「1単位あたりの実測サイクル × 単位数」。(2) 行読み上げ方式（CVVC / 連続音）は「1行 12.0 秒（≦6モーラ）＋モーラ超過分」。音高数を掛けて多音階の所要時間にする。この 12.0 秒は実務値であって KOERU の録音 UI での実測ではない（DEC-RCL-008）。 それでも方式選択画面に出す——方式選択の主軸は「手作業が必要かどうか」で（DEC-RCL-001）、所要時間は桁が合っていれば併記の役を果たす。残り所要時間も同じこの式から出し、実測でペースを推定しない（DEC-RCL-013）。 残りは時間だけで示さず、残りの行数（多音階では音高の本数を掛けた数）と併記する。 時間は桁しか合っていないが行数は数え上げなので正確であり、本人が自分のペースを当てはめられる'
notes = [
  't_overhead 8.3 秒は OREMO の録音周期に固有の値であり、KOERU の録音 UI が連続録音や VAD 分割を採るとオーバーヘッドが 3〜4 秒まで下がって全数値が 1.5〜2 倍速くなる（単独音 5.7 分、連続音 8 モーラ 18.9 分、3 音階 56.7 分）',
  'r_retake = 0.20 に実測の裏付けがない',
  '実測でペースを推定しないので、本人のペースが式と大きく違っても残り時間が寄らない。 そのぶん行数を併記する',
  '12.0 秒を置き換える条件は DEC-RCL-008 の review_triggers が持つ。 各方式を実際に録って測ったときに差し替える',
]

[[requirement]]
id = 'TR-RCL-11'
title = '方式選択画面には各プリセットにつき単一の所要時間と到達点を出し、時間だけで並べない'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-RCL-09',
  'TR-RCL-19',
]
statement = '方式選択画面は各プリセットにつき (a) 所要時間1個（レンジではなく代表値）、(b) 到達点として「歌える曲の範囲」を具体語で1行、(c) 1回の録音セッションで区切った場合の想定回数、(d) 読み上げの難しさ（1行あたりモーラ数と難読音の含有率としてリストから機械算出する） を提示する。所要時間の差が5分未満のプリセットを同一画面に2つ以上並べない。並べる場合は到達点の差を数値で明示する'
notes = [
  '到達点を数値で出すと、少ない方を選ぶことが劣った選択に見えて離脱要因になる',
]

[[requirement]]
id = 'TR-RCL-12'
title = '課題曲の同梱は最小限にし、本人が UST から曲を持ち込めるようにする'
confidence = 'Assumption'
depends_on = []
