statement = '1 行に対して複数のテイクを保存でき、採用テイクを後から切り替えられる。採用テイクの切り替えは、その行が生む収録単位の集合を変えないため、カバレッジ台帳の単位集合と「歌える曲の数」に影響を与えない（原音設定の値のみが変わる）。テイクは行 ID とテイク番号でファイル名を分け、採用テイクのみが配布パッケージのファイル名（＝行テキスト）を持つ。録り直し率 r_retake の実測（TR-RCL-10）はテイク数から算出する。'
