# 録音リスト生成とカバレッジ管理
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'reclist'
domain_title = '録音リスト生成とカバレッジ管理'
prefix = 'TR-RCL'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Unknown] 権利上同梱できる日本語の課題曲をどこから何本調達するかが未決。** パブリックドメインの伝承曲は権利上安全だが、ミナが最初に聴いて「私の声だ」と思う曲としての魅力が足りない可能性がある。オリジナル曲を制作するか、ユーザーが持ち込む UST / USTX に依存するかも未決。**曲が無いと、ミニ音源の設計（→ Q-RCL-001）の実測が始まらない。**',
  '**[Unknown] 録り直し率の実測値がない。** イヤホンマイク程度の機材と家庭の環境で、初回制作者の録り直し率がどれくらいになるかのデータが必要。この値が所要時間表示を左右する。',
  '**[Unknown] 単一音高で録った素材のピッチシフト許容幅（半音何個まで実用に足るか）が未確認。** 実務上「UTAU は上方向のシフトに強く下方向に弱い」ことと、prefix.map の切り替え間隔が 7〜9 半音であることは確認できたが、resampler ごとの劣化量を測定した公開データは見つからなかった。TR-RCL-22 の +7 / -3 半音は推定値である。',
  '**[Unknown] 収録音高を本人の声域から自動決定すべきかが未決。** 既定値は実務上の推奨として確認できたが、本人が出せる音域は録音前には分からない。声域測定を録音の前に置くと Create before configure に反する。録音しながら音高を後から追加する設計が可能かは未検討。',
  '**[Unknown] 録音リストのモーラ長を 5 モーラと 8 モーラのどちらでプリセットするかが未決。** 8 モーラの方が総時間は短いが、実務上は「長ければ長いほど読み間違いが発生しやすく、結果的に収録時間が無駄に伸びる」とされ、初心者には 5〜6 モーラが推奨されている。ミナ向けとハル向けで違うモーラ長を出すべきかも未決。',
  '**[Unknown] 連続音の語頭 CV を単独音として書き出したときのサステイン不足。** 語頭 CV はガイド 100BPM で 0.6 秒しか伸びていないため、長いノートでは UTAU の伸縮に依存する。実用に足る品質になるかは未検証であり、これが崩れると下位方式書き出し（UC-F05-02）が成立しない。**この論点は行数コストとは独立であり、所有者を reclist に寄せて実測項目1件に統合する。**',
  '**[Risk] 多音階では1音高を録り終えた時点で「歌える曲」がゼロのままになりうる。** 1曲を歌わせるのに複数の収録音高が揃う必要があるため。音高を跨いだフォールバック（下の音高で代用）を許すかの決定が必要。**許すと進捗が見かけ上早く進むが音質が破綻する。**',
  '**[Risk] 「歌える」の3段階を画面に出すことと、非公開のままの完成を正規の完成形として残すことの整合が未検討。** 段階を出すと「完全ではない」ことが未完成として読まれる。',
  '**[Unknown] 促音「っ」「無声化母音」「長音の連続」など特殊モーラの扱いが OpenUtau 側の phonemizer と一致しているかの検証が未了。** ずれるとカバレッジ判定で「歌える」とした曲が実際には音を欠く。',
]

[[requirement]]
id = 'TR-RCL-01'
title = '方式プリセットを「方式 × モーラ長 × 音階数 × 音素インベントリ」の単一データとして定義する'
confidence = 'Fact'
depends_on = []
statement = 'プリセットを方式名ではなくプリセット ID で管理し、各プリセットが (a) 収録方式（CV / VCV / CVVC）、(b) 1行あたり最大モーラ数、(c) 収録音高の本数と音高、(d) 音素インベントリのバージョン、(e) 語頭 CV を含めるか、(f) 表示用の所要時間と到達点 を必須フィールドとして持つ。**録音リスト・所要時間表示・カバレッジ台帳・書き出し可能方式の判定はすべてこの1個のプリセットデータから導出し、同じ値を二重に持たない**'
notes = [
  'プリセットを後から変更すると、公開済みの所要時間表示と既存プロジェクトのカバレッジ台帳が食い違う',
  'プリセット数を増やすと選択画面の判断コストが上がり、方式選択を所要時間で簡単にするという狙いが崩れる',
]

[[requirement]]
id = 'TR-RCL-02'
title = '日本語の収録単位インベントリを自前のデータテーブルとして持ち、第三者の録音リストファイルを同梱しない'
confidence = 'Fact'
depends_on = [
  'TR-RCL-01',
]
statement = '母音クラス 7 種（a / i / u / e / o / n / N）、子音記号 30 種、CV 単位のインベントリを **KOERU 自身が保持する1個のテーブル**として定義する。録音リストはこのテーブルからアルゴリズムで生成し、OREMO・NHP・その他の配布リストのファイルを同梱・再配布しない。インベントリはバージョン番号を持ち、プロジェクトは作成時のバージョンを記録する。**各エントリに導出根拠の欄を持たせ、日本語のモーラ体系と OpenUtau の presamp 既定値（母音 7 / 子音 30、MIT）から機械的に導出する手順として書く。** 実用セットとして単位を除外する場合は、除外理由を音韻的な根拠（難読・現代日本語で出現しない拍など）として個別に書き、既存リストの構成をそのまま写した形にしない'
notes = [
  '自前生成したリストが既存リストと行境界で非互換になり、既存音源の追加録音に流用できない',
]

[[requirement]]
id = 'TR-RCL-03'
title = '単独音の録音リストを、1 行あたり最大単位数の制約下で最小行数に詰めて生成する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
]
statement = '単独音プリセットでは、インベントリの CV 単位（141 または 168）を 1 行あたり最大 N 単位（既定 5、上限 8）でグルーピングした録音リストを生成する。同一行内の単位は子音行が揃うように並べ（例: か き く け こ）、読み間違いを避けるため難読音（すぁ / ぬぁ / むぁ / るぁ 等）は 141 音セットでは除外し、168 音セットでは行末にまとめる。生成結果の行数は 141 音 / 5 単位で 29 行以内、168 音 / 5 単位で 46 行以内であること。'
notes = [
  '行内の単位数を増やすと 1 ファイルに多数の音が入り、自動切り出しの失敗が 1 ファイル単位で伝播する',
]

[[requirement]]
id = 'TR-RCL-04'
title = '連続音の録音リストを有向グラフの辺被覆パス分解として生成し、語頭 CV を必ず全種含める'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
  'TR-RCL-07',
]
statement = '連続音は必要エイリアス集合を「先行母音クラス × CV 単位」の有向辺集合とみなし、1行 = 最大モーラ数 M 以下の有向路として全辺を被覆する路の集合を生成する。**行の先頭モーラは `- CV` エイリアスを生む唯一の位置であるため、語頭 CV を全種収録する要件から行数の下限は語頭 CV 種類数以上になる。** **[Fact] 語頭 CV を全種含む設計は連続音リストの標準的な効率設計であり（各子音セクションに最低5行、1行7エイリアス、8モーラが最高効率）、下位方式書き出しを構成上保証することに追加の時間コストはほぼ生じない**'
notes = [
  '最大モーラ数を増やすと理論上の総時間は縮むが読み間違いが増えて実測時間が伸びる',
  '辺被覆の最適化に時間をかけすぎるとプロジェクト作成が待たされる',
]

[[requirement]]
id = 'TR-RCL-05'
title = 'CVVC の録音リストを CV・VC・語尾の 3 種のエイリアスを同時に回収する行として生成する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-02',
  'TR-RCL-07',
]
statement = 'CVVC プリセットでは、CV 単位 141 種、VC 単位（先行母音クラス 6 種 a/i/u/e/o/n × 子音 30 種 = 180 種）、語尾（V- 6 種）の合計 327 エイリアスを被覆する行を生成する。1 行 n モーラは CV を最大 n 種、隣接遷移由来の VC を最大 n-1 種与えるため、生成器は M=8 のとき 60 行・480 モーラ以内で被覆すること。口蓋化子音の VC（ky/gy/sh/ch/ty/dy/py/by/ny/hy/my/ry）を非口蓋化 VC から複製して代用する「軽量モード」を選択可能にし、その場合 VC を 180 → 120 種に減らして行数と所要時間を再計算する。'
notes = [
  '口蓋化 VC の代用は音質を落とすため、軽量モードを既定にすると品質面の期待を裏切る',
  'CVVC は 1 行の読み上げ難易度が最も高く（例のような無意味音列になる）、所要時間の見積もりが読み間違いで崩れやすい',
]

[[requirement]]
id = 'TR-RCL-06'
title = '多音階の収録音高を 5〜9 半音間隔で 3 本を既定とし、prefix.map を floor 割り当てで生成する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-01',
  'TR-RCL-22',
]
statement = '多音階の既定は 3 音高（女声 G3 / D4 / A4、男声 C3 / A3 / E4）。音高は 5〜9 半音間隔に収め、外れたら警告する。prefix.map は C1 から B7 の 84 半音すべてに1行を持つタブ区切り（音名 / prefix / suffix）で出力し、各半音に「その音以下で最も高い収録音高」に対応する接尾辞を割り当てる（floor 割り当て。最低音高は自分より下の全音域も担当）'
notes = [
  '最低収録音高より下の音域は必ず下方シフトになり、劣化が避けられない',
  '音高を本人の声域から自動決定するには録音前に声域測定が必要で、Create before configure と衝突する',
]

[[requirement]]
id = 'TR-RCL-07'
title = '生成した行に読み上げ可能性の制約を課し、行ごとに読み間違いリスクを評価する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-02',
]
statement = '録音リストの各行に対し、(a) モーラ数がプリセットの上限以下、(b) 同一 CV の 3 連続を作らない、(c) 撥音「ん」の連続を作らない、(d) 行内に難読音（拗音＋外来音の連鎖）を 2 個以上入れない、の 4 制約を必ず満たす。加えて行ごとに読み間違いリスクスコア（難読音数、拗音数、モーラ数から算出）を持ち、録音画面でモーラ境界を視覚的に区切って提示する。制約を満たす解が存在しない場合はモーラ上限を 1 下げて再生成する。'
notes = [
  '制約を強めると理論上の最小行数に届かず所要時間が伸びる',
  '読み間違いリスクの閾値が実際の発生率と対応しない',
]

[[requirement]]
id = 'TR-RCL-08'
title = '録音リストの各行を CP932 で符号化可能かつファイル名として安全な一意文字列にする'
confidence = 'Fact'
depends_on = [
  'TR-RCL-03',
  'TR-RCL-04',
  'TR-RCL-05',
]
statement = '生成する各行は (a) CP932 で符号化可能、(b) Windows / macOS のファイル名禁止文字を含まない、(c) Windows 予約名と一致しない、(d) リスト内で一意、(e) 拡張子を含めて 255 バイト以内、の5条件をすべて満たすことを生成時に検証する。失敗した行は生成をやり直し、失敗を黙って通さない。多音階では音高ごとにフォルダを分けて同名の行を許す。**この5条件の検証は、日本語ファイル名を生成する写像の入力チェックとして残す**（要件どうしの衝突の符号化2層分離を参照）'
notes = [
  '外来音を増やすと CP932 で表現できない文字に当たる',
]

[[requirement]]
id = 'TR-RCL-09'
title = '所要時間を「行数 × 行オーバーヘッド + 総モーラ数 × 単位発声時間 × (1 + 録り直し率) × 音高数」で算出する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-01',
  'TR-RCL-03',
  'TR-RCL-04',
  'TR-RCL-05',
]
statement = '所要時間の算出式を2本に分ける。(1) 単独音は「1単位あたりの実測サイクル × 単位数」。(2) 行読み上げ方式（CVVC / 連続音）は「1行 12.0 秒（≦6モーラ）＋モーラ超過分」。**8モーラ前提の数値は自前実測まで [Unknown] として選択画面に出さない。** 初期の表示値は実務値を一次基準に置き、KOERU の録音 UI での実測で確定する'
notes = [
  't_overhead 8.3 秒は OREMO の録音周期に固有の値であり、KOERU の録音 UI が連続録音や VAD 分割を採るとオーバーヘッドが 3〜4 秒まで下がって全数値が 1.5〜2 倍速くなる（単独音 5.7 分、連続音 8 モーラ 18.9 分、3 音階 56.7 分）',
  'r_retake = 0.20 に実測の裏付けがない',
]

[[requirement]]
id = 'TR-RCL-10'
title = '所要時間パラメータをユーザーの実測から更新し、残り時間の表示に反映する'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-09',
  'TR-RCL-23',
]
statement = '録音セッション中、行ごとに (a) 発声開始から終了までの実測時間、(b) 保存から次の行の発声開始までの実測時間、(c) 同一行のテイク数、を記録する。直近 20 行の中央値から t_overhead / t_unit / r_retake を推定し、そのプロジェクトの「残り所要時間」の表示に用いる。ただしプロジェクト作成画面に出す方式選択用の所要時間は実測で書き換えず、TR-RCL-09 の固定値のままとする（未着手のユーザーには実測がなく、方式間の比較可能性を壊すため）。実測が 10 行に達するまでは固定値を使う。'
notes = [
  '選択画面が固定値、進行中が実測値という二重表示がユーザーに矛盾として見える',
]

[[requirement]]
id = 'TR-RCL-11'
title = '方式選択画面には各プリセットにつき単一の所要時間と到達点を出し、時間だけで並べない'
confidence = 'Fact'
depends_on = [
  'TR-RCL-09',
  'TR-RCL-19',
]
statement = '方式選択画面は各プリセットにつき (a) 所要時間1個（レンジではなく代表値）、(b) 到達点として「歌える曲の範囲」を具体語で1行、(c) 1回の録音セッションで区切った場合の想定回数、**(d) 読み上げの難しさ（1行あたりモーラ数と難読音の含有率としてリストから機械算出する）** を提示する。所要時間の差が5分未満のプリセットを同一画面に2つ以上並べない。並べる場合は到達点の差を数値で明示する'
notes = [
  '到達点を数値で出すと、少ない方を選ぶことが劣った選択に見えて離脱要因になる',
]

[[requirement]]
id = 'TR-RCL-12'
title = '課題曲を「モーラ列 + MIDI ノート列 + 音域」のデータとして持ち、権利上同梱可能なものだけを収録する'
confidence = 'Unknown'
depends_on = []
statement = '課題曲は 1 曲につき (a) ノートごとの歌詞モーラ、(b) ノートごとの MIDI ノート番号と長さ、(c) 曲全体の最低音・最高音、(d) 総モーラ数、(e) 必要収録単位集合（方式ごとに事前計算した集合）、(f) 出典と利用許諾、をフィールドに持つデータとして同梱する。同梱する曲はパブリックドメインの伝承曲か KOERU のために制作したオリジナル曲に限り、第三者の楽曲の旋律・歌詞をデータとして含めない。ユーザーが持ち込む UST / USTX を課題曲として読み込む経路を用意し、その場合の必要単位集合は読み込み時に算出する。'
notes = [
  '同梱曲がパブリックドメインの伝承曲に偏ると、ミナが最初に聴く曲として魅力が足りず、報酬を先に届ける設計が弱まる',
]

[[requirement]]
id = 'TR-RCL-13'
title = '歌詞のモーラ分割と特殊モーラの正規化規則を 1 箇所に定義する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-02',
]
statement = '歌詞（仮名列）から収録単位列への変換規則を次のように定義し、録音リスト生成・課題曲の必要単位算出・カバレッジ判定のすべてで同一の実装を使う。(a) 小書き仮名（ぁぃぅぇぉゃゅょ）は直前の文字と結合して 1 モーラとする。(b) 促音「っ」は 1 モーラとして数えるが収録単位を要求せず、直後の CV の子音部を要求する。(c) 長音「ー」は直前モーラの末尾母音の継続として扱い、新たな収録単位を要求しない（presamp の LONG_V 規則 %V%ー に対応）。(d) 撥音「ん」は母音クラス n を持つ独立した収録単位とする。(e) カタカナは対応する平仮名に正規化し、「ヴ」系は外来音として 168 音セットにのみ含める。(f) 無声化母音は正規化しない。'
notes = [
  '促音・長音の扱いが OpenUtau 側の phonemizer と食い違うと、カバレッジ上は歌えると判定した曲が実際には音を欠く',
]

[[requirement]]
id = 'TR-RCL-14'
title = '生の歌詞テキストを入力できる場合は g2p で仮名読みに変換し、変換結果をユーザーが修正できる'
confidence = 'Assumption'
depends_on = [
  'TR-RCL-13',
]
statement = 'ユーザーが漢字混じりの歌詞テキストを貼り付けた場合、形態素解析＋読み付与で仮名列に変換し、TR-RCL-13 の規則でモーラ列にする。変換器は単一ネイティブアプリに同梱でき、オフラインで動作し、辞書を含めて再配布可能なライセンスであること。変換結果はモーラ単位で表示し、ユーザーが読みを直接修正できる UI を持つ。修正はプロジェクトに保存し、同じ語の再変換に反映する。'
notes = [
  '同梱曲を UST / USTX で持てば g2p は不要になるため、この機能が投資に見合わない可能性がある',
]

[[requirement]]
id = 'TR-RCL-15'
title = '課題曲ごとに、方式別の必要収録単位集合を算出する'
confidence = 'Fact'
depends_on = [
  'TR-RCL-13',
  'TR-RCL-06',
]
statement = "課題曲のモーラ列から方式ごとの必要エイリアス集合を算出する。単独音は `{ mi }`、連続音は `{ vowel_class(m_{i-1}) + ' ' + mi }`（i=1 は `- ` + m1）、CVVC は `{ mi } ∪ { vowel_class(m_{i-1}) + ' ' + consonant(mi) } ∪ { 語尾 }`。多音階では各エイリアスに、そのノートの MIDI 値を prefix.map の floor 割り当てで解決した収録音高を付与し、（エイリアス, 収録音高）の組を単位とする。算出は課題曲データに事前計算値として保存する"
notes = [
  '多音階では 1 曲の必要単位が音高をまたいで分散し、「1 曲歌える」までに必要な録音量が単一音階の数倍になる',
]

[[requirement]]
id = 'TR-RCL-16'
title = '曲先行のミニ音源は、フルリストの部分集合として選ぶ'
confidence = 'Fact'
depends_on = [
