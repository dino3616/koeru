  'REQ-RCL-003',
  'INV-RCL-001',
]
statement = '進捗表示はカバレッジと「いま歌える曲の数」を常時両方出す。どちらかを隠さない。 カバレッジは収録単位（エイリアス）の被覆率とし、行の消化率ではない。行数は本人の作業量、単位の被覆は音源の到達度で、意味が違う。 曲の状態は3段階で定義する。(1) 完全: 必要単位がすべて収録済み。(2) 代替あり: 一部が未収録だがフォールバック規則で解決すれば全ノートが鳴る。(3) 不可: フォールバックでも解決できない、または音域が範囲外。表示では (1) と (2) を「歌える」に含めてよいが、(2) は音のつながりが粗くなることを1行で説明する。歌える曲は、録り始めのとっかかりとして最も効く指標であって、唯一の指標ではない。 曲を1本も入れていないプロジェクトでも進捗が読めること。完成の判定に公開の有無を含めない'
notes = [
  '段階を出すと「完全ではない」ことが未完成として見え、非公開完成を正規の完成形として残す方針と衝突する',
]

