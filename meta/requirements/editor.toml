# 原音設定エディタ（setParam / vLabeler 同等）
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

domain = 'editor'
domain_title = '原音設定エディタ（setParam / vLabeler 同等）'
prefix = 'TR-EDT'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Risk] 「原音設定を自分でやらずに済む」と「録音品質のリアルタイム判定はスコープ外」が両立しない場面がある。** 音量不足・クリッピング・過大なノイズのある録音は自動推定の要確認スコアを確実に上げるが、原因が録音品質であることは編集画面からは分からない。**結果として通常モードは「境界がずれている」として提示し、ユーザは境界を動かして直そうとするが直らない。** 編集画面で「これは録り直したほうがよい」と言えるようにするには、録音品質の判定を編集フェーズに後付けで持ち込むことになる。**判定を持たないなら、通常モードは直せない問題を直させ続けることになる。**',
  '**[Risk] 下位方式書き出し時の写像（連続音の語頭を単独音として切り出す）を、エディタの一括編集として持つのか書き出し領域が持つのかが未決。** エディタが持つと、書き出し方式ごとに別の oto.ini が生まれ、TR-EDT-37 の「往復で何が失われるか」の設計が方式ごとに分岐する。',
  '**[Unknown] TR-EDT-20 のゼロクロス吸着で、setParam と同じ「ピッチマーク左側の右上がりゼロクロス」を実装するにはピッチマークの算出が必要。** F0 推定を自動推定領域から借りるのか、単純な「左方向の直近の立ち上がりゼロクロス」で代替するのかが未決。代替した場合、setParam と結果が一致しないことをユーザがどう受け取るか。',
  '**[Risk] TR-EDT-15 の事前計算と即時試唱が CPU を争う。** 録音直後に事前計算を走らせると試唱が遅くなり、試唱を優先すると編集画面を開いたときに待ちが出る。→ TR-SYN-34 のワーカプール優先度（録音直後の前処理 > 試唱の要求 > 全件再推定 > チャート事前計算）で解く。',
  '**[Unknown] prefix.map で B7〜C1 の 84 行すべてを出力するのが必須かどうか。** OpenUtau のテストデータからの推定で、UTAU 本体が不足行をどう扱うかは未確認。',
  '**[Unknown] 既定キーバインドを macOS でどうするか。** setParam の F1〜F5 は macOS では OS の輝度・Mission Control に既定で占有されており、そもそも setParam は Windows 専用なので macOS ユーザに互換の意味も薄い。OS ごとに別の既定を持つと、ドキュメントとコミュニティの知識が分岐する。',
  '**[Unknown] setParam の実際に流通している最新ビルドが確定できていない。** 公式配布ページは古いビルドまでしか掲載しておらず、GPL ソースを含むミラーはさらに別のビルド、コミュニティ wiki が言及するビルドは直接確認できなかった。**基準線とする機能セットが確認できたビルドのもので足りているかは未確認。**',
  '**[Risk] TR-EDT-37 の「往復で情報が非対称に失われる」設計が、実際に「戻ってくる動機」として機能するかは検証されていない。** 逆に、外部編集を隠したまま作業する動機になる可能性がある。',
  '**[Unknown] エディタが扱う wav の入力条件が未決。** KOERU が録った wav はフォーマットを自分で決められるが、インポートした音源はステレオ・48kHz・24bit などが混在する。setParam は「ステレオ→モノラル変換」「DC 成分の除去」「wav のトリミング」を持つが、これらを KOERU が持つかは未決（TR-EDT-27 の必須集合には入れていない）。',
]

[[requirement]]
id = 'TR-EDT-01'
title = '5値を絶対サンプル位置で保持する単一データモデル'
confidence = 'Fact'
depends_on = []
statement = '1エントリは、参照 wav・エイリアス文字列・5つの境界（左ブランク / オーバーラップ / 先行発声 / 子音部 / 右ブランク）を、いずれも wav 先頭からの絶対サンプル位置として保持する。**ただし右ブランクだけは wav の総長という外部状態に依存するため、モデルは絶対サンプル位置に加えて、エントリごとに (a) インポート時の表記（正 / 負）と (b) インポート時に読んだ wav のフレーム数 を保持する。** 書き出し時に対象 wav のフレーム数が (b) と一致しない場合は黙って再変換せず、影響エントリ数を出して「元の絶対位置を保つ / 末尾基準を保つ」を選ばせる。wav のトリミング・正規化・モノラル化は KOERU 内部の明示的な操作としてのみ許し、実行時にその wav を参照する全エントリを再アンカーして件数を報告する'
notes = [
  '正の右ブランクは wav 末尾基準なので、絶対位置への変換に wav 長が必要。インポート時に全 wav の長さを読む必要があり、wav をトリミング・正規化すると既存の正値エントリが黙って移動する',
]

[[requirement]]
id = 'TR-EDT-02'
title = '境界単位の信頼度・由来・確認状態'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-01',
]
statement = '5値それぞれに (a) **要確認スコア**、(b) 由来 {自動 / 手動編集 / 一括編集 / 外部インポート}、(c) 確認状態 {未確認 / 確認済み} を独立して持たせる。エントリ単位ではなく境界単位で持つ。**(a) は「モデル事後確率」ではなく「複数の独立した観測から作る要確認スコア」として定義する**: (1) 制約付き Viterbi の境界と、モデルに依存しない検出（短時間エネルギーの立ち上がり、スペクトルフラックスのピーク、ゼロクロス密度の変化）との不一致量、(2) ガイドのテンポから期待される位置とのずれ、(3) 同一音素が録音リスト内の他エントリで取った長さの中央値からの乖離、(4) その窓の SNR・クリッピング・無音判定の失敗、の合成。**これらは監査可能で、較正の研究成果を前提にしない**'
notes = [
  'アライナの信頼度が実際の境界誤差と相関しない場合、この構造の上に載る通常モード全体が意味を失う',
]

[[requirement]]
id = 'TR-EDT-03'
title = '通常/上級はモデルではなくビューの切替'
confidence = 'Fact'
depends_on = [
  'TR-EDT-01',
  'TR-EDT-02',
]
statement = '通常モードと上級モードは同一プロジェクトデータに対する2つのビューとして実装する。モード切替でデータ変換・マイグレーション・情報の欠落を一切起こさない。モードはプロジェクト設定ではなくウィンドウのビュー状態として保存し、いつでも往復できる'

[[requirement]]
id = 'TR-EDT-04'
title = '全変更を単一のコマンド層に通す'
confidence = 'Fact'
depends_on = [
  'TR-EDT-03',
]
statement = '5値の変更、エイリアス変更、一括編集、通常モードでの「これで合っている」確認、外部インポートによる上書き — すべてを可逆なコマンドオブジェクトとして表現し、undo/redo・由来の更新・信頼度の無効化をコマンド層で一元的に行う。通常モードの確認操作も undo できること。'

[[requirement]]
id = 'TR-EDT-05'
title = '用語の露出はビュー層のみで制御する'
confidence = 'Fact'
depends_on = [
  'TR-EDT-03',
]
statement = '通常モードは「先行発声」「オーバーラップ」「子音部」「ブランク」「オフセット」「oto.ini」「エイリアス」「原音設定」を一切表示しない。上級モードは逆に、これらの語を既存エコシステムの表記のまま用い、KOERU 独自の言い換えを導入しない。**UTAU 本体と setParam でパラメータ名が異なる事実があるため、両方の呼び方の対応表をヘルプに持つ**'

[[requirement]]
id = 'TR-EDT-06'
title = '通常モードの提示単位と画面構成'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-02',
  'TR-EDT-05',
]
statement = '通常モードでは5値のハンドルを見せず、確認対象を「録った1フレーズ（1エントリ）」単位で提示する。1件の確認画面は、波形（スペクトログラムなし）、自動が置いた境界の位置、その位置での再生ボタン、および「これで良い / ずれている」の2択のみで構成する。「ずれている」を選んだときに限り、その境界1本だけをドラッグできる簡易編集を開く。簡易編集でも数値は表示しない。**境界1本を動かしたときの他の4値の追随規則を TR-EDT-21 の (a)(b) のいずれかに確定させる**（決めないと簡易編集が TR-EDT-44 を機械的に破る）'
notes = [
  '1本だけ動かしたとき他の4値をどう追随させるかが未定義だと、簡易編集が制約違反を生む',
]

[[requirement]]
id = 'TR-EDT-07'
title = '確認待ちの選別は閾値ではなく件数上限で決める'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-02',
  'TR-EDT-06',
]
statement = '通常モードに出す確認待ちは **TR-ALN-25 の定義を参照する**（同一の量を2箇所で定義しない）。出荷条件として「内部で人手ラベルを付けた検証セットに対し、20ms 超の誤差のうち提示分が拾えた割合（再現率）を実測すること」を要件に追加する。**実測前は通常モードの UI で『怪しいところだけ確認すれば済む』と読める表現を使わない**'
notes = [
  '上位N件で切ると、外れている境界を残したまま完成に到達し、書き出した音源の品質が下がる',
  'N の妥当な値と信頼度の較正方法が未定',
]

[[requirement]]
id = 'TR-EDT-08'
title = '上級モードは通常モードの上位互換であること'
confidence = 'Fact'
depends_on = [
  'TR-EDT-03',
  'TR-EDT-06',
]
statement = '上級モードで到達できる編集は通常モードの編集をすべて含む。通常モードで確認済みにしたエントリは上級モードで「確認済み」として可視化され、上級モードで編集したエントリは自動的に確認済みになる。上級モードを一度も開かずに完成・書き出しへ到達できる経路を必ず残す。'

[[requirement]]
id = 'TR-EDT-09'
title = '波形とスペクトログラムの同時・同軸表示'
confidence = 'Fact'
depends_on = []
statement = '上級モードは波形とスペクトログラムを縦に並べ、同一の時間軸・同一のスクロール位置・同一のズーム倍率に常に同期させる。両ペインの高さ比を変更でき、いずれかを非表示にできる。境界の値は常にサンプル単位で決まり、スペクトログラムのフレーム境界には丸めない'

[[requirement]]
id = 'TR-EDT-10'
title = 'スペクトログラムの解析パラメータ'
confidence = 'Fact'
depends_on = [
  'TR-EDT-09',
]
statement = 'STFT は既定で窓長 512 サンプル（128〜4096 で可変）、ホップ長は時間分解能 2.5ms 以下になる値（48kHz で 110 サンプル以下、44.1kHz で 101 サンプル以下）、窓関数は Blackman-Harris 既定（Hamming / Hann / 矩形 / Bartlett / Blackman / 三角も選択可）、強度は dB 表示で下限 -20dB・上限 55dB を既定とする。周波数軸は既定でメルまたは対数ワープ表示とし、線形表示も選べる。表示上限周波数は既定 20kHz、5kHz〜ナイキストで可変。'

[[requirement]]
id = 'TR-EDT-11'
title = 'ズーム段階の下限と上限'
confidence = 'Fact'
depends_on = [
  'TR-EDT-09',
]
statement = '水平ズームは 0.25 ms/px 以下まで拡大でき、9 ms/px 以上まで縮小できること（44.1kHz で 10〜400 サンプル/px 相当）。刻みは既定 20 サンプル/px で良いが、倍率の数値直接入力を必ず持つ。1ms が 4px 以上で描かれる倍率に必ず到達できること。垂直ズーム（波形の振幅方向、およびスペクトログラム・パワー・F0 の高さ）も独立に変更できること。'

[[requirement]]
id = 'TR-EDT-12'
title = 'ドラッグ・ズーム・スクロール中は STFT を再計算しない'
confidence = 'Fact'
depends_on = [
  'TR-EDT-10',
  'TR-EDT-11',
]
statement = 'スペクトログラムは wav ファイル単位（大きいファイルはチャンク単位）で事前に計算してビットマップ化し、ズーム・スクロール・ハンドルのドラッグでは再計算せず**ソース矩形の変換だけで再描画する。** 解析パラメータを変えたときのみ再計算する。**ソース矩形拡大時の補間はバイリニアとし、最大拡大でも階段状にしない。** 解析パラメータ（窓長 128〜4096・ホップ）を可変にしてある事実をユーザ操作として露出する。再計算が必要なのはズーム段の切り替わり時の1回だけであり、必ずワーカスレッドで行いビットマップを差し替える'
notes = [
  '0.25 ms/px でホップ 2.29ms だと 1 STFT フレームが約 9px を占める。精度が最も必要な倍率でスペクトログラムが目に見えてブロック状になり、再計算なしでは解決できない。OpenUtau は zoomInMel トグルで別途 FFT サイズを変えて再計算しており、この回避策が必要になる可能性がある',
]

[[requirement]]
id = 'TR-EDT-13'
title = 'ドラッグ中のフレーム予算'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-12',
]
statement = 'ハンドルのドラッグ中、ポインタ位置とハンドル描画位置の遅れは1フレーム以内とし、メインスレッドの1フレームあたりの作業を 8ms 以下に収める。ホイールによる水平スクロールとズームも同じ予算に収める。'

[[requirement]]
id = 'TR-EDT-14'
title = '隣接エントリへの移動の応答時間'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-12',
  'TR-EDT-15',
]
statement = '「次の音へ」操作から、波形・スペクトログラム・5値ハンドルが完全に描き終わるまでを、チャート事前計算済みのファイルで 50ms 以内、未計算のファイルで 200ms 以内とする。未計算時は波形を先に出し、スペクトログラムは遅れて差し込む（波形の表示をスペクトログラムの計算で待たせない）。'

[[requirement]]
id = 'TR-EDT-15'
title = 'チャートの事前計算とディスクキャッシュ'
confidence = 'Fact'
depends_on = [
  'TR-EDT-12',
]
statement = 'スペクトログラム・波形のビットマップはプロジェクト単位の**ディスクキャッシュ**に保存し、解析パラメータのハッシュをキーに含める。パラメータが変われば自動で全破棄する。**メモリは可視域＋前後数エントリのウィンドウだけとする**（→ Q-EDT-001）。録音完了時とプロジェクト開始時にバックグラウンドで事前計算し、**事前計算はエントリの走査順に先行させ「次の N エントリが常に計算済み」を満たす形で優先度を付ける。** 音階・ファイル・チャートの3段の進捗を表示し、途中でも編集を開始できる。キャッシュを明示的に破棄する操作を持つ'
notes = [
  '録音直後の全ファイル事前計算が、即時試唱（F02、プロダクトの中核体験）と CPU を争う',
]

[[requirement]]
id = 'TR-EDT-16'
title = 'メモリ上限とチャンク分割'
confidence = 'Fact'
depends_on = [
  'TR-EDT-15',
]
statement = '音源の総再生時間に関わらず、常駐する音声データとチャート画像のメモリ量に上限（既定 512MB）を設け、wav はチャンク分割して読み込む。上限に達したら現在のエントリから遠いチャンクを解放する。上限を超えたことをユーザに見せない（手動でメモリを回収させる操作を要求しない）。'

[[requirement]]
id = 'TR-EDT-17'
title = '事前計算のスループット'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-15',
]
statement = '4コア以上の一般的な PC で、合計 30 分（1800秒）の音声に対するスペクトログラム事前計算を 60 秒以内に完了すること。処理は打ち切り・再開可能で、アプリ終了時に中断しても次回起動時に続きから走ること。'

[[requirement]]
id = 'TR-EDT-18'
title = '5値へのキー割り当て（カーソル位置への設定）'
confidence = 'Fact'
depends_on = [
  'TR-EDT-22',
]
statement = '上級モードで、5値それぞれに「カーソル位置へその境界を移動する」キーを割り当てる。既定は setParam に合わせ F1=左ブランク / F2=オーバーラップ / F3=先行発声 / F4=子音部 / F5=右ブランクとし、vLabeler 流の英字キー割り当てもプリセットとして選べること。既定プリセットを起動時に選ばせず、あとから切り替えられること。'
notes = [
  'macOS では F1〜F5 が OS の輝度・Mission Control に既定で占有されており、setParam 互換の既定キーがそのまま使えない。setParam 自体が Windows 専用（setParam.exe）なので、macOS ユーザには互換の意味も薄い',
]

[[requirement]]
id = 'TR-EDT-19'
title = '再生操作の必須集合'
confidence = 'Fact'
depends_on = []
statement = '次の8種を必ず持つ。(a) 現在エントリの再生（既定 Space）、(b) wav 全体の再生、(c) 画面表示範囲の再生、(d) 任意2境界の間の再生（既定 Ctrl+Space で左ブランク〜右ブランク）、(e) クリック位置からの部分再生、(f) ドラッグ範囲の再生と、同範囲の繰り返し再生、(g) 先行発声のタイミング確認再生（クリック音／メトロノームと重ねて鳴らす）、(h) 現在の5値でリサンプラを通した合成試聴。(g)(h) は本体機能として持ち、プラグインに委ねない。'
notes = [
  '(h) はリサンプラの同梱と実行を前提にする。処理をローカル完結させる方針とは整合するが、リサンプラのライセンスと同梱可否は別領域の判断に依存する',
]

[[requirement]]
id = 'TR-EDT-20'
title = 'ゼロクロス吸着'
confidence = 'Fact'
depends_on = []
statement = '5値それぞれについて境界を立ち上がりゼロクロス位置へ吸着させる機能を持ち、パラメータ別に on/off を切り替えられる（既定は5値すべて on）。探索窓は上限を持ち（既定 ±5ms）、窓内にゼロクロスが無ければ吸着しない。吸着はドラッグ確定時とキーによる設定時の両方に効き、数値の直接入力時には効かない'
notes = [
  'setParam は「ピッチマーク左側の」立ち上がりゼロクロスを使うが、ピッチマーク（基本周期のマーク）の算出手段が KOERU に無い場合、「直近」の定義が変わり結果が一致しない',
  '歌声の低域では基本周期が長く、±5ms 窓内に複数のゼロクロスが入る',
]

[[requirement]]
id = 'TR-EDT-21'
title = '位置保持ドラッグの2モード'
confidence = 'Fact'
depends_on = [
  'TR-EDT-01',
]
statement = '左ブランクまたは先行発声を動かしたとき、他の境界の扱いを2通り選べる。(a) 他の境界の wav 内の絶対位置を保つ、(b) 他の境界との相対関係を保って一緒に動く。既定は (a)。切替はモーダルな設定だけでなく修飾キーによる一時反転でも行える'

[[requirement]]
id = 'TR-EDT-22'
title = 'キーバインドの完全なカスタマイズ'
confidence = 'Fact'
depends_on = []
statement = 'エディタの全操作（最低60種以上: ファイル操作、undo/redo、ツール切替、エントリ / wav / 音階の移動、5値の設定、各種再生、ズーム、一括編集の起動枠、確認状態の切替）について、キー・マウスクリック・マウススクロールの割り当てをそれぞれ変更できる。衝突を検出して警告し既定に戻せる。設定をファイルに書き出し・読み込みできる'

[[requirement]]
id = 'TR-EDT-23'
title = '日本語入力環境でのキー入力'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-22',
]
statement = 'IME が有効な状態でも、エディタのキャンバスにフォーカスがあるときは5値設定キー・移動キー・再生キー・ズームキーが IME に吸われずエディタに届くこと。エイリアス編集フィールドにフォーカスがある間だけ IME に渡すこと。フォーカスの所在が画面上で常に判別できること。'
notes = [
  '採用する GUI フレームワークが IME の有効/無効をフォーカス単位で制御できない場合、この要件は満たせない',
]

[[requirement]]
id = 'TR-EDT-24'
title = '連続した音への移動と絞り込みの連動'
confidence = 'Fact'
depends_on = [
  'TR-EDT-02',
]
statement = 'エントリ単位の前後移動、wav ファイル単位の前後移動、音階単位の前後移動、番号または名前によるジャンプを持つ。加えてエントリ一覧に絞り込みを持ち、絞り込みを移動操作に連動させる on/off を持つ（連動 on のとき、絞り込みから外れたエントリを前後移動でスキップする）。絞り込み条件はエイリアスの部分一致、wav 名の部分一致、確認状態、信頼度の下限を AND で組み合わせられること。編集後に自動で次のエントリへ進む挙動を on/off できること。'

[[requirement]]
id = 'TR-EDT-25'
title = 'undo/redo の粒度と保持量'
confidence = 'Fact'
depends_on = [
  'TR-EDT-04',
]
statement = 'undo の単位は「1つのユーザ操作」とする。すなわち (a) 1本の境界の1回のドラッグ（ドラッグ中の中間状態は1件に統合）、(b) 1セルの数値入力、(c) 1エントリのエイリアス変更、(d) 1回の一括編集（何千エントリに及んでも1件）、(e) 通常モードでの1件の確認、(f) 1回の外部インポート、をそれぞれ1件とする。エントリ間の移動やモード切替は履歴に積まない。履歴は既定100操作以上を保持し、同時にメモリ量の上限（既定200MB）を併用して上限到達時は古い方から捨てる。履歴に操作名を表示する。'

[[requirement]]
id = 'TR-EDT-26'
title = '数値テーブルによる直接編集'
confidence = 'Fact'
depends_on = [
  'TR-EDT-22',
  'TR-EDT-25',
]
statement = '上級モードは5値の数値をテーブルで直接編集できる。セル移動、範囲選択、範囲対範囲のコピー / 貼り付け（区切り文字はタブと空白を選択可、範囲サイズが違う場合は確認する）、行の複製と削除、検索と次 / 前を検索、選択範囲への規則適用を持つ'

[[requirement]]
id = 'TR-EDT-27'
title = '一括編集の必須集合（12種）を本体機能として持つ'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-25',
]
statement = '一括編集を本体機能として持つ。**[Fact] 12種の出自は setParam / KiraOtoToolbox / vLabeler の交差である。[Assumption] それが必要十分であるかは未検証。** 12種は (1) エイリアスの検索置換、(2) 接頭辞・接尾辞の一括付与と除去、(3) エイリアスの複製、(4) 重複エイリアスの検出と連番振り直し / 削除、(5) 空エントリの削除、(6) 選択範囲への値の一括適用（絶対値 / 加減算 / 比率）、(7) 位置保持つきの値変更、(8) CV/VC 分割、(9) 右ブランクの正負表記の相互変換、(10) 並べ替え、(11) 別 oto.ini のマージ、(12) 書き出し時の小数桁数の指定。**13番目として「条件選択＋フィールド式」を追加する**（エイリアス・音階・wav ファイル名・各値に対する述語でエントリを絞り込み、選択集合の各フィールドに四則と min/max とクランプからなる式を適用する）。これはスクリプトエンジンを同梱せずに長い裾を吸収する一般操作であり、(6)(7) はこの一般形の特例として書ける。**実装は参照元から独立に行う**（GPL-3.0 の KiraOtoToolbox と GPL の setParam のコードを読まない）'
notes = [
  '列挙が外れていた場合、スクリプトを持たない方針（TR-EDT-30）と組み合わさって逃げ道が無くなる',
]

[[requirement]]
id = 'TR-EDT-28'
title = '一括編集の適用範囲とプレビュー'
confidence = 'Fact'
depends_on = [
  'TR-EDT-27',
  'TR-EDT-24',
]
statement = 'すべての一括編集は (a) プロジェクト全体、(b) 現在の音階、(c) 絞り込み結果、(d) 明示的な選択、のいずれかを対象に指定できること。実行前に「変更されるエントリ数と、最初の20件の before / after」を表示し、実行後に変更件数のレポートを出し、1件の undo で完全に戻せること。設定は名前を付けて保存・読み込みできること。'

[[requirement]]
id = 'TR-EDT-29'
title = '一括編集の性能'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-28',
]
statement = '5000エントリに対する一括編集は 1 秒以内に完了し、UI をブロックしないこと。プレビューの生成は 200ms 以内。'

[[requirement]]
id = 'TR-EDT-30'
title = 'スクリプトによる一括編集は初期スコープに含めない'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-27',
]
statement = '任意コードによる一括編集（JavaScript 等）は初期スコープに含めない。ただし TR-EDT-27 の12種はすべて同一の内部一括編集 API の上に実装し、その API がエントリ配列とパラメータ辞書を受けて配列を書き換える形（vLabeler の macro スクリプトと同型）であること。後からその API をスクリプトへ開放しても、12種の実装を書き換えずに済むこと。'
notes = [
  '12種の列挙が不足していた場合、逃げ道がないため、その1操作のためにハルが外部ツールへ出る',
]

[[requirement]]
id = 'TR-EDT-31'
title = 'エイリアスの検証'
confidence = 'Fact'
depends_on = [
  'TR-EDT-38',
]
statement = 'エイリアスに対して次を検出して警告する。前後の空白、2つ以上の空白、全角空白の混入、Unicode 正規形が NFC でないこと、Shift-JIS（CP932）で表現できない文字の混入、他エントリとの重複、大文字小文字の違いだけで衝突する重複。参照している wav ファイル名についても、NFC でないこと・実ファイルとの大文字小文字の不一致を検出する。'

[[requirement]]
id = 'TR-EDT-32'
title = '音階を跨いだ横断編集'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-24',
  'TR-EDT-28',
]
statement = '多音階プロジェクトでは、各音階を1つのサブプロジェクト（サブフォルダとその oto.ini）として扱い、次の3つを持つ。(a) 音階単位の前後移動とジャンプ、(b) 「同じエイリアスの、音階をまたぐ全エントリ」を並べて一覧し、同時に編集する横断ビュー、(c) 一括編集を全音階へ一度に適用。'
notes = [
  '横断ビューは画面設計と実装の工数が読めていない',
]

[[requirement]]
id = 'TR-EDT-33'
title = 'prefix.map の生成と編集'
confidence = 'Fact'
depends_on = [
  'TR-EDT-38',
]
statement = 'prefix.map を KOERU が生成し編集できる。書式は「音階名 TAB 接頭辞 TAB 接尾辞」のタブ区切りで1行1音階、B7 から C1 までの 84 音階すべての行を出力する（空の音階も空欄で行を出す）。編集 UI は音階の範囲を指定してまとめて割り当てられる。文字コードは音源の他のテキストファイルと同一にする'
notes = [
  '84音階すべての行を出すのが必須かどうかは、OpenUtau のテストデータからの推定。UTAU 本体が不足行をどう扱うかは未確認',
]

[[requirement]]
id = 'TR-EDT-34'
title = '接頭辞・接尾辞とエイリアスの整合検査'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-33',
  'TR-EDT-27',
]
statement = 'prefix.map の接頭辞・接尾辞を変更したとき、対応する音階の oto.ini のエイリアスと不整合になるエントリを検出して警告し、エイリアス側を追随させる一括編集（TR-EDT-27 の (2)）を同じ画面から提示する。逆に、エイリアスの接辞を一括変更したときも prefix.map との不整合を検出する。'

[[requirement]]
id = 'TR-EDT-35'
title = '音階をまたいだ値の複製'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-32',
  'TR-EDT-02',
]
statement = 'ある音階のエントリの5値を、同一エイリアスの他の音階のエントリへ複製できること。複製時に (a) 値をそのまま入れる、(b) 相対関係を保って入れる、を選べること。複製された境界は由来を「一括編集」、確認状態を「未確認」に落とし、信頼度を「なし」にすること。'
notes = [
  '高音側では発声の立ち上がりが変わり、複製した境界の妥当性が低い',
]

[[requirement]]
id = 'TR-EDT-36'
title = 'oto.ini のインポートを持つ'
confidence = 'Fact'
depends_on = [
  'TR-EDT-01',
  'TR-EDT-38',
]
statement = '既存の oto.ini（単一ファイル、および複数音階のフォルダ構成）をインポートして編集できる。KOERU で録っていない wav に対しても編集できる。インポートしたプロジェクトも通常モード・上級モードの両方から扱える。**[Fact] インポート時に wav ファイル数ぶんのヘッダ読み（エントリ数ではない）が発生する**'
notes = [
  'インポートで正の右ブランクを絶対位置へ変換するには全 wav の長さを読む必要があり、大規模音源でインポートが遅くなる',
]

[[requirement]]
id = 'TR-EDT-37'
title = '往復で失われるものを意図的に非対称にする'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-36',
  'TR-EDT-02',
]
statement = '信頼度・由来・確認状態・テイク履歴・録音リストとの対応は KOERU のプロジェクトファイルにのみ保持し、oto.ini には書かない。外部ツールで編集された oto.ini を再インポートした場合、値が変わったエントリの由来を「外部インポート」、確認状態を「未確認」に落とし、信頼度を「なし」にする。何件がその状態になったかを再インポート時に表示する。oto.ini にコメント行として独自メタデータを埋め込む方法は採らない。'
notes = [
  '「未確認に落ちる」ことがハルにはペナルティに見え、外部編集を隠したまま作業する動機になる',
  'そもそも往復の摩擦を「戻ってくる動機」に変換できるという前提が検証されていない',
]

[[requirement]]
id = 'TR-EDT-38'
title = 'oto.ini の文字コード'
confidence = 'Fact'
depends_on = []
statement = '書き出しは既定 Shift-JIS（CP932）とする。CP932 で表現できない文字がエイリアスまたはファイル名に含まれる場合は書き出し前に警告し、BOM なし UTF-8 と1行目の `#Charset:UTF-8` 宣言を付ける選択肢を出す。読み込みは1行目の `#Charset:` 宣言を最優先し、無ければ character.txt の文字コード指定、それも無ければ文字コード判定にかける。判定結果は必ずユーザが上書きできること。判定に失敗した状態で黙って読み進めないこと。'

[[requirement]]
id = 'TR-EDT-39'
title = 'インポートの非破壊性'
confidence = 'Fact'
depends_on = [
  'TR-EDT-36',
  'TR-EDT-41',
]
statement = 'インポートした oto.ini に解釈できない行が含まれていた場合、その行を原文のまま保持し、書き出し時に同じ位置に同じ内容で書き戻す。編集していないエントリは、値の丸めや空欄の埋めを行わずに原文どおり書き戻す。空欄のフィールドと 0 のフィールドを区別して保つ。インポートしてすぐ書き出したらファイルが1バイトも変わらないこと。'

[[requirement]]
id = 'TR-EDT-40'
title = '外部変更の検知'
confidence = 'Fact'
depends_on = [
  'TR-EDT-37',
]
statement = 'KOERU が書き出した oto.ini を含むフォルダをサブフォルダまで監視し、KOERU の外で変更されたことを検知したら「取り込む / 無視する / 差分を見る」を提示する。KOERU 自身の書き込みでは通知しない。差分表示は変更されたエントリ単位で5値とエイリアスの before / after を出す。**変わったフィールドの組み合わせと件数の形（何が一括で同じ量だけ動いたか）をローカルのプロジェクトファイルに記録する**（送信は既定オフ。一括編集の列挙の欠落を推測ではなく計測で発見する経路）'

[[requirement]]
id = 'TR-EDT-41'
title = '数値の精度と書き出しの再現性'
confidence = 'Fact'
depends_on = [
  'TR-EDT-01',
]
statement = '内部はサンプル単位の整数で保持し、書き出し時に ms へ変換する。小数桁数はフィールドごとに指定でき既定は3桁。同じプロジェクトを2回書き出したら同一のバイト列になる。**右ブランク表記の既定は負表記とする**（wav 長非依存で往復の安定性が最も高い）。正表記は UTAU v0.2.43 以前への配布時の選択肢として残す'
notes = [
  '負表記を既定にすると古い UTAU で読めない。正表記を既定にすると wav 長への依存が残る',
]

[[requirement]]
id = 'TR-EDT-42'
title = '外部ツールへの受け渡しはフォルダを開くまで'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-40',
]
statement = '現在の音階の oto.ini があるフォルダを OS のファイラで開く操作を持つ。外部ツールを KOERU 内から起動するプラグイン登録機構は初期スコープに含めない。'

[[requirement]]
id = 'TR-EDT-43'
title = '制約違反の常時検出'
confidence = 'Fact'
depends_on = []
statement = '次の11条件を編集中に常時検出し、該当エントリを一覧できること。左ブランクが負 / 左ブランクが wav 長を超える / 先行発声が負 / 左ブランク+先行発声が wav 長を超える / 子音部が負 / 左ブランク+子音部が wav 長を超える / 左ブランク+オーバーラップが wav 長を超える / 右ブランク位置が 左ブランク+先行発声 より前 / 右ブランク位置が 左ブランク+オーバーラップ より前 / 右ブランク位置が 左ブランク+子音部 以下 / 右ブランク位置が wav 長を超える。'

[[requirement]]
id = 'TR-EDT-44'
title = '編集操作は制約を破らない'
confidence = 'Fact'
depends_on = [
  'TR-EDT-43',
  'TR-EDT-39',
]
statement = 'ドラッグおよびキーによる境界設定は、TR-EDT-43 の制約を破る位置で停止する（境界同士が最小距離を保つ）。最小距離は既定 3ms とし、オーバーラップのみ負値を許す。数値の直接入力とインポートでは制約違反を許すが、該当エントリを警告表示する。制約を外す設定（無制約編集）を上級モードに持つ。'

[[requirement]]
id = 'TR-EDT-45'
title = '通常モードの確認待ちに制約違反を必ず含める'
confidence = 'Fact'
depends_on = [
  'TR-EDT-07',
  'TR-EDT-43',
]
statement = '制約違反が残っているエントリは、確認待ちの件数上限の枠外として通常モードでも必ず全件を確認待ちに出す。件数上限は要確認スコアによる選別にのみ適用する。**制約違反が残っている状態では通常モードの完成表示を「完成」にしない**'

[[requirement]]
id = 'TR-EDT-46'
title = '再自動推定に対する手動編集の保護'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-02',
  'TR-EDT-04',
]
statement = '自動推定を再実行したとき、由来が「手動編集」または確認状態が「確認済み」の境界は上書きしない。上書きするかを実行前に選べるが既定は保護する。保護した件数と上書きした件数を実行後に表示する'

[[requirement]]
id = 'TR-EDT-47'
title = '上級モードへの入口と可逆性'
confidence = 'Assumption'
depends_on = [
  'TR-EDT-03',
  'TR-EDT-08',
]
statement = '上級モードは通常モードの画面から1操作で開けること。開いたことがプロジェクトの状態を変えないこと（開いただけで確認済みになったり、モードが固定されたりしない）。通常モードに戻る操作も1操作であること。上級モードの存在は通常モードの画面上で発見できるが、通常モードの主動線を邪魔しないこと。'
