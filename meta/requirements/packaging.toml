statement = 'クラッシュレポートは利用計測とは別の同意単位で扱う。クラッシュ発生時にのみ、送信内容の全文をその場で提示し、都度送信の可否をユーザーが選べるようにする。自動送信を既定にしない。スタックトレースに含まれるファイルパスと音源名をマスクしてから提示する。'
