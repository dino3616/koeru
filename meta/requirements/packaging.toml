# パッケージング・互換性・データ永続化
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'packaging'
domain_title = 'パッケージング・互換性・データ永続化'
prefix = 'TR-PKG'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '[Risk] 音源名の自由入力と classic 互換（CP932）は両立しない場合がある。 音源名は character.txt の name として配布物に現れるため、CP932 で表現できない文字（絵文字、簡体字、ハングル、結合ダイアクリティカル）を含む名前は classic 互換プロファイルで書き出せない。「仮名で始めて後から改名できる」（UC-F01-02）を成立させるには、表示名と配布名を分離してユーザーに配布名を別途決めさせるか、入力時点で文字集合を制限するかのどちらかが要る。どちらも「名前で止まらない」という要件を削る。',
  '[Unknown] classic UTAU 本体および setParam・各リサンプラーが、oto.ini の先頭 `#Charset:` 行と UTF-8 の oto.ini をどこまで許容するかが確認できていない。 許容しないツールが多ければ CP932 固定しか安全な選択肢が無くなる。',
  '[Unknown] 推奨音域を機械可読に持つ場所が、多音階音源の character.yaml の `subbanks.tone_ranges` しか無い。 単一音階の音源では subbanks を持たないため、推奨音域は readme.txt の自由文にしか残らない。単一音階でも subbanks を1つだけ書いて音域を宣言するのが妥当かは、OpenUtau 側の挙動を実機で確認する必要がある。',
  '[Unknown] UAR（install.txt 同梱・拡張子 `.uar`）を出すかが未決。 UTAU 本体へのドラッグ&ドロップでインストールできる利点があるが、ZIP と UAR の2種類を出すと配布物が増える。OpenUtau は install.txt を無視して展開するため UAR を単独で出しても両対応にはなる。',
  '周波数表は同梱する。 `.frq` は録音時に作ると決めたため、書き出し時の追加コストは無い。ZIP が約3%増える代わりに、受け手の初回再生の待ち時間が消える。',
  '[Unknown] 既存音源の取り込み（他ツールで作った音源を KOERU プロジェクトへ）を製品範囲に含めるかが未決。 含めると符号化の推定、NFD の修復、大小不一致の修復、アーカイブ展開が発生し、本領域の実装量がおよそ倍になる。含めないと、既存音源を持つハルは3本目を必ずゼロから始めることになる。',
  '''
[Unknown] 利用規約テンプレートを何種類・どの粒度で同梱するかが未決。 設問から生成する方式は決まるが、生成された文面の法的有効性を KOERU がどこまで表明するか（あるいは一切表明しないか）は決まっていない。

---


---

# 性能予算（エンドツーエンドの内訳）
''',
]

[[requirement]]
id = 'TR-PKG-01'
title = '音源ルートの必須成果物'
confidence = 'Fact'
needs_component = false
depends_on = []
statement = '音源ルート直下に character.txt を必ず生成する（最低限 name= を書く）。WAV を含む各フォルダに oto.ini を1つ生成する。readme.txt を音源ルート直下に生成する'
notes = [
  'character.txt を生成しないと、他のファイルが全て正しくても音源として一切読まれない',
]

[[requirement]]
id = 'TR-PKG-02'
title = 'character.txt に書くキーを7種に固定する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-01',
]
statement = 'character.txt に書き出すキーを name / image / author / voice / sample / web / version の7種に限定し、区切り文字は = を使う。これ以外の情報（キャラクター設定、推奨音域、収録機材など）を独自キーとして追加しない'

[[requirement]]
id = 'TR-PKG-03'
title = 'character.yaml を必ず同時生成する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-02',
  'TR-PKG-12',
]
statement = 'character.yaml を必ず同時生成する。書き出すキーを name / localized_names / singer_type / text_file_encoding / image / portrait / portrait_opacity / portrait_height / author / voice / web / version / sample / default_phonemizer / symbol_set / subbanks / use_filename_as_alias に限定し、未知のキーを追加しない'

[[requirement]]
id = 'TR-PKG-04'
title = '多音階は prefix.map と subbanks を同内容で両方生成する'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PKG-03',
]
statement = '多音階では prefix.map を「音階名 TAB prefix TAB suffix」の1行1音階で生成し、同じ割り当てを character.yaml の subbanks（color / prefix / suffix / tone_ranges）としても生成する。tone_ranges は "C3-C4" または "C5" の形式で書く'

[[requirement]]
id = 'TR-PKG-05'
title = '周波数表は .frq のみを生成する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-20',
]
statement = '周波数表は `.frq` のみを生成する。ファイル名は WAV 名の拡張子のドットをアンダースコアに置換して `.frq` を付ける。形式は先頭 ASCII 8バイト "FREQ0003"、int32 hopSize（256）、double 平均F0、16バイトの予約領域（ゼロ）、int32 フレーム数（＝ f0/amp の対の数。WAV のサンプル数ではない。ここにサンプル数を書くと、読み手は 256 倍の要素を確保して EOF に当たる）、以降 double f0 と double amp の対。生成は F0 の再推定を要しない。必要なのは (1) 内部 F0 系列を hopSize=256 の時間格子へ補間、(2) WAV 全長を覆うフレーム数ぶんの f0/amp を用意、(3) 無声・無音フレームの f0 を 0 とし内部で補間している連続 F0 をそのまま書かない、(4) amp を録音停止時に算出して DB に保存し書き出し時に WAV を再走査しない、の4点（録音時に作ると決めたため）'

[[requirement]]
id = 'TR-PKG-06'
title = '.frc / .llsm / .pmk / .vs4ufrq / desc.mrq を生成しない'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PKG-05',
]
statement = '`.frc` / `.llsm` / `.pmk` / `.vs4ufrq` / `desc.mrq` を生成・同梱しない。周波数表が無い形式については「受け手のリサンプラーが初回再生時に自動生成する」旨を readme.txt に明記する'
notes = [
  '生成しないことで、特定リサンプラー利用者の初回再生が遅くなる',
]

[[requirement]]
id = 'TR-PKG-07'
title = 'アイコンと立ち絵を役割で分ける'
confidence = 'Assumption'
needs_component = false
depends_on = []
statement = 'character.txt の image= が指す音源アイコンは 100×100 の BMP を生成する。立ち絵は character.yaml の portrait / portrait_opacity / portrait_height でのみ指定し、character.txt には書かない。'
notes = [
  'classic UTAU が PNG を表示できるかは一次仕様として確認できていない。BMP に固定することで安全側に倒す',
]

[[requirement]]
id = 'TR-PKG-08'
title = 'oto.ini の WAV 参照はフォルダ内の相対名のみ'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PKG-01',
]
statement = "oto.ini の <wav> 欄には同一フォルダ内のファイル名のみを書き、/ と \\ を含めない。WAV を含むフォルダごとに oto.ini を1つ置き、1つの oto.ini が別フォルダの WAV を参照しない。"

[[requirement]]
id = 'TR-PKG-09'
title = 'install.txt と UAR の生成規則'
confidence = 'Fact'
depends_on = []
statement = 'install.txt を生成する場合、type=voiceset、folder=<インストール先ディレクトリ名。省略不可>、contentsdir=<アーカイブ内の格納先ディレクトリ名。同階層なら省略可>、description=<1行の説明。省略可> の4項目のみを書く。install.txt はアーカイブのルート直下に置き、音源フォルダをその下に置く二層構造にする。拡張子を .uar にしたものは UTAU 本体へのドラッグ&ドロップでインストールできる。'
notes = [
  'ZIP と UAR の2種類を出すと、受け手にどちらを使うか選ばせることになる',
]

[[requirement]]
id = 'TR-PKG-10'
title = '$read を生成しない'
confidence = 'Assumption'
needs_component = false
depends_on = []
statement = '$read ファイルを生成・同梱しない。'

[[requirement]]
id = 'TR-PKG-11'
title = '内部表現を UTF-8 / NFC に固定する'
confidence = 'Fact'
depends_on = []
statement = 'アプリ内部の全文字列を UTF-8 かつ NFC 正規化で保持する。外部から文字列が入る全ての境界（ユーザー入力、ファイル読み込み、ディレクトリ列挙）で NFC 化する。以後、ファイルシステムから読み戻した名前ではなく内部モデルの文字列を正として扱う'
notes = [
  'NFD の混入は macOS 上でのローカル動作では一切再現せず、配布後に受け手の環境で初めて表面化する',
]

[[requirement]]
id = 'TR-PKG-12'
title = '書き出しプロファイルを3つ持ち、両対応を既定にする'
confidence = 'Fact'
depends_on = [
  'TR-PKG-03',
]
statement = '書き出しプロファイルを3つ実装する。(a) classic 互換: character.txt / oto.ini / prefix.map / readme.txt を CP932、改行 CRLF、ZIP エントリ名を CP932 かつ EFS フラグ無し。(b) OpenUtau 互換: テキストを UTF-8、character.yaml の text_file_encoding に utf-8、ZIP エントリ名を UTF-8 かつ EFS フラグ有り。(c) 両対応: テキストを CP932、character.yaml の text_file_encoding に shift_jis、ZIP エントリ名を CP932。既定は (c) とする。'
notes = [
  'classic UTAU 側の周辺ツール（setParam、各リサンプラー、外部プラグイン）が UTF-8 の oto.ini をどこまで許容するかは未確認で、(b) を既定にできる根拠が無い',
]

[[requirement]]
id = 'TR-PKG-13'
title = 'CP932 を実行時登録なしで使い、変換できない文字を検出する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-12',
]
statement = 'CP932（Windows-31J）の符号化・復号は、**実行時のプロバイダ登録にも OS のロケール設定にも依存しない形で持つ。** `encoding_rs` の `SHIFT_JIS`（実体は Windows-31J）のように、ライブラリへ静的に含まれるものを使う。**符号化できない文字を黙って置換文字に落とさない。** エンコード時は不可逆な変換が起きた位置を呼び出し側へ返し、TR-PKG-11 / TR-EDT-42 の警告に使う。起動時に既知文字列の往復変換で健全性を検査し、失敗したら classic 互換と両対応の書き出しを無効化する。'

[[requirement]]
id = 'TR-PKG-14'
title = 'ZIP エントリ名の符号化を明示する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-13',
]
statement = 'ZIP エントリ名は、内部モデル（UTF-8 / NFC）の文字列を目的の符号化へ変換したバイト列として明示的に渡す。`zip` crate はエントリ名をバイト列として扱うので、符号化を暗黙の既定に任せない。classic 互換・両対応プロファイルでは CP932、OpenUtau 互換プロファイルでは UTF-8 とする。CP932 へ変換できない文字が含まれる場合は暗黙置換せず、書き出し前検証で止める（TR-PKG-17）。'

[[requirement]]
id = 'TR-PKG-15'
title = 'ZIP エントリ名を内部モデルから組み立てる'
confidence = 'Fact'
depends_on = [
  'TR-PKG-11',
  'TR-PKG-14',
]
statement = 'ZIP エントリ名と oto.ini の `<wav>` 欄は、内部モデル（NFC）の文字列から組み立てる。ディレクトリ列挙の戻り値をそのままエントリ名や oto.ini の参照に使わない。 ファイルシステムが返す名前は正規化形が環境で変わるため、内部モデルを正とする。書き出し後、生成した ZIP を読み戻してエントリ名が内部モデルとバイト単位で一致することを検査する。'

[[requirement]]
id = 'TR-PKG-16'
title = 'ファイル名に使える文字を制限する'
confidence = 'Fact'
depends_on = [
  'TR-PKG-12',
]
statement = "生成する WAV 名・フォルダ名・ZIP エントリ名は、次を全て満たす文字だけで構成する。(1) ASCII 英数字・ハイフン・アンダースコアである（DEC-PKG-004）、(2) Windows の予約文字 < > : \" / \\ | ? * と NUL および制御文字（1–31）を含まない、(3) 末尾がスペースまたはピリオドでない、(4) CON / PRN / AUX / NUL / COM1–COM9 / LPT1–LPT9 とその上付き数字変種を基底名としない、(5) oto.ini のパーサを壊す = と , を含まない。読み込む音源のファイル名にはこの制限を課さない。 日本語ファイル名の既存音源を開けること。"

[[requirement]]
id = 'TR-PKG-17'
title = 'CP932 に変換できない文字を暗黙置換しない'
confidence = 'Fact'
depends_on = [
  'TR-PKG-11',
  'TR-PKG-16',
]
statement = '音源名・エイリアス・ファイル名に CP932 で表現できない文字（絵文字、結合ダイアクリティカル U+3099 / U+309A、簡体字、ハングル等）が含まれる場合、? への暗黙置換を禁止する。書き出し前に該当箇所を全件列挙して代替案を提示し、ユーザーが解決するまで classic 互換・両対応プロファイルでの書き出しを実行しない。'
notes = [
  'この検査を怠ると、破損した音源が検証を通過して配布される',
]

[[requirement]]
id = 'TR-PKG-18'
title = 'エイリアスの生成規則'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PKG-11',
]
statement = '生成するエイリアスに、先頭・末尾の半角スペース、2個以上の半角スペース、全角スペース U+3000、NFD 形を含めない。'

[[requirement]]
id = 'TR-PKG-19'
title = 'エイリアスを音源全体で一意にする'
confidence = 'Fact'
needs_component = false
depends_on = [
  'TR-PKG-04',
]
formalized_as = [
  'REQ-PKG-103',
  'INV-PKG-104',
  'FB-PKG-103',
]
statement = 'エイリアスは音源全体（全 oto.ini 横断）で一意にする。多音階でサブフォルダを分けた場合も、各サブフォルダのエイリアスに prefix.map と同じ prefix / suffix を必ず付与し、フォルダ間で同名エイリアスが生じないようにする。'
notes = [
  '多音階の書き出しで最も踏みやすい罠。実装時に必ず多音階の検証ケースを用意する',
]

[[requirement]]
id = 'TR-PKG-20'
title = 'WAV フォーマットと大文字小文字の規則'
confidence = 'Fact'
depends_on = []
statement = '配布する WAV を 44100 Hz / 16 bit / 1ch に固定する。同一フォルダ内で小文字化すると衝突する WAV 名を作らない。oto.ini の <wav> 欄は実ファイル名と大文字小文字まで完全一致させる。character.txt / character.yaml / prefix.map / oto.ini のファイル名も規定どおりの小文字で生成する。'
notes = [
  '大小不一致と小文字化衝突は macOS / Windows のいずれでも再現せず、受け手が Linux で使ったときだけ壊れる',
]

[[requirement]]
id = 'TR-PKG-21'
title = 'oto.ini に #Charset: 行を書かない'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-PKG-12',
]
statement = '生成する oto.ini の先頭に #Charset: 行を書かない。読み込み側（既存音源の取り込みを実装する場合）は、先頭10行以内の #Charset: 行を解釈する。'
notes = [
  '書かない選択により、character.yaml を読まない古いツールでは符号化の宣言が一切残らない',
]

[[requirement]]
id = 'TR-PKG-22'
title = '方式の書き出し可否をエイリアス被覆から導出し、上下関係を別に宣言しない'
confidence = 'Fact'
needs_component = false
depends_on = []
formalized_as = [
  'REQ-PKG-108',
  'REQ-PKG-109',
  'INV-PKG-105',
  'INV-PKG-106',
  'FB-PKG-104',
  'FB-PKG-105',
]
statement = '方式の上下関係を独立したデータとして持たない。 ある方式のパッケージを作れるかどうかは、その方式が要求するエイリアス表を既存素材のエイリアス集合が被覆しているかだけで決まる（TR-PKG-23）。判定の正本はカバレッジ台帳（TR-RCL-18）に一本化する。逆方向の導線は、禁止を宣言しなくても構造上出てこない。 連続音が要求する VCV エイリアスを単独音の素材は決して持たないので、被覆が原理的に 100% にならない。多音階は方式ではない。 TR-RCL-01 が定めるとおり、収録方式（CV / VCV / CVVC）と収録音高の本数は独立した軸で、音階数の削減は別のエイリアスを要求するのではなく prefix.map の割り当てが減るだけ。書き出し先として提示するのは、被覆が 100% の方式に限る'

[[requirement]]
id = 'TR-PKG-23'
title = '下位方式書き出しの可否をエイリアス被覆で判定する'
confidence = 'Assumption'
needs_component = false
depends_on = [
  'TR-PKG-22',
]
formalized_as = [
  'REQ-PKG-102',
  'INV-PKG-102',
  'FB-PKG-101',
]
statement = '下位方式への書き出しは、対象方式が要求するエイリアス表を既存素材のエイリアス集合が100%被覆できるときのみ許可する。1件でも不足する場合は書き出しを実行せず、不足エイリアスを全件列挙する。部分的なパッケージを出さない。'
notes = [
  '被覆はしているが品質が実用に達しないケースを、この判定は検出できない',
]

[[requirement]]
id = 'TR-PKG-24'
title = '下位方式パッケージは独立した音源ルート・独立した ZIP として作る'
confidence = 'Fact'
depends_on = [
  'TR-PKG-23',
]
formalized_as = [
  'REQ-PKG-001',
]
statement = '下位方式パッケージは常に独立した音源ルート・独立した ZIP として生成する。 WAV は複製されるため、コストは「oto.ini 1ファイル分」ではなく「元パッケージとほぼ同等の容量と生成時間がもう1本」として見積もる（多音階連続音では 275MB × 2）。再切り出しを行わない点だけが節約になる（デコード・再エンコードは不要）。下位方式が参照する WAV の集合のみを複製することを性能上の最適化として明記する。書き出し前に容量をユーザーに提示する。5値は下位方式の規約プリセットで再導出する（align の新設要件）'
notes = [
  '連続音の語頭 CV は前後の文脈を含むため、単独音として使ったときの先行発声・オーバーラップの許容幅が実用に足るかは未検証',
]

[[requirement]]
id = 'TR-PKG-25'
title = '下位方式パッケージを同一 ZIP に同梱しない'
confidence = 'Fact'
depends_on = [
  'TR-PKG-19',
  'TR-PKG-24',
]
