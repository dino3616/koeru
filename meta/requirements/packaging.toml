statement = '送信は SaaS 経由とし、自前のサーバーを持たない。 送信するフィールドはホワイトリスト方式で、列挙した名前に無いものは通さない。音源名・ファイルパス・歌詞・プロジェクト名・波形を送らない。 送信先、保持期間、プライバシーポリシー、および「声そのものは送らない」ことを、同意を求める画面に明示する。送信する内容の全文を利用者が確認できる。'
notes = [
  '「処理はローカルで完結」というメッセージと矛盾して受け取られうる',
  'ソラ（非公開志向）にとって、同意ダイアログの存在自体が初回起動時の離脱要因になりうる',
  '送信先を持つことで、配布の場を持たないという判断で回避したはずの運用責任が別の形で戻る',
]

