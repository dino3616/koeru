# 録音サブシステム
#
# 満たさなければ製品が成立しない条件。実装仕様ではない。
# 形式的な契約（状態・遷移・不変条件）は specs/ の FSL が正本で、
# formalized_as がある要件は FSL 側が正。

schema = 'requirement-set'
domain = 'recording'
domain_title = '録音サブシステム'
prefix = 'TR-REC'

# この領域が抱える [Risk] と [Unknown]。個別の要件ではなく領域全体にかかる。
domain_risks = [
  '**[Fact] 「RAW 要求と IAudioEffectsManager で OS 加工を外せる」と書いてはならない。** RAW は AUDCLNT_STREAMOPTIONS の定義上、APO・ドライバ・ハードウェアのエンドポイント固有な常時オン処理を除外しない。したがって**機材内蔵 DSP による AGC / NS は KOERU からは検知も無効化もできず、加工なしを保証する手段は存在しない。** **[Unknown]** 無効化の可否は RawProcessingSupported、ドライバのサポートモード、APO が IAudioSystemEffects3 を実装しているか、canSetState、および OS ビルドの積で決まり、成功率は不明で見積りに用いない。**列挙結果が空であることを「加工なし」の証拠として扱わない。** メタデータには「列挙結果が空」「列挙不能」「無効化成功」「無効化拒否」を区別して記録する。**最重要: アライメント精度の見積りを「加工されていない声」の前提に接続してはならない。** 既知の境界誤差の数値はクリーンなコーパスでの測定値であり、AGC・NS を通った信号での境界誤差は **[Unknown]** である。',
  '**[Fact] 校正とゲイン固定で破綻は防げない。** 校正の目的は「破綻の防止」ではなく「初期値の妥当化」に限定する。上限を -3 dBFS ではなく **-6 dBFS 程度に下げ**、校正発声を「そのプロジェクトで最も高い音高の全力発声」で行う（多音階では最高音高で校正）。32bit float マスターを持つ設計では 16bit の余裕は問題にならないため、ヘッドルームを優先する。**[Fact]** RAW 経路ではエンドポイントボリュームが効かない可能性があるため、ゲイン制御はハードウェアボリュームを持つデバイスに限定し、ソフトウェア実装のボリュームは「校正に使えない」として区別して記録する。API が読み書きできないデバイスでは校正が自動で成立しない。**[Risk]** リアルタイム品質判定がスコープ外である以上、破綻の検知はスコープ外ではなく**未解決の残存リスク**として明示的に残す。→ 少なくともフルスケール到達サンプル数については、**配布パッケージ生成の直前に集計して一度だけ提示する関門**を置く。これは収録中のリアルタイム判定ではないためスコープを侵さず、壊れた成果物が完成に到達する経路を塞げる唯一の安価な手当てである。',
  '**[Fact] 出力エンドポイントの種別判定ではガイド音の回り込みを構造的に排除できない。** FormFactor / TransportType はドライバの自己申告であり、UnknownFormFactor が正規値として存在する。判定結果は記録するが安全側の根拠として使わない。FormFactor が Headphones であってもヘッドホンが装着されている保証はない。**回り込みは録音側でしか確認できない。** → 「収録前に一度だけ、ガイドを鳴らしながら1秒キャプチャして、ガイドの既知信号との相関でリークの有無を確認する」セットアップ工程を追加する。これは TR-REC-17 と同じ性質の静的な経路検査であり、既知の再生信号との相関を使えば声質評価を一切含まずに判定できるため、スコープ外制約と衝突しない。**[Risk]** この検査を置かない場合、「全テイクにガイドが混入した音源が完成に到達しうる」ことを未解決リスクとして明示する。',
  '**[Fact] リサンプル品質の SNR / 帯域は、20ms 級の境界誤差予算の根拠にならない。** 誤差予算の項目から SNR / 帯域を根拠とする記述を外し、リサンプル品質は「エイリアシングと帯域の確保」の項目として独立させる。時間軸に対して意味のある唯一の条件は「**使用するリサンプラの群遅延をサンプル単位で既知とし、マスター上で補償済みであること**」であり、これを要件として書く。libsamplerate の 97dB / 97% は測定条件が公開されていないため confidence を Fact から Assumption に下げ、可能なら 48000→44100 の実測（スイープのエイリアシング測定と既知パルスの群遅延測定）を受け入れ基準に置き換える。**20ms 級の予算に本当に効くのはリサンプルではなく、上流の適応処理とテイクの時間軸完全性（TR-REC-07）である。**',
  '**[Unknown] macOS の AVCaptureDevice のマイクモード値が、AUHAL 経由の素の HAL キャプチャに反映されるかが不明。** 反映されない場合、Voice Isolation で加工されているのに standard と報告される可能性があり、TR-REC-11 の検知は空振りになる。実機での検証が必要。',
  '**[Unknown] プロジェクトディレクトリがクラウド同期フォルダに置かれた場合の扱いが未決。** SQLite の破損と、macOS 側で分解形のファイル名が持ち込まれる経路の両方のリスクがある。同期対象外への配置を強制するか、案内にとどめるかを決める必要がある。',
  '**[Unknown] ディスク枯渇時の書き込み失敗に対する要件がない。** TR-REC-21 がプロジェクト総容量 4GB 超過時の削除候補提示を持つのみで、3時間の収録中に OS のディスクが埋まって書き込みが失敗する経路（TR-REC-28 の `.part` 書き込み、TR-EDT-15 のディスクキャッシュ、TR-SYN-25 の解析キャッシュ）に対する検知・停止・保全の要件が存在しない。→ TR-REC-28 に「書き込み失敗と空き容量閾値を検知したら収録を停止し、確定済みテイクを保全し、原因と復帰手順を提示する」を追加する。**リアルタイム品質判定ではなくデータ完全性の破綻なので、スコープ外制約と衝突しない。**',
  '**実装に入る前に、音声 I/O の技術スパイクを 3 OS で通す。** 確認するのは (1) デバイス列挙、(2) 44.1kHz でのキャプチャ、(3) RAW ストリーム要求の成否と OS 側音響効果の検出、(4) 収録中のデバイス消失、(5) xrun の検出、(6) マイク権限の取得と拒否からの回復、の6点。**miniaudio の抽象化だけで足りるのか、バックエンド固有 API へ降りる必要があるのかは、この実測で決める。** TR-REC-05 / 09 / 24 の前提がここで崩れる可能性があり、崩れたときに動くのは要件であって決定ではない。',
]

[[requirement]]
id = 'TR-REC-01'
title = '配布用 WAV の仕様を 44100 Hz / 16 bit / モノラルに固定する'
confidence = 'Fact'
depends_on = []
statement = '音源として書き出す WAV は 44100 Hz / 16 bit 整数 PCM / 1ch。fmt チャンクは WAVE_FORMAT_PCM とし、RIFF には fmt と data 以外のチャンク（LIST/INFO、fact、id3、cue、bext 等）を書かない。この3値のいずれも設定として可変にしない'
notes = [
  '16 bit 固定のため、静かな声のダイナミックレンジ余裕が小さい（ただし小声収録は前提外）',
  '将来 NNSVS 等へ書き出す場合はこの仕様では足りないが、初期スコープ外なので衝突しない',
]

[[requirement]]
id = 'TR-REC-02'
title = 'キャプチャは 32 bit float で受け、マスターは 44100 Hz / 32 bit float、リサンプルは1回だけ'
confidence = 'Assumption'
depends_on = [
  'TR-REC-01',
  'TR-REC-05',
]
statement = 'キャプチャは 32bit float・デバイスのネイティブレートで受ける。44100 Hz でない場合はアプリ内の固定リサンプラで1回だけ変換し、44100 Hz / 32bit float の WAV（マスター）として保存する。マスターは以後書き換えない。16bit PCM はマスターからの派生として生成する。**「アプリ内で1回だけ変換される」は保証ではなく努力目標である**（MATCH_FORMAT はドライバと APO が対応する場合にのみ有効）。実際に開けた形式とネイティブレートの一致／不一致をメタデータに記録し、**上流の変換の有無は [Unknown] と明記する。** 使用したリサンプラの識別子とバージョンを記録する'
notes = [
  'ドライバ／OS が既に内部で変換や加工を済ませた信号を渡してくる場合、「1回だけ」は成立しない',
  'マスターを float で持つとストレージが 16 bit の2倍になる',
]

[[requirement]]
id = 'TR-REC-03'
title = '入力デバイスをユーザーが明示的に選択し、プロジェクトに固定する'
confidence = 'Fact'
depends_on = []
formalized_as = [
  'REQ-REC-101',
]
statement = '収録開始前に、入力デバイスの一覧（表示名、既定デバイスかどうか、ネイティブレート、チャンネル数）を提示し、選択結果をプロジェクトに永続化する。永続化する識別子は表示名ではなく、Windows はエンドポイント ID 文字列、macOS は kAudioDevicePropertyDeviceUID、Linux は ALSA/PipeWire のノード名とする。デバイス一覧の取得は 1 秒以内に完了させ、取得中も UI をブロックしない。'
notes = [
  'USB デバイスは接続ポートによって識別子が変わる実装があり、同一デバイスと判定できない場合がある',
]

[[requirement]]
id = 'TR-REC-04'
title = 'デバイスの着脱・既定変更・消失を検知し、無断フォールバックを禁止する'
confidence = 'Fact'
depends_on = [
  'TR-REC-03',
  'TR-REC-31',
]
formalized_as = [
  'REQ-REC-109',
  'INV-REC-101',
  'FB-REC-101',
]
statement = '入力デバイスの追加・削除・状態変化・既定変更を OS の通知で受け取る（Windows: IMMNotificationClient、macOS: kAudioHardwarePropertyDevices / kAudioDevicePropertyDeviceIsAlive、Linux: PipeWire のノード監視または ALSA 列挙の再取得）。選択済みデバイスが録音中に消失したら進行中テイクを不完全としてマークして破棄し収録を停止する。**別のデバイスへ自動で切り替えてはならない。** 復帰後の再開は同一識別子のデバイスが戻ったときのみ自動で許可する'
notes = [
  'Bluetooth デバイスは電源管理でエンドポイントが消えたり戻ったりを繰り返し、収録が頻繁に中断される可能性がある',
]

[[requirement]]
id = 'TR-REC-05'
title = '共有モードを既定とし、フォーマット一致を要求して OS の暗黙変換を避ける'
confidence = 'Fact'
depends_on = [
  'TR-REC-02',
]
statement = '排他モード（およびハングモード）は既定で使わない。Windows では IAudioClient3 の共有モードを用い、`SetClientProperties` の `AudioClientProperties.Options` に `AUDCLNT_STREAMOPTIONS_MATCH_FORMAT` を立てて 44100 Hz / 1ch / 32 bit float を要求する。`IsFormatSupported` が `S_FALSE` を返した場合は closest として返された形式で開き、差分をアプリ内リサンプル（TR-REC-02）で埋める。macOS では AUHAL（`kAudioUnitSubType_HALOutput`）の入力エレメントを使い、`kAudioDevicePropertyNominalSampleRate` を照会して 44100 Hz を選べるときは選ぶ。**MATCH_FORMAT はドライバと APO が対応する場合にのみ有効で、要求が通る保証はない。** 実際に開けた形式（レート、チャンネル数、サンプル型、共有モード）とデバイスのネイティブレートの一致／不一致をテイクのメタデータに記録し、**アプリ内変換が発生したかどうかだけ**を記述可能にする。**[Unknown] 上流（ドライバ / APO）で変換が起きたかは判定できない。** したがって「アプリ内で1回だけ変換される」は保証ではなく努力目標として扱う。'
notes = [
  'MATCH_FORMAT はドライバと APO が対応する場合のみ有効で、対応しないと従来どおりエンジン側で変換される',
  '共有モードのため、他アプリが同じエンドポイントを低遅延で開くと周期が変わる',
]

[[requirement]]
id = 'TR-REC-06'
title = '多チャンネル入力からモノラルを作る規則をプロジェクトに固定する'
confidence = 'Fact'
depends_on = [
  'TR-REC-14',
]
statement = 'デバイスが 2 チャンネル以上を提示する場合、L+R の平均を既定にしない。校正時（TR-REC-14）に各チャンネルの RMS を測り、有意な信号を持つチャンネルを1つ選んで初期値とし、選択をプロジェクトに固定する。全チャンネルに有意な信号がある場合に限り、ユーザーが「合成する」を選べる。選択したチャンネル番号をテイクのメタデータに記録し、プロジェクト内で一貫させる。'
notes = [
  '校正時だけ片側が無音で、収録中に配線が変わるケースは検知しない',
]

[[requirement]]
id = 'TR-REC-07'
title = '取りこぼし（xrun）を検出したテイクは自動的に無効化して録り直させる'
confidence = 'Fact'
depends_on = [
  'TR-REC-40',
]
formalized_as = [
  'REQ-REC-003',
  'INV-REC-002',
  'FB-REC-001',
]
statement = 'キャプチャのフレーム連続性をコールバックごとのフレーム数累積とデバイス位置で検証する。1テイクの中で1フレームでも欠落を検出したらそのテイクを invalid として保存し、同じフレーズを再提示する。欠落の発生数と位置をメタデータに記録する'
notes = [
  '低性能機や電源プロファイル次第で欠落が頻発し、録り直しループに陥る可能性がある',
]

[[requirement]]
id = 'TR-REC-08'
title = 'Windows で、開いたキャプチャストリームに適用中の効果を列挙する'
confidence = 'Fact'
depends_on = [
  'TR-REC-05',
  'TR-REC-30',
]
formalized_as = [
  'REQ-REC-103',
]
statement = 'キャプチャストリームを開いた後、IAudioClient::GetService で IAudioEffectsManager を取得し、GetAudioEffects で適用中の効果を列挙する。少なくとも AUDIO_EFFECT_TYPE_AUTOMATIC_GAIN_CONTROL、AUDIO_EFFECT_TYPE_NOISE_SUPPRESSION、AUDIO_EFFECT_TYPE_DEEP_NOISE_SUPPRESSION、AUDIO_EFFECT_TYPE_ACOUSTIC_ECHO_CANCELLATION、AUDIO_EFFECT_TYPE_BEAMFORMING、AUDIO_EFFECT_TYPE_CONSTANT_TONE_REMOVAL、AUDIO_EFFECT_TYPE_DYNAMIC_RANGE_COMPRESSION、AUDIO_EFFECT_TYPE_EQUALIZER の有無を判別し、結果（id、state、canSetState）をセッションメタデータに記録する。RegisterAudioEffectsChangedNotificationCallback で変化も監視し、収録中に効果構成が変わったらセッション境界を切る。IAudioEffectsManager が使えない環境（Windows Build 22000 未満）では、列挙不能であることを記録する。'
notes = [
  'Build 22000 未満（Windows 10）では列挙手段がなく、加工の有無が不明なまま収録される',
  'APO が IAudioSystemEffects3 を実装していない場合、効果があっても列挙に現れない',
]

[[requirement]]
id = 'TR-REC-09'
title = 'Windows で RAW ストリームを要求し、成否を記録する'
confidence = 'Fact'
depends_on = [
  'TR-REC-05',
  'TR-REC-08',
]
statement = 'デバイスの `RawProcessingSupported` が true の場合、`SetClientProperties` の Options に `AUDCLNT_STREAMOPTIONS_RAW` を立ててキャプチャストリームを開く。RAW で開けたか、要求が拒否されたか、`RawProcessingSupported` が false だったかを3値で記録する。RAW で開けた場合は返ってきた形式を検証し、想定外の形式（チャンネル数の増加、非対応サンプル型）であれば RAW を諦めて非 RAW で開き直す。RAW と非 RAW のどちらで録ったかをテイクのメタデータに残す。**RAW 経路ではエンドポイントボリュームが効かない可能性があるため、ゲイン制御はハードウェアボリュームを持つデバイスに限る**（TR-REC-14）。'
notes = [
  'RawProcessingSupported が false のマシンでは要求そのものができない',
  '「常時オンの、エンドポイント固有処理」は RAW でも残ると明記されている',
]

[[requirement]]
id = 'TR-REC-10'
title = '加工を無効化できない場合の扱いを、指摘ではなく一度きりの提示に限定する'
confidence = 'Assumption'
depends_on = [
  'TR-REC-08',
  'TR-REC-09',
]
formalized_as = [
  'REQ-REC-104',
  'INV-REC-108',
  'FB-REC-104',
]
statement = 'TR-REC-08 で適応処理（AGC / NS / Deep NS / AEC / DRC）が検出され、かつ canSetState が true の効果については、SetAudioEffectState(AUDIO_EFFECT_STATE_OFF) を試み、AUDCLNT_E_EFFECT_NOT_AVAILABLE および AUDCLNT_E_EFFECT_STATE_READ_ONLY は失敗として扱う。無効化できない効果が残った場合、収録開始前に一度だけ、OS の設定で切る手順を提示する。提示は収録中には出さず、テイクごとの警告や品質評価は出さない。ユーザーが提示を閉じた選択はプロジェクトに記録し、同一デバイス・同一効果構成では再提示しない。エンドポイントのプロパティストア（PKEY_AudioEndpoint_Disable_SysFx 等）をアプリが書き換えてシステム全体の設定を永続変更してはならない。'
notes = [
  'ユーザーが提示を無視した場合、AGC が乗った素材で音源が完成する',
  '提示文から専門用語を排除しつつ、OS 設定の場所を伝えるのは難しい',
]

[[requirement]]
id = 'TR-REC-11'
title = 'macOS ではマイクモードを検知し、音声処理ユニットを使わない'
confidence = 'Fact'
depends_on = [
  'TR-REC-05',
  'TR-REC-30',
]
statement = '入力は AUHAL（kAudioUnitSubType_HALOutput の入力エレメント）で開き、kAudioUnitSubType_VoiceProcessingIO は一切使わない。AVCaptureDevice.activeMicrophoneMode と preferredMicrophoneMode（いずれも macOS 12.0 以降、読み取り専用、KVO 対応）を監視し、standard 以外（voiceIsolation / wideSpectrum）が選択されている場合はセッションメタデータに記録する。standard へ戻すことはアプリからできないため、AVCaptureDevice.showSystemUserInterface(.microphoneModes) で該当 UI を開いて本人に選ばせる形にとどめる。マイクモードが収録中に変化したらセッション境界を切る。'
notes = [
  'AVCaptureDevice の値が AUHAL 経由の素の HAL キャプチャに反映されるかは [Unknown]。反映されない場合、加工されているのに standard と報告される可能性がある',
  'macOS 12 未満では検知手段がない',
]

[[requirement]]
id = 'TR-REC-12'
title = 'Linux では経路を明示し、サーバ側の変換・加工を経由しない'
confidence = 'Assumption'
depends_on = [
  'TR-REC-05',
  'TR-REC-30',
]
statement = 'Linux では、PipeWire が動作している場合は PipeWire ノードへ直接接続し、node.rate と node.latency を明示指定する（例: node.latency = 441/44100）。エコーキャンセル・ノイズ抑制のフィルタノード（module-echo-cancel 相当や filter-chain）を経由するノードは入力候補から除外する。PipeWire が無い環境では ALSA の hw: デバイスへ直接接続し、plug: 経由の暗黙変換を使わない。実際に接続した経路の種別（PipeWire ノード / ALSA hw / ALSA plug）をセッションメタデータに記録する。'
notes = [
  'Linux では Windows の IAudioEffectsManager に相当する「適用中の効果を列挙する」手段がなく、加工の有無を保証できない',
  'hw: 直結は他アプリと排他になり、ガイド音の再生と両立しない構成があり得る',
]

[[requirement]]
id = 'TR-REC-13'
title = '入力チェーンの全条件をテイクから遡って復元できるようにする'
confidence = 'Assumption'
depends_on = [
  'TR-REC-08',
  'TR-REC-09',
  'TR-REC-11',
  'TR-REC-12',
  'TR-REC-30',
]
statement = '各テイクから、次の情報を一意に参照できること: デバイス識別子と表示名、ネイティブフォーマット、実際に開いた共有モードとフォーマット、RAW 要求の成否、列挙された効果とその状態、macOS のマイクモード、Linux の接続経路、入力ゲイン値、選択チャンネル、リサンプラ識別子、OS とアプリのバージョン。これらは録音時に確定し、後から推測で埋めない。'
notes = [
  '記録量が増え、プロジェクトの可搬性（ZIP 化）に影響する',
]

[[requirement]]
id = 'TR-REC-14'
title = '入力レベルの校正を、収録前の1回のセットアップ工程として持つ'
confidence = 'Assumption'
depends_on = [
  'TR-REC-03',
  'TR-REC-15',
]
formalized_as = [
  'REQ-REC-105',
  'INV-REC-104',
  'FB-REC-103',
]
statement = 'プロジェクトの最初の収録に入る前に、**そのプロジェクトで最も高い音高の全力発声**を 3〜5 秒1回取り、その区間のサンプルピークと RMS を測る（多音階では最高音高で校正する）。ピークが **-12 dBFS 以上 -6 dBFS 以下**に入っていれば校正完了とする。16 bit のヘッドルームより 32 bit float マスターの余裕を優先する。**校正の目的は「破綻の防止」ではなく「初期値の妥当化」に限る。校正しても収録中の破綻は防げない。** 範囲外の場合は、OS の入力ゲインを調整して範囲内へ入れる。ゲイン調整の API は Windows はキャプチャエンドポイントの `IAudioEndpointVolume::SetMasterVolumeLevelScalar`、macOS は入力スコープの `kAudioDevicePropertyVolumeScalar`、Linux は PipeWire ノードまたは ALSA ミキサのボリュームを用いる。**[Fact] ゲイン制御はハードウェアボリュームを持つデバイスに限る。** ソフトウェア実装のボリュームは「校正に使えない」として区別して記録し、API が値を読み書きできないデバイスでは校正が自動で成立しない。その場合は自動調整せず、OS 設定での調整をその場で1回だけ案内する。校正は最大2回の測定で収束させ、収束しない場合も収録に進めること（校正を必須の関門にしない）。'
notes = [
  'OS の入力ゲインはシステム全体の設定であり、変更には本人の明示同意が必要になる。同意を求める画面が「設定する前に、まず歌える」と衝突する',
  '校正時の発声と本番の発声の声量が違えば、校正は当たらない',
]

[[requirement]]
id = 'TR-REC-15'
title = '入力ゲインをプロジェクト期間中固定し、変更を検知し、終了時に復元する'
confidence = 'Assumption'
depends_on = [
  'TR-REC-14',
]
formalized_as = [
  'REQ-REC-105',
  'INV-REC-107',
]
statement = '校正で決めたゲイン値をプロジェクトに保存し、以後の収録セッションの開始時に、現在のゲイン値と保存値を比較する。差があれば保存値へ戻すことを本人に確認する。アプリが変更した OS 側のゲインは、アプリ終了時に変更前の値へ戻す（変更前の値を保存しておく）。収録中はゲインを変更しない。ゲインの実測値は各セッションのメタデータに記録する。'
notes = [
  '他アプリ（会議ソフト等）が OS のゲインを書き換える。次回起動時までそれに気づかない',
  'ハードウェアつまみのゲインは API から見えない',
]

[[requirement]]
id = 'TR-REC-16'
title = 'レベルとフルスケール到達を計測して記録するが、判定も指摘もしない'
confidence = 'Assumption'
depends_on = [
  'TR-REC-28',
]
statement = '各テイクについて、サンプルピーク（dBFS）、区間 RMS、フルスケール到達サンプル数（|x| >= 1.0 - 1LSB が 3 サンプル以上連続した回数）、DC オフセット平均値、推定ノイズフロア（先頭無音マージン区間の RMS）を計測し、テイクのメタデータに保存する。収録画面には入力レベルの現在値を表示するだけとし、「小さすぎます」「歪んでいます」のような評価・警告・スコアを一切出さない。テイクをこれらの値によって自動で無効化しない（自動無効化は TR-REC-07 と TR-REC-04 の2条件のみ）。**ただしフルスケール到達サンプル数だけは、配布パッケージの書き出し直前に一度だけ集計して提示する関門を置く。** これは収録中のリアルタイム判定ではないためスコープを侵さず、**壊れた成果物が完成に到達する経路を塞げる唯一の安価な手当てである。** **[Risk] 収録中の破綻検知は依然としてスコープ外であり、未解決の残存リスクとして残る。**'
notes = [
  '「計測は許されるが判定は許されない」という線引きが確定方針の意図と一致するかは未確認。計測自体も外すなら、破綻を防ぐ手段は校正のみになる',
  'レベル表示は目に入るだけで事実上の判定として機能してしまう可能性がある',
]

[[requirement]]
id = 'TR-REC-17'
title = '入力が届いていない状態を構造的に検出して収録を止める'
confidence = 'Fact'
depends_on = [
  'TR-REC-16',
]
formalized_as = [
  'REQ-REC-106',
  'INV-REC-103',
  'FB-REC-102',
]
statement = '収録開始後の最初の 1.0 秒間に、全サンプルが厳密にゼロ／DC 成分のみで交流成分の RMS が -90 dBFS を下回る、のいずれかに該当したら収録を停止しテイクを作らずデバイス選択へ戻す。**これは録音品質ではなく入力経路の生死判定として扱い、収録中の継続監視は行わない。** ミュート状態も併せて確認する'
notes = [
  'きわめて静かな環境で入力ゲインが極端に低いデバイスは、生きているのに無入力と誤判定され得る',
]

[[requirement]]
id = 'TR-REC-18'
title = '次に読むフレーズだけを提示し、進捗は録音リストの用語で見せない'
confidence = 'Fact'
depends_on = [
  'TR-REC-31',
]
statement = '収録画面には、次に発声する1フレーズをフレーズ本文として大きく提示する。フレーズは録音リストの項目 ID と1対1で対応させ、画面には項目 ID・ファイル名・エイリアス・oto などの内部表現を出さない。多音階では対象の音高を、方式名や prefix.map の表記ではなく、音として提示できる形（TR-REC-25）で併記する。フレーズの提示から次のフレーズへの切り替えは 100 ms 以内に完了させる。'
notes = [
  '上級者は項目 ID とファイル名を見たい。上級モードでの表示可否は未決',
]

[[requirement]]
id = 'TR-REC-19'
title = 'プリロールを常時確保し、先頭の欠けを構造的に起こさない'
confidence = 'Fact'
depends_on = [
  'TR-REC-38',
  'TR-REC-40',
]
formalized_as = [
  'REQ-REC-102',
  'INV-REC-102',
]
statement = '収録画面に入った時点でキャプチャストリームを開始し、フレーズ間も止めない。直近 1000ms 以上を保持するリングバッファを常時回し、録音開始の指示から 500ms 遡った位置をテイクの開始点とする。終了点は指示から 500ms 後ろへ延ばす。**ストリームの開始・停止をテイクごとに行ってはならない**'
notes = [
  '常時キャプチャは消費電力とプライバシー上の印象に影響する。収録画面を離れたら必ず停止する必要がある',
]

[[requirement]]
id = 'TR-REC-20'
title = '連続収録と自動送りの条件を明示する'
confidence = 'Fact'
depends_on = [
  'TR-REC-19',
  'TR-REC-23',
]
statement = '連続収録では、1フレーズの収録が終わったら自動で次のフレーズへ進む。進む条件は「ガイドを使う方式ではガイドの1フレーズ分の再生完了」「ガイドを使わない方式では固定長（既定 3000 ms）の経過」のいずれかで、発話の検出結果を条件にしない。ユーザーはいつでも一時停止でき、一時停止したフレーズは未収録として残す。連続収録中も TR-REC-19 のプリロールを維持し、フレーズ間の無録音区間を作らない。'
notes = [
  '固定長だと発話が長い人ではフレーズが途中で切れる。既定値の妥当性は未検証',
]

[[requirement]]
id = 'TR-REC-21'
title = '録り直しは上書きせず、世代として積む'
confidence = 'Assumption'
depends_on = [
  'TR-REC-28',
]
formalized_as = [
  'REQ-REC-005',
  'INV-REC-005',
]
statement = '同じ録音リスト項目に対する録り直しは、既存のテイクを削除・上書きせず、新しいテイクとして保存し、その項目の採用テイクを新しい方へ切り替える。過去のテイクは非採用として保持し、いつでも採用を戻せる。録音リスト項目1つあたりのテイク保持数は上限を設けず、プロジェクトの総容量が閾値（既定 4 GB）を超えたときに、非採用テイクの古い順から削除候補として本人に提示する（自動削除はしない）。'
notes = [
  '容量が線形に増える。3 時間級プロジェクトでの実測が必要',
]

[[requirement]]
id = 'TR-REC-22'
title = '入力モニタリングは既定で無効とし、有効化時のレイテンシ予算を定める'
confidence = 'Assumption'
depends_on = [
  'TR-REC-24',
]
statement = '自分の声を出力へ返すモニタリングは既定で無効とする。有効化できる条件は、(a) 出力デバイスがヘッドホン／ヘッドセットと判定できる、かつ (b) 実測の入出力往復レイテンシが 25 ms 以下に収まる、の両方を満たす場合に限る。往復レイテンシの目標値は 15 ms 以下とする。Windows では IAudioClient3::GetSharedModeEnginePeriod で最小周期を取得して最小に近い周期で開き、macOS では kAudioDevicePropertyBufferFrameSize を 256 フレーム以下に設定する。25 ms を超える環境ではモニタリング機能を提示しない。'
notes = [
  '歌う行為に自己モニタリングが必要で、既定オフが音高の安定を損なう可能性がある',
  '出力デバイスの種別判定が外れると、スピーカ出力でハウリングする',
]

[[requirement]]
id = 'TR-REC-23'
title = 'ガイド音は方式ごとに要否を分け、テンポと構造を固定する'
confidence = 'Fact'
depends_on = [
  'TR-REC-25',
]
statement = '単独音では既定でガイドを使わず、無音の中で1フレーズずつ提示する。連続音・CVVC・多音階連続音では既定でガイドを使う。ガイドは 120 BPM、1モーラ=1拍を既定とし、フレーズあたりのモーラ数は録音リストの構造（例: 7モーラ、8モーラ）に一致させる。ガイドは（1）該当音高の持続音、（2）拍のクリック、の2成分に分け、それぞれ独立に音量を設定できる／無音にできること。ガイドの1フレーズは、発声開始位置までの助走（既定 1250 ms）と、モーラ数×拍長と、末尾余白から成る。ガイド音源はアプリに同梱し、外部ファイルの入手を要求しない。'
notes = [
  '単独音でガイドを外すと音高がばらつき、後から連続音へ拡張する際の声質不連続が悪化する',
  '120 BPM が誰にとっても発声可能なテンポである保証はない',
]

[[requirement]]
id = 'TR-REC-24'
title = 'ガイド音の回り込みを、出力デバイスの種別で構造的に避ける'
confidence = 'Assumption'
depends_on = [
  'TR-REC-22',
  'TR-REC-23',
]
formalized_as = [
  'REQ-REC-107',
  'INV-REC-105',
  'FB-REC-105',
]
statement = '収録開始前に出力エンドポイントの種別を判定する（Windows: `PKEY_AudioEndpoint_FormFactor` の Headphones / Headset / Speakers、macOS: `kAudioDevicePropertyTransportType` と `kAudioDevicePropertyDataSource`）。スピーカと判定された場合、ガイド音・音高提示・モニタリングを再生しない。**[Fact] FormFactor / TransportType はドライバの自己申告であり、`UnknownFormFactor` が正規値として存在する。判定結果は記録するが、安全側の根拠として使わない。** FormFactor が Headphones でもヘッドホンが装着されている保証はないため、**出力経路の判定だけでは回り込み対策として不十分である。回り込みは録音側でしか確認できない。** したがって、**収録前に一度だけ、ガイドを鳴らしながら1秒キャプチャし、ガイドの既知信号との相関でリークの有無を確認する**セットアップ工程を持つ。既知の再生信号との相関を使うため声質評価を一切含まず、TR-REC-17（入力経路の生死判定）と同じ性質の静的な経路検査なので、リアルタイム品質判定をスコープ外とする方針と衝突しない。種別を判定できない場合は、収録開始前に一度だけ「イヤホンやヘッドホンを使っているか」を確認し、回答をプロジェクトに保存して同一出力デバイスでは再確認しない。判定結果と回答をセッションメタデータに記録する。**[Risk] この検査を置かない場合、全テイクにガイドが混入した音源が完成に到達しうる。**'
notes = [
  'FormFactor / TransportType の値はドライバ実装依存で、ヘッドホン端子をスピーカと申告するデバイスがある',
  'Bluetooth イヤホンは判定できても、開放型では漏れる',
]

[[requirement]]
id = 'TR-REC-25'
title = '多音階収録では対象音高を音として提示し、音高表現を prefix.map と揃える'
confidence = 'Fact'
depends_on = [
  'TR-REC-36',
]
statement = '多音階の収録では、フレーズの収録開始前に対象音高の基準音を必ず鳴らす（既定 1000 ms、正弦波またはガイド音源の該当音階ファイル）。収録中もガイドの持続音で音高を維持する。音高の内部表現は MIDI ノート番号とし、表示・ディレクトリ名・prefix.map の tone に使う文字列は英語音名（例: G3、C4、A4、F#5）で統一する。1プロジェクトで収録する音高の集合はプロジェクト作成時に確定させ、収録途中に増減させない。'
notes = [
  '収録する代表音高の点数（2点か3点か5点か）が未決で、3 時間という所要時間の内訳が決まらない',
  '本人の音域を収録前に把握する手段がない',
]

[[requirement]]
id = 'TR-REC-26'
title = '録音とガイド再生の時刻対応を記録し、ガイド時刻を切り出しの根拠にしない'
confidence = 'Assumption'
depends_on = [
  'TR-REC-23',
]
statement = 'ガイド再生の開始時刻と録音の開始時刻の対応を、レンダ側とキャプチャ側それぞれのハードウェア位置（Windows: IAudioClock::GetPosition / IAudioClock2::GetDevicePosition、macOS: AudioTimeStamp.mHostTime と mSampleTime）から算出し、テイクのメタデータに「ガイドのフレーズ開始が録音の何サンプル目に相当するか」として記録する。誤差目標は ±10 ms とする。この対応情報は参考値としてのみ用い、音素境界の切り出しやトリミングの根拠にしてはならない。入力デバイスと出力デバイスが別デバイスの場合はクロックドリフトが生じるため、テイクをまたいだ累積補正は行わない。'
notes = [
  '±10 ms が別デバイス構成で達成できるかは未検証',
]

[[requirement]]
id = 'TR-REC-27'
title = 'プロジェクトを1ディレクトリに閉じ、原本と成果物を分離する'
confidence = 'Fact'
depends_on = [
  'TR-REC-02',
]
statement = '1プロジェクト＝1ディレクトリとし、`masters/`（不変のマスター WAV）、`index`（SQLite、WAL モード）、`reclist/`（採用リストのスナップショット）、`build/`（配布用に生成した再生成可能な成果物）に分ける。`build/` は毎回作り直してよく、`masters/` と `index` を上書きしてはならない。別マシンへコピーしただけで収録を再開できる'
notes = [
  'masters と build の二重持ちで容量が増える',
  'SQLite ファイルはクラウド同期フォルダ上で壊れやすい',
]

[[requirement]]
id = 'TR-REC-28'
title = 'テイクを即時に永続化し、異常終了で完了テイクを失わない'
confidence = 'Fact'
depends_on = [
  'TR-REC-27',
]
formalized_as = ['REQ-REC-004']
statement = 'テイクごとに `.wav.part` へストリーミング書き込みし、終了時に seek してサイズを確定させ fsync 後にアトミックな rename で最終ファイル名にする。SQLite へのコミットは rename 成功後。異常終了で `.part` が残った場合、次回起動時にファイル長からデータ長を復元して復旧可能なテイクとして提示する。`masters/` の WAV は書き込み完了後に読み取り専用にする'
notes = [
  'fsync をテイクごとに行うため、テイク境界で数十〜数百 ms のディスク待ちが入り得る。連続収録の送りをブロックしない設計が必要',
]

[[requirement]]
id = 'TR-REC-29'
title = '8分から3時間までを同一の中断・再開機構で扱う'
confidence = 'Fact'
depends_on = [
  'TR-REC-28',
  'TR-REC-31',
]
formalized_as = ['REQ-REC-004']
statement = '収録の中断・再開は方式・リスト長にかかわらず同一の仕組みで扱う。再開時に提示するのは「次に録る1フレーズ」だけとし、残り件数や消化率を主表示にしない。アプリ終了・OS 再起動・電源喪失をまたいでコミット済みテイクを1件も失わない。再開時の読み込み（テイク 2000 件規模）を2秒以内に完了させる'
notes = [
  '中断が「一時停止」に見えるかは体験設計の問題で、機構だけでは解決しない',
]

[[requirement]]
id = 'TR-REC-30'
title = '収録セッションを単位として、録音条件のスナップショットを残す'
confidence = 'Assumption'
depends_on = [
  'TR-REC-13',
  'TR-REC-28',
]
statement = '連続した一続きの収録を1セッションとし、セッションごとに次を記録する: 開始・終了時刻、TR-REC-13 の入力チェーン全条件、ガイドの設定（テンポ、モーラ数、音量、有効／無効）、出力デバイス種別の判定結果、モニタリングの有効／無効。各テイクは所属セッションを参照する。セッションを切る条件は、アプリの再起動、選択デバイスの変更・消失、OS 加工構成の変化（TR-REC-08 の通知、TR-REC-11 のマイクモード変化）、入力ゲインの変化、および 30 分以上の無操作とする。'
notes = [
  'セッション境界の定義が細かすぎるとセッション数が爆発する。30 分の閾値は根拠が薄い',
]

[[requirement]]
id = 'TR-REC-31'
title = '録音リストに対するカバレッジ状態を単一の真実として持つ'
confidence = 'Fact'
depends_on = [
  'TR-REC-21',
  'TR-REC-27',
]
formalized_as = [
  'INV-REC-001',
  'INV-REC-002',
  'INV-REC-003',
]
statement = '録音リストの各項目の状態を（未収録／採用テイクあり／全テイク無効）の3値で保持し採用テイク ID を持つ。**この状態は SQLite 上の単一テーブルを真実とし、`masters/` のファイル存在をスキャンして導出しない。** 試唱の可否・再開位置・書き出しの可否をすべてここから決める。整合性は起動時に検証し、不整合は提示して自動修復しない'
notes = [
  'SQLite が壊れた場合の復旧経路が必要（masters/ の WAV とファイル名から再構築できる設計にしておく）',
]

[[requirement]]
id = 'TR-REC-32'
title = 'ファイル名を NFC に正規化し、書き込み後に読み戻して検証する'
confidence = 'Fact'
depends_on = [
  'TR-REC-33',
]
statement = 'WAV ファイル名およびディレクトリ名は、生成時に Unicode NFC（正規合成形）へ正規化する。macOS では、ファイル作成後に readdir / URL 列挙で名前を読み戻し、NFC であることを検証する。分解形になっていた場合はリネームして NFC に直す。プロジェクト全体の書き出し前にも、全ファイル名の NFC 検証を通す。'
notes = [
  '正規化非依存のファイルシステム上では、NFC 名で作成しても列挙で分解形が返る経路があり得る。検証の実装は OS ごとに要検証',
]

[[requirement]]
id = 'TR-REC-33'
title = 'ファイル名を CP932（Shift-JIS）で表現可能な文字だけで構成する'
confidence = 'Fact'
depends_on = [
  'TR-REC-32',
]
statement = 'WAV ファイル名とサブディレクトリ名は **ASCII 英数字・ハイフン・アンダースコアだけを使う**（DEC-PKG-004。書き出しは ASCII 固定、読み込みは日本語にも対応）。**[Risk] これは既存の UTAU 音源の慣例（かなのファイル名）から外れる。** 代わりに、CP932 表現可能性・macOS の NFD 正規化・大文字小文字だけが違う重複という3つの問題が書き出し側で一括して消える。元の日本語表記はエイリアス側に保持し、失われない。ファイル名の生成規則（録音リスト項目 ID → ファイル名）は可逆であり、同じ入力から常に同じ名前を生成すること。読み込みでは日本語ファイル名の音源も扱えること。'
notes = [
  'ASCII 代替名に落ちたファイルは、setParam / vLabeler で人が編集するときに元のフレーズと対応付けにくい',
]

[[requirement]]
id = 'TR-REC-34'
title = '同一 oto セット内のファイル名を大文字小文字を無視して一意にする'
confidence = 'Fact'
depends_on = [
  'TR-REC-33',
]
statement = '1つの oto セット（1ディレクトリ）内で、ファイル名は大文字小文字を無視した比較で一意でなければならない。ファイル名の大文字小文字は生成規則で決めた通りに固定し、実ファイルの名前とメタデータ上の名前を完全一致させる（大文字小文字の差異も許さない）。生成時に衝突が起きた場合は、決定論的なサフィックスを付与して回避し、衝突があったことを記録する。'
notes = [
  '決定論的サフィックスの規則が録音リストの更新で変わると、既存プロジェクトのファイル名が変わる',
]

[[requirement]]
id = 'TR-REC-35'
title = 'ファイル名とエイリアスから、前後空白・連続空白・全角空白を排除する'
confidence = 'Fact'
depends_on = [
  'TR-REC-33',
]
statement = 'ファイル名およびエイリアス文字列は、先頭・末尾に空白を含まない、連続する空白を含まない、全角空白（U+3000）を含まない、という3条件を満たすこと。連続音のエイリアスにおける区切りは半角スペース1個に統一する。これらは録音リストの読み込み時と、ファイル生成時の両方で検証し、違反があれば録音リスト側を修正して収録に入る（収録後の一括修正に頼らない）。'
notes = [
  '既存の配布録音リストをそのまま使えず、正規化した結果が慣例と異なる名前になる場合がある',
]

[[requirement]]
id = 'TR-REC-36'
title = '多音階は音高ごとのサブディレクトリで収録し、構成を収録時点で確定する'
confidence = 'Fact'
depends_on = [
  'TR-REC-25',
  'TR-REC-33',
]
statement = '多音階のプロジェクトでは、音高ごとにサブディレクトリを作り、そのディレクトリ名は ASCII の英語音名（例: G3、C4、A4）とする。収録した WAV は該当音高のサブディレクトリ直下に置く。ディレクトリ構成は収録開始時点で確定させ、収録後にファイルを別ディレクトリへ移動する処理を持たない。prefix.map はプロジェクトルートに1つとし、その内容は音高ディレクトリの集合から生成する。'
notes = [
  '1音高あたりのファイル数×音高数でファイル総数が増え、ファイルシステムと ZIP の扱いが重くなる',
]

[[requirement]]
id = 'TR-REC-37'
title = '16 bit 化ではディザのみを適用し、音色を変える処理を既定で行わない'
confidence = 'Assumption'
depends_on = [
  'TR-REC-01',
  'TR-REC-02',
]
statement = 'マスターから配布用 16bit PCM へ変換する際、TPDF ディザ（振幅 1 LSB）のみを適用する。**適用範囲は「配布用 16bit 変換時の禁止事項」に限定する**（録音直後のオフライン前処理は、変換前の派生生成として区別する）。DC オフセットは計測して記録するのみ、除去は既定で無効。無音区間のトリミングも既定で行わない'
notes = [
  'DC オフセットを残すと一部の resampler で不具合が出るという指摘があり（UTAU wav 最適化ツールが除去対象にしている）、既定無効が正しいかは要検証',
]

[[requirement]]
id = 'TR-REC-38'
title = 'テイクの前後に無音マージンを必ず確保する'
confidence = 'Fact'
depends_on = [
  'TR-REC-19',
]
statement = '保存するテイクは発声開始位置の前に 300ms 以上、終了位置の後に 300ms 以上の無音マージンを含む。**マージンをトリミングしてはならない。** 確保できなかったテイクはその事実をメタデータに記録する'
notes = [
  '先頭 300 ms の余白に環境ノイズが入るため、ノイズフロア推定には使えるが、無音として扱えない環境がある',
]

[[requirement]]
id = 'TR-REC-39'
title = '音声 I/O 抽象は、ネイティブハンドルへ到達できるものだけを候補にする'
confidence = 'Fact'
depends_on = [
  'TR-REC-08',
  'TR-REC-09',
  'TR-REC-11',
]
statement = '音声 I/O の抽象レイヤは次のすべてを満たすものを選ぶ。(a) Windows / macOS / Linux を単一 API で扱える。(b) 単一ネイティブアプリに同梱して再配布でき、コピーレフトが製品本体へ伝播しない。(c) キャプチャのフォーマット（レート・チャンネル数・サンプル型）を明示指定でき、OS 側のサンプルレート変換を回避する手段がある。(d) デバイスの着脱・既定デバイス変更・ルート変更を通知として受け取れる。(e) 生成されたネイティブハンドル（Windows の IAudioClient*、macOS の AudioObjectID）へ公開 API から到達できる。(e) を満たさない抽象は、TR-REC-08 から TR-REC-11 の OS 加工の検知・無効化を実装できないため不適とする。'
notes = [
  'ネイティブハンドルに直接触る実装は、抽象レイヤのバージョン更新で壊れやすい',
  '(e) を優先すると言語・GUI フレームワークの選択が制約される',
]

[[requirement]]
id = 'TR-REC-40'
title = 'リアルタイムコールバックの規律を定め、取りこぼしをレイテンシより優先する'
confidence = 'Fact'
depends_on = [
  'TR-REC-07',
  'TR-REC-22',
]
statement = 'キャプチャコールバック内でメモリ確保・解放、ロック獲得、ファイル I/O、ログ出力、例外を投げうる処理を行わない。ロックフリーのリングバッファへの書き込みと事前確保済みバッファ上のリサンプルのみを行う。ディスク書き込み・レベル集計・UI 更新は別スレッド。周期は 10ms 相当を既定とし、モニタリングを使わない限り縮めない。**取りこぼしゼロをレイテンシ短縮より常に優先する**'
notes = [
  'リサンプルをコールバック内で行うと、負荷の高いリサンプラでは周期内に終わらない可能性がある',
]
