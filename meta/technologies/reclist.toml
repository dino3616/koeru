# 録音リスト生成とカバレッジ管理 の候補技術
#
# ライセンスは AGPL-3.0-or-later に取り込めるかで判断する。
# 許可リストは deny.toml、依存として入ったものの判定は cargo deny check。

domain = 'reclist'

[[technology]]
name = 'jpreprocess'
purpose = '漢字混じり歌詞から仮名読み・音素列への変換（g2p）。OpenJTalk の Rust 再実装'
license = 'BSD-3-Clause'
verdict = '採用候補'

[[technology]]
name = 'jpreprocess-naist-jdic'
purpose = 'jpreprocess 用の日本語辞書'
license = 'BSD-3-Clause'
verdict = '採用候補'

[[technology]]
name = 'OpenUtau'
purpose = 'エイリアス文法（VCV / CVVC / presamp / prefix.map）とフォールバック探索順の参照実装'
license = 'MIT'
verdict = '採用候補（著作権表示を保持して移植）'

[[technology]]
name = 'pathfinding'
purpose = '有向グラフのパス分解・オイラー路系の探索補助'
license = 'Apache-2.0 OR MIT'
verdict = '条件付き'

[[technology]]
name = 'good_lp（+ HiGHS）'
purpose = '最小被覆・辺被覆パス分解を厳密に解く場合の MIP ソルバ'
license = 'MIT'
verdict = '条件付き'

[[technology]]
name = 'lindera / vibrato'
purpose = '形態素解析（読み付与の代替）'
license = 'MIT / MIT OR Apache-2.0'
verdict = '条件付き'

[[technology]]
name = 'adlez27/vcv-generator'
purpose = '連続音録音リストと oto の生成器（先行実装の参照）'
license = 'MIT'
verdict = '条件付き（参照のみ）'

[[technology]]
name = 'RecStar'
purpose = '録音リストとガイド音声設定のパーサ仕様の参照'
license = 'Apache-2.0'
verdict = '参照のみ'

[[technology]]
name = 'vLabeler'
purpose = 'reclist / oto / 多音階の扱いの参照'
license = 'Apache-2.0'
verdict = '参照のみ'

[[technology]]
name = 'OREMO（付属リストとガイド BGM 制御ファイル形式）'
purpose = '録音周期と標準リスト規模の実測データ'
license = 'GPL-2.0'
verdict = '条件付き（**ファイル形式と実測値の参照のみ。ファイルを同梱・再配布しない**）'

[[technology]]
name = 'hikari one crystal ja'
purpose = '多音階連続音音源の規模とエイリアス構成の実測データ'
license = '**Unknown**'
verdict = '不適'

[[technology]]
name = 'reclist-gen-cvvc / new_cvvc_generator'
purpose = 'CVVC 録音リスト生成器'
license = '**Unknown**'
verdict = '不適'

[[technology]]
name = 'XieYunP/reclisrgen-'
purpose = 'UTAU 録音リスト生成器'
license = 'Apache-2.0'
verdict = '要調査'
