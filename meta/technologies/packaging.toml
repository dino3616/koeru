# パッケージング・互換性・データ永続化 の候補技術
#
# ライセンスは AGPL-3.0-or-later に取り込めるかで判断する。
# 許可リストは deny.toml、依存として入ったものの判定は cargo deny check。

domain = 'packaging'

[[technology]]
name = 'serde ＋ YAML 実装'
purpose = 'character.yaml の生成と読み取り'
license = 'MIT / Apache-2.0'
verdict = '要選定（`serde_yaml` は保守終了のため後継を選ぶ）'

[[technology]]
name = 'hound'
purpose = 'WAV の読み書きとフォーマット検証（44100 / 16bit / 1ch）'
license = 'Apache-2.0'
verdict = '採用候補'

[[technology]]
name = 'SQLite'
purpose = 'プロジェクトの構造化データの永続化'
license = 'Public Domain'
verdict = '採用候補'

[[technology]]
name = 'OpenUtau (OpenUtau.Core/Classic)'
purpose = 'UTAU パッケージ仕様の参照実装'
license = 'MIT'
verdict = '採用候補'

[[technology]]
name = 'zip ＋ 形式別の展開 crate'
purpose = '既存音源アーカイブの展開とエントリ名の符号化強制。**エントリ名は UTF-8 と CP932 が混在するため、`zip` の生バイト列を取り出して `encoding_rs` で復号する**'
license = '個別に確認'
verdict = '条件付き（既存音源の取り込みを範囲に含める場合。rar / 7z は crate のライセンスを個別に確認する）'

[[technology]]
name = 'GAKUYA'
purpose = '同領域に実在する Web / プラグインツール。要件の答え合わせ'
license = 'MIT'
verdict = '参照のみ'

[[technology]]
name = 'tracing ＋ tracing-subscriber'
purpose = '構造化ログとトレースの基盤'
license = 'MIT'
verdict = '採用'

[[technology]]
name = 'SharpZipLib'
purpose = 'CP932 エントリ名の ZIP 生成の代替'
license = 'MIT'
verdict = '不適'

[[technology]]
name = 'ignore'
purpose = 'ZIP 生成時の除外規則を .gitignore 形式で書く'
license = 'Unlicense / MIT'
verdict = '採用候補'

[[technology]]
name = 'zip'
purpose = '配布 ZIP の生成と読み戻し検証'
license = 'MIT'
verdict = '採用候補'

[[technology]]
name = 'encoding_rs'
purpose = 'CP932 の読み書き'
license = 'MIT / Apache-2.0'
verdict = '採用候補'

[[technology]]
name = 'rusqlite'
purpose = 'プロジェクト永続化'
license = 'MIT'
verdict = '採用候補'

[[technology]]
name = 'tracing + tracing-opentelemetry'
purpose = '計装'
license = 'MIT / Apache-2.0'
verdict = '採用候補'

[[technology]]
name = 'sentry'
purpose = 'クラッシュレポート'
license = 'MIT'
verdict = '採用候補'
