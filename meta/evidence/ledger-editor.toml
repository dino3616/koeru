# 原音設定エディタ の部品台帳
#
# ライセンス監査の面。**採否そのものは判断記録（decided_by）が持つ。**
# decided_by が無いものは、まだ判断記録になっていない採否。

schema = 'component-ledger'
domain = 'editor'

[[component]]
name = 'OpenUtau'
purpose = 'oto.ini / prefix.map / character.txt の書式仕様、CheckOto の11条件の検証規則、原音設定ビューの実装'
license = 'MIT'
status = '採用候補'

[[component]]
name = 'KissFFT'
purpose = 'ネイティブ実装での FFT'
license = 'BSD-3-Clause'
status = '採用候補'

[[component]]
name = 'dr_wav (dr_libs)'
purpose = 'wav の読み書き'
license = 'Unlicense または MIT-0 の選択'
status = '採用候補'

[[component]]
name = 'chardetng'
purpose = 'oto.ini・character.txt の文字コード判定'
license = 'Apache-2.0 / MIT デュアル'
status = '採用候補'
note = 'ただし3分岐の自前実装で足りる場合は不要'

[[component]]
name = 'ゼロクロス吸着'
purpose = '5値の境界を立ち上がりゼロクロスへ吸着'
license = '自前'
status = '採用候補'

[[component]]
name = 'RustFFT'
purpose = 'Rust 実装での FFT'
license = 'MIT / Apache-2.0 デュアル'
status = '条件付き'

[[component]]
name = 'quickjs-ng'
purpose = '将来の一括編集スクリプト開放'
license = 'MIT'
status = '条件付き'
note = '初期スコープ外'

[[component]]
name = 'vLabeler'
purpose = '機能の基準線（同軸表示、5値ハンドル、lockedDrag、キーマップ、modules、macro）'
license = 'Apache-2.0'
status = '参照のみ'

[[component]]
name = 'setParam'
purpose = '機能の基準線（自動推定、ゼロクロス吸着、F1〜F5、確認再生、合成試聴、テーブル範囲編集）'
license = 'GPL（作者が snack に倣って GPL と明記）'
status = '不適'
note = 'Tcl ソースを読まず、UI 文字列と公開キーバインド一覧という機能的事実からのみ互換基準を定める'

[[component]]
name = 'KiraOtoToolbox'
purpose = '一括編集の必須集合を決めるための仕様源（5カテゴリ19ツール）'
license = 'GPL-3.0'
status = '不適'
note = '機能リストという事実の抽出のみ。実装は独立に行う'

[[component]]
name = 'snack'
purpose = 'setParam の音声処理基盤'
license = 'GPL'
status = '不適'

[[component]]
name = 'FFTW'
purpose = 'FFT'
license = 'GPL または商用'
status = '不適'

[[component]]
name = 'uchardet'
purpose = '文字コード判定（ネイティブ）'
license = 'MPL-1.1'
status = '不適'
note = '自前実装で置換'

[[component]]
name = 'libsndfile'
purpose = 'wav 以外の音声フォーマットの I/O'
license = '**Unknown**'
status = '要調査'

[[component]]
name = 'Apache Tika (text module) / GraalVM JavaScript'
purpose = '文字コード判定 / スクリプト（JVM）'
license = '**Unknown**'
status = '要調査'

[[component]]
name = 'jDSP'
purpose = 'JVM での FFT・窓関数'
license = 'MIT'
status = '条件付き'
note = 'GUI 基盤が JVM 側になる場合'

[[component]]
name = 'rustfft / realfft'
purpose = 'STFT・スペクトログラム'
license = 'MIT / Apache-2.0'
status = '採用候補'
