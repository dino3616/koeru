# 原音設定エディタ の部品台帳
#
# ライセンス監査の面。**採否そのものは判断記録（decided_by）が持つ。**
# **「採用」「不適」には decided_by が要る**（check-meta が検査する）。
# 「採用候補」「条件付き」「要調査」はまだ決めていないので不要。

schema = 'component-ledger'
domain = 'editor'

[[component]]
id = 'CMP-EDT-001'
name = 'OpenUtau'
purpose = 'oto.ini / prefix.map / character.txt の書式仕様、CheckOto の11条件の検証規則、原音設定ビューの実装'
license = 'MIT'
status = '参照のみ'
decided_by = 'DEC-PLT-011'
note = '**仕様と振る舞いの参照のみ**（DEC-PLT-011）'

[[component]]
id = 'CMP-EDT-002'
name = 'KissFFT'
purpose = 'ネイティブ実装での FFT'
license = 'BSD-3-Clause'
status = '採用候補'

[[component]]
id = 'CMP-EDT-003'
name = 'dr_wav (dr_libs)'
purpose = 'wav の読み書き'
license = 'Unlicense または MIT-0 の選択'
status = '採用候補'

[[component]]
id = 'CMP-EDT-004'
name = 'chardetng'
purpose = 'oto.ini・character.txt の文字コード判定'
license = 'Apache-2.0 / MIT デュアル'
status = '採用候補'
note = 'ただし3分岐の自前実装で足りる場合は不要'

[[component]]
id = 'CMP-EDT-005'
name = 'ゼロクロス吸着'
purpose = '5値の境界を立ち上がりゼロクロスへ吸着'
license = '自前'
status = '採用候補'

[[component]]
id = 'CMP-EDT-006'
name = 'RustFFT'
purpose = 'Rust 実装での FFT'
license = 'MIT / Apache-2.0 デュアル'
status = '条件付き'

[[component]]
id = 'CMP-EDT-007'
name = 'quickjs-ng'
purpose = '将来の一括編集スクリプト開放'
license = 'MIT'
status = '条件付き'
note = '初期スコープ外'

[[component]]
id = 'CMP-EDT-008'
name = 'vLabeler'
purpose = '機能の基準線（同軸表示、5値ハンドル、lockedDrag、キーマップ、modules、macro）'
license = 'Apache-2.0'
status = '参照のみ'

[[component]]
id = 'CMP-EDT-009'
name = 'setParam'
purpose = '機能の基準線（自動推定、ゼロクロス吸着、F1〜F5、確認再生、合成試聴、テーブル範囲編集）'
license = 'GPL（作者が snack に倣って GPL と明記）'
status = '不適'
decided_by = 'DEC-ALL-005'
note = 'Tcl ソースを読まず、UI 文字列と公開キーバインド一覧という機能的事実からのみ互換基準を定める'

[[component]]
id = 'CMP-EDT-010'
name = 'KiraOtoToolbox'
purpose = '一括編集の必須集合を決めるための仕様源（5カテゴリ19ツール）'
license = 'GPL-3.0'
status = '不適'
decided_by = 'DEC-ALL-005'
note = '機能リストという事実の抽出のみ。実装は独立に行う'

[[component]]
id = 'CMP-EDT-011'
name = 'snack'
purpose = 'setParam の音声処理基盤'
license = 'GPL'
status = '不適'
decided_by = 'DEC-ALL-005'

[[component]]
id = 'CMP-EDT-012'
name = 'FFTW'
purpose = 'FFT'
license = 'GPL または商用'
status = '不適'
decided_by = 'DEC-ALL-003'

[[component]]
id = 'CMP-EDT-013'
name = 'uchardet'
purpose = '文字コード判定（ネイティブ）'
license = 'MPL-1.1'
status = '不適'
decided_by = 'DEC-ALL-003'
note = '自前実装で置換'

[[component]]
id = 'CMP-EDT-014'
name = 'libsndfile'
purpose = 'wav 以外の音声フォーマットの I/O'
license = '**Unknown**'
status = '要調査'

[[component]]
id = 'CMP-EDT-015'
name = 'Apache Tika (text module) / GraalVM JavaScript'
purpose = '文字コード判定 / スクリプト（JVM）'
license = '**Unknown**'
status = '要調査'

[[component]]
id = 'CMP-EDT-016'
name = 'jDSP'
purpose = 'JVM での FFT・窓関数'
license = 'MIT'
status = '条件付き'
note = 'GUI 基盤が JVM 側になる場合'

[[component]]
id = 'CMP-EDT-017'
name = 'rustfft / realfft'
purpose = 'STFT・スペクトログラム'
license = 'MIT / Apache-2.0'
status = '採用候補'
