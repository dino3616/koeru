schema = 'evidence'
id = 'EVID-PLT-002'
title = '作り直した画面を実機で測った結果（列幅・環と的の隙間・声の色の散らばり・押せない状態の比）'
kind = 'measurement'
source = 'koeru-app の dev ビルド / macOS 15 / WebKit（Tauri 2）と Chromium（Playwright）'
provenance = '''
実測。 動いているアプリの窓をウィンドウ ID 指定で撮影し、画素から測った。
手前の窓が写り込まない経路を使っている（画面領域の切り出しでは、重なった別の窓が
そのまま画素に入る——**一度それで別のアプリの画面を測っていた**）。

明るい面と収録中の状態は storybook で見た。 OS の配色設定を触らずに
両方の面を出すため。同じ部品を同じ CSS で描いているので、測る対象は同じ。

**マイクは開いていない。** 実際の録音・確定・環が伸びる演出は、
コードと story での確認にとどまる。下の表にその行は無い。
'''
confidence = 'Fact'
supports_decisions = ['DEC-PLT-025', 'DEC-PLT-027', 'DEC-PLT-029']

measured = '''
## 1. 列の幅

[Fact] 宣言している最小の窓で、右の列が 52px になる。 `tauri.conf.json` の
`minWidth` は 960。左 320（縮まない）＋ 中央 460（`flex-shrink-0`）＋ 余白 128 を
引くと右に 52px しか残らず、**「歌える曲」が1文字ずつ縦に改行された。**

| 窓の幅 | 左 | 中央 | 右 |
|---|---|---|---|
| 1280 | 320 | 460 | 369 |
| 1180 | 320 | 460 | 52 |
| 960（最小） | 320 | 460 | 52 |

[Fact] 中央が縮まないので、縮み分を右が全部引き受ける。 左は絞り込みの札3つが
横並びで min-content が 320 近くあり、縮めない。右は字なので min-content が
いくらでも小さくなる。

## 2. 既定の窓で「録る」が下端に掛かる

[Fact] 1280×840 で、中央の列の中身が 712px の枠に収まらない。 環 300 ＋ 数字2行 ＋
止める ＋「次に読む」で 780px 前後になり、**「録る」と、押せない理由を書いた1行が
下端より下に出た。** 中央の列は内部スクロールなので届くが、印は出ない。

## 3. 環と「聴く」の隙間

[Fact] 面によって隙間が 5 倍違い、狭いほうは 1.5px。 `size-19`（76px）の的に対して
`INNER_R = 72` は viewBox で 67 相当しか空けていなかった。

| 面 | 環の一辺 | 隙間 |
|---|---|---|
| 音 | 300 | 7.5px |
| 曲・配り物・設定 | 260 | **1.5px** |

狭いほうでは、いちばん内側の環が的の輪郭に見える。 あ行が閉じているかどうかが
図から読めない。

## 4. 声の色の散らばり

[Fact] 6音源の色相が2つに固まった。 撮影画像から有彩画素の色相の中央値を読んだもの。

| 音源 | 色相 | 代表色 |
|---|---|---|
| 1 | 170° | rgb(145,206,196) |
| 2 | 174° | rgb(151,204,199) |
| 3 | 217° | rgb(166,192,234) |
| 4 | 214° | rgb(163,193,233) |
| 5 | 179° | rgb(150,203,202) |
| 6 | 217° | rgb(166,192,234) |

250 度使えるうち 47 度に収まり、2組は画素値まで同じ。 色相の入力が音高だけなので、
**同じ人が録った音源は同じ色になる**——KOERU の想定使用がまさにそれ。
`DEC-PLT-027` の撤回条件「声の特徴が近い二人の音源が、実際に見分けられないと
分かったとき」に当たる。

[Fact] 明るい面では、彩度が 0.06 前後で灰色に見える。 色相 318（赤紫）の音源が
`oklch(0.492 0.0592 318)` = rgb(111,86,119) で出ていた。

[Fact] sRGB の上限は色相ごとに 3 倍違う。 明度を面の帯の中央に置いて、
ブラウザに解かせた値。

| 明度 | 色相 150 | 色相 210 | 色相 318 |
|---|---|---|---|
| 0.49（明るい面） | 0.12 まで | **0.09 で破綻** | 0.18 まで |
| 0.71（暗い面） | 0.18 まで | **0.14 で破綻** | 0.22 まで |

いずれもコントラストは 5:1〜9:1 を保つ。 上限を上げても `TR-PLT-28` の 3:1 に
余裕がある——**彩度を抑えていたのは sRGB ではなく、全色相で一律にしていたこと。**

## 5. 押せない状態の字

[Fact] `opacity-45` を掛けた後の比は 1.94:1（明るい面の主ボタン）。 axe も
同じ値を出した。押せないコントロールは WCAG 1.4.3 の対象外なので違反ではないが、
**初めて音源を開いた人が最初に見る「録る」がこの状態になる。**

| 面 | 主 | 副 | 地 |
|---|---|---|---|
| 明るい面 | 1.95:1 | 2.68:1 | 1.93:1 |
| 暗い面 | 2.83:1 | 3.86:1 | 2.74:1 |

`palette.story.tsx` はどの組み合わせも**合成前**の色で測っていたので、
この状態は一度も測られていなかった。

## 6. 面の埋まり具合

[Fact] 下 1/3 に中身が無い面が3つある。 地と空のカード面が占める割合。

| 面 | 下 35% |
|---|---|
| 配り物 | 99.4% |
| 曲 | 98.9% |
| 設定 | 98.6% |
| テイク | 94.2% |

左の枠が列の全高まで伸び、中身が上端だけに寄っていた。 テイクの面だけは
同じ枠を自然高で置いていて、扱いが揃っていない。

## 7. 主操作までのキーボード操作

[Fact] Tab を 14 回押しても収録項目の一覧の中だった。 順序は
タブ4 → 絞り込み3 → 収録項目 29 行 → 中央。DOM が左→中央→右の順なので、
主操作は一覧の後ろに回る。

## 8. 声の色の面積

[Fact] 環がいちばん多い面でも、有彩画素は 5.11%。 `docs/design/direction.md` の
目安（声の色が1割を超えない）の内側。細い線で描く選択がここで効いている。
'''
