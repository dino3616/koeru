# 録音サブシステム の部品台帳
#
# ライセンス監査の面。**採否そのものは判断記録（decided_by）が持つ。**
# **「採用」「不適」には decided_by が要る**（check-meta が検査する）。
# 「採用候補」「条件付き」「要調査」はまだ決めていないので不要。

schema = 'component-ledger'
domain = 'recording'

[[component]]
id = 'CMP-REC-001'
name = 'miniaudio'
purpose = '音声 I/O 抽象（WASAPI / CoreAudio / ALSA / PulseAudio / JACK）'
license = 'Public Domain または MIT No Attribution の選択制'
status = '採用候補'
decided_by = 'DEC-REC-001'

[[component]]
id = 'CMP-REC-002'
name = 'WASAPI / IAudioClient3 + IAudioEffectsManager'
purpose = 'Windows の低レベル入力、RAW 要求、効果の列挙と無効化'
license = 'OS 付属 API'
status = '採用候補'

[[component]]
id = 'CMP-REC-003'
name = 'CoreAudio HAL / AUHAL'
purpose = 'macOS の低レベル入力、デバイス通知、入力ゲイン制御'
license = 'OS 付属 API'
status = '採用候補'

[[component]]
id = 'CMP-REC-004'
name = 'AVCaptureDevice マイクモード API'
purpose = 'macOS の Voice Isolation / Wide Spectrum の検知と設定 UI の提示'
license = 'OS 付属 API'
status = '条件付き'
note = '下記 [Unknown]'

[[component]]
id = 'CMP-REC-005'
name = 'PipeWire'
purpose = 'Linux の音声グラフへの接続（ノードレート・レイテンシの明示指定）'
license = 'MIT'
status = '採用候補'

[[component]]
id = 'CMP-REC-006'
name = 'libsamplerate'
purpose = '非 44100 のキャプチャから 44100 Hz へのリサンプル'
license = 'BSD-2-Clause'
status = '採用候補'

[[component]]
id = 'CMP-REC-007'
name = 'SQLite'
purpose = 'テイク・セッション・カバレッジのメタデータ永続化（WAL モード）'
license = 'Public Domain'
status = '採用候補'

[[component]]
id = 'CMP-REC-008'
name = 'PortAudio'
purpose = '音声 I/O（代替）'
license = 'MIT'
status = '条件付き'

[[component]]
id = 'CMP-REC-009'
name = 'cpal'
purpose = '音声 I/O（対抗案）'
license = 'Apache-2.0'
status = '不適'
decided_by = 'DEC-REC-001'
note = '上記と同じ理由'

[[component]]
id = 'CMP-REC-010'
name = 'RtAudio'
purpose = '音声 I/O（C++）'
license = 'MIT 類似（改変版の扱いに関する条項あり。原文の逐語確認が未了）'
status = '要調査'

[[component]]
id = 'CMP-REC-011'
name = 'alsa-lib'
purpose = 'ALSA デバイスへの直接アクセス'
license = 'LGPL-2.1'
status = '不適'
decided_by = 'DEC-ALL-007'
note = 'Store / 署名配布と両立しない。miniaudio の実行時 dlopen 経由でのみ ALSA に到達する'

[[component]]
id = 'CMP-REC-012'
name = 'libsoxr'
purpose = 'リサンプル'
license = 'LGPL-2.1 以降'
status = '不適'
decided_by = 'DEC-ALL-003'
note = 'libsamplerate で置換'

[[component]]
id = 'CMP-REC-013'
name = 'JUCE 9'
purpose = '音声 I/O を含むフレームワーク'
license = 'AGPLv3 と商用のデュアル'
status = '不適'
decided_by = 'DEC-ALL-004'

[[component]]
id = 'CMP-REC-014'
name = 'RecStar'
purpose = '録音セッション構造の仕様参照元（同梱対象ではない）'
license = 'Apache-2.0'
status = '参照のみ'

[[component]]
id = 'CMP-REC-015'
name = 'OpenUtau (VoicebankErrorChecker)'
purpose = '配布物の検証仕様の一次資料（同梱対象ではない）'
license = 'MIT'
status = '参照のみ'

[[component]]
id = 'CMP-REC-016'
name = 'miniaudio（FFI）'
purpose = '音声 I/O。WASAPI / CoreAudio / ALSA / PulseAudio を1つの API で扱う'
license = 'パブリックドメイン または MIT-0'
status = '採用'
decided_by = 'DEC-REC-001'

[[component]]
id = 'CMP-REC-017'
name = 'cpal'
purpose = '音声 I/O（対抗案）'
license = 'Apache-2.0'
status = '不適'
decided_by = 'DEC-REC-001'
note = '。排他モードにも RAW ストリーム要求にも到達できず、OS 側の音声加工を無効化する経路が無い'
