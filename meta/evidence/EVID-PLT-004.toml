schema = 'evidence'
id = 'EVID-PLT-004'
title = 'アーキテクチャ刷新の基準点。検査の実行結果、consumer 契約の面、確かめ直した欠陥'
kind = 'implementation_survey'
source = 'main 4b28e5a（PR #16 のマージ後）の全ソース、手元の検査の実行（macOS 26 arm64、Nix devShell）、.github/workflows、docs/reports/architecture の調査'
provenance = '''
`docs/reports/architecture/` は PR #16 の head（`af9a808`）を GitHub 越しに読んだ調査で、
検査は実行していない。 ここでは同じ観察を **マージ後の main で読み直し**、
手元で検査を走らせた。調査の結論と食い違ったものは、その旨を書いてある。

実行したもの: `cargo clippy --workspace --all-targets --all-features -- -D warnings`、
`cargo test --workspace --all-features`、UI の `bun run check:ci`。
いずれも devShell の中で、既定の cfg（macOS の native backend）。
`koeru_force_unsupported_backend` の組み立てでも clippy と test を走らせた。
実行していないもの: 実機の録音と再生、実音声のハーネス（環境変数が要る）、
Windows / Linux の native、移行、電源断。

件数は `rg` と、試験の実行結果の要約行から数えた。
'''
confidence = 'Fact'

executed = '''
| 検査 | 結果 |
|---|---|
| clippy（macOS、全 target、全 feature） | 通過。警告 0 |
| cargo test（macOS、全 feature） | 通過。試験 binary 34 個で成功 863・失敗 0・無視 0。うち 7 個は 0 件（doctest と、試験を持たない target） |
| clippy（`--cfg koeru_force_unsupported_backend`） | 通過。警告 0 |
| cargo test（同じ cfg、`RUSTDOCFLAGS` にも同じ cfg） | 通過。試験 binary 34 個で成功 789・失敗 0・無視 0。native の経路の 74 件ぶんが cfg で外れる |
| UI `check:ci`（story 55 ファイル・207 件、stories・ipc の検査） | 通過 |

[Fact] 通過した試験には、前提を欠いて `return` したものが含まれる。 実行結果の要約は
それを「通過」と数えるので、上の件数は「実行して確かめた件数」ではない。
