schema = 'evidence'
id = 'EVID-UX-003'
title = '制作者が公開している制作記の痕跡（工程・所要時間・つまずき）'
kind = 'field_traces'
source = 'note.com に公開されている UTAU 音源制作記・入門記事（くろ州「UTAU音源収録リストの選び方」、くろいくろわ「UTAU音源制作を始めるにあたって」、ちていこ「初心者向けUTAU音源制作入門」、しょぼん「超絶完全初心者向け UTAU音源のつくりかた」）'
provenance = '''
制作者本人が書いた文章から、行動の痕跡（何をして、どこで詰まったと書いているか）を拾った。
インタビューではない。 こちらから質問していないので、聞きたいことが書かれている保証は無く、
書く気になった人だけが母集団になっている。

**Fact なのは「その制作者がそう書いた」ことまで。** 制作者一般に当てはまるかは確かめていない。
だから確度は Assumption に置く。それでも `docs/journey-map.md` の `※推測` より一段強い
——推測ではなく、誰かが実際に書いた言葉なので。

引用は原文のまま。 要約して意味を寄せると、痕跡としての価値が消える。
'''
confidence = 'Assumption'

process_fragmentation = '''
工程とソフトの分断が、記事の構成にそのまま出ている。

ある入門記事が挙げる工程は8つ。 音源構成の検討 → 収録 → 原音設定 → キャラクターイラスト
→ その他音源同梱物 → 利用規約 → アップローダー → 音源配布動画。使うソフトは
収録が OREMO、原音設定が setParam、歌声合成・調声が UTAU。

スマートフォン収録の記事では4つ。 RecStar（収録）、speedwagon（周波数表作成）、
setParam（原音設定）、UTAU 本体。**周波数表を作るためだけに、もう1つソフトが挟まる。**

KOERU は周波数表を録音時の副産物として書き出す（`docs/product-vision.md`）ので、
この1工程はまるごと消える。
'''

terminology_as_ritual = '''
用語が理解されないまま手順として実行されている実例がある。

周波数表について、ある記事は「説明がわりとむずいので『謎の表』として覚えてね」と書いている。
何であるかを説明せずに、手順として通過させている。

`docs/journey-map.md` の【調べる】が「最初に出会うのが声ではなく用語になっている」と
書いた状況は、書き手の側でも起きている。 教える側が説明を諦めた用語が、
手順の中に残る。
'''

reported_costs = '''
制作者が書いている所要時間。出典ごとに前提が違うので、そのまま並べる。

収録の所要時間は、ある記事が方式ごとに挙げている。単独音が普通5分・最速30秒台、
CVVC が普通10分、連続音が普通30分・最速4分台。

**`docs/product-vision.md` が目安に置いている「単独音 約8分」と食い違う。** どちらも
出典の前提（何音階か、読み上げの慣れ、リストの行数）が書かれていないので、
どちらが正しいかは決まらない。方式ごとの所要時間を算出するときの注意点として残す。

原音設定は、ある記事が「原音設定は、ある程度習熟した後でも、連続音1音階あたり
1〜2時間程度の作業時間が必要」と書いている。**習熟した後の数字。**
'''

reported_obstacles = '''
制作者が自分の言葉で挙げている障害。

読み上げそのものが難しい。 CVVC と連続音について「読み上げむずすぎ」とし、
「ささんすぃさすさすぃ」のような行を初心者が読むのは「まず不可能」と書いている記事がある。
同じ記事は、行が「長ければ長いほど読み間違いが発生しやすく、結果的に収録時間が
無駄に伸びるしイライラする」として、8モーラを最適としている。

**方式の難しさに、手作業の量とは別の軸がある。** `docs/product-vision.md` は方式の
選択肢を「手作業が必要かどうか」で切ると決めているが、読み上げの難しさはそれとは別に効く。

失敗の発見が遅れる。 「マイクの位置取りが悪くて全部録り直ししないといけない」
「発音が間違ってて修正が効かない」が「当たり前にある」と書かれている。

音高の維持が難しい。 「特に音痴は一定の音程を保つことがまず鬼門となるので
1音階をおすすめする」と書いている記事がある。
'''

