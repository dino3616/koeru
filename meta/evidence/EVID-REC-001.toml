schema = 'evidence'
id = 'EVID-REC-001'
title = 'macOS で音声 I/O を自前実装したときの実測（Q-REC-002 の6点）'
kind = 'measurement'
source = '実機（macOS 26.6.2 arm64）。CoreAudio HAL / AUHAL / AVFoundation を直接叩く自前実装'
provenance = 'すべて実機のテストで確認。数値は `crates/koeru-audio/tests/` と `crates/koeru-app/tests/` の出力'
