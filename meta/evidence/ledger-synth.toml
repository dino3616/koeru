# 即時試唱と合成エンジン の部品台帳
#
# ライセンス監査の面。**採否そのものは判断記録（decided_by）が持つ。**
# **「採用」「不適」には decided_by が要る**（check-meta が検査する）。
# 「採用候補」「条件付き」「要調査」はまだ決めていないので不要。

schema = 'component-ledger'
domain = 'synth'

[[component]]
id = 'CMP-SYN-001'
name = 'WORLD (mmorise/World)'
purpose = '合成コアの基礎。F0 推定（DIO / Harvest）、スペクトル包絡（CheapTrick）、非周期性指標（D4C）、合成'
license = 'BSD-3-Clause'
status = '採用候補'
decided_by = 'DEC-SYN-001'

[[component]]
id = 'CMP-SYN-002'
name = 'worldline のソース（`@spline` 除去後に自前ビルド）'
purpose = 'UTAU classic 引数互換の resampler ＋ フレーズ単位合成 API。周波数表の読み込み、時間伸縮、フラグ処理'
license = 'MIT（推移的依存に GPL-2.0-or-later を含むため除去が前提）'
status = '条件付き'
decided_by = 'DEC-SYN-001'
note = 'プリビルドバイナリは使わない。→ DEC-PLT-002'

[[component]]
id = 'CMP-SYN-003'
name = 'libpyin + libgvps'
purpose = '周波数表が無いサンプルの F0 推定（pYIN）'
license = 'BSD-3-Clause'
status = '条件付き'

[[component]]
id = 'CMP-SYN-004'
name = 'miniaudio'
purpose = '録音・再生の音声入出力'
license = 'Public Domain (Unlicense) / MIT-0 の選択制'
status = '採用候補'
decided_by = 'DEC-REC-001'

[[component]]
id = 'CMP-SYN-005'
name = 'xxHash（ライブラリ部）'
purpose = 'フレーズ中間表現のハッシュ（キャッシュキー）'
license = 'BSD-2-Clause'
status = '採用候補'

[[component]]
id = 'CMP-SYN-006'
name = 'KissFFT'
purpose = 'ネイティブ実装での FFT'
license = 'BSD-3-Clause'
status = '採用候補'

[[component]]
id = 'CMP-SYN-007'
