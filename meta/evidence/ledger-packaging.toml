# パッケージング・互換性・データ永続化 の部品台帳
#
# ライセンス監査の面。**採否そのものは判断記録（decided_by）が持つ。**
# decided_by が無いものは、まだ判断記録になっていない採否。

domain = 'packaging'

[[component]]
name = 'serde ＋ YAML 実装'
purpose = 'character.yaml の生成と読み取り'
license = 'MIT / Apache-2.0'
status = '要選定'
note = '`serde_yaml` は保守終了のため後継を選ぶ'

[[component]]
name = 'hound'
purpose = 'WAV の読み書きとフォーマット検証（44100 / 16bit / 1ch）'
license = 'Apache-2.0'
status = '採用候補'

[[component]]
name = 'SQLite'
purpose = 'プロジェクトの構造化データの永続化'
license = 'Public Domain'
status = '採用候補'

[[component]]
name = 'OpenUtau (OpenUtau.Core/Classic)'
purpose = 'UTAU パッケージ仕様の参照実装'
license = 'MIT'
status = '採用候補'

[[component]]
name = 'zip ＋ 形式別の展開 crate'
purpose = '既存音源アーカイブの展開とエントリ名の符号化強制。**エントリ名は UTF-8 と CP932 が混在するため、`zip` の生バイト列を取り出して `encoding_rs` で復号する**'
license = '個別に確認'
status = '条件付き'
note = '既存音源の取り込みを範囲に含める場合。rar / 7z は crate のライセンスを個別に確認する'

[[component]]
name = 'GAKUYA'
purpose = '同領域に実在する Web / プラグインツール。要件の答え合わせ'
license = 'MIT'
status = '参照のみ'

[[component]]
name = 'tracing ＋ tracing-subscriber'
purpose = '構造化ログとトレースの基盤'
license = 'MIT'
status = '採用'

[[component]]
name = 'SharpZipLib'
purpose = 'CP932 エントリ名の ZIP 生成の代替'
license = 'MIT'
status = '不適'

[[component]]
name = 'ignore'
purpose = 'ZIP 生成時の除外規則を .gitignore 形式で書く'
license = 'Unlicense / MIT'
status = '採用候補'

[[component]]
name = 'zip'
purpose = '配布 ZIP の生成と読み戻し検証'
license = 'MIT'
status = '採用候補'

[[component]]
name = 'encoding_rs'
purpose = 'CP932 の読み書き'
license = 'MIT / Apache-2.0'
status = '採用候補'

[[component]]
name = 'rusqlite'
purpose = 'プロジェクト永続化'
license = 'MIT'
status = '採用候補'

[[component]]
name = 'tracing + tracing-opentelemetry'
purpose = '計装'
license = 'MIT / Apache-2.0'
status = '採用候補'

[[component]]
name = 'sentry'
purpose = 'クラッシュレポート'
license = 'MIT'
status = '採用候補'
