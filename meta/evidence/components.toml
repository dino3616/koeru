[[component]]
id = 'CMP-130'
name = 'Kaldi（共有ライブラリ、CPU のみ）'
purpose = 'GMM-HMM の強制アライメント。MFA モデルを読んで Viterbi を回す'
license = 'Apache-2.0'
status = '採用'
decided_by = 'DEC-ALN-008'
