  'TR-ALN-06',
  'TR-ALN-10',
]
note = '''**C++ なので Rust からは C シム経由で呼ぶ**（pybind11 で kalpy がやっていることの Rust 版）。
Apache-2.0 は `deny.toml` の allow に載っており、DEC-PLT-002（AGPL-3.0-or-later）と両立する。
conda-forge のパッケージは linux-64 で約33MB / osx-arm64 で約28MB（圧縮）だが、
**同梱するのは GMM アライメントに要る部分だけ。** OpenFst（Apache-2.0）を推移的に引く。
→ EVID-ALN-001'''
