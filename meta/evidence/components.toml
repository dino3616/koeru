# KOERU が使う / 参照する / 採らなかった部品の単一台帳。
#
# **1部品 = 1行。** 以前は領域ごとにファイルを分けていたため、同じ部品が別 ID で複数行に載り、
# miniaudio が「採用」と「採用候補」を同時に持つような食い違いが起きていた。
# **どの領域で使うかは `domains` が持つ。**
#
# **「採用」「不適」には decided_by が要る**（check-meta が検査する）。
# 「採用候補」「条件付き」「要調査」「要選定」はまだ決めていないので不要。
#
# `supports_requirements` は「この部品が支える要件」。
# 要件の側は、外部部品が要らないなら `needs_component = false` を宣言する。
# **すべての要件がどちらか一方に属する。** `cargo xtask check-coverage` が両方を検査する
# （支える部品が1つも無い要件、および両方を宣言している矛盾）。

