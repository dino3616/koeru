# ── 実行時経路（Python が要るという記録は 3.x では不正確だった）────
runtime_path = '''
**Python は必須ではない。** MFA 3.0 は Kaldi のバイナリを呼ぶ方式をやめ、
kalpy（pybind11 バインディング）経由で **Kaldi の共有ライブラリを直接呼ぶ**形に変わった。
pybind11 でできることは、C シムを書けば Rust からもできる。

- **Kaldi は Apache-2.0。** `deny.toml` の allow に載っている。OpenFst も Apache-2.0
- **PostgreSQL も必須ではない。** MFA 3.x の `use_postgres` は既定 `False` で、標準は SQLite
- conda-forge の Kaldi パッケージは linux-64 で約 33MB / osx-arm64 で約 28MB（圧縮）

**必要な工程**（Kaldi の関数として）:
MFCC → CMVN → splice → LDA+MLLT 行列 → 辞書 FST と転写から training graph をコンパイル（OpenFst）
→ `final.alimdl` で1パス目の Viterbi → fMLLR 推定 → `final.mdl` で2パス目 → transition-id を音素へ変換。

**特徴パイプラインは `meta.json` から確定した**（TR-ALN-05 notes の [Unknown] を閉じる）。
**推測していた LDA+MLLT ではなかった。**

```json
"features": {
  "type": "mfcc", "sample_frequency": 16000,
  "frame_shift": 10, "frame_length": 25, "snip_edges": false,
  "num_coefficients": 13, "num_mel_bins": 23,
  "low_frequency": 20, "high_frequency": 7800,
  "cepstral_lifter": 22, "preemphasis_coefficient": 0.97,
  "dither": 1, "energy_floor": 0, "use_energy": false,
  "uses_cmvn": true, "uses_deltas": true, "uses_splices": false,
  "uses_speaker_adaptation": true
}
```

- **[Fact] 特徴は LDA+MLLT の 40 次。`meta.json` の `uses_splices` / `uses_deltas` は
  このモデルの実態を表していない。** モデルのバイナリを直接読んで確かめた:
  `final.mdl` の `<DIMENSION>` が **40**、`lda.mat` が **40 行 × 91 列**、
  91 = 13（MFCC）× 7（`splice_left_context` 3 ＋ 自分 ＋ `splice_right_context` 3）。
  Δ＋ΔΔ なら 13 × 3 = 39 で、40 にはならない。
  **`meta.json` は `uses_splices: false, uses_deltas: true` と書いているが、
  バイナリと合わない。** 実装が従うのはバイナリ側。
  したがって特徴パイプラインは
  **MFCC(13) → CMVN → splice(±3)=91 → LDA+MLLT(40×91) → 40 → fMLLR**
- **`uses_speaker_adaptation: true`** — SAT / fMLLR は確定。`final.alimdl` と `final.mdl` の
  2パス構成という読みは正しかった
- **`sample_frequency: 16000`** — **モデルは 16kHz を前提にしている。**
  KOERU のマスターは 44100 Hz（TR-REC-01 / TR-REC-02）なので、
  **アライメントの入口で 44100 → 16000 のダウンサンプルが要る。**
  `high_frequency: 7800` なので 7.8kHz より上は使われない
- **`frame_shift: 10`** — フレーム分解能は 10ms。TR-ALN-06 が要求する 2ms 以下は
  サブフレーム補間で作る（TR-ALN-06 が「アライナのフレーム分解能がこれより粗い場合は」と
  想定している経路そのもの）
- **`position_dependent_phones: false`** — 音素に `_B` / `_I` / `_E` / `_S` が付かない。
  木の引き方が単純になる
'''

# ── 音素セット（phones.txt / meta.json より）────────────────
phone_set = '''
**86 エントリ**（`<eps>` 0 / `sil` 1 / `spn` 2 ＋ 音素 83）。**IPA 表記。**
長音は `ː` を付ける（`a` / `aː`）、口蓋化は `ʲ`（`b` / `bʲ`）、促音も子音に `ː`（`k` / `kː`）。

母音 `a i ɨ ɯ e o`、撥音 `ɴ ɰ̃ ŋ`、声門閉鎖 `ʔ`、無声化母音 `i̥ ɨ̥ ɯ̥`。
**撥音 `ɴ` が独立の音素として存在する**——TR-ALN-03 が snfa の制約として挙げていた
「`phone_set` に撥音 N がなく無声化母音を区別しない」は、**MFA では問題にならない。**

`meta.json` の `phone_groups` に 33 の群があり、TR-ALN-24 の音素別の集計と
TR-ALN-12 の話者内一貫性の集団分けに使える。

学習の統計: 話者 2,352 / 発話 161,385 / 音声 873,325 秒（約 242 時間）/
`average_log_likelihood` = -0.1032。**この値は TR-ALN-09 (c) のテキスト逸脱の閾値を
置くときの参照になる。**

無音モデルのパラメータ: `silence_probability` 0.2 / `initial_silence_probability` 0.2 /
`final_silence_correction` 0.99 / `final_non_silence_correction` 0.24。
**TR-ALN-09 (a)(b) の「前後の無音を自由にする」はここで効く。**
'''

# ── Rust 側の部品 ──────────────────────────────────
rust_availability = '''
crates.io を調べた結果。

- **ある**: MFCC / fbank 抽出（`knf-rs` 137万DL、`kaldi-native-fbank` 2.2万DL）
- **無い**: **Kaldi の GMM-HMM モデルを読んでアライメントする crate は存在しない。**
  `vosk-rust`（純 Rust の nnet3 chain 再実装）は v0.0.1・27ダウンロードで、
  そもそも chain モデル向けなので GMM-HMM には使えない

したがって道は2つ。**(a) Kaldi C++ を C シム経由でリンクする**（DEC-ALN-008 が採った）、
**(b) デコーダを自前で書く**（fMLLR まで要るので、snfa の移植より重い）。
'''

# ── 実装して分かったこと ──────────────────────────
implementation_findings = '''
**Kaldi は OpenFst 無しで組めた。** `base + matrix + util + tree + gmm + hmm + transform + feat`
の 77 ファイルのうち **74 が `cc` でコンパイルでき、リンクも通った**（macOS / Accelerate）。

- `base/kaldi-types.h` は `OPENFST_VER >= 10800` を定義すれば `<stdint.h>` で足りる
  （**上流自身が用意している分岐**）
- `hmm/transition-model.h` は `<fst/fst-decl.h>` を引くが **FST の型を1つも使っていない。**
  空のスタブで通る。使い始めたらビルドが壊れるので、気づける
- `base/version.h` は Kaldi の Makefile が git から作るもの。ビルド時に生成すればよい
- 本当に OpenFst が要るのは `tree/tree-renderer.cc`（GraphViz 可視化）、
  `hmm/tree-accu.cc`（学習用）、`hmm/hmm-utils.cc`（FST 構築）の3つだけで、
  **どれも推論には要らない**

**[Fact] dither を切らないと決定性が成り立たない。** `meta.json` は `dither: 1` だが、
Kaldi の dither は各フレームへ乱数の雑音を足すので、**同じ入力から違う特徴が出る**
（実装して実測した——1回目と2回目で値が違った）。`TR-ALN-29` の「ビット単位で同一」と
両立しないため、`dither = 0` にした。**学習時の設定と1つずれる。**
dither はモデルの選択ではなく log(0) を避けるための措置で、Kaldi 自身が
メル帯域のエネルギーに `ApplyFloor(epsilon)` を掛けているので、切っても 0 の log は踏まない。

**実モデルで確かめた値**: 特徴次元 40 / 音素数 85（`phones.txt` の 86 から `<eps>` を除いた数）/
1秒の音声で 101 フレーム（`snip_edges: false` なので端が少し増える）。

**[Fact] topology は音素の飛び越しを許している。** `sil` は5状態・最短3フレーム、
`k` と `a` は3状態だが **`HmmTopology::MinLength` が 1**。
つまり3状態の音素でも1フレームで通過できる。**「状態数＝最短の継続長」ではない。**
グラフを組むときも、境界の妥当性を検査するときも、`MinLength` を見ること。

**[Fact] 1パス目には `final.alimdl`（話者非依存）を使う。** `final.mdl` は SAT で、
fMLLR を掛けた特徴を前提にしている。**素の特徴に SAT モデルを当てると尤度が歪む**——
実装して実測したところ、その状態では音素が事後確率で一度も最大にならなかった。
話者非依存モデルへ替えたら最大を取るようになった。

**[Fact] 合成音では到達水準を検証できない。** 正弦波の和で作った「母音」は、
242 時間の実音声で学習した GMM には母音として見えない。境界の絶対位置を
合成音で主張すると、**DEC-ALN-007 で M6 へ送ったはずの「到達水準の判定」を
根拠なくやり直すことになる。** 試験は構造（区間の単調性、最短長、事後確率の和が 1、
決定性、入力への追従）に留めた。**最初の意味のある検証には実際に録った音声が要る。**

**[Fact] `ComputeFmllrDiagGmm` はヘッダに宣言があるだけで、Kaldi のどこにも定義が無い。**
上流の死んだ宣言で、**リンクの段階で初めて分かる。** 実際の口は
`FmllrDiagGmmAccs::Update(opts, xform, &objf_impr, &count)`。

**[Fact] MFCC の dither を切らないと決定性が成り立たない**（上の実装知見を参照）。

**[Fact] リサンプラの窓幅は遮断周波数に追随させる。** 44100 → 16000 では
sinc が `1/cutoff` 倍に伸びるので、入力サンプルで数えた窓幅も同じだけ広げないと
ローブが数本しか入らない。**幅を固定したまま遮断だけ下げて 12kHz が -10dB しか
落ちなかった。** 追随させると定常部で -88dB。
**端の窓が欠けたぶんを重みで割り戻さないこと**——割り戻すと信号が急に始まるとき
**先頭に無い音を作る。** ゼロ詰めなら素直に立ち上がるだけで済む。
'''
