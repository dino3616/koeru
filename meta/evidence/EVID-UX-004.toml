provenance = '''
Playwright（Chromium、1120×760）で公開ページを描画して観察した。ログインも同意も
していない。**Picrew は規約への同意ダイアログの先だったので開いていない。**
**pokemon.com は CAPTCHA だったので諦めた。** どちらも回避していない。
Ready Player Me は名前解決に失敗した。

画像はリポジトリに入れない。 他人のスクリーンショットを AGPL のリポジトリへ
再配布しないため。ここに残すのは URL と、観察して書いた分析だけ。

**14 枚撮って 12 枚を読んだ。** 参照した水準（30 枚）には届いていない。
'''
confidence = 'Assumption'

utau_culture = '''
音源はキャラクターとして記憶されている。 あみたろもつくよみちゃんも、ページの最前面に
立ち絵がいる。「UTAU音源リスト」はキャラクター設定と衣装の特徴に特化したまとめとして
成立している。**KOERU は絵を描かせないので、声の形がこの位置を引き受けることになる。**

ページは商品説明ではなく、贈り物の包み。 あみたろのサイトはピンクのパステル・リボン・
レース・顔文字で組まれ、更新履歴が 2011 年から 10 年分縦に並ぶ。手描きのロゴタイプ。
「使ってもらえたらうれしいです」という語り口。**装飾はかわいさというより、もてなし。**

つくよみちゃんは同じ文化の整理された側。 白地に水色〜藤色、キャラクター3体と一体になった
ロゴ、グローバルナビとパンくずと目次。それでも語り口は個人的なまま。
'''

character_creation = '''
VRoid Studio がキャラクリ UI の実物。 明るい地。**中央にキャラクターが大きく常駐し、
左にサムネイルの格子（選択肢を絵で見せる。言葉ではない）、右にスライダー群。**
押すと即座に中央が変わる。

**KOERU には「選択肢の格子」が存在しない。** 録音は選択ではなく生成なので、
録る前は選べるものが1つも無い。選べるようになるのは録ったあと（テイクの世代）だけ。
**キャラクリの構造をそのまま持ってくることはできない。**
'''

contemporary_desktop = '''
2026 の「良い」は一枚岩ではない。

Linear は近黒地に巨大で字間の詰まった見出し。色はほぼ無く、状態を示す小さな点だけ。
Raycast は黒地の上に生成的な光の帯とグレイン。Obsidian は近黒地に紫1色で、
「private thoughts」——**誰にも見せないことを売りにしている。**

**Zed は逆に振っている。** 明るい地、等幅を本文に使い、見出しだけセリフのイタリックで
別の色。薄い方眼が敷いてある。暗ければ良い、ではない。

Things はほぼ白でアイコン1つと短い文だけ。Craft は紙のコラージュにセリフの見出し。

共通しているのは、**色数を絞って1箇所に強く効かせること**だけ。
'''

dark_creative_tools = '''
暗い地の上でデータが色を持つ、が繰り返し現れる。

teenage engineering は無彩色のグレーに装飾ゼロ、小文字だけ、独自のピクトグラム。
**色は道具の画面の中にしか無い。** 周りが無彩色だから、あの小さなディスプレイの
水色とオレンジが生きている。

Bitwig は暗い面に飽和した色のクリップが密に並ぶ。色は「どのトラックか」の区別に使われる。
KOERU は情報密度が低いので密度は取れないが、構造は同じ。

Blender は白いヘッダーの下に暗い作例が主役。**作ったものが最前面にある。**
ただし KOERU は配布の場を持たないので、他人の作品を並べる面は作れない。

**`DEC-PLT-025` の方針（UI のアクセントは固定、色は声にだけ）は、この系譜の上にある。**
偶然そう決めたのではなく、暗い制作ツールが共通して選んでいる構造だった。
'''

closed_paths = '''
KOERU が取れないと分かった道。

**ゲーミフィケーション。** Duolingo はストリークと XP、Habitica は RPG のレベルとクエスト。
`TR-SYN-20` が品質スコア・良し悪しの判定・他音源との比較・上達度を禁じているので、
この楽しさは丸ごと使えない。**キャラクリのワクワク（作る楽しさ）と Duolingo の
ワクワク（評価される楽しさ）は別物で、KOERU が取れるのは前者だけ。**

**他人の作品を並べること。** Blender の作例ギャラリーに相当する面は持てない。
配布の場を持たないと決めている（`docs/product-vision.md`）。

**キャラクターの絵で顔を作ること。** UTAU 文化の主流だが、KOERU は絵を描かせない。

**2000 年代個人サイトのノスタルジー。** あみたろのページの温かさは本物だが、
`docs/product-vision.md` は「ノスタルジーにも寄りかからない」と明示している。
'''

