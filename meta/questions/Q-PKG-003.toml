schema = 'question'
id = 'Q-PKG-003'
title = '音源の名前を後から変えられるようにするか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
`LibraryScreen` が「あとから変えられます。絵文字や記号も使えます。」と書いているが、
生成された commands に改名が無い。画面の文言が、実装されていない機能を約束している。

`docs/product-vision.md` は「音源の名前を後から変えられるか、仮名で始められるか」を
未決として挙げていて、この文言はその未決に先回りして答えてしまっている。

`UC-F01-02`（音源の名前を仮のまま先に進める）は、改名できることを前提にしないと成立しない。
名前で止まらせないという設計は、後で直せることとひと組になっている。

改名の影響範囲は表示名だけに閉じる見込みがある。 プロジェクトのディレクトリ名は不変の
UUID（`TR-PKG-37`）なので、改名でパスは動かない。ただし完成の条件に表示名が入っている
（`TR-PKG-34`）ので、空文字への改名を許すかは決める必要がある。
'''
how_to_close = '''
(1) 改名を実装するか、文言を削るかを決める。(2) 実装するなら、空文字と重複を許すか、
どの面から改名できるか（一覧・収録画面・両方）を決める。決めるまで、文言のほうが
実装より先に約束している状態が続く。
'''
