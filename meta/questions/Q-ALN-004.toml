schema = 'question'
id = 'Q-ALN-004'
title = '無声破裂音の閉鎖を「無音」とみなす閾値が、実測されていない'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
DEC-ALN-018 は、閉鎖の区間が直前の母音より 20 dB 以上低ければ通すと決めたが、
20 dB は仮置きで何にも基づいていない。

緩すぎれば、息が漏れて声の途中で切れた VC が分岐不一致の印を付けられないまま
確信度の順に紛れ込む。厳しすぎれば、正しく閉鎖の中で切れたエントリまで
確認キューの先頭を埋め、本人が見るべきものが後ろへ押し出される
（確認は合計時間の上限で切る。DEC-ALN-003）。

直前の母音を持たないエントリ（単独音の CV、行頭の語頭形）には比べる相手が無く、
検証していない。こちらも実測なしには基準を置けない。
'''
how_to_close = 'CVVC と連続音のテイクを複数の話者で録り、無声破裂音ごとに「閉鎖の前半の RMS − 直前の母音の RMS」の分布を出す。聴いて声の途中で切れていたものと、閉鎖の中で切れていたものを分けて並べ、両者を分ける値を規約プリセットの閾値に置く。実音声は環境変数で渡し、リポジトリに置かない。'
blocks_profiles = []
affects_requirements = ['TR-ALN-16', 'TR-ALN-23']
affects_decisions = ['DEC-ALN-018']
