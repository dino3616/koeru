schema = 'question'
id = 'Q-PLT-006'
title = '背後の仕事の上限・期限・保持の値。実測で決め直す'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
`JobRuntime`（`DEC-PLT-047`）の上限と期限は、**根拠の無い仮の値**で置いてある
（`crates/koeru-runtime/src/jobs/config.rs` の定数）。小さすぎれば、正当な仕事が
断られる（チャートや再推定）か、脇に置かれて遅れる（保存済みテイクの解析）。大きすぎれば、
メモリ予算を食う。実測が無いので、どちらに外れているかも分からない。

決まっていないのは次の値。

- lane ごとの待ちの件数（前景・背景）
- lane ごとの、待ち＋走っている仕事の申告バイト数
- 固まったと見なした作業スレッドを、lane ごとに何本まで許すか
- 仕事ごとの期限（解析・試唱・チャートで違うはず）
- 終わった仕事を何件・どれだけの間引けるようにするか
- 閉じた貸与をいくつ覚えておくか

メモリ予算に触るので、実装を使いはじめる前に数値を積み直す（`AGENTS.md` の「未決の論点」）。
'''
how_to_close = '''
実際の収録と書き出しの代表プロジェクトで、次を測る。

- 前景の待ちの件数の最大値と、申告バイト数の最大値（連続収録の途中で、解析が録音に
  追いつかなくなる点）
- 解析・試唱・チャートの所要時間の分布。期限は p99 に余裕を乗せた値から決める
- 解析の外部エンジン呼び出しが固まった実績の有無（`DEC-PLT-047` の見直しの条件）
- 件数・バイト数の上限で、`Defer` が何件脇に置かれたか

測った値を `BUDGET-*` に積み、定数を置き換える。解析が固まる・落ちる実績が出たら、
値ではなく実行域の選択（別プロセス）を `DEC-PLT-047` で見直す。
'''
