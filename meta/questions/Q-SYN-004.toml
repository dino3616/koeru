schema = 'question'
id = 'Q-SYN-004'
title = '外部 phonemizer をどの機構で接続するか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
**OpenUtau の phonemizer は C# プラグインなので、KOERU がそのまま読み込むことはできない。**
「任意の phonemizer を接続できる」を満たすには、KOERU 側で別の機構を定める必要がある。

取り得るのは3つ。(1) 規則テーブルによるデータ定義、(2) 共有ライブラリの ABI、(3) WASM。
**TR-PLT-07 がスクリプト言語ランタイムの同梱を禁じているため、埋め込みインタプリタは取れない。**

差し替えの範囲も決まっていない。エイリアス解決順（TR-SYN-12）とカバレッジ判定（TR-RCL-20）は
同じコードパスを通ると決めてあるので、**片方だけ差し替わると歌える判定と実際に鳴る音がずれる。**
'''
how_to_close = '機構を1つ選び、差し替え点の境界（何を差し替えられて何を差し替えられないか）を TR-SYN-36 へ書き足す。既定の phonemizer 自体をその機構で書けるかどうかを、選定の条件にする。'
