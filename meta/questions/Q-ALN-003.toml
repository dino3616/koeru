schema = 'question'
id = 'Q-ALN-003'
title = '境界精度が編集の手間を減らす水準に届くかが、実測されていない'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
アライナの精度目標を支える学習済みモデルが存在しない。Julius で実装を進める判断は済んでいるが、
水準に届くかは実装中に自分の声で測るまで分からない技術リスクとして残っている。
届かなければ「原音設定を自分でやらずに済む」という確定方針が、単独音でも成立しなくなる。
その場合に何を製品として出すのかは、技術判断ではなくプロダクト判断になる。

M3 では測らないと決めた（DEC-ALN-007）。**このリスクは消えたのではなく、
M6 まで検証されないまま持ち越される。** その間、DEC-ALN-001 の撤回条件は発火せず、
5値の導出規約（TR-ALN-13〜19）を変えたときの回帰も検出できない。
'''
how_to_close = '内部評価ハーネス（TR-ALN-32）と手ラベルの参照データを M6 で作り、境界誤差分布と「人間の編集を要するエントリの割合」を測る。参照データの作成者は複数にする。M3 では作らないと決めた（DEC-ALN-007）ため、この問いは M3 を塞がず M6 を塞ぐ。'
blocks_profiles = [
  'PROFILE-M6',
]
affects_requirements = ['TR-ALN-03', 'TR-ALN-28', 'TR-ALN-32']
affects_decisions = ['DEC-ALN-001', 'DEC-ALN-007']
