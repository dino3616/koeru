schema = 'question'
id = 'Q-PKG-004'
title = '声色の接尾辞をどう決め、音源ルートの prefix.map にどの声色を入れるか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
UTAU 本体が自分で読む音階の割り当ては、音源ルートの `prefix.map` だけ。 1つの音高に
接尾辞を1つしか書けないので、入るのは1つの声色の割り当てだけになる。 ほかの声色は
`prefix/〈声色〉.map`（presamp などのプラグインが読む）と `character.yaml` の subbanks
（OpenUtau が読む）に書く。

刷新のボード（P4h）は「今は接尾辞の無い声色（Normal）をルートへ入れる」と描き、
すべての声色に接尾辞があるときをまだ決めていない。

声色は自由に打つ名前で、空が「声色なし」（`DEC-RCL-018`）。 声色の名前から接尾辞を
どう作るか（そのまま付けるか、本人が別に打つか）も決まっていない。 接尾辞はエイリアスに
付いて歌詞の側から見えるので、あとから変えると、その音源で作った ust が別の音で鳴る。
'''
how_to_close = '''
配布物の書き出し（刷新の R47b）を作る前に決める。 決めることは2つ。

- 声色の接尾辞。 声色の名前をそのまま使う / 本人が別に打つ / 声色なしだけを空にし、ほかは名前から作る
- 音源ルートの `prefix.map`。 声色なしがあればそれ / 配布物ごとに本人が選ぶ / 並びの先頭の声色

決めたら判断記録に移し、`TR-PKG-59` から引く。
'''
