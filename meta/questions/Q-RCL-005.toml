schema = 'question'
id = 'Q-RCL-005'
title = '同じ声色の担当音域が重なるとき、隙間があるときにどの枠が歌うか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
担当音域は枠ごとに下端と上端で直せる（`TR-RCL-31`）。 範囲を独立に持つので、
同じ声色の2つの枠の範囲が重なることも、どちらにも入らない音が出ることも起こる。

既定の floor 割り当て（`TR-RCL-06`）は重なりも隙間も作らない。 問題になるのは、本人が
直したあとだけ。

**判定・代用・試唱・書き出しは同じ経路で同じ枠を選ばなければならない**（`TR-RCL-15`）。
KOERU で歌えた曲が、OpenUtau では別の枠で鳴るのでは困る。 OpenUtau は `character.yaml` の
subbanks を先頭から見て、最初に範囲へ入った枠を使う。 KOERU がそれと違う規則を持つと、
同じ音源が2つの場所で違って鳴る。

UTAU の `prefix.map` は1つの音高に接尾辞を1つしか書けない。 重なりはそこでは表せず、
どちらかへ畳むことになる。
'''
how_to_close = '''
担当音域を直す画面（S06b の帯、刷新の R19b）を作る前に決める。 選択肢は3つ。

- 重なりも隙間も許さない。 一方の端を動かすと、隣の枠の端もついて動く（境目を動かすのと同じ）
- 重なりは許さず、隙間だけ許す。 隙間の音は floor 割り当てで下の枠へ落とす
- どちらも許し、OpenUtau と同じく「並びが先の枠が勝つ」とする。 枠の並び（`TR-RCL-28`）が音の選び方にも効く

決めたら判断記録に移し、`TR-RCL-31` から引く。
'''
