schema = 'question'
id = 'Q-REC-004'
title = '入力レベルの評価語を、色だけで伝えずにどう外すか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
`DEC-REC-008` は、観測をフラットに報告するだけにすると決めた。しかしライブの入力メーターは
「割れている」「小さすぎる」「ちょうどよい」を表示している。**確定したテイクには生の数値しか
出さないのに、ライブメーターは判定している。** 一貫していない。

語を外すだけでは済まない。 メーターは `<meter>` の `low` / `high` / `optimum` で色分けしていて、
語はその色を文字で補うために置いてある（`TR-PLT-28` の「色だけで意味を伝えない」）。
語だけ消すと、判定が色だけに残る——`TR-PLT-28` を割る。

区分そのものを消すなら、`<meter>` の `low` / `high` / `optimum` と、それに対応する
`globals.css` の色分けも一緒に消えることになる。支援技術が「よい範囲かどうか」を
拾えなくなるが、拾わせないのが `DEC-REC-008` の意図でもある。

校正は別扱いになる見込み。 `TR-REC-14` は目標範囲（ピークが -12 dBFS 以上 -6 dBFS 以下）を
持つ工程として定義されていて、そこで範囲を示すのは判定ではなく手順。収録中のメーターと
校正カードで扱いが分かれる。
'''
how_to_close = '''
(1) 区分（`low` / `high` / `optimum` と色分け）ごと消すか、語だけ残す形にするかを決める。
(2) 消す場合、`TR-REC-14` の校正で目標範囲をどう示すかを決める。
(3) `TR-PLT-28` と `TR-PLT-29` を割らないことを、実ブラウザの axe で確かめる。
現行の画面は作り直すので、Phase 3 のオブジェクト定義と Phase 6 の実装で決める。
'''
