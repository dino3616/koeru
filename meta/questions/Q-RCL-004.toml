schema = 'question'
id = 'Q-RCL-004'
title = '音源一覧に到達度を出すか'
status = 'resolved'
owner = 'dino3616'
why_it_matters = '''
`LibraryScreen` は音源ごとに項目数だけを出す。カバレッジも「いま歌える曲の数」も無い。

`TR-RCL-19` は進捗表示に両方を常時出すことを求めているが、その「進捗表示」が収録画面だけを
指すのか、音源を並べる面にも掛かるのかが書かれていない。掛かるなら、いまの一覧は両方とも
隠している。

項目数は行の数であって、`TR-RCL-19` がカバレッジと区別している「行の消化率」の分母ですらない。
中断して数週間後に戻る利用者（`UC-F03-02`）が最初に見るのはこの一覧で、そこに到達度が無いと
どの音源を再開すべきかを開くまで判断できない。

一覧に出すなら、音源ごとに台帳を読むことになる。 いまの `list_projects` は項目数しか返さない。
'''
how_to_close = '''
`DEC-RCL-006` で閉じた。一覧にも掛ける。`ProjectView` に到達度・歌える曲の数・
子音行ごとの被覆・声の色を足し、`list_projects` が音源ごとに台帳を開く。

**費用の実測はまだ取っていない。** 音源が数十を超えたときに待たされるなら、
環と色だけ後から差し込む形へ移る（`DEC-RCL-006` の撤回条件）。
'''
