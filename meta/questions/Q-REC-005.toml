schema = 'question'
id = 'Q-REC-005'
title = '読み上げの難しさを、提示の仕方でどう吸収するか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
制作者の公開記録に、CVVC と連続音について「読み上げむずすぎ」とあり、
「ささんすぃさすさすぃ」のような行を初心者が読むのは「まず不可能」と書かれている
（`EVID-UX-003`）。同じ記録が、行は長いほど読み間違いが増えるとして8モーラを最適としている。

**読み上げの難しさは、方式選択の主軸（手作業が必要かどうか）とは独立に効く。**
主軸が答えているのは録り終えた後の話で、読み上げは録っている最中に効く。
全自動で完結する方式を選んでも、行が読めなければ録音が進まない。

方式選択の軸は1本のままにすると決めた。 `docs/product-vision.md` は改訂しない。
だから吸収する場所は提示の設計になる。

単独音では設計上すでに対処されている。 `TR-RCL-03` が1行あたり最大 N 単位
（既定 5、上限 8）と定めていて、記録が言う「8モーラが最適」と一致する。
**破綻するのは CVVC と連続音の行の中身そのもので、そこは M5 の領域。**

`TR-REC-18` が「次に発声する1フレーズをフレーズ本文として大きく提示する」と定めているので、
分割表示や補助表記を足すなら、この要件の中で足せる形かを見る必要がある。
'''
how_to_close = '''
CVVC と連続音の行を実際に生成して、読み上げにくい形がどれだけ出るかを数える。
そのうえで (a) 行の分割表示、(b) 読み仮名や区切りの補助表記、(c) 行の長さの上限を
方式ごとに変える、のどれで吸収するかを決める。`TR-REC-18` の提示規則の中に収まるかも見る。
M5 に着手するまでは閉じない。
'''
