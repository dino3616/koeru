schema = 'question'
id = 'Q-REC-005'
title = 'ファイル確定後・DB コミット前のクラッシュで残る WAV の扱いが決まっていない'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
TR-REC-28 は `.wav.part` が残った場合の復旧を定めているが、**fsync と rename が成功した直後、
SQLite へのコミットが済む前にクラッシュした場合**を扱っていない。この窓では、
確定済みの WAV がディスクにあるのに DB に行が無い状態が残る。

**設計層の形式検証で見つかった。** `NoOrphanTakeRow`（DB の行はファイルより多くならない）は
成り立ち続けるので、壊れはしない。ただし本人が録った音が、テイクとして存在しないまま
ディスクに溜まる。多音階連続音のような長い収録では、これが積み重なる。
'''
how_to_close = '起動時の整合性検証（TR-REC-31）でこの WAV をどう扱うかを決める。復旧候補として提示するか、破棄するか、報告だけするか。決めたら TR-REC-28 へ要件として追加する。'
blocks_profiles = []
affects_requirements = ['TR-REC-28', 'TR-REC-31']
affects_decisions = ['DEC-REC-004']
