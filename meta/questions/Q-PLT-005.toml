title = 'シンボルの形。声の気配がする形が、まだ出ていない'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
形式と語彙は決まっている（`DEC-PLT-025`）。シンボルとワードマークは分離でき、
ワードマークは KOERU のラテンのみ。シンボルは声の形（同心の環）と混ざらないよう、
環を使わず線質だけ共有する。**最優先で求めるのは「声の気配がすること」。**

決まっていないのは形そのもの。 12案出して、どれも届いていない。
すれ違う二つの弧を**仮に置いて**先へ進む。

## 試して駄目だったもの

**第1案（弧・交差・開き、等幅の線）** すれ違う二つの弧 / 線を離れて抜ける弧 /
対になった開き / 一筆で交差して抜ける。全部外れ。**「越える」を障害を跳び越えることとして
扱っていたのが違った。** `docs/product-vision.md` の Naming が言っているのは
「声が、あなたを越えて創作へ向かう」で、本人から離れて別のところで再び鳴ること。

**第2案（複製・分岐・向こう側・通り道）** 意味は近づいたが全部外れ。
分岐は芽か木に見え、向こう側は幾何的すぎて声の気配がなく、通り道は 16px で消える。

**第3案（太さに抑揚をつけた版）** 等幅の線に抑揚がないことが原因だと見て、
すれ違い / 交差 / ひと息 / 共鳴を膨らみのある形で描き直した。まだ届いていない。
共鳴は声の形と語彙が近すぎて混ざる。

**まだ試していない手段。** 輪郭の不均一さ、かすれ、途切れ、重なりの透け、
非対称、手で描いた線。文字（コ・声・K・O）由来も、第1案で選ばれなかっただけで
潰しきってはいない。
'''
how_to_close = '''
