schema = 'question'
id = 'Q-PKG-002'
title = '完成の状態を画面のどこで見せるか'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
`ProgressView` は `coverage`（完成状態）と `handoff`（手渡し状態）を持ち、Rust から画面まで
渡っている。**この2つを読んでいるのは story の固定値だけで、どの部品も描いていない。**
値が来ていないのではなく、受け取って捨てている。

一覧の見出しは「作りかけ」だけで、完成を表す置き場所が無い。`TR-PKG-36` は完成条件を
満たしたプロジェクトを一覧上で完成として表示することを求めている。

非公開のまま完成できることは製品の中核のひとつ（`docs/product-vision.md`）で、その出口が
画面に存在しない。同時に `TR-PKG-35` が進捗の分母に書き出し・公開・作者を含めることを
禁じているので、「完成」をどう見せるかは、公開を前提にしたゲージでは表せない。

`handoff` を出すかどうかは別の判断になる。 完成の判定には使わない（`TR-PKG-33`）が、
本人にとっては「渡したかどうか」も状態ではある。出すと、公開を完成の一部と読ませる余地が生まれる。
'''
how_to_close = '''
3点のうち1点目は決まった。 完成の表示は被覆の表示が兼ねる（`DEC-PLT-025` の環）。
`DEC-PKG-007` が完成の条件を先に満たさせることにしたので、被覆が満ちた瞬間に必ず
完成していて、別の印を足さずに済む。

残っているのは2点。 (a) `handoff`（手渡し状態）を画面に出すか。完成の判定には使わない
（`TR-PKG-33`）が、本人にとっては「渡したかどうか」も状態ではある。(b) 出す場合、
公開を完成の一部と読ませない表現。`TR-PKG-35` が「公開」「配布」「作者」を必須ステップとして
通常モードに出すことを禁じている。Phase 5 のコピー規律で決める。
'''
