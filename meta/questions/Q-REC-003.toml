schema = 'question'
id = 'Q-REC-003'
title = '収録画面のどこまでが「発声を待っている面」か'
status = 'resolved'
owner = 'dino3616'
why_it_matters = '''
`TakeList` が録音リストの行 ID（`s001` など）を等幅で表示し、テイク切替・聴く・録り直しの
`aria-label` すべてに入れている。読み上げには確実に届く。

`TR-REC-18` は内部表現を出さない対象を「発声を待っている面」と書いている。これを
収録画面全体と読むか、「いま録るところ」のカードだけと読むかで、いまの実装が違反かどうかが
変わる。要件の文言だけでは決まらない。

OOUI では「収録項目」に人が見てよい識別子があるかどうかの問題になる。 行を指す手段が
読み上げ文字列しか無いと、同じテキストの行が複数あるときに区別できない。一覧・録り直し・
支援技術の3つが、それぞれ行を指す必要がある。
'''
how_to_close = '''
`DEC-REC-009` で閉じた。(a) を採る——収録に関わる面すべてを対象とし、行 ID は
画面のどこにも出さない。読み上げの名前にも入れない。行はテキストと並び順で指す。

単独音では仮名が一意なので、同じ読み上げ文字列の行は並ばない。方式が増えて
並ぶようになったら (c) の人間向けの通し番号へ移る。

識別子は経路の引数としては残す。 Tauri にアドレスバーは無いので本人の目に触れず、
横移動（`TR-PKG-51`、`TR-ALN-27`、`TR-RCL-17`）が行を名指しできないと成立しない。
'''
