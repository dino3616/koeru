schema = 'question'
id = 'Q-REC-003'
title = '収録画面のどこまでが「発声を待っている面」か'
status = 'open'
owner = 'dino3616'
why_it_matters = '''
`TakeList` が録音リストの行 ID（`s001` など）を等幅で表示し、テイク切替・聴く・録り直しの
`aria-label` すべてに入れている。読み上げには確実に届く。

`TR-REC-18` は内部表現を出さない対象を「発声を待っている面」と書いている。これを
収録画面全体と読むか、「いま録るところ」のカードだけと読むかで、いまの実装が違反かどうかが
変わる。要件の文言だけでは決まらない。

OOUI では「収録項目」に人が見てよい識別子があるかどうかの問題になる。 行を指す手段が
読み上げ文字列しか無いと、同じテキストの行が複数あるときに区別できない。一覧・録り直し・
支援技術の3つが、それぞれ行を指す必要がある。
'''
how_to_close = '''
3つから選ぶ。(a) 収録画面全体を対象とし、行 ID をどこにも出さない——行はテキストと並び順で指す。
(b) 「いま録るところ」のカードだけを対象とし、一覧では出してよい。(c) 内部表現とは別に、
人間向けの通し番号を与える。決めたら `TR-REC-18` の適用範囲を要件側に書き足す。
Phase 3 のオブジェクト定義と同時に決める。
'''
