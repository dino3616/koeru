schema = 'evidence-capability'

# 観測方法（`method`）が、どの種類の仮説（`hypothesis_kind`）について証言できるかの表。
# 検査するのは「その方法に、その仮説を支持する資格があるか」だけで、観察の内容の真偽は
# 認定しない。 正しい method の札を付けた誤観察は、誤観察のまま残る。
#
# 行は ID を持たない。 鍵は（`hypothesis_kind`, `method`）の組。 ほかの記録から引かれない。
#
# `support`:
#   can-support                 証言できる
#   cannot-support              それだけでは Evidence にならない
#   hypothesis-generation-only  仮説を作る材料にはなるが、支持にはならない
#   context-dependent           必要条件を明示できない限り、自動では昇格させない
#
# **この表に無い組は、`context-dependent` と同じに扱う（自動では支持にならない）。** 登録しないことが
# 「だめ」の意味ではなく、「まだ誰も決めていない」の意味。 足すときは、提案書の出典を `source` に
# 書く。 出典の無い行を足さない。
#
# `observer` は `can-support` の行にだけ付ける。 人の観察でしか足りないかを決める材料
# （`design-debt --human`）。 表が観察者を言っていない方法は付けず、付けない方法を含む種類は
# 「人の観察だけ」とみなさない。 同じ方法は、どの行でも同じ値にする。
#
# 出典は `docs/reports/design-system/koeru_design_system_proposal_full.md` の 10.1（表）、10.1.1
# （例）、10.2（三つ目の規則）、10.3（自己観察）。 `note` は、セルの文言を方法の語に写すときに
# 解釈を挟んだ行にだけ書いた。 そこは人が確かめる。

