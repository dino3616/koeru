# align の性能予算（目標値）
#
# 上限と配分を持つ横断予算は BUDGET-*.toml。ここは領域ごとの目標値で、合計の検査は無い。
# 実時間・パーセンタイル・スループットは FSL の対象外。ここが正本。
# 実測に置き換わるまでは目標であって、達成の根拠ではない。

schema = 'target-set'
domain = 'align'

[[target]]
id = 'TGT-ALN-001'
item = '1テイクのアライメント + oto 5値推定'
goal = 'p95 で 300ms 以下'
decided_by = 'DEC-ALN-008'
note = '''**実測 13.5ms は snfa 相当の推論経路の数字であって、MFA のものではない**（TR-ALN-10 の [Fact]）。
MFA は MFCC → LDA+MLLT → `final.alimdl` で1パス目 → fMLLR 推定 → `final.mdl` で2パス目、の2パス構成なので
桁が変わる可能性がある。**この目標は未実測に戻った。**
モデルを常駐させる前提（TGT-ALN-004 の 160MB）は、ここを守るために置いている'''

[[target]]
id = 'TGT-ALN-002'
item = '全件再推定（多音階連続音）'
goal = '10分以下（バックグラウンド、中断・再開可）'
decided_by = 'DEC-ALN-008'
note = '''**約36秒は snfa 相当の数字で、MFA のものではない。未実測に戻った。**
2パス＋fMLLR 推定ぶん増える。キャッシュ再構築の予算行は TGT-ALN-009'''

[[target]]
id = 'TGT-ALN-003'
item = '同梱物のサイズ'
goal = '**100MB 以下**'
decided_by = 'DEC-ALN-008'
note = '''**MFA 日本語音響モデル v3.3.0 の `acoustic/` が 96.0MiB**（DEC-ALN-012、EVID-ALN-001 の実測）。
うち 95.8MiB が `final.alimdl` と `final.mdl` の2つ。辞書（`japanese_mfa.dict`）が 5.9MiB、
退避経路の Julius が 3.6MB。**合計で約 105.5MiB。**
**submodule には使わない `g2p/model.fst`（33.2MiB）も入っているが、配布物へは入れない。**
従来の 50MB は snfa 級（約1.2MB）と Julius 級（約3.6MB）しか候補が無かった時期の枠'''

[[target]]
id = 'TGT-ALN-004'
item = 'ピークメモリ'
goal = '**160MB**（プロセス全体予算からの配分）'
decided_by = 'DEC-ALN-008'
note = '''**MFA の2つのモデルを常駐させる**（各 47.9MiB、合計 95.8MiB）。
**配分は BUDGET-MEMORY-001 の editor から 96MB 回した**（512→416MB）。上限 1500MB と
scope の「8GB 搭載機で他アプリと共存」は動かしていない。編集中の山は 1456MB のまま。
逐次ロードなら 112MB で足りるが、テイクごとに 48MiB を読み直すので TGT-ALN-001 と TGT-ALN-005 を割る。
従来の 64MB は DEC-PLT-012 が snfa 級の重み 1.25MB を前提に置いた枠'''

[[target]]
id = 'TGT-ALN-005'
item = 'モデルロード → 初回推定可能'
goal = '200ms 以下'
decided_by = 'DEC-ALN-008'
note = '''**[Risk] 97MiB を読むので、この目標が最も割れやすい。** SSD の逐次読み出しでも
100〜500ms の幅に入る。**割るなら、収録画面に入った時点で先読みして録音開始までに終わらせる**
（TR-REC-19 がキャプチャストリームを収録画面の入場時に開くのと同じ手）。
起動時に読むのではなく、プロジェクトを開いた時点から始める'''

[[target]]
id = 'TGT-ALN-006'
item = 'oto 各値の出力時間分解能'
goal = '2ms 以下'

[[target]]
id = 'TGT-ALN-007'
item = '境界誤差と、人間の編集を要するエントリの割合'
goal = '''**数値目標を置かない。到達水準を対外的に宣言しない**（DEC-ALN-008）。
MFA が本番の一次経路になったことで、**比較する上位の基準線が消えた**——
TR-ALN-05 が定めていた「MFA を評価の基準線としてのみ用いる」も、
暫定参照値だった MFA の CSJ 実測（10ms 以内 63.44%）も、自分自身の数字になるため成立しない。
根拠にするのは「最も良いと実測されているアライナを使っている」という事実だけにする。
測ること自体はやめない——境界誤差（平均絶対誤差、10ms / 20ms / 25ms 以内の割合）と
「人間の編集を要するエントリの割合」は TR-ALN-32 の評価ハーネスで記録する。**合否の線を引かないだけ。**'''
decided_by = 'DEC-ALN-008'
note = '''**評価ハーネス自体は M6 にある**（DEC-ALN-007）。M3 の期間は、
導出規約の係数を変えたときの回帰を検出する手段が無い状態で進む。
合否の線を「確認の合計所要時間5分から逆算する」としていた案（DEC-ALN-003 経由）は、
宣言しない方針に変わったため保留する'''

[[target]]
id = 'TGT-ALN-008'
item = '確認待ちの上限'
goal = '**件数ではなく「確認の合計所要時間」で切る**（通常モードは合計5分ぶんまで）'
decided_by = 'DEC-ALN-003'
note = '定義の正本は TR-ALN-25。editor 側は参照だけ'

[[target]]
id = 'TGT-ALN-009'
item = '全件再推定後のフレーズキャッシュ再構築'
goal = '全件再推定の10分枠のうち5分以内（バックグラウンド、中断・再開可）'
derives_from = ['SCALE-REF-001']
note = 'TGT-ALN-002 の10分枠のうち、推論は約36秒。**残りをキャッシュ再構築と読み直しで分け合う。** 再構築中も既存のキャッシュで試唱できること（試唱を止めない）'

[[target]]
id = 'TGT-ALN-010'
item = '下位方式書き出し時の oto 5値の再導出'
goal = '1エントリ 1ms 以内。代表プロジェクト（444行）で1秒以内'
derives_from = ['SCALE-REF-001']
note = '**再導出は推論を伴わない。** 既存のアライメント結果から5値を引き直すだけなので、TGT-ALN-001（1テイク 300ms、実測 13.5ms）より2桁小さい。方式変換は上位から下位への書き出しだけ（DEC-RCL-002）'

[[target]]
id = 'TGT-ALN-011'
item = '全件再推定時の master WAV 読み直し帯域'
goal = '逐次読み出しとし、全件再推定の10分枠のうち読み込みに2分以上使わない'
derives_from = ['SCALE-REF-001']
note = '**帯域の絶対値ではなく、アクセスパターンを制約として置く。** テイク単位のランダムアクセスにすると、回転ディスクでは枠を使い切る。総容量は SCALE-REF-001 の録り直し係数が未実測のため確定しない。実測が出たら帯域の数値へ置き換える'
