# platform の性能予算（目標値）
#
# 上限と配分を持つ横断予算は BUDGET-*.toml。ここは領域ごとの目標値で、合計の検査は無い。
# 実時間・パーセンタイル・スループットは FSL の対象外。ここが正本。
# 実測に置き換わるまでは目標であって、達成の根拠ではない。

schema = 'target-set'
domain = 'platform'

[[target]]
id = 'TGT-PLT-001'
item = 'インストーラのダウンロードサイズ（win-x64）'
goal = '≤ 300MB（圧縮後）'
decided_by = 'DEC-ALN-008'
note = '''**枠であって実測ではない。** 内訳の見込みは MFA モデル 88.0MiB（EVID-ALN-001）
＋ Julius 3.6MB（退避経路）＋ Kaldi の共有ライブラリ 約30MiB ＋ アプリ本体
＋ WebView2 固定版。**ビルドが通った時点で実値に差し替える。**
従来の 120MB は、同梱モデルが snfa 級（約1.2MB）だった時期の枠'''

[[target]]
id = 'TGT-PLT-002'
item = '同（macOS arm64 / Linux x64）'
goal = '≤ 250MB'
decided_by = 'DEC-ALN-008'
note = '''macOS は WKWebView が OS 同梱のため増えない。Linux は Flatpak runtime に含める。
**win-x64 との差 50MB は WebView2 固定版のぶん。** こちらも枠であって実測ではない'''

[[target]]
id = 'TGT-PLT-003'
item = '同梱する推論モデルの合計サイズ'
goal = '≤ 100MB'
decided_by = 'DEC-ALN-008'
note = '''**実サイズ約 100.6MiB**——MFA 日本語音響モデル 97.0MiB（展開後、EVID-ALN-001 の実測）
＋ Julius 3.6MB（退避経路）。**枠にほぼ張り付いている。** TR-ALN-02 の同梱予算と同じ数字'''

[[target]]
id = 'TGT-PLT-004'
item = '初回起動後に追加ダウンロードする総量'
goal = '0MB'
note = 'TR-PLT-19 / TR-PLT-20'

[[target]]
id = 'TGT-PLT-005'
item = 'コールドスタート → プロジェクト作成画面'
goal = '≤ 3秒'
note = '購入5年程度のノート PC、SSD 前提'

[[target]]
id = 'TGT-PLT-006'
item = '「録音」押下 → キャプチャ開始'
goal = '≤ 200ms、プリロール ≥ 300ms で冒頭欠落ゼロ'

[[target]]
id = 'TGT-PLT-007'
item = '8フレーズ録音直後の初回試唱までの待ち時間'
goal = '≤ 30秒'
note = '実見積もり 5〜5.5秒（Harvest が実時間相当なら 10〜12秒）'

[[target]]
id = 'TGT-PLT-008'
item = '波形のパン・ズーム中のフレーム時間'
goal = '≤ 16.7ms/frame（60fps 維持）'

[[target]]
id = 'TGT-PLT-009'
item = 'スペクトログラムの初回計算'
goal = '10秒素材の STFT を ≤ 150ms、再描画は ≤ 16.7ms（再計算なし）'

[[target]]
id = 'TGT-PLT-010'
item = '原音設定エントリ間の移動'
goal = '≤ 50ms（エントリ数 3000）'
note = '**Q-EDT-001 によりディスクキャッシュ前提への変更が必要**'

[[target]]
id = 'TGT-PLT-011'
item = 'ピークメモリ'
goal = '≤ 1.5GB'
derives_from = ['BUDGET-MEMORY-001', 'SCALE-REF-001']
decided_by = 'DEC-PLT-012'
note = '**内訳は BUDGET-MEMORY-001 が持つ。** 実行モード別に割り直した。山は編集中の 1,456MB で、残る余裕は 44MB。WebView の 400MB は実測ではなく枠'
