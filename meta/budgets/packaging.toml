# packaging の性能予算（目標値）
#
# 上限と配分を持つ横断予算は BUDGET-*.toml。ここは領域ごとの目標値で、合計の検査は無い。
# 実時間・パーセンタイル・スループットは FSL の対象外。ここが正本。
# 実測に置き換わるまでは目標であって、達成の根拠ではない。

domain = 'packaging'

[[target]]
item = 'ZIP 生成'
goal = '単独音 約120項目・約21MB で3秒以内 / 多音階連続音 約750項目・約275MB で45秒以内'

[[target]]
item = '`.frq` の生成'
goal = '約750ファイルを3秒以内'
note = '**録音時に f0 と amp を確定していることが前提**（録音時に作ると決めたため）'

[[target]]
item = '書き出し前検証'
goal = '約3750 oto エントリを5秒以内'

[[target]]
item = '生成 ZIP の読み戻し検証'
goal = '生成時間の 30% 以内'

[[target]]
item = 'プロジェクトの再開'
goal = '約3750項目で3秒以内に進捗と次の録音項目が表示される'

[[target]]
item = '自動保存による作業損失の上限 / メタデータの1コミット'
goal = '2秒 / 100ms 以内'

[[target]]
item = '録音停止 → WAV のディスク確定'
goal = '300ms 以内'

[[target]]
item = '破壊的操作直前の自動スナップショット'
goal = '1秒以内'

[[target]]
item = '完成判定（`coverage_state`）の再計算'
goal = '200ms 以内'

[[target]]
item = 'ライブラリ全体のバックアップ書き出し'
goal = '多音階1本あたり60秒以内'
