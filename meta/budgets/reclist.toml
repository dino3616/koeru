# reclist の性能予算（目標値）
#
# 上限と配分を持つ横断予算は BUDGET-*.toml。ここは領域ごとの目標値で、合計の検査は無い。
# 実時間・パーセンタイル・スループットは FSL の対象外。ここが正本。
# 実測に置き換わるまでは目標であって、達成の根拠ではない。

schema = 'target-set'
domain = 'reclist'

[[target]]
id = 'TGT-RCL-001'
item = 'プリセットから全録音リストを生成'
goal = '連続音8モーラ 200ms 以内 / 多音階3音階 500ms 以内'

[[target]]
id = 'TGT-RCL-002'
item = '生成リストの理論下限への近さ'
goal = '連続音8モーラ・141 CV で 148 行・1,040 モーラ以内（理論下限の 105% 以内）'

[[target]]
id = 'TGT-RCL-003'
item = '課題曲1曲の必要単位集合の算出'
goal = '5ms 以内（45〜200 モーラ）'

[[target]]
id = 'TGT-RCL-004'
item = 'ミニ音源の被覆計算'
goal = '50ms 以内（1曲・連続音）'

[[target]]
id = 'TGT-RCL-005'
item = '「あと何フレーズ」の全課題曲再計算'
goal = '100ms 以内（課題曲20曲・1テイク保存ごと）'

[[target]]
id = 'TGT-RCL-006'
item = 'カバレッジ台帳の更新と画面反映'
goal = '16ms 以内（1フレーム）'

[[target]]
id = 'TGT-RCL-007'
item = '1セッションの想定長'
goal = '30分以内で区切れること。多音階連続音は4〜6セッションに分割'
