# 代表プロジェクトの規模。全領域の予算はここから導く。
#
# 領域ごとに別々の数値を持っていたため、予算の突き合わせが成立していなかった
# （5000エントリ / 2000テイク / 148行 / 3時間 / 4GB がそれぞれ別の場所にあった）。
# ここが唯一の基点で、他の数値は `[[derived]]` の式で導く。
#
# 係数が実測待ちのものは value を持たせない。 埋めると根拠の無い数字が固まる。

schema = 'scale-reference'
id = 'SCALE-REF-001'
title = '代表プロジェクト：連続音8モーラ・141 CV・3音階'
basis = '連続音8モーラ・141 CV のリストを3音階ぶん収録したプロジェクト'
scope = '予算・目標値・容量見積もりが想定する規模。単独音や他の音階数はここからの倍率で表す'
source_requirements = ['TR-RCL-09', 'TR-REC-21', 'TR-PLT-19']
source_targets = ['TGT-RCL-002']
rationale = '''
軸を2つだけ決めて、残りは計算で出す。 決めたのは「連続音8モーラ・141 CV」と「3音階」。
行数もモーラ数も TGT-RCL-002 の実測に基づく値がすでにあるので、そこから導ける。

包絡線（各領域の現在値をそのまま代表値にする）を採らなかったのは、**数字の根拠が
無いまま固まるから。** 導出式にしておけば、実測が式と食い違ったときに
「式が間違っている」と分かる。固定値だと何も分からない。

単独音を別の代表にしなかったのは、桁が小さいほうは同じ式の倍率で表せるため。
予算表が2列に増えると、どちらを守ればよいかが場所ごとに変わる。
'''
note = '''
この定義は、既存の数値のうち1つが過大である疑いを示す。 テイク2000件（TGT-REC-011）は
総行数444行に対して4.5テイク/行にあたる。録り直し係数が実測されるまで確定できないが、
桁として高い。→ 実測後に再計算する。
5000エントリ（TGT-EDT-009 ほか）は総モーラ3,120に対して整合的な桁。
'''

[[derived]]
name = '総行数'
value = 444
unit = '行'
formula = '148 行/音階 × 3 音階'
measured = true
note = 'TGT-RCL-002 の実測値から'

[[derived]]
name = '総モーラ数'
value = 3120
unit = 'モーラ'
formula = '1,040 モーラ/音階 × 3 音階'
measured = true

[[derived]]
name = '読み上げ時間（下限）'
value = 5328
unit = '秒'
formula = '444 行 × 12.0 秒（TR-RCL-09 の ≦6モーラ の基準値）'
measured = false
note = 'モーラ超過分を含まない下限。 平均 7.03 モーラ/行なので実際はこれより長い。超過分の秒数係数は TR-RCL-09 が [Unknown] としている'

[[derived]]
name = '収録セッション時間'
unit = '時間'
formula = '読み上げ時間 × セッション係数（息継ぎ・録り直し・確認を含む）'
measured = false
note = 'セッション係数が未実測。 既存の「約3時間」は下限1.48時間に対して係数2.0にあたるが、根拠が無い'

[[derived]]
name = '保存テイク数'
unit = 'テイク'
formula = '444 行 × 録り直し係数'
measured = false
note = '録り直し係数が未実測。 既存の2000件は係数4.5にあたる'

[[derived]]
name = 'oto エントリ数'
unit = 'エントリ'
formula = '総モーラ数 + VC・語尾の追加分'
measured = false
note = '既存の5000は3,120モーラに対して係数1.6。連続音の VCV / VC を含めると妥当な桁'

[[derived]]
name = 'プロジェクト総容量'
unit = 'GB'
formula = '保存テイク数 × 1テイクあたり（マスター 32bit float + 配布用 16bit + 周波数表）'
measured = false
note = '既存の閾値4GB（TR-REC-21）はテイク数が確定するまで検算できない'
