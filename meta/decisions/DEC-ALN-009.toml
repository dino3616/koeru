schema = 'decision'
id = 'DEC-ALN-009'
constraint_label = '原音設定の置き場所'
constraint = 'crate の境界を meta の領域と一致させ、同じ要件の実装が2箇所に散らないこと'
title = 'koeru-align を作って原音設定を集約し、アライナは trait で切る'
status = 'accepted'
owner = 'dino3616'
options = [
  'koeru-align を1つ作り、oto と segment を移す',
  'koeru-synth に足す',
  'koeru-kaldi-sys と koeru-align に分ける',
]
selected = 'koeru-align を1つ作り、oto と segment を移す'
rationale = '''
**crate の境界を meta の `domain` に合わせる。** いま `koeru-synth` に
`oto.rs`（TR-ALN-13〜18 の5値導出）と `segment.rs`（TR-ALN-11 の単独音経路）が入っている。
M2 の試唱が oto を要るので先に書いたものだが、**`koeru-synth` の description は「合成」であり、
合成と原音設定が1つの crate に混ざっている。**

**`-sys` に分けない。** 低レベルを隔離する形は、Kaldi の FFI が大きく育ったら意味を持つが、
**いまは `koeru-align` の中の1モジュールで足りる。** 先に分けると、
crate をまたぐ型の受け渡しだけが増える。育ってから割る。

**アライナは trait で切る。** これは抽象レイヤを好むからではなく、
**TR-ALN-03 が「いずれの実装も emission 行列（フレーム×音素の事後確率）を
呼び出し側に返し、TR-ALN-24 の確信度計算に使えること」と要求しているため。**
共通インタフェースは要件側が指定している。DEC-REC-001（音声 I/O に抽象レイヤを挟まない）とは
事情が違う——あちらは各 OS 固有の制御を包むと出せなくなるものがあったが、
こちらは出すものが要件で揃えられている。

**実装する順序は、アライナ本体に依存しない要件から。** M3 の31件のうち、
規約プリセット（TR-ALN-23）、確信度（TR-ALN-24）、確認キュー（TR-ALN-25〜27）、
oto.ini の検証と書式（TR-ALN-20 / 21）、決定性（TR-ALN-29）、
人間の編集の優先（TR-ALN-30）、台帳（TR-ALN-31）は純 Rust で書ける。
**先に境界を切ってそこを埋めれば、Kaldi で詰まっても他が進む。**

**退避経路の位置づけがはっきりする。** `segment.rs` のヒューリスティックは
DEC-ALN-006 で退避経路になった。trait の実装が2つ並ぶ形にすれば、
どちらが使われているかが型の上で見える。
'''
review_triggers = [
  'Kaldi の FFI が `koeru-align` の中で支配的になり、unsafe の境界が読めなくなったとき。**そのときは `koeru-align-sys` へ割る**',
  'trait が MFA 固有の概念（fMLLR、transition-id）で汚れ、退避経路が実装できなくなったとき',
  '原音設定エディタ（M6）が `koeru-align` に依存して、GUI 非依存という前提が崩れたとき',
]
