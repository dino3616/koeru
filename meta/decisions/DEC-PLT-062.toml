selected = 'P6 の役割を Radix の段へ写し、寸法は P6 の値を相対単位で採る'
rationale = '''
## hex を写さない

P6 は色を hex で並べている。 写すと Radix の版が上がったときに片方だけ古くなり、
明るい面の値も持てない（`docs/reports/ux/direction.md`）。 P6 の hex は暗い slate の段に
ほぼ重なるので、役割を段へ写す。 明るい面は同じ表で Radix の明るい段が付く。 明暗の
両方を残す。

| P6 の役割 | 段 | 使う所 |
|---|---|---|
| `bg` | slate 1 | 音源の面の地 |
| `surface-1` | slate 2 | サイドバー、コレクション |
| `surface-2` | slate 3（hover で 4） | コレクションの中の1件 |
| `surface-3` | slate 4 | 重ねて出す面（メニュー、つまんでいる間） |
| `line` | slate 6 | 区切り線 |
| `line-strong` | slate 7 | 要素の輪郭。 輪郭だけで的だと分かるものは 11（`DEC-PLT-028`） |
| `text-1` | slate 12 | 読ませる文字 |
| `text-2` | slate 11 | 補助の文字・単位・説明 |
| `text-3` | 置かない。 slate 11 | 下を読む |
| `rec` | red 11 | 録音中、危険と失敗 |
| `brand / attention` | amber 11 | KOERU の印と注意 |
| フォーカス | slate 12、2px、2px 離す | 押せるものすべて |

**`text-3` は置かない。** P6 の #878A93 にあたる段が Radix に無い。 いちばん近い slate 10 は
slate 3 の上で 4.14:1 で、文字に要る 4.5:1（`TR-PLT-28`）に届かない。 段のあいだを
`color-mix` で作ると、検査（`DEC-PLT-022`）が段の意味で測れなくなる。 字の色は2段にし、
3段目の差は大きさと太さで付ける。

## 主ボタンだけ声の色で塗る

`DEC-PLT-028` は押せるものの塗りを無彩色にした。 P6 は主ボタンを声の色で塗る。
**主ボタンだけを例外にする。** 1画面に1つで、塗りは声の色、字は `voice-ink`。
ほかの押せるものは `DEC-PLT-028` のまま slate 11 で塗る。

例外にしてよい理由は、`DEC-PLT-028` が守っていたもの——画面上で色相を持つのは本人の声か
状態だけ——を崩さないから。 主ボタンが持つ色相は、その音源の声の色そのもの。 道具が
自分の色を持つわけではない。

- 声の色がまだ無い音源（1行も録っていない）では、主ボタンは slate 11 で塗る。
  灰色の声を作らない（`src/lib/voice-color.ts`）
- 録音ボタンは主ボタンではない。 red 11 で塗り、形（丸から四角）と文字でも状態を示す
  （`TR-PLT-28` の「色だけで意味を伝えない」）
- `voice-ink` は塗りの上で 4.5:1 を満たす側の slate（暗い面で slate 1、明るい面で slate 1 か 12）。
  **主ボタンの塗りは、環の明度の帯（非テキストの 3:1）と別の帯を持つ。** 字を載せるので
  4.5:1 が要る。 測るのは `styles/palette.story.tsx`

声の色の比率（`direction.md` の「声の色が画面の1割を超えない」）は、主ボタンを含めて数える。

## 声の色と、本人が選ぶイメージカラー

声の色の既定は `DEC-PLT-027` のまま、声から作る。

本人は S06 で11色からイメージカラーを選べる。 **選んだら、それが声の色に勝つ**
（P7 の C2「色の主導権はキャラ」）。 主ボタン、選択中の行、顔の代替、環の色が、すべて
その色に置き換わる。 環の形は声から作るままで、色だけ。 戻せば声から作る色に戻る。

11色は Radix の色相に対応させ、暗い面で段 11 を使う。 明るい面も同じ段。

| 名前 | Radix |
|---|---|
| グリーン | lime |
| エメラルド | green |
| ティール | teal |
| シアン | cyan |
| スカイ | sky |
| ブルー | blue |
| インディゴ | indigo |
| バイオレット | violet |
| パープル | purple |
| マゼンタ | plum |
| ピンク | pink |

**赤系（tomato、red、ruby、crimson）と琥珀系（orange、amber、yellow、gold、brown、bronze）は
入れない。** 録音中と注意に当てているので、どの声とも衝突させない（`DEC-PLT-027` の
「禁じられた帯」と同じ）。 cyan と jade は `DEC-PLT-028` で道具の色から外したが、ここでは
声の色としてだけ戻る。

`voice-wash`（選択中の行）は、声の色を `surface-1` に 14% 混ぜたもの
（`color-mix(in oklab, …)`）。 声から作った色にも、選んだ色にも同じ式を当てる。

`voice-frame`（窓の外枠の地。 サイドバーとツールバーの下）は、同じ式で 7% 混ぜたもの。
声の色が無い音源では `surface-1` のまま。 中身の面は `bg` のまま染めず、外枠との境は
線ではなく影で付ける（S04）。

イメージカラーを保存する操作はまだ SDL に無い。 S06 の Issue が SDL に先に書く（`DEC-PLT-061`）。

## 書体は変えない

P5 は Zen Kaku Gothic New（UI）、IBM Plex Mono（数値）、Dela Gothic One（存在声域）の3書体を
描いている。 **どれも同梱しない。**

- UI は Noto Sans JP のまま（`DEC-PLT-026`）。 Zen Kaku Gothic New は常用域までで、本人が
  打つ珍しい漢字で豆腐が出る。 カバレッジを個性より優先した理由は変わっていない
- Dela Gothic One は要らなくなった。 P7 が「名前に人格を足さない。 名前は UI 書体で組む」（C3）とした
- 数値は今の `--font-mono` に `tabular-nums` を当てる。 P5 が IBM Plex Mono に求めていたのは
  「桁が揃って揺れない」ことで、等幅なら満たす
- 太さは 400（本文）・600（見出し・ラベル）・900（録音リストの行と音源名）の3つ。
  ボードの 700 は 600 で読む。 Noto Sans JP は可変なので、同梱は増えない

表示メニューから BIZ UDPゴシックへ切り替える（P5）ことは、ここでは決めない。

## 寸法

P6 の値を採る。 文字と余白は相対単位で持つ（`TR-PLT-34`。 16px を 1rem として割る）。

- 余白: 0.25 / 0.5 / 0.75 / 1 / 1.25 / 1.5 / 2 / 2.5 / 3.5rem（4〜56px）
- 文字の大きさ: 0.75 / 0.8125 / 0.875 / 1 / 1.25 / 1.5 / 2 / 3 / 4.5rem（12〜72px）。
  最小は 0.75rem。 本文は 0.875rem。 4.5rem は録音リストの行で、行の高さは 5.5rem
- 角丸: 6 / 10 / 14 / 18px と、丸（9999px）
- 押せる所: マウスで最小 32px、主要なものは 44px
- サイドバー: 248px、畳むと 64px
- ツールバー: 52px。 窓のドラッグ領域を兼ねる
- 顔（アバター）: 72 / 40 / 24px。 KOERU が描く代替だけ、角丸を一辺の 22% にする

## 存在声域は採らない。 立ち絵には手を入れない

P5 は、音源が前に出る3つの瞬間に、声の色の面・立ち絵の切り欠き・網点・極太書体・
斜めのステッカーで紙面を弾けさせる「存在声域」を描いた。 **P7 がこれを8体の架空の
キャラクターに当て、通らないと判定した。** 老年の和装、白黒のゴシック、ドット絵の機械の
どれも、KOERU の衣装を着せられて人物像が上書きされる。 立ち絵の規約が加工を禁じていれば、
表示そのものが規約違反になりうる。

P7 の基準をそのまま採る。

- 絵に手を入れない。 切り欠き・角丸・網点・重ね描き・ぼかしをしない。 比率と透過を保ち、
  拡大縮小だけ。 ドット絵は整数倍で拡げる（C1）
- アイコンはそのまま縮小し、角丸もかけない。 立ち絵から顔を自動で切り出さない
- 色の主導権はキャラ。 イメージカラーが声の色に勝ち、瞬間の画面でも面は塗らない（C2）
- 名前は UI 書体で組む。 ロゴ画像があれば変形せずに置く（C3）
- 祝福の温度は中立。 煽る文言・ステッカー・跳ねる動きを使わない（C4）
- 画像が無くても成立させる。 代替（声の色の面と頭文字。 網点はここでだけ使ってよい）が
  「未設定」に見えないようにし、キャラクターを勝手に作らない（C5）
- 性別・年齢・種族で分けた語やプリセットを置かない（C6）

S11 は演出なしで作る。 瞬間の演出（刷新の R24）はこの基準の中で決める。

## 動き

作業面の動きは 120〜180ms の ease-out だけにする。 視差・ループ・跳ねを置かない。
`prefers-reduced-motion` では全部やめる（`TR-PLT-33`）。 `direction.md` の「道具側は動かない」を
これに置き換える。 「各面につき、主となる動きは1つ」は残す。

## direction.md で書き換えた行

- 「押せるものにも色相を与えない」に、主ボタンの例外とイメージカラーを足した
- 段の割り当てに、主ボタンの塗りと `voice-wash` を足した
- 文字の太さを 400・600 の2つから 400・600・900 の3つにし、大きさを P6 の段にした
- 余白を4段から P6 の9段にした。 役割ごとの使い方は残した
- 演出の「道具側は動かない」を、120〜180ms の ease-out だけに置き換えた
- 立ち絵とアイコンの扱いを、P7 の基準として足した
'''
