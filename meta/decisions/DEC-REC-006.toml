rationale = '''
**`TR-REC-02` が要求している変換が、そもそも実装されていなかった。**

> キャプチャは 32bit float・デバイスのネイティブレートで受ける。
> **44100 Hz でない場合はアプリ内の固定リサンプラで1回だけ変換し、
> 44100 Hz / 32bit float の WAV（マスター）として保存する**

`pump.rs` はリングから出したものを受けたレートのまま書いていた。
**手元の4プロジェクト、全ファイルが 48000 Hz。**

**見えていた症状は試唱の失敗だった。** `preview.rs` が `TR-SYN-31` の
「変換して通さない」で弾き、`RegionOutOfRange` に畳んでいたので、
画面には**「oto の切り出し範囲が素材に収まらない」**と出ていた。
**oto を疑うことになる。** `TR-ALN-11` のときと同じ形——**メッセージが嘘をついていた。**

**見えていなかったほうが重い。** `wav::write_distribution` は
ヘッダに 44100 と書くだけでサンプルを変換しない。**48000 のマスターを配ると、
44100 と名乗る 48000 の音**になる——8.8% 遅く、低い。黙って壊れる。

# 流し込み型にした理由

排出は塊で来る。**塊ごとに独立して変換すると継ぎ目に段差が出る。**
窓に要る手前の入力と出力の位相を持ち回す形にした。
`塊に切っても通しでも同じ列が出る` が、1 / 7 / 512 / 8192 / 33333 サンプルの
どの刻みでも通しと一致することを見ている。

**確定後に作り直す形は採れない。** `.wav.part` は fsync → rename で
そのままマスターになる（`DEC-REC-004`）。**書く時点で 44100 でなければならない。**

**テイクごとに変換器を作り直さない。** 収録中ストリームは開きっぱなしで
（`REQ-REC-102`）、作り直すと位相が飛んでテイクの継ぎ目に段差が出る。

# レートを下流へ持ち回さない

**変換したあとは、すべてマスターの時間軸で扱う。** プリロール、ピーク、
検査用の収集、残量の見積り、回り込みの検査、書き出すテイク——全部 44100。
`Pump::start_take` からレートの引数を外した。**呼び出し側が別の値を渡せると、
そこが壊れる口になる。**

# koeru-align のリサンプラとは別に持つ

あちらはマスターを読む側の 44100 → 16000 で、`TR-ALN-29` が
**ビット単位の同一**を要求している。核は同じ窓関数付き sinc だが、
**要求が違うものを1つにまとめると、片方の都合でもう片方が動く。**

# 変換の記録

`TR-REC-02` が求める3つを `sessions` へ足した——
`master_rate_hz`（常に 44100。`sample_rate_hz` のネイティブレートと並べて、
**一致／不一致が後から分かる**）、`resampler`（識別子と版）、
`upstream_conversion`（**`unknown` と明記**。`MATCH_FORMAT` が効いたかは
アプリからは見えない）。**既存の行には `unknown` を入れる**——
空欄にすると「変換していない」と読めてしまう。

**`source_channel` は列があるのに一度も書かれていなかった。** ここで併せて入れた。

# 既に録ってある 48000 Hz のファイル

**録り直す。** 変換して上書きするのは `TR-PKG-39`（マスターは書き換えない）と
正面から衝突するので、やるなら別の判断記録が要る。
'''
