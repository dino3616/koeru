selected = '完成の条件を先に満たさせ、被覆が満ちた時点で必ず完成にする'
rationale = '''
被覆の表示（`DEC-PLT-025` の環）が表すのは `TR-PKG-34` の3条件のうち1つだけで、
**環が閉じても完成しない状態が作れてしまう。** 3案から、条件を先に満たさせる形を採る。
被覆が満ちた瞬間に必ず完成しているので、一覧での完成表示（`TR-PKG-36`）は
被覆の表示がそのまま担う。別の印を足さない。

検証は既に常時走ることになっている。 `TR-EDT-43` が制約違反の常時検出を、
`TR-EDT-45` が通常モードの確認待ちに制約違反を必ず含めることを求めている。
だから「被覆が満ちた時点で検証違反が残っていない」は、新しい要求ではなく既定の帰結。

**名前は必須にする。ただし、あとから変えられる。** 表示名が完成の条件である以上、
未設定のまま被覆だけ満ちる経路を残せない。一方 `UC-F01-02`（音源の名前を仮のまま
先に進める）は「名前で止まらない」ことを求めていて、必須と両立する——**仮の名前で
通過でき、気が変わったら変えられる**なら、判断を求められていない。

改名は表示名だけに閉じる。 プロジェクトのディレクトリ名は不変の UUID なので
（`TR-PKG-37`）、改名でパスは動かない。**空文字への改名は許さない**——完成の条件を
後から崩すことになる。

配布名との分離は別の論点として残る。 音源名は character.txt の name として配布物に
現れるため、CP932 で表現できない文字を含む名前は classic 互換で書き出せない
（`meta/requirements/packaging.toml` の domain_risks）。**表示名を自由にした分、
書き出し時に配布名を別に決めさせるかが未決のまま残る。**
'''
