constraint = '完成 = 必須エイリアス表を100%被覆し、全 oto が書き出し前検証を通り、表示名が設定されている状態（TR-PKG-34）'
title = '完成の条件を先に満たさせる。名前は必須にし、あとから変えられるようにする'
status = 'accepted'
owner = 'dino3616'
options = [
  '被覆が満ちたあとに、残りの条件を「あと一歩」として出す',
  '被覆の表示に3条件すべてを含める',
