rationale = '''
**`head` と `tail` を `% cap` した値で持ちながら、差を
`head.wrapping_sub(tail) % cap` で取っていた。**

これが合うのは `2^64 % cap == 0` のとき、つまり容量が2の冪のときだけ。
アプリの容量は `48000 × 8 = 384000` で、`2^64 % 384000 = 111616`。

環をまたいだ瞬間から、消費側が「111616 サンプル余分に読める」と誤認する
（48kHz で 2.3 秒ぶん）。読み終えた古い領域をもう一度読み、
`tail` が `head` を追い越して、そこから壊れたまま走り続ける。

# 見えていた形

| どこ | どう見えたか |
|---|---|
| 波形 | 前に流れたものがまた流れる。 速くなったり遅れたりする |
| 収録 | 実時間より長いテイク（3秒押さえて 12 秒）、7 秒の先頭余白 |
| 収録 | 28本の合計 238.7 秒が、実時間 210 秒の間に録れている |
| 収録 | 発声がまるごと隣のテイクへ落ち、無音のテイクが残る（`s017`） |

実測: アプリと同じ容量で 10 秒流すと、排出が 127%——
流した量の 1.27 倍を排出していた。直すと 100%。

# なぜ試験が通っていたか

既存の試験は容量を 4 / 8 / 16 / 1024 でしか作っていなかった。全部2の冪。
剰余の誤りが打ち消される値ばかりで、アプリが使う値だけが外れていた。

容量を2の冪でない値にした試験を足した（300、1000、そして実際の 384000）。
古い実装では「300 のはずが 0 が来た」で落ちる。

# 総数で持つ

差がそのまま溜まっている数になる。剰余は添字にするときだけ取る。
`usize` は 64 ビットなので、48kHz で溢れるまで 1200 万年かかる。
'''
