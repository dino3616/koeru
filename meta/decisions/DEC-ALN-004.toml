rationale = '''
**リポジトリ全体が MIT で配られている。** `julius-speech/segmentation-kit` の License.md は
MIT で、音響モデル（`hmmdefs_monof_mix16_gid.binhmm` 464KB /
`hmmdefs_ptm_gid.binhmm` 2.9MB / `logicalTri` 239KB）はそのリポジトリの中にある。

**[Risk] ただし License.md は対象を "the Software" と定義するだけで、`.binhmm` を
明示的に列挙していない。学習コーパスの出所も未確認。** SwiftF0 の
`MANIFEST.in` のような「著者が重みを意図して同梱している」明示的な痕跡が無い。

**この件では、リポジトリに同梱されている事実を受け取る。** 判断であって、
確実性の主張ではない。AGENTS.md の破ってはいけないもの #4 は
「モデル側の表示ライセンスが学習コーパスの条件を上書きできるとは限らない」と
注意を促すもので、禁止ではない。**通すなら記録に残す、という規律に従う。**

**代替が無い。** MFA は Python / Conda / Kaldi ランタイムを要して単一ネイティブアプリと
両立せず（TR-ALN-01）、日本語音響モデルの CC BY 4.0 表示も上流コーパスの
再配布禁止・非商用限定を上書きできない。snfa は境界の教師信号を持たず、
公開された境界精度の数値が存在しない（TR-ALN-03）。**50MB 以内で日本語に使える
学習済みモデルは snfa 級と Julius 級しか存在しない**（TR-ALN-02 の [Fact]）。

**TR-ALN-31 に例外条項を足す。** TR-ALN-31 は「ライセンスまたは学習データの出所が
確認できないモデルは同梱しない」と定めており、この決定は字面では反する。
**黙って反するのではなく、例外を要件側に書いてこの決定へ参照させる。**

**上流への問い合わせは続ける。** 回答で否定されたら DEC-ALN-001 ごと snfa へ戻す
（CMP-001 は採用候補のまま残してある）。
'''
