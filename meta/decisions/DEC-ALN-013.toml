schema = 'decision'
id = 'DEC-ALN-013'
constraint_label = '1ファイルに入るモーラ数'
constraint = '録音リストが生成する行の形と、原音設定が想定する形が一致していること'
title = '単独音も1ファイルに複数モーラが入る。oto はモーラごとに持つ'
status = 'accepted'
owner = 'dino3616'
options = [
  'TR-RCL-03 を正とし、TR-ALN-11 を直す',
  'TR-ALN-11 を正とし、録音リストを1行1モーラにする',
]
selected = 'TR-RCL-03 を正とし、TR-ALN-11 を直す'
rationale = '''
2つの要件が矛盾していた。

- `TR-RCL-03`: 単独音は 1行あたり最大N単位（既定5、上限8）でグルーピングする。
  「同一行内の単位は子音行が揃うように並べる（例: か き く け こ）」
- `TR-ALN-11`: 「単独音方式では、1ファイルに1モーラしか含まれないことを使い…」

**UTAU の単独音は「あ い う え お」を1ファイルに録り、oto.ini にモーラごとの
エントリを書く形。** 同じ WAV を複数のエイリアスが別の位置で指す。
`TR-RCL-03` が製品の形を正しく書いていて、`TR-ALN-11` の前提のほうが誤り。

1行1モーラにする案は採らない。 中核 102 単位が 102 回の収録になり（いまは約21行）、
`TR-RCL-03` が意図した「子音行が揃うように並べる」読みやすさも失われる。
録音の手間は KOERU が減らそうとしているものそのもの。

データモデルを直す必要がある。 `oto_values` の主キーが `take_id` で、
1テイクに1つしか oto を持てない。 5モーラの行には5つ要る。
`(take_id, alias)` で持つ形へ移行する。

実装は複数モーラのアライメントを一度も通っていなかった。 `koeru-align` の試験は
すべて1〜2音素の音素列で書いており、縦切りの実機ハーネスはマイクが無い環境で途中で戻る。
画面で「発声を見つけられませんでした」と出て初めて分かった——
アライメントは成功していて、`Boundaries::from_alignment` が
`[sil, C, V, sil]` の4区間しか受けないために `None` を返していた。
メッセージが嘘をついていた。
'''
