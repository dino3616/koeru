constraint_label = 'ディスク枯渇'
constraint = '保存先の容量が尽きても、既に録れているテイクを1件も壊さない'
title = '収録開始前に必要容量を見積もり、足りなければ録りきれる件数を提示して開始させない'
status = 'accepted'
owner = 'dino3616'
options = [
  '事前に見積もって、入る分だけ録らせる',
  '書き込み失敗を検出したときだけ止める',
  '両方を要件にする',
]
selected = '事前に見積もって、入る分だけ録らせる'
rationale = '''
**書き込み失敗時の保護は既に構造で担保されている。** DEC-REC-004 のアトミックな確定手順
（`.wav.part` → fsync → rename → コミット）により、書き込みが失敗してもそのテイクが確定しない
だけで、`masters/` の既存ファイルと `index` は書き換わらない。**失敗検出だけを足しても、
新しく守れるものが無い。**

足りないのは予防のほう。多音階連続音のような長い収録では、途中でディスクが尽きると
そこまでの手間が中途半端に終わる。**途中で止まるより、始めないほうが損失が小さい。**
だから残量を先に見て、その残量で録りきれる件数を提示する。

収録中も監視は続ける。ただし進行中のテイクは最後まで録りきる。**録っている最中に切ると、
本人が歌いきったものを失う。**
'''
