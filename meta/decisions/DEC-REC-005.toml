schema = 'decision'
id = 'DEC-REC-005'
constraint_label = 'FSL の有界化を写さない'
constraint = '検証のために置いた有限の上限が、製品の規則として実装に入らないこと'
title = '検証用の有界化（MAX_TAKES）は写さない。テイク数に上限は無い'
status = 'accepted'
owner = 'dino3616'
options = [
  'Session から上限を取り除く',
  '上限は残し、アプリから「無制限」を渡す',
  '上限を取り除いたうえで、TR-REC-21 の容量規則まで実装する',
]
selected = 'Session から上限を取り除く'
rationale = '''
**`recording-input.fsl` の `MAX_TAKES = 3` を製品コードへ写していた。**

あれは冒頭に明記してあるとおり `ASSUME-3`——
「テイク数は検証用に有限へ閉じる（**表現上の仮定**）」。
モデル検査の状態空間を有限にするための数であって、製品の規則ではない。
**設計層の `project-storage.fsl` では同じ定数が 2 になっている。**
値が食い違うこと自体が、任意の有界化である証拠。

**製品側の規則は `TR-REC-21` が持っていて、逆のことを言っている。**

> 録音リスト項目1つあたりのテイク保持数は**上限を設けず**、プロジェクトの総容量が
> 閾値（既定 4 GB）を超えたときに、非採用テイクの古い順から削除候補として
> 本人に提示する（自動削除はしない）

`studio.rs` には `Session::new(3)` と書かれ、コメントは
**「3件までの提示上限は `recording-input.fsl` と揃える」**だった。
**揃えてはいけないものを揃えている。** しかも `Session` の `takes` は
項目ごとではなく**セッション全体の通算**なので、3テイク録ると
以降どの項目も録れなくなる。中核 102 単位は1行5モーラで 21 行あるので、
**3 で止まると製品が成立しない。**

**取り除く側を採る。** 「アプリから無制限を渡す」は写しの規律は守れるが、
**死んだ分岐がコードに残り、次に読む人が同じ読み違いをする。**
`koeru-audio` の `Session` は「`recording-input.fsl` の写し」だが、
**FSL が自分で「表現上の仮定」と名乗っているものは契約ではない。**
session.rs の冒頭に「写してはいけないもの」として明記した。

ここで効く上限は**残量だけ**（`space_sufficient` / `TR-REC-41`）。
`TR-REC-21` の 4 GB 閾値と削除候補の提示は別途（範囲が広いので分ける）。

**M2 の要件違反だった。** `TR-REC-21` は `PROFILE-M2` に属する。
以前の M2 監査はこれを見落としている——**要件 ID がコードから参照されているか**は
見たが、**参照している値が要件と逆向きか**は見ていなかった。
'''
review_triggers = [
  'FSL に新しい `const` の有界化を足すとき。**写す前に、それが契約か仮定かを見る**',
