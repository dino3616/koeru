rationale = '''
## 何が問題だったか

取り込みは、画面がファイルを読んで渡したバイト列を `koeru_core::ust::parse_file` で曲へ
変え、曲の行だけを台帳へ書いていた。

- 原文は残らない。`Provenance` が持つのは出典と許諾の文字列だけで、パーサを直したあとに
  取り込み直す手段が無い。`docs/reports/architecture/03-task-dag.md` の T04 は「raw import」を
  変えてはならないものに、T08 は「raw imports retained」を移行・回復の要件に挙げている
- `OperationId` が無い。応答が失われたあとの送り直しは、新しい曲の ID を振って二重に入れる。
  テイクの確定は受領証で冪等になっている（`DEC-REC-010`、`DEC-PLT-035`）のに、曲の取り込みは
  同じ契約の外にいた

## なぜ project の台帳に置くか

`DEC-PLT-041`・`DEC-PLT-043` のとおり、project の状態は台帳が単一の真実で、控え・移行・
一貫した読みの対象になる。原文を台帳に置けば、控えも移行も版も同じ経路で扱え、新しい
保存先を増やさない。曲の行と原文と受領証を1つのトランザクションに載せられるのも、同じ
SQLite の中にあるから。

曲のファイルは、音声と違って小さい。台帳に BLOB を持たせる代償は小さい。

## 冪等の形

テイクの受領証（`commit_receipts`）と同じ作りにした。受領証を先に見て、あれば何も書かずに
答える。応答が失われた consumer の送り直しは、新しい曲の ID を振り直してくるので、台帳の
ID が勝つ。

同じ `OperationId` で別の要求が来る場合を送り直しと区別するため、要求の指紋
（ファイル名・バイト列・題の SHA-256）を持つ。区別しないと、別のファイルを取り込んだつもりの
consumer が、先に取り込んだ曲を受け取って気づかない。

## 採らなかった案

### 原文は残さず、冪等だけを足す

T04・T08 が求める「raw imports retained」と食い違う。原文が無ければ、パーサを直しても
取り込み済みの曲は直せず、本人がファイルを探して取り込み直すことになる。台帳に BLOB を足す
移行の代償は小さい。

### 原文は project の外（ライブラリ側）に置く

project を別の機械へ持ち運ぶと、原文が付いてこない。曲の行は残るのに原文が無い状態が、
持ち運んだ先で起きる。台帳とライブラリが別々に控えを取られると、受領証と原文の対応も
崩れうる。

## 最大の欠点

取り込みのたびに原文の BLOB が増える。同じファイルを何度も持ち込めば、そのぶん増える
（内容の指紋で畳まない）。曲ファイルの大きさに上限は置いていない。USTX はピッチ曲線や
表情を持つので UST より大きくなるが、上限の数値を置く根拠は無い。
'''
