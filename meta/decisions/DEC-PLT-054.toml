selected = '''
原文のバイト列を台帳（project）に残し、取り込みを OperationId で冪等にする。

- 表は `song_imports`（操作ごとに1行。原文・ファイル名・要求の指紋・時刻）と
  `song_import_songs`（その取り込みが作った曲の ID と並び）の2つ。移行は
  `2026-10-13-040000_song_imports`。全表に版のトリガーを置く規則（`DEC-PLT-043`）に従う
- 曲の行・原文・受領証は同じトランザクションで書く。途中で落ちたら1つも残らない
- 同じ `OperationId` の送り直しは、書かずに先の曲の ID を返す。同じ `OperationId` で
  要求（ファイル名・バイト列・本人が決めた題）が違えば、取り込まずに先の受領証を返す
  （`OperationIdReused`）。どちらも失敗ではなく値で返す（`DEC-PLT-038`）
- `OperationId` が違えば、原文が同じでも新しい取り込みで、曲がもう1組並ぶ。内容の指紋で
  重複を畳まない
- 原文は符号化も改行も直さずに残す。ファイル名はディレクトリを落とした名前だけ
- 移行より前に取り込んだ曲は原文を持たない（ファイルが残っていない）。作り直さない
- 取り込めないファイル（歌詞を読めない、音高が範囲外、1ノートに2音）は、下見（`prepare`）の
  診断として返す。台帳へは書かない
