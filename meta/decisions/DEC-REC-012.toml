rationale = '''
## どの単位で持つか

画面刷新のモデル（`docs/reports/ux/redesign-canvas/model/schema.graphql`）は
`Voicebank.guideBpm: Int!` と書いている。 KOERU では1つの project が1つの音源なので、
project の台帳に1つ持つ。 収録画面のツールバー（`S04-Record`）も音源の画面に1つだけ置いている。

枠ごと（2つ目）はボードに無い。 多音階では枠が音高の数だけあり、同じ人が同じ速さで
歌うのに枠を移るたびに合わせ直すことになる。 枠ごとに変えたい要望が出たら、音源の値を
既定にした上書きとして足せる（下の review_triggers）。

アプリの設定（3つ目）にしない。 テンポはその音源をどう録ったかの一部で、別の音源へ
持ち越すものではない。 セッションごと（4つ目）にもしない。 収録セッションは録音条件の
スナップショットで（`TR-REC-30`）、設定の置き場所ではない。 開くたびに既定へ戻ると、
遅く録りたい人が毎回合わせ直す。

## 範囲と刻み

ボードから決まるのは、整数であること、−／＋の押しボタンで上げ下げすること、3桁で
表示することまで。 範囲と刻みは書いていないので、ここで決める。

下限を 60 にするのは助走のため。 助走はミリ秒で持ち（既定 1250 ms、`TR-REC-23`）、
その中で鳴るクリックは「助走 ÷ 拍長」の切り捨ての数になる（`koeru_model::guide`）。
60 BPM で1つ、50 BPM を割ると0になり、いつ入るかを知らせる合図が消える。

上限を 180 にするのは、1拍 333 ms を下回ると1モーラの中で子音と母音の定常区間を
取りにくくなると見ているから。 [Assumption] 実測していない。 外れたら上限を上げる。

刻みを 5 にするのは押す回数のため。 120 から 100 へ下げるのが4回で済む。 1 BPM の違いを
ガイドに求める理由は見当たらない。 [Assumption]

**狭く始めて広げる。** 範囲を広げ、刻みを細かくしても、保存してある値は全部そのまま
有効に残る。 逆は、保存してある値の一部が範囲外になり、読み直しの規則が要る。
範囲と刻みを外れた値は、保存せずに `InvalidRequest` で断る。 規則は `koeru_model::guide` の
1箇所に置き、画面は読みで受け取った範囲と刻みを使う。 画面に数を写さない。

## 録ってある行との関係

テンポは録音リストの生成の入力ではない（`TR-RCL-27`）。 変えても行は増えも減りもせず、
並びも変わらない。 録ったテイクも変えない。 無効にせず、録り直しの印も付けず、
推定し直しもしない。

テイクがどのテンポで録られたかは、そのテイクが属する収録セッションの記録が持つ
（`TR-REC-30` がガイドの設定をセッションに記録すると書いている）。 セッションの途中で
テンポを変えると、そのセッションの記録が後半のテイクについて嘘になる。 だから変えたら
セッションを切り、入力の条件は同じままテンポだけ違う新しいセッションを始める。
`TR-REC-30` のセッションを切る条件にこれを足した。 値が変わらないなら切らない。

録っている途中は変えさせない（`ActionRejected`）。 録り始めた時点のセッションに
テイクが属するので、途中で変えると、そのテイクの記録と実際に鳴っていた速さが食い違う。

テイクごとの列（8つ目）にしない。 セッションの記録と二重になり、片方だけが変わる。
記録しない（9つ目）にもしない。 グリッド（`TR-ALN-08`）と要確認スコアの (2)
（`TR-EDT-02` の「ガイドのテンポから期待される位置とのずれ」）はテイクごとの
テンポを要る。 いまの設定から読むと、テンポを変えた瞬間に、録ってある全テイクの
期待位置が動く。 それは録ったテイクの意味を変えることになる。

この記録を足す前に録った収録セッションには、テンポを入れない（空のまま）。
その頃は収録中にガイドを鳴らす経路が無く（`take_metrics.guide_offset_frames` が
全テイクで空）、120 と埋めると 120 BPM の拍に合わせて歌ったテイクに見える。
変換の記録を足したとき（`sessions.resampler` を `unknown` で埋めた）と同じ考え方。

## 推定への効き方

いまは、テンポを変えても原音設定の推定は1つも動かない。 アライナにはグリッドを
渡しておらず（`TR-ALN-08` は未実装）、5値の導出もテンポを入力に取らず、
要確認スコアの (2) も無い。 標準の拍長は、テイクの先行発声の位置の差分から推す
（`TR-ALN-12`）ので、設定の値を読まない。

これらを実装するときは、テンポをテイクのセッションの記録から読み、ガイドが実際に
鳴っていたテイク（`TR-REC-26` の時刻対応が空でないもの）にだけ当てる。

## 変えないもの

- 所要時間の見積もり（`TR-RCL-09`）。 行あたり 12.0 秒は実務値で（`DEC-RCL-008`）、
  テンポを入力に持たない。 実測のペースでも書き換えない（`DEC-RCL-013`）。
  遅いテンポで録ると見積もりより長くかかるが、行数を併記しているので本人が当てはめられる
- 回り込みの検査（`TR-REC-24` の「1秒キャプチャ」）、多音階の基準音（`TR-REC-25` の
  既定 1000 ms）、単独音の音高提示。 どれも拍を刻まないので、設定のテンポを使わない
- 助走の長さ。 ミリ秒のまま（`TR-REC-23`）
'''
