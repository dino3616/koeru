rationale = '''
`DEC-SYN-010` は差し替えの機構を presamp.ini に置いた。 **置く時期を
決めていなかった。**

台帳は、プロジェクトを作った瞬間に「この行を録ると、どの綴りができるか」を
行ごとに書き込む（`TR-RCL-18`）。**作る瞬間はフォルダがまだ無い**ので、
必ず同梱の既定の表で書き込まれる。差し替えるには、作ったあとで本人が
フォルダへ手で置くしかなかった。

そうして置いた表は、台帳の綴りと噛み合わない。 語頭形を `- か` から `-か` に
変えると、録るたびに新しい表が `-か` を作り、台帳に無いので捨てる。
書き出しの判定は新しい表で `-か` を要求するので、**何度録り直しても書き出せない。**
差し替えは必ず作ったあとになるので、綴りを変えた部分は一度も効かなかった。

## 作成時に選ばせる

作成画面で presamp.ini を選ばせ、台帳を最初からその表で書く。 選ばなければ
同梱の既定。どちらでも、使う表の中身を台帳に写しとして持ち、フォルダにも
`presamp.ini` として書く。

解決・被覆・書き出しは、台帳の写しを読む。 フォルダのファイルは読まない。
フォルダのものを読むと、開いていない音源の一覧（ライブラリ）が、
書き換えられたままの表で被覆を数える。

## あとからの書き換えは戻して残す

開いたとき、フォルダの `presamp.ini` が写しと違えば、

1. 書き換えられた中身を `presamp-{SHA-256 の先頭8桁}.ini` として同じフォルダに残す
2. `presamp.ini` を写しの中身に戻す
3. 戻したことと、残したファイルの名前を本人に知らせる

消さずに残すのは、本人が書いたものだから。 別の音源を作るときに選び直せる。
名前に中身の指紋を使うので、同じものを何度置いても1つにしかならない。

**無くなっていたときは黙って戻す。** 残すべき中身が無く、失われるものも無い。

写しを持たない古いプロジェクトは、同梱の既定を写しとする。 台帳の綴りは
作ったときの既定の表で書かれているので、それがその音源の表になる。

## 採らなかった案

**知らせて本人が選んだら作り直す**、**黙って作り直す**。 台帳の綴りを新しい表で
書き直せば効くが、録り終えたテイクの5値と境界も綴りで引いて保存している。
綴りが変わると、古い綴りの5値（本人が手で直した値と確認済みの印を含む）が
宙に浮く。位置で対応づければほとんどは引き継げるが、持ち主の割り当てが
変わると引き継げないものが出る。

**最初のテイクまでだけ効かせる**。 録り始めたあとの差し替えを断る点は選んだ案と
同じで、作成画面に項目が増えないぶん軽い。採らないのは、選ぶ口が
「作ってから録る前に、フォルダへ手で置く」しかなく、画面から辿れないため。
'''
