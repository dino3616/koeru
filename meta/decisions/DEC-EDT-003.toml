selected = 'TR-EDT-08 に「制約違反が残っていない場合に限る」を足す'
rationale = '''
形式検証で見つかった。 TR-EDT-44 が上級モードに無制約編集を持たせているため、
「上級モードで編集した」と「制約違反が残っている」が同時に成り立つ状態が作れる。
TR-EDT-08 は前者から確認済みを導き、TR-EDT-45 は後者から確認待ちを導くので、両立しない。

通常モードの利用者に違反が見えなくなるほうが害が大きい。 上級モードは一度も開かずに
完成へ到達できる経路が保証されている（TR-EDT-08）。つまり上級モードで残した違反を
確認済みとして畳むと、上級を開かない利用者には違反があったこと自体が届かない。
第2案（承認済みの違反）はまさにそれを起こす。

第3案は「確認済みなのに完成しない」という説明できない状態を作る。確認済みという語が
「見て、これでよいと判断した」を意味しなくなる。

`INV-EDT-001`（違反は決して確認済みにならない）を FSL でそのまま保てる案を採る。
'''
