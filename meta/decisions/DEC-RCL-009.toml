rationale = '''
M5 の生成器を書こうとして、条文どおりには作れない箇所が4つ出た。 いずれも
「条文に書いた数」と「データやグラフから決まる数」が噛み合っていない。
`DEC-RCL-004` が単独音で通ったのと同じ筋で、導出のほうを正本にする。

## CV の数が、捨てたはずの 141 のまま

`TR-RCL-05` は「CV 単位 141 種」「合計 327 エイリアス」と書いていた。
`DEC-RCL-004` はこの 141 を「出どころが追えない」として捨て、中核 102 / 拡張 144 を
正本にしている。**その書き換えが TR-RCL-05 まで届いていなかった。**
拡張セットで数え直すと 144 + 180 + 6 = 330。

## 軽量モードの 180 → 120 が、挙げた子音の数と合わない

条文が挙げる口蓋化子音は ky / gy / sh / ch / ty / dy / py / by / ny / hy / my / ry の12種。
外すと 30 − 12 = 18 で、母音 6 種を掛けて 108 にしかならない。120 になるのは10種を外したとき。

**軽量モードごと落とす。** 数を合わせる直し方は2通りあるが、どちらも
「どの子音の VC を代用してよいか」を実測なしに決めることになる。代用は音質に直接効く
——「さ」の VC で「し」を鳴らすかどうかの判断が、数合わせの副産物になってしまう。
録音量を減らす手当ては、要る場面が来てから実測を付けて入れる。

## 全辺被覆と「行内に難読音を2個以上入れない」が両立しない

`TR-RCL-04` は「先行母音クラス × CV 単位」の全辺を被覆せよと言い、
`TR-RCL-07` (d) は行内の難読音を1個までに抑えろと言う。拗音どうしの遷移（きゃ → ぎゃ）は、
両方を同じ行に隣接させないと覆えない。条文の逃げ道（「解が存在しない場合はモーラ上限を
1下げて再生成する」）は、行を短くするだけなので解けない。

**被覆を優先し、(d) を落とす。** 覆えない辺があると、その遷移は永久に録れない。
読みにくさは `TR-RCL-07` 後半のリスクスコアが引き受ける——生成はするが、
読み間違いリスクが高い行として提示される。

## CVVC の「60 行以内」が、語頭 CV の数と両立しない

`TR-RCL-05` は「生成器は M=8 のとき 60 行・480 モーラ以内で被覆すること」と書いていた。
**語頭 CV（`- CV`）は行の先頭にしか出ない。** CV が 144 種あるなら行は 144 本以上要る。
60 行では、どう詰めても 60 種しか語頭を作れない。141 種だった頃から成り立っていない。

行数の下限は「語頭 CV の種類数」と書き換える。 実際に生成して測ると、
拡張セット・M=8 で 173 行 / 468 モーラ（要求 474 エイリアスを過不足なく被覆）。
モーラ数のほうは元の 480 以内に収まっている——**間違っていたのは行数の見積もりだけ。**

## 撥音の連続を禁じると、辺「n ん」が覆えない

母音クラス n を持つ単位は「ん」だけ。 だから辺「n ん」は、行内で「ん」を
連続させないと覆えない。`TR-RCL-07` (c) はそれを禁じている。

**被覆が制約に優先する、と順序を付ける。** 制約は被覆を落とさない範囲で守り、
守ると覆えなくなる辺があれば、その辺を含む行に限って緩める。難読音の個数制約を
落としたのと同じ理由——覆えない辺があると、その遷移は永久に録れない。

## 母音クラス N を要求する表が、録音では埋まらない

`VOWEL_CLASSES` は presamp の体系どおり 7 種（a / i / u / e / o / n / N）を持つが、
**どの収録単位も母音クラス N を持たない。** それなのに連続音の要求表は
`VOWEL_CLASSES` を回して作っていたので、`N か` のような 144 件を要求していた。
録音では絶対に作れないので、**連続音は 100% 被覆に到達できず、書き出せる方式に入らない。**

試験では見えなかった。 `provided` を `required()` の出力から作っていたので、
要求表が自分自身を満たしてしまう。実際に録って埋める経路を通していない。

遷移の始点は、実在する単位が持つ母音クラスから作る。 a / i / u / e / o / n の6種。
`VOWEL_CLASSES` の 7 種は presamp の体系として残す——presamp.ini の `[VOWEL]` に
書き出すのはこちら（`TR-RCL-24`）。**2つは別物で、混ぜたのが原因だった。**
'''
