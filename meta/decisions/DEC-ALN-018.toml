rationale = '''
`TR-ALN-16` は、無声破裂音の分岐を適用したエントリについて「該当区間が実際に
低エネルギーの閉鎖区間であることを短時間パワーで事後検証し、一致しない場合は
分岐不一致フラグを立てて確認キューに載せる」と定めている。**実装していなかった。**
何を「低エネルギー」とみなすかが要件にも判断記録にも無かった。

k・t・p は口を一度閉じて息を止め、開いて出す音で、閉じているあいだは音がほぼ出ない。
前の母音と子音のあいだに短い無音（閉鎖）ができる。KOERU は無声破裂音のときだけ、
CVVC の VC の終わりを閉鎖の中に置き（`TR-ALN-17`）、オーバーラップを 0 にする
（`TR-ALN-16`）。どちらも「そこが無音だ」という前提の上に立っている。境界の推定が
ずれていたり、息が漏れて無音になっていなかったりすると、素材の終わりが声の途中に来る。

## 直前の母音と比べる

閉鎖の区間の短時間パワーが、直前の母音の短時間パワーより十分小さいかを見る。
マイクのゲインや声の大きさが変わっても、同じ基準で判断できる。テイクごとの
余白に頼らない。

- 閉鎖の区間は、直前の母音の終わりから、次の母音の始まりまでの前半。
  後半には破裂と気息が入る。VC の終わりもこの中点に置いている（`TR-ALN-17`）
- 直前の母音の区間は、そのモーラの母音の始まりから終わりまで
- 閉鎖の区間の RMS が、直前の母音の RMS より **20 dB 以上**低ければ通る

**20 dB は仮置き。** 実測していない（[Assumption]）。規約プリセットに置き
（`TR-ALN-23`）、実際の録音で分布を見て決め直す（`Q-ALN-004`）。

## 検証できないエントリ

**直前の母音を持たないエントリは検証しない。** 単独音の CV と、行頭の語頭形
（`- か`）がそう。比べる相手が無い。

検証しないものは、分岐不一致の印も付かないが、**確信度の対象から外しもしない。**
`TR-ALN-16` の「確信度対象外にしてよいのは、この事後検証に通った分岐だけとする」の
とおりで、これまでどおり確信度の順で確認キューに並ぶ（`TR-ALN-25`）。

## 印は確認キューの先頭へ

KOERU は推定したエントリを全件確認キューへ入れ、確信度の低い順に並べている
（`TR-ALN-25` の「確信度の閾値は絶対値で固定せず」）。分岐不一致の印が付いた
エントリは、確信度より先にキューの先頭へ並べ、画面に理由を1行出す。
印はエントリの状態ではなく推定の結果として台帳に残す——状態機械
（`align-review.fsl`）には手を入れない。

## 採らなかった案

**テイクの無音の余白と比べる**。 「無音か」を直接確かめられるが、余白には
環境の雑音や息が入ることがあり、余白が無いテイクでは測れない。

**両方を満たす**。 いちばん厳しく、確認に回るものがいちばん多くなる。
'''
