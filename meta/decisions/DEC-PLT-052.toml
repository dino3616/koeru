別々に直すと、片方だけが変わる。 `TR-SYN-12` が「カバレッジ判定と書き出しはこの定義を参照し、
同じコードパスを通る」と定めているのと同じ向きで、素材の選びも1か所にする。

## なぜ列挙を受ける1つにするか

試唱と書き出しの違いは実在する。 CVVC の語尾は、OpenUtau の presamp phonemizer が挟まないので
試唱では鳴らさないが、録った語尾は配布物の素材として入る。 下位方式への書き出しは、持ち主ではなく
深さで選ぶ。 この違いを真偽値1つに潰すと、次に違いが増えたときに真偽値が増える。
列挙の値に持たせれば、違いは1つの `match` に集まり、試験が「同じ候補になる」と
「用途が決めたところだけ違う」を固定できる。

書き出しのプロファイル（`classic` / `openutau` / `both`）は持たない。 符号化と配置を変えるだけで、
どの素材を選ぶかは変えない。 選び方を変えるものが現れたときに足す。

## 採らなかった案

### 全部の候補を返し、それぞれが絞る

resolver は単純になる。 採らなかった理由は、絞り方が各所に散ること。 試唱が「5値があるもの」を、
書き出しが「持ち主のもの」を、別々に書けば、今回の食い違いがそのまま再発する。
候補に理由を付けて返すことと、理由で絞るのを呼び出し側に任せることは別。 この判断は
前者だけを採る。

### resolver を2つに分けて部品を共有する

共有した部品の上で、同じ事実を別々に解釈する余地が残る。 試験で「同じ候補になる」を固定しにくく、
片方だけが規則を足す経路が開く。

## 最大の欠点

用途を足すたびに `UseContext` と resolver の `match` が育つ。 用途が増えて分岐が絡むと、
1つの関数が読めなくなる。 見直しの条件に置いた。

## 範囲

選びを1か所にしたもの: 試唱が鳴らす素材、書き出しが配る素材と被覆、下位方式の選びと容量の概算。
テイク単体を聴く入口（`Studio::render_take`）は、綴りではなくテイクを引き数に取るので通していない。
曲の状態（歌えるか）が使う被覆の読みは、解決の被覆と同じ定義で、試験で一致を固定した。
'''
