rationale = '''
関係者に KOERU を提案する資料が要る（GTM 計画の §7）。 資料は書き出した
HTML と PDF だけが渡り、リポジトリの外で一人歩きする。 だから資料の中に
`docs/` や `meta/` への出典や ID を書かず、資料だけで読み切れるようにする。

## dek を採った理由

**台本（`script.md`）が正本で、スライドはそこから派生する。** 喋る内容と
ト書きが1つのファイルに揃い、順序と持ち時間を台本で決められる。
Slidev と Marp も Markdown から始まるが、1ファイルに全枚の見た目まで書くので、
台本と見た目が同じ行に混ざる。

**描画を測って、機械可読な診断で返す。** はみ出し・コントラスト・欠けた画像を
`dek lint --visual` が返す。エージェントは自分の描いた枚を見られないので、
これが無いと直せない。 1枚が 40 行ほどの HTML 1つなので、差分も読める。

手書きの HTML は、この計測と台本の分離を自分で作ることになる。

## 置き場所と調達

リポジトリ直下の `talks/` を dek のプロジェクトにする。 `docs/` は常に現在を語る
リファレンスで（禁止事項7）、日付と持ち時間を持つ発表とは性質が違う。

bun と Playwright のブラウザは devShell が出す（`DEC-PLT-033`）。 Playwright の版は
`crates/koeru-app/ui` と同じく nixpkgs に揃え、CI が突き合わせる。 Linux には和文の
書体が無く、はみ出しの計測が macOS と食い違うので、devShell が Noto CJK を
fontconfig に渡す。

**dek は tag も release も持たないので、commit の SHA で固定する。** Renovate は
40 桁の SHA を digest として追える。上流は日に何度も動くので週1に絞り、CI が
通れば入れる。

`dek ref` が取ってくる他人のデッキは `talks/refs/` に置かれ、gitignore される。
中の ID らしい文字列は KOERU のものではないので、`refs` を走査から外した。

## 何をコミットするか

台本・スライド・テーマに加えて、書き出した HTML と PDF をコミットする。 資料だけを
受け取った人が、組み立てずに読めるようにするため。 HTML は CI が作り直して
突き合わせる。PDF は書体と生成日時が環境で変わるので突き合わせない——
`bun run build` が HTML と PDF を一度に出すので、手元で書き出せば揃う。

**公開はしない。** リポジトリは公開なので資料は誰でも読めるが、Pages のような
入口は作らない。 渡す相手と時期は GTM 計画の接触方針が決める。

## ライセンス

dek は MIT。 開発にしか使わず、配布物（KOERU のアプリ）に入らない。
'''
