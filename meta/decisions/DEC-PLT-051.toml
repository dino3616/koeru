rationale = '''
`DEC-PLT-047` は、背後の計算を同じプロセスの作業スレッドで走らせ、lane の既定を前景と背景の
2本とした。その §4 が書いた lane の分け方（試唱の要求を前景に置く）だけを、この判断が
置き換える。`DEC-PLT-047` の `selected`（同じプロセスの作業スレッドで走らせ、計算は closure で
受け取る）は変えない。そのため `DEC-PLT-047` は書き換えず、`affects_decisions` で結ぶ。

## 1. なぜ前景の lane に試唱を置けないか

試唱の流し込みは、曲の長さの間ずっと走る仕事になる。先頭のフレーズを鳴らしはじめたあと、
残りを合成して流し口へ継ぎ足し続け、流し口が満杯なら空くまで待つ。前景の lane は作業スレッドが
1本で、録音直後の前処理（テイクの確定の応答が待つ解析）も同じ lane にあった。試唱が走って
いる間、解析は走れない。待っている人（確定の応答を待つ人）を、待っていない仕事（流し続ける
試唱）が待たせる。

## 2. 何が変わるか

`TR-SYN-34` の「録音直後の前処理 > 試唱の要求 > 全件再推定 > チャート事前計算」という順番が
意味を持つのは、**同じ lane の中だけ**になる。lane どうしは並んで走る。これは待っている人を
より待たせない向きの変更で、順番の並びそのもの（`Priority`）は変えていない。

- 前景と試唱は、互いを待たない。解析が長くても試唱は鳴りはじめ、試唱が流している間も解析は終わる
- 試唱と背景は、以前から別の lane で、互いを待たない。ここは変わらない

## 3. 試唱の仕事の扱い

- **期限は付けない。** 曲の長さの間ずっと走り、流し口の空きを待つ時間も含めて長い。期限を付けると、
  正常に流している最中の仕事が「固まった」と見なされ、代わりの作業スレッドが立つ。止めるのは
  取り消し（`TR-SYN-27`）だけ
- **取消の合図をフレーズごとに見る。** 停止・曲の切り替え・次の録音の開始で取り消すと、仕事は
  次のフレーズの手前で抜ける。流し口を待っている間は、流し口が閉じられると待ちを抜ける。
  中断したフレーズの部分結果は、キャッシュへ書かない
- **新しい試唱は古い試唱を取り消してから積む。** 待ちにいる古い試唱は `OverflowPolicy::Coalesce`
  で新しい試唱に置き換わる
- **結果は台帳へ書かない。** キャッシュはメモリで、計算が済んだら何も書かずに公開して仕事を終わらせる
- 上限（待てる数・申告バイト数）は、他の lane と同じく**仮の値**で、根拠が無い（`Q-PLT-006`）。
  申告するのは、仕事が抱えて流す先頭フレーズの大きさ

## 採らなかった案

### (b) 前景の lane の作業スレッドを2本にする

試唱と解析が別のスレッドで走るので、一見は足りる。採らなかった理由は2つ。

- lane の作業スレッドは、重いエンジンの状態を複製しないために1本にしてある
  （`DEC-PLT-047`）。前景の2本は、解析の側のエンジンの状態も複製の対象にする
- 優先度は同じ lane の中でしか効かないので、前景に試唱が2本重なれば結局2本とも塞がり、解析は
  止まる。新しい試唱を取り消してから積むと、古い試唱の作業スレッドが抜けるまでの間は2本が
  塞がりうる

### (c) 試唱だけ JobRuntime の外に、専用のスレッドで残す

今のコード（`std::thread::spawn`）の形。解析との競合は起きない。採らなかった理由は、取消・観測・上限が
`JobRuntime` の外と中に分かれること。待ち数（`TR-SYN-33`）・貸与ごとの取消（project を移る・閉じる）・
状態の記録を、試唱だけ別に持つことになる。専用のスレッドは上限が無く、試唱を押し続けると
スレッドが積もる。`JobRuntime` は、取消・観測・上限を1か所で持つために作った。

## 最大の欠点

試唱の合成と解析が、同時に CPU を使う。作業スレッドが1本増え、コア数の少ない機械では、並んで走る
ぶん互いを遅くしうる。録音入力は別スレッドで、アロケータとロックを使わない設計だが（`TR-SYN-34`）、
CPU が足りなければ録音のコールバックを妨げる。この負荷を測った記録は無い。測るまでは、
見直しの条件に置いてある。
'''
