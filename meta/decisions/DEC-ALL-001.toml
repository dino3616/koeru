rationale = '''
**モデル側の表示ライセンスが、学習コーパスの条件を上書きできるとは限らない。**
コードが MIT でも、配布されている重みの再配布許諾が別に必要になる。
SOFA と HubertFA は配布 ckpt の条項が示されておらず、HubertFA は release ノートが
