再配布できないモデルは実行時取得でも回避できない。**

narabas は許諾自体は MIT で明確だが、200MB 超という帯域と ReazonSpeech という
学習コーパスの条件の両方が引っかかる。**サイズだけなら量子化で逃げられるが、
コーパスの条件は逃げられない。**
'''
