rationale = '''
**綴りを選ぶ段と素材を選ぶ段が、別の集合を見ていた。**

綴りは全部の収録音高の和集合で選び、素材はそのノートが使える区画
（floor とそれより下、`TR-RCL-20`）から引いていた。G3 と D4 の2音階で、
D4 だけ録り終えた連続音を A3 の「か」で歌わせると、

1. 綴りを選ぶ段は「`a か` はどこか（D4）にある」ので `a か` に決める
2. 素材を選ぶ段では、A3 のノートは G3 以下しか使えない。G3 に `a か` は無い
3. 素材が見つからず、**このノートは黙って鳴らない。** G3 に代用の `か` があっても使わない
4. 曲の状態も和集合で数えるので、この曲は「完全」と出る

`TR-RCL-20` は判定・書き出し・試唱が同じ道を通ることを求めている。
表示と音が食い違うのは要件違反なので、ノートごとに「そのノートが使える区画」だけで
綴りを選ぶところまでは判断が要らない。

## 決めたのは、2種類の代用のどちらを先に試すか

E4 の「か」で、floor は D4。D4 には代用の `か` しかなく、G3 には本来の
`a か` があるとき、

- **高さを守る**なら D4 の `か`。高さは近く、前の音からのつながりが粗くなる
- **綴りを守る**なら G3 の `a か`。つながりは滑らかで、G3 の素材を 9 半音引き上げる

高さを守る。 **OpenUtau と同じ順**だから。OpenUtau は、そのノートの音高を
含む区画の中で綴りの候補を順に試し（`ClassicSinger.TryGetMappedOto` が
区画の接頭辞・接尾辞を付けて引く）、下の区画へは降りない。配布した先で鳴る音と、
KOERU の中で聴く音が近くなる。下の区画へ降りるのは KOERU が足した動き
（`TR-RCL-20`）で、区画の中で候補が尽きたときだけにする。

## 解決の順

ノートごとに、floor の区画で `TR-SYN-12` の候補を先頭から全部試す。
尽きたら1つ下の区画で同じ候補を試す。最低音高まで尽きたら欠損。

CVVC の渡り（VC）は、その尾に乗る直前のノートの区画から同じ順で引く。
どこにも無ければ挟まない（`TR-SYN-12`）。

## 曲の3段階（`TR-RCL-19`）

- **完全**: 全ノートが floor の区画で第一候補に解決し、CVVC の渡りも
  floor の区画にある。必要単位は（綴り, floor の収録音高）の組で数える（`TR-RCL-15`）
- **代替あり**: 完全ではないが、全ノートが上の順で解決する。下の区画で鳴るノートも
  ここに入る（`TR-RCL-20` の「解決した単位は台帳上『代替』として記録し
  収録済みと区別する」）
- **不可**: 解決しないノートがある、または音域外（`TR-RCL-22`）

単音階は区画が1つなので、これまでと同じ結果になる。

## 採らなかった案

**綴りを守る**。 つながりは滑らかになるが、配布した先（OpenUtau）では
この選び方をしないので、KOERU の中で聴いた音と受け取った人が聴く音が
ずれる。低い素材を大きく引き上げることにもなる。
'''
