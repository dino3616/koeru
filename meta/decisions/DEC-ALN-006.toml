schema = 'decision'
id = 'DEC-ALN-006'
constraint_label = '単独音の境界検出'
constraint = '確信度の成分を、経路が変わっても同じ定義で出せること'
title = '単独音も Julius を一次経路とし、いまのヒューリスティックは退避に置く'
status = 'accepted'
owner = 'dino3616'
options = [
  'Julius を一次、koeru-synth の segment を退避に',
  'segment のヒューリスティックを単独音の一次に確定する',
  '両方を実装し、評価ハーネスの比較で決める',
]
selected = 'Julius を一次、koeru-synth の segment を退避に'
rationale = '''
**いま `crates/koeru-synth/src/segment.rs` にあるのは、音響モデルを使わない
短時間パワー＋ゼロ交差率のヒューリスティックである。** M2 の試唱が oto を要るために
先に書いたもので、TR-ALN-11 の3工程（トリミングとオンセット検出 / 子音から母音への境界 /
母音の定常区間終端）には対応しているが、統計的なアライメントを通っていない。

このままでは要件4件が満たせない。

- TR-ALN-03 は「いずれの実装も emission 行列（フレーム×音素の事後確率）を
  呼び出し側に返し、TR-ALN-24 の確信度計算に使えること」を要求する。返せない
- TR-ALN-24 (1) 経路確信度が存在しない。実装の3成分は (1) を落としており、
  TR-ALN-24 の [Fact]（単独音で落ちるのは (3) のグリッド由来の項）と対応が合わない
- TR-ALN-24 (2) 境界鋭さは「境界周辺の事後確率の集中度と次善解とのスコア差」と
  定義されているが、実装は境界前後のパワー比を使っている
- TR-ALN-06 のサブフレーム補間は「境界近傍のフレーム事後確率」を前提にしている
- TR-ALN-26 (4) の次善候補3件とそのスコアは、ヒューリスティックからは出てこない

要件を4件書き換えるより、経路を1つに寄せる。 DEC-ALN-001 と TR-ALN-04 は
Julius を一次経路と定めており、その字面をそのまま通す。

退避経路として残す。 消さない理由は2つ。(1) Julius のモデルが配布できないと
判明した場合（DEC-ALN-004 の review_trigger）に、単独音だけは即座に鳴らせる経路が要る。
(2) M2 の試唱が既にこの経路の上で動いており、Julius の統合が終わるまで試唱を止めない。

両方を評価ハーネスで比較する案は、ハーネスを M6 へ回した時点で成立しない
（DEC-ALN-007）。
'''
