selected = '一度録った綴りは読ませない。重なりは先に録った行が持つ'
rationale = '''
`DEC-ALN-017` は綴りの持ち主を「台帳に先に入った行」に決めていた。
**詰め直した行（`DEC-RCL-011`）がそれで丸ごと止まっていた。**

フルリストは作った時点で全部台帳に入る。 詰め直した行はそのあとに足されるので、
`さ` を作れる行がフルリストの「さしすせそ」と曲の「さくら…」の2本になると、
持ち主は必ずフルリストのほう。**詰め直した行は綴りを1つも持たず、録っても
原音設定は1つもできず、曲の被覆も進まない。**

## 2本できるのはシステムの都合

同じ綴りを作れる行が同じ音高に2本並ぶ理由は2つあった。

1. **詰め直し。** フルリストに手を付けず、曲のための行を上に足すだけなので、
   両方に同じ綴りが入る。曲の行を録り終えても、フルリストの「さしすせそ」は
   録る行として残り、`さ` をもう一度読ませる。逆に、フルリストで録ってから
   詰め直すと、録ってある `さ` も曲の行に入れて作る
2. **連続音の行頭。** 行は無音から読み始めるので、行の最初の音は必ず語頭形になる。
   行の数が語頭形の種類より多いので、同じ語頭形が何度か出る（`Core` で
   `- い` `- え` `- ん`）。他の音を録るために読む行の「ついで」で、
   そのために読ませているわけではない

1 は同じ声を二度録らせている。本人から見れば、曲のために録った素材を
もう一度録る理由は無い。

## 一度録った綴りは読ませない

- **詰め直すとき**、その音高で録ってある綴りを除いてから行を作る
- **片方の出どころの行を録ったら、もう片方の出どころの未収録の行を組み直す。**
  出どころはフルリストと詰め直しの2つ（`TR-RCL-18` (g)）。組み直す範囲は、
  その出どころのまだ1回も録っていない行が作る綴りのうち、まだ録っていないもの。
  行は詰め直しと同じ生成器（選んだ綴りだけを覆う行を作る）で作る
- **録っている側は組み直さない。** 本人が読み進めている並びが、読むたびに
  足元で変わる。同じ出どころの中では綴りはほぼ重ならない（重なるのは 2 だけ）
- **録った行は消さない。** 組み直すのは、テイクを1本も持たない行だけ
  （`INV-REC-003` の「未収録の項目は、確定したテイクも無効テイクも持たない」
  状態の行で、消しても失われるものが無い）

同じプリセットからいつも同じリストが出る（`TR-RCL-27`）は、
「プリセットと選択と録った綴りが同じなら、同じリストが出る」へ広がる。
`DEC-RCL-011` で「プリセットと選択」に広げた先の一歩。

提示順（`TR-SYN-19`）は台帳の未収録の行から作る。 プリセットから生成し直した
リストを並べると、組み直した行も詰め直した行も並ばない。

## 重なりは先に録った行が持つ

2 の避けられない重なりと、組み直す前に録られた重なりは、**先に録った行が持つ。**
持ち主は録った時点で決まり、あとから別の行を録っても入れ替わらない。確認済みの
5値と手で直した値が、本人の知らないうちに別の素材へ移らない。

先に録った行のテイクが無効になった（取りこぼし、`TR-REC-07`）ときは、
同じ綴りを作れる録り済みの行へ移る。無効のテイクは素材として使えない。

**同一性は（収録音高, 綴り）のまま。** `DEC-ALN-017` が決めた、確認キューと
台帳の鍵の形は変えない。変えるのは、同じ音高の中で誰がその綴りを持つかの決め方だけ。

`row_aliases` は「その行を歌うと何が録れるか」を全部持ち、持ち主は台帳の
テイクから導く。 台帳に持ち主の欄を足すと、テイクを無効にするたびに
書き換えることになり、書き換え忘れた欄が別の行を指す。

## 採らなかった案

**台帳は組み直さず、持ち主だけを先に録った行にする**。 詰め直した行は動くように
なるが、同じ声を二度読ませる形は残る。

**あとで録った行に移す**。 前の録音の確認済みの値と手直しが使われなくなり、
確認し直しになる。

**フルリストの行を優先する**。 フルリストを録った時点で、詰め直した行で
確認済みだった値が確認し直しになる。
