rationale = '''
`DEC-PKG-007` が残した論点。 表示名は日本語も絵文字も通るのに、生成する
フォルダ名は ASCII 固定（`DEC-PKG-004`）なので、両者は原理的に一致しない。

表示名から機械的に導く案を採らなかったのは、日本語名の音源がほぼ全て同じ既定名に
落ちるから。 非 ASCII を落とすと「こえるちゃん」も「ゆめみさん」も残る字が無く、
受け手のフォルダ名が意味を持たなくなる。ローマ字化は読みの辞書を抱えることになり、
`TR-RCL-02`（第三者の配布物を同梱しない）と同じ問題に触れる。

作成時に両方決めさせる案は、最初の画面を重くする。 `TR-PKG-35` は「公開」「配布」
「作者」を通常モードの必須ステップにしないことを求めていて、配布名はその側にある。
非公開のまま完成する人は、配布名を一度も決めずに終わってよい。

既定値は表示名から作り、残らなければ `voice`。 空欄から始めさせない。
そのうえで本人が読める名前に直せる。
'''
