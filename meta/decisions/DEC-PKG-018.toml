selected = '名前を付けた配布物を残し、配布物ごとに版を数える'
rationale = '''
## 何が足りなかったか

今の配布は音源に1つで、設定も版も1本しかない（`DistributionSettings`）。 同じ音源から
「すべて」「多音階 Normal」「単独音 A3」のように形を変えて出すには、出すたびに入れる枠と
フォルダ名と版を付け直すことになる。 GAKUYA も同じで、設定が残らないので配り直すたびに
全部のタブを確かめ直す（P4h の調べ）。

## 配布物を主語にする

Unity の Build Profiles、Godot の Export presets、itch.io の channel は、どれも「何を入れて
どう作るか」に名前を付けて残し、同じ名前でもう一度出す。 itch.io の channel は1つの
ダウンロードで、push するたびに同じ枠の新しい版になる。 KOERU はこの形を採る
（`TR-PKG-58`）。

- 既定は、すべての枠を入れた「すべて」が1つ。 増やさない人の画面は今と同じ
- 1つの配布物は1つの ZIP。 版は配布物ごとに数える（`TR-PKG-60`）
- 配布物が持つのは、入れる枠・名前・フォルダ名・利用規約の上書き。 画像・名義・声の提供者・
  web・サンプル音声は音源で1つ（Unity が共通の設定と profile だけの設定を分けるのと同じ）。
  受け取った人の画面に出る「何者か」は、どの配布物でも同じでなければならない
- 増やすときは、いまの配布物を写して足す。 白紙から作らせない

## 版は設定を持たない

版ごとに設定を写して持つ案（キャンバスの `DistributionVersion` が近い）は採らない。
何を入れるかを配布物と版の2か所が持つと、どちらを直したのかを本人が追えなくなる。
版は番号と書き出しの記録だけを持つ。 そのため、ボード（S10-Versions）にある「版の複製」は
置かない。 別の形で出したいなら配布物を写す。

下書きの版は高々1つで、番号は前の版の末尾を1つ上げて出しておく（Lightroom の
「Export With Previous」と同じく、もう一度は1手で済む）。

## 「上書きして書き出す」は前の ZIP を消さない

ボードは書き出し済みの版に「上書きして書き出す」を置いている。 これは同じ番号で
記録を1件足すことと読む。 `TR-PKG-44` が過去の ZIP を上書きさせず、記録を不変に
しているので、前の ZIP は残る。 書き出し済みの版は消せない。 消せるのは下書きだけ。
画面の文言は「上書き」がファイルを消すと約束しないものにする（刷新の R47b）。

## 担当音域は配布物の書き出しに限って直せる

「多音階 Normal」のように枠を外すと、外した枠が受け持っていた高さが空く。 P4h はこれを
その場で、境目をつまんで埋められるとした。 直した範囲はその配布物の書き出しにだけ効き、
枠の担当音域（`TR-RCL-31`）は変えない（`TR-PKG-59`）。

これで、その配布物の ZIP は KOERU の試唱と違う枠で鳴りうる。 `TR-RCL-31` の
「判定・代用・試唱・書き出しは同じ範囲を読む」に例外を1つ足した。 それでも採るのは、
配布物を作るたびに枠の担当音域を書き換えさせると、「すべて」の書き出しまで変わるから。
空きは事実として出すだけで、埋めなくても書き出せる。

## 書き出したあとの行

配布物ごとに、最後に書き出したあとで採用が変わった行の数を出す（`TR-PKG-61`）。 進捗にも
完成にも入れない（`TR-PKG-34`、`TR-PKG-35`）。 書き出しを促す印ではなく、渡した ZIP と
いまの音源がどれだけ違うかの事実。

## 決めていないこと

- 声色の接尾辞と、音源ルートの `prefix.map` に入れる声色（`Q-PKG-004`）
- 同じ配布物の中で範囲が重なる・隙間があるときにどの枠が歌うか（`Q-RCL-005`）

## 運び方

SDL は `distribution.graphql` に先に書いた。 `DistributionSettings` の `distributionName` と
`version` は配布物ごとの値へ移したので非推奨にした（`DEC-PLT-035` の改名の手順）。 運ぶのは
刷新のあいだ tauri-specta（`DEC-PLT-061`）。 配布物が1つのとき（刷新の P0）は今の
`package_settings` のままで作れる。

## 変えた条文

- `TR-PKG-44`: 記録がどの配布物の書き出しかを持ち、版を配布物ごとに数えることを足した
- `TR-RCL-31`: 配布物がその書き出しに限って範囲を上書きする例外を足した
'''
