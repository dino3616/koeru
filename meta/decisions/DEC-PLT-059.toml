schema = 'decision'
id = 'DEC-PLT-059'
title = 'CI は macOS を1枠に畳み、書いていない OS の席は macOS では組み立てだけを見る。 Rust のキャッシュは main だけが保存し、警告は build.warnings で落とす'
status = 'accepted'
owner = 'dino3616'
options = [
  'macOS の2ジョブ（native の試験と、clippy ＋ unsupported の試験）をそのまま残す',
  'macOS を1ジョブに畳み、clippy は native と unsupported の両方を見て、試験は native だけ走らせる',
  'macOS の検査を main への push だけにする',
  '変更の無いパスの検査を飛ばす',
