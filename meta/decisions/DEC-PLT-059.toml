  'リポジトリを Organization へ移し、マージキューや外部のランナーが使えるようになったとき',
  'macOS で書いていない OS の席だけを壊す欠陥が、組み立て以外で見つかったとき。 macOS × unsupported の試験を戻す',
  'macOS で試験の実行が組み立てより長くなったとき。 試験 binary の並列実行を見直す',
]
