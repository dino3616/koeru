rationale = '''
`TR-RCL-01` はプリセットを「方式 × モーラ長 × 音階数 × 音素インベントリ」と
定義していた。その読みで4つを並べていた。

| | 単独音 | 連続音 | CVVC |
|---|---|---|---|
| 単音階 | `single` | `sequential` | `cvvc` |
| 多音階 | 無い | `multi-pitch-sequential` | 無い |

**6通りのうち4つしか無く、その4つを選んだ根拠が無い。** 多音階を連続音にだけ
付けたのは「多音階といえば連続音だろう」でしかなく、条文にも判断記録にも
そう書いてある箇所は無い。

## 6つに揃えても足りない

揃えれば穴は埋まるが、**本数と音高がこちらの決め打ちのまま残る。**
`multi-pitch-*` が意味するのは「3本、G3 / D4 / A4」だけで、2本にすることも、
C3 と A4 だけにすることもできない。

本人の声域はこちらには分からない。 `TR-RCL-06` の推奨値は実務上の目安で、
出せる音域は人によって違う。決め打ちは、出せない音高を要求することになる。

## 音高はリストを変えない

多音階は同じリストを音高の数だけ録る（`TR-RCL-26`）。 **だから音高は
録音リストの生成に1文字も効かない。** 効くのは所要時間（本数に比例）と、
音高ごとのディレクトリ・行集合だけ。

プリセットに混ぜる理由が無い。 混ぜていたせいで、`MethodPreset` が
`tones: Vec<i32>` を持ち、`is_multi_pitch()` という導出まで生えていた。

## 選ばせるが、咎めない

弾くのは鳴らせないものだけ——0 本、`prefix.map` が覆う範囲（C1〜B7）の外、重複。
間隔では弾かないし警告もしない（`TR-RCL-06`、閾値の根拠が無い）。

推奨は出す。 84 個の選択肢の前で手が止まるので、「1本で始める」「女声の目安」
「男声の目安」を出発点として置く。押せば入るが、そこから足しても外してもよい。

## 引き受けるもの

**録る量の割に得るものが少ない構成を止めない。** 2 半音差を 3 本選べば、
録る量は 3 倍で被覆はほとんど広がらない。止める根拠を持っていないので、
本数が所要時間に比例することを画面に1行で書くにとどめる。
'''
