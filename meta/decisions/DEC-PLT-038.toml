rationale = '''
## 今の形で起きていること（`EVID-PLT-004`）

エラー型は 31 個あり、どれも種別文字列（`kind()`）を持つ。 境界の `AppError` は
それを `{kind, message}` に畳む。3つが足りない。

- **確定したかどうかが消える。** `finish_take` は DB にテイクを確定したあと、解析・周波数表・
  アライメント・oto を続ける。そのどれかが失敗するとコマンド全体が失敗を返す。
  保存済みの録音が「録れなかった」と見え、やり直すと二重に録る
- **次の手が型に無い。** 画面は `kind` で一度も分岐しておらず、表示文を出すだけ。
  「入力を直す」「待つ」「同じ操作をもう一度」「容量を空ける」を区別できない
- **source が捨てられる。** 畳むときに下位のエラーの連鎖を文字列にして捨てている

加えて、`#[instrument(err)]` が約 150 箇所あり、同じ失敗を呼び出しの段ごとに
表示文つきで記録している。表示文には利用者の入力が差し込まれる箇所がある。

## 分類

分類は「呼び出し側が次に何をするか」で決める。 crate の名前では分けない。

| 分類 | 次の手 | 確定の状態 |
|---|---|---|
| 入力が不正 | 入力を直す。自動で再試行しない | 始まっていない |
| 状態として受けられない | 足りない条件を示し、操作を選ばせる | 確定していない |
| 古い・衝突 | 最新を読み直す。古い要求を自動で当てない | 確定していない |
| 取り消した | 正常な終わりとして見せる | 公開していない |
| 取消が遅かった | 受領証を見せる。戻すなら新しい操作で | 確定済み |
| 混んでいる | 待つ・まとめる・明示して再試行 | 意図による |
| デバイスが使えない | 選び直す・許可する・つなぎ直す。無音を録音として扱わない | 収録の状態を併記 |
| 一時的な IO | 同じ操作の状態を照合してから再試行 | 確定していない / 不明 |
| 容量・権限 | 容量や権限を直す。確定済みの資産と受領証は守る | 段を併記 |
| 壊れている | 隔離・読み取り専用・回復。自動で正常化しない | 回復が要る |
| この環境では使えない | 使える能力だけ使う。無限に再試行しない | 始まっていない |
| 外部エンジンの失敗 | 派生物を作り直すか縮退する。元のデータは残す | 部分的に成功しうる |
| 内部の不変条件の破れ | 持ち主を止め、診断を残す | 継続できる範囲を限る |

分類・確定の状態・次の手の語彙は葉の crate `koeru-failure` が持つ（`DEC-PLT-034`）。
各エラー型は自分の変種ごとに分類を返し、`match` の網羅性で書き忘れを落とす。
境界の対応表で code から分類を引く形は採らない。 変種を足しても、型が分類の
書き忘れを教えなくなる。

**再試行してよいかの真偽値1つでは足りない。** 確定の状態（始まっていない / 確定していない /
確定済み / 不明）と、同じ操作での再試行の可否と、利用者の次の手を別々に持つ。
不明はまず受領証の照会と回復で解く。新しい収録を作って解かない。

## 予期できる結果は失敗にしない

`rust-conventions` の「失敗ではないものをエラーにしない」を境界まで伸ばす。
テイクの確定は解析が保留・失敗でも「確定した」で、解析の状態は値として返す。
衝突・拒否・取消の遅れも、呼び出し側が分岐する値として返す。 GraphQL では
payload / union で表し、`errors[]` は不正な文書・resolver の欠陥・想定外の
不変条件の破れだけにする（`DEC-PLT-035`）。 null の伝播を状態機械の代わりにしない。

## 伝え方

1. model は型つきの拒否と検査の結果を返す。 編集の数値の下書きのように、不正でも
   受け取れる文書は「文書 ＋ 違反」として受け取る
2. native・FS・DB の adapter は、型つきの source と操作・段を保つ
3. application の持ち主が文脈（確定したか、対象がまだ有効か、縮退できるか）を付け、
   公開する失敗と内部の診断を分ける
4. GraphQL adapter は予期できる結果を payload に写し、想定外だけを `errors[]` にする
5. 画面は code と分類で分岐する。表示文を解析しない

code は `recording.not_enough_space` のような点区切りの固定文字列で、型をまたいで
一意にする。 今は同じ code を複数の型が名乗っている（`ledger.*`、`preset.*`、
`resample.zero_rate`）。code を変えることは契約の変更として扱う。

## 利用者に見せる文言は Rust に置く

多言語は範囲外（`DEC-PLT-008`）なので、文言を失敗の定義の隣に置く利点を採る。
エラー型の `Display` は固定の文で、**利用者のデータ（パス・音源名・歌詞・綴り・入力値）を
差し込まない。** 数や段のように安全な値は型つきの欄で持つ。これは試験で強制する。
外部の consumer は code・分類・次の手・確定の状態で処理し、日本語の文を解析しない。

## 失敗の記録

`#[instrument(err)]` は使わない。 結果を決める持ち主が、1回だけ型つきの event で出す。
載せるのは code・分類・確定の状態・段だけ。source の連鎖は同じ端末の診断にだけ残し、
通常のトレースにも送信層にも載せない（`DEC-PLT-009`、`DEC-TEL-001`）。
span は工程の単位で引き続き切る。落ちた場所は、code と段と span の文脈で追う。

ドメイン層で `anyhow::Error` を返さない規律は変えない。 境界でも使っていない
（宣言だけ残っている）ので、依存から外す。
'''
