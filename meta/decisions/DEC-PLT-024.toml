selected = '面をオブジェクトで切る（収録項目 / 曲 / 配布パッケージ / 設定）'
rationale = '''
**工程で面を切ると、分断を製品の内側で再現することになる。** 既存ツールは録音・原音設定・
歌わせるが別のアプリで、工程間を渡るのはファイル名の一致だけだった（`EVID-UX-002`）。
タブの名前を工程にすると、対象の同一性は保たれても「3つの段階を通過する」という
読み方が残る。面はオブジェクトで切り、工程は面の中の作業として現れるようにする。

**原音設定に独立した面を与えない。** テイクを開けばそこにある。工程としての
「原音設定をする」がナビゲーションの単位から消える。

詳細の主語はテイクにする。 収録は行、原音設定はエイリアス、進捗はエイリアスの被覆
（`TR-RCL-19`）と、3つの面が違う単位で同じ音源を語る。テイクを主語に置くと、
波形1枚の上にエイリアスの境界が並び、境界どうしの関係が同じ絵の中に入る。
エイリアス間の移動とテイク間の移動が2軸に分かれ、`TR-EDT-14` の移動応答時間が効く形になる。
実装のデータもこの形（oto はテイクにぶら下がる）。**代償は、テイクが世代を持つので
「どの世代を見ているか」が常につきまとうこと。**

音高は第一級の軸にする。 カバレッジは音高ごとに独立管理して表示は最小値（`TR-RCL-26`）、
収録は音高ごとのサブディレクトリ（`TR-REC-36`）、oto も音階単位で独立（`TR-ALN-22`）。
一方で音階を跨いだ横断編集（`TR-EDT-32`）と複製（`TR-EDT-35`）が要る。**単一の階層木では
表せない。** 音源の面に切り替え器を常設し、単独音1音階のときは隠す。

**準備は音源の設定であって、収録画面の一部ではない。** 入力デバイスは音源に固定し
（`TR-REC-03`）、ゲインも音源の期間中固定する（`TR-REC-15`）。設定である以上、
置き場所は音源の設定面になる。収録面に残すのは「いま何で録っているか」の1行だけ。
現行は画面の上半分を準備が占めていて（`EVID-UX-001`）、毎回同じ場所にある。
**一度で済むものを、毎回同じ大きさで置かない。**

確認待ちは面ではなく絞り込みにする。 確認状態は境界に付き（`TR-EDT-02`）、選別は
件数上限で決まる（`TR-EDT-07`）。収録項目のコレクションの絞り込み軸として置けば、
一覧と確認作業が同じ面になる。vLabeler が Done / Star / Tag でフィルタする形と同じ
（`EVID-UX-002`）。

収録セッションと自動スナップショットは画面に出さない。 復元のために持つが
（`TR-REC-30`、`TR-PKG-43`）、本人が名指しして操作する対象にはしない。
'''
