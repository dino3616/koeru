## 再生：単一の出力枠（`PlaybackLease`）

`Studio` は再生を3つの `Option` で別々に持っていた（`playback` / `singing` /
`playback_stream`）。 音高提示・基準音・試唱・テイクの再生・曲の試唱はどれも
同じ出力デバイスを鳴らすので、実態は「同時に1つしか鳴らない」はずが、型では
表現されていなかった。 `sing_song` は `stop_preview` を先に呼ぶ規律で辻褄を
合わせていたが、`play_pitch` / `play_tone_reference` / `preview` / `play_take` の
どれも、曲の試唱（`singing` / `playback_stream`）を止めずに単発の再生を差し込める
経路が残っていた——重ねて鳴らせてしまうと、回り込みの検査（`play_and_capture`）が
曲の音を拾って歪む。

2つ目の案（今までの形のまま）は、呼び出し箇所が増えるたびに3つを手で揃える負担が
そのまま残る。 `CaptureLease` で一度「型に順序を持たせる」と決めた（`T06c`）のと
矛盾する。 1つ目を選び、`crate::playback_lease::PlaybackLease` へ集約した。
曲の試唱を止める順序（合図 → 再生 → 合成の待ち合わせ）は `crate::capture_lease::DropFirst`
（Pump → Capture の骨格と同じ型）を再利用して型で保証する。

## デバイス消失：検知して状態を保つだけ

`TR-REC-04` の「選択済みデバイスが録音中に消失したら進行中テイクを不完全として
マークして破棄し収録を停止する」を実装する（`REQ-REC-109` が形式化）。
画面へ通知する経路（Subscription）は
`T12` の担当で、今回は Tauri の Channel を新設しない（`DEC-PLT-036`）。
`Studio` 側の状態を正しく持つところまでを T06d の範囲とする。

3つ目の案（無傷のまま残し、確定時に無効化）は、`TR-REC-31` の「カバレッジの
単一の真実は SQLite」という前提と衝突する——確定していない予定がいつまでも
`open` のまま残ると、次にその行を録ろうとしたときに予定が競合する
（`start_take_for` は既知の行でしか始めず、`recording.is_some()` を先に断る）。
4つ目（その場で破棄）を選んだ。

破棄の手順は、`Studio::disarm` が既に持っていた事実——排出スレッド（`Pump`）は
止められると書きかけの WAV を確定させる——を利用する。 順序は
「ストリームを落とす（`.wav.part` が確定する）→ 台帳の予定を `Discarded` で閉じる
→ 確定したファイルを削除する」。 台帳を先に閉じるのは、ファイルを先に消すと
「ファイルが無いのに予定が開いたまま残る」窓ができるため。

**これは孤児の自動削除ではない。** `TR-REC-31` が禁じているのは、起動時の整合性
検証（`koeru_core::capture::verify`）が台帳に載っていない確定済み WAV を見て回る
ときに、本人の判断を経ずに削除・採用することである。 ここで消すのは、
`Studio` 自身がこの瞬間に「進行中テイクは続けられない」と決めた録音で、
台帳の予定は同じ手続きの中で明示的に `Discarded` として閉じている——
持ち主が居ない孤児ではない。 混同しないよう、コード側にも同じ理由を残す。

## 復帰：同一識別子なら自動で再オープン、録音は自動で始めない

`TR-REC-04` の「復帰後の再開は同一識別子のデバイスが戻ったときのみ自動で
許可する」と「本人が明示的に別のデバイスを選び直した場合は、そのデバイスで
収録を再開できる。自動では起きず、本人が選べば起きる」の両方を実装する
（`REQ-REC-109` が形式化）。

5つ目の案（本人の操作を待つ）は、この要求のうち「自動で許可する」側を
満たさない。 6つ目を選び、同一識別子が生きているのを見つけたら、既存の
`arm_device` の経路でストリームを再オープンし、`probe_input` で入力の生死を
再確認するところまでを自動で行う。 **録音そのものは自動で始めない**——
`start_take` は本人の操作でしか呼ばれない。 別のデバイスへ自動で切り替える
経路も存在しない（`device_transition` が `Returned` を返すのは、見失っていた
のと同じ識別子が生きているときだけ）。

`arm_device` を再利用する副作用として、再オープンに失敗すると（実機が無い、
まだ挿さっていないなど）`arm_device` は自身の前提どおり選択（`Studio::device`）を
`None` に戻す。 これにより、次に一覧が動いても自動では拾い直さなくなり、
本人が明示的に選び直す、いつもの経路に戻る。 自動復旧を失敗のたびに
再試行し続ける仕組みは、今回のスコープに含めない——`arm_device` を
そのまま使う以上の複雑さを、まだ実測の裏付けが無いまま持ち込まない。
