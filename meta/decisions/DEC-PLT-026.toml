selected = 'Noto Sans JP を1本だけ同梱する'
rationale = '''
候補は Zen Kaku Gothic New / M PLUS 2 / Murecho / Zen Maru Gothic / BIZ UDPGothic /
Noto Sans JP の6つで、どれも SIL OFL 1.1。同じ収録画面の断片に当てて見比べた。

**個性とカバレッジがまっすぐトレードオフになっていて、カバレッジを取った。**
Noto Sans JP は BMP の統合漢字に加えて非 BMP の漢字を 2000 字超持つ。他の候補は常用域まで。
音源名は本人が自由に打つので、**珍しい漢字で豆腐が出ないのはこれだけ。**
ブランドの顔は配色・余白・声の形・ロゴで背負う。

**サブセット化しない。** 利用者が音源名・エイリアス・規約本文に何を打つか予測できない。
削った字は豆腐になり、しかも豆腐が出るのは珍しい名前を付けた人だけなので、
こちらの手元では再現しない。同梱するなら全字。

可変フォントなので1本で全ウェイトを賄える。 非可変の候補は必要なウェイトの本数だけ
同梱することになる。

## 検査の穴

**このフォントのライセンスは、いまの CI では誰も見ていない。**
`cargo deny check` が見るのは Cargo の依存で、同梱するフォントファイルは crate ではない。
`crates/koeru-app/ui/scripts/check-licenses.ts` が見るのは JS の依存。
**再配布する成果物が増えるのに、それを検査する経路が無い。**

`deny.toml` の allow に `OFL-1.1` は入っていない。 足しても `cargo deny` は
このファイルに当たらないので、宣言としての意味しか持たない。

そこで部品台帳へ載せる（`CMP-131`）。 台帳はライセンス監査の面として
name / purpose / license / status を持ち、`check-meta` が `decided_by` の有無を検査する。
**当面はここが唯一の検査点になる。** 同梱する非 crate の成果物が増えるなら、
台帳を見る検査を CI に足すことを別途考える。
'''
