selected = 'Julius を採らず、退避を segment.rs の1段に確定する'
rationale = '''
MFA は実際に動いている。 `crates/koeru-app/src/align.rs` が一次経路として選び、
モデルが読めたときは Kaldi が走る。`DEC-ALN-010` が「M5 で連続音に広げるとき」を
実装の予定地にしていたが、その時点に来てみると、払う理由が見当たらない。

`DEC-ALN-010` 自身が理由を並べていた。 Julius が守るのは「MFA だけが個別に引っ込む」
場合に限られ、「学習コーパスの条件が派生モデルへ及ぶ」という筋に対しては
Julius のほうが弱い（`corpus_status = "unverified"`。出所そのものが未確認）。
その筋のためだけに、MFA でやったのと同じ量の作業をもう一度払う。

払う量が大きい。 libjulius のリンク、モデル3本の submodule、`koeru-align` の
ビルド構成。M5 に残っている作業の中で単独では最も重い。

## 引き受けるもの

**多モーラ方式では MFA が必須になる。** `segment.rs` の退避は音素3つ以上を受け取らない
（`HeuristicAligner::align` が弾く）。単独音は音素列が `[C, V]` までなので degrade するが、
連続音と CVVC は退避へ落ちた時点で oto が出ない。

それでよいと判断する。 MFA は配布物に同梱していて（`DEC-ALN-012`）、読めないのは
梱包の失敗と開発ビルドのときだけ。利用者の環境の問題ではなく、こちらの問題として直すもの。

**ただし黙って落とさない。** 退避経路が多モーラ行を渡されたら、そのことを名指しで返す。
以前、境界への変換が落ちているのに画面が「発声を見つけられませんでした」と出して
原因を隠した（`crates/koeru-align/tests/multi_mora_row.rs` の冒頭）。同じ形を作らない。

## 戻り先は残っている

`segment.rs`（モデルを一切使わない）と snfa（`CMP-001`、重みが Public Domain 宣言、
採用候補のまま）。`DEC-ALN-010` が「licensing の筋で本当に独立な戻り先」と呼んだ2つは
どちらも生きている。snfa へ差し替える判断は、必要になったときに取る。
'''
