rationale = '''
`TR-RCL-16` は「詰め直しは採らない」と定め、理由を「フル方式への継続性が
定義上保証される」としていた。**その前提が M5 で変わった。**

## 「もう一度録り直す」は起きない

`plan.rs` が撤回の理由をこう書いていた——「詰め直すと、曲のために録った分が
フルリストのどこにも当たらなくなり、同じ声をもう一度録り直すことになる」。

これはカバレッジを仮名（収録単位）で数えていた頃の話。 M5 で `row_aliases` と
`covered_aliases` を入れ、**カバレッジはエイリアスで数えるようになった**
（`TR-PKG-22` の「判定の正本はカバレッジ台帳」）。

詰め直した行が生むエイリアスは、フルリストの行が生むものと同じ綴りになる
（単独音なら `さ`、連続音なら `- さ` / `a く`）。**だから録った分はそのまま
フル方式の被覆に効く。** 録り直しは起きない。

## 損の大きさを測った

「さくらさくら」1曲を歌えるようにするまで。

| 方式 | 要るエイリアス | 部分集合 | 詰め直しの下限 |
|---|---|---|---|
| 単独音 | 9 | 7 行 / 27 モーラ | 2 行 |
| 連続音 | 11 | 11 行 / 75 モーラ | 2 行 |

`TR-RCL-16` の「連続音のみ詰め直し版に対して数分の増加を受け入れる」は、
曲を絞ったときには成り立たない。 75 モーラと 2 行の差は数分では済まない。

**「単独音は1項目＝1モーラなので部分集合で無条件に最小」も正しくない。**
最小なのは単位の数で、読む量ではない。行は 5 単位ずつなので、9 単位が欲しくても
27 モーラ読むことになる。**行の途中でやめられない。**

## 本当の代償は再現性

崩れるのは継続性ではなく2つ。

- `TR-RCL-27` の決定性——「同じプリセットと同じインベントリ版からは、行の順序を
  含めて常に同一のリストを得る」。詰め直したリストは選択に依存する
- `TR-RCL-18` の台帳——「プリセットから生成した全行」を持つ形が前提だった

**決定性の範囲を「プリセット＋選択」へ広げる。** 同じプリセットと同じ選択からは
常に同一のリストを得る、と書き換える。乱数を使わないことは変えない。

台帳は行の出どころを持つ。 プリセットから生成した行か、選択から詰め直した行か。
両方が同じ台帳に並び、被覆はエイリアスで数えるので合算できる。
'''
