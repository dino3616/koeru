rationale = '''
canonical SDL（`DEC-PLT-035`、`DEC-PLT-042`）で、編集と確認の欄をどう運ぶかを決めた。
チャットで決めてもらった。

## 5値はテイク先頭からの標本位置

今の Rust（`koeru_model::oto::Oto`）は oto.ini と同じミリ秒で持ち、左ブランクだけがファイル先頭からの
位置で、残りの4値は左ブランクからの距離になっている。 `TR-EDT-01` は内部の単一のデータモデルを
絶対の標本位置と決めている。 相対のまま運ぶと、左ブランクを動かしたとき他の4値の画面上の位置も
動き、画面が直さないと位置がずれる。

契約の上では、どの値もテイク先頭からの標本位置（マスターのレート）で運ぶ。 ms への換算は
consumer が `ApplicationInfo.masterSampleRate` で行う。 今の Rust の形との変換は境界（resolver）が持つ。

## 確認と境界の編集には編集の区間

通常モードと上級モードは同じデータの2つの見え方（`TR-EDT-03`、`specs/requirements/editor-constraints.fsl`）。
アーキテクチャの報告（`docs/reports/architecture/00-architecture-report.md` §14）は、モードと区間の
revision を `EditingSession` が持ち、閉じた上級モードの遅れた命令を拒む形を提案していた。 これを採る。

確認（`confirmEntry`）と境界の編集は `EditingSessionId` を取る。 区間が閉じていれば
`EditingSessionEnded` を値で返す。 確認の画面も区間を開いてから操作する。

## 採らなかったもの

相対のミリ秒で運ぶ案は今の Rust と同じ形で変換が要らない。 ただし編集のたびに画面が4値を
直すことになり、直し忘れた画面だけが位置をずらす。 編集の区間を要らないものにする案は画面が
1手少ないが、遅れた編集を弾く手段が revision の競合だけになり、モードの規則を契約が表せない。
