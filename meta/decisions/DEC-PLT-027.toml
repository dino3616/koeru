rationale = '''
`DEC-PLT-025` が「音高帯・共鳴の重心・発声の長さから決定的に作る」と決めていたが、
**規則そのものは未定のままだった**（`docs/design/direction.md` の「まだ決めていないこと」）。
画面を作るには具体の式が要るので、ここで決める。

## 何を測るか

採用テイクから3つ取り、**どれも中央値**にする。 平均にすると、極端なテイクが
1本あるだけで色が動き、録り直しても戻らない。

| 観測 | 何になるか | 範囲 |
|---|---|---|
| 有声フレームの F0 の中央値 | 色相の**区画** | 70〜450 Hz |
| 倍音の重心 ÷ F0 の中央値 | 区画の中の**位置**、および彩度 | 2〜14 倍 |
| 1テイクの有声区間の中央値 | 明度 | 200〜1600 ms |

**色相の入力を音高だけにしない。** 最初は音高だけで色相を決めていたが、
**同じ人が録った音源は音高がほぼ同じなので、一人の音源が全部同じ色になった**
——手元の6音源で色相が 170〜179 度と 214〜217 度の2つに固まり、
2組は画素値まで同じだった（`EVID-PLT-002`）。KOERU の想定使用がまさにそれ
（一人が複数の音源を作る）なので、色が identity として機能していない。

**音高で 250 度を5区画（50 度ずつ）に割り、区画の中の位置を重心が決める。**
音高帯が大まかな色の系統を、声色がその中の位置を決める。区画を5にしたのは、
広すぎると音高帯の違いが読めず、狭すぎると重心の違いが隣の音高帯へはみ出して
音高帯の意味が消えるため。

**重心が色相と彩度の両方に効く。** 明るい声は「色相が進んで、かつ彩度が上がる」形で
揃って動く。承知のうえで選んだ——**入力が3つしか無いので、色相を音高から離すには
どれかを二度使うほかない。**

**重心をそのまま使わない。** 重心は音高に引きずられるので、生の Hz を使うと
色相と同じことを二度測ることになる。基本周波数で割って、音高の影響を抜く。

**対数の目盛りで写す。** 音高も長さも比で効く。100Hz と 150Hz の違いは
300Hz と 350Hz の違いより大きいので、線形に割ると低い声どうしが同じ色になる。

**採用テイクだけを見る。** 非採用まで混ぜると、採用を切り替えても色が変わらない。
切り替えは「声の表情を選ぶ」操作なので（`DEC-PLT-025`）、色が動かないと選んだことにならない。

## 色相に禁じられた帯がある

色相を持ってよいのは声・危険（red）・注意（amber）だけ（`docs/design/direction.md`）。
声がその帯に入ると状態と見分けがつかないので、**110 度から始めて 250 度ぶんだけ**使う。
OKLCH で red-11 は 20 度付近、amber-11 は 85 度付近にいる。

## 彩度と明度の幅は面が決める

**返すのは 0〜1 の位置だけで、実際の値は CSS が決める。** 理由は2つ。

1. 同じ明度を明暗の両方で使うと、片方で地に沈む。環は非テキストの図なので 3:1 が要る（`TR-PLT-28`）
2. **明るい面で sRGB に収まる彩度は暗い面より狭い。** 収まらない彩度は画面で丸められ、
   **声ごとの彩度の差がそこで消える**

明度の幅は実測で選んだ。 暗い面が 0.62〜0.80、明るい面が 0.42〜0.58。
段 1〜3 のどの面に載せても 3:1 を満たす。検査は `palette.story.tsx` の「声の色」で、
**実ブラウザに描いた色から測る**（計算値を写さない）。

**彩度の上限は色相ごとに出す。** 以前は全色相で一律（明るい面 0.072 / 暗い面 0.10）
だった。いちばん狭い色相（190〜210 の青緑）に合わせた値なので**そこは正しい**が、
**明るい面ではそれが灰色に見える彩度で、6音源を並べても色の違いがほとんど読めなかった**
（`EVID-PLT-002`）。

上限は色相で 3 倍違う。 明るい面の明度で測ると、色相 210 は 0.09 で sRGB を外れるが、
150 は 0.12、318 は 0.18 まで入る。**コントラストは全域で 5:1 を超えたままなので、
彩度を抑えていたのは sRGB ではなく「全色相で一律にしていたこと」だった。**

上限まで使わず 9 割で止める。 端はブラウザの丸めと面の合成で越えるので、
越えた色は画面で潰れ、**声ごとの差がそこで消える。**

## 組み立てる場所を CSS から TS へ移した

以前は幅を `globals.css` が持ち、`calc()` で組んでいた。**色相ごとの上限を出すには
明度が要り、CSS には「この色相で収まる最大の彩度」を問う式が無い。**
だから幅と上限をまとめて `lib/voice-color.ts` へ移し、明暗2つの色を変数として渡す
——どちらを使うかだけを CSS が選ぶ。

**幅が「面が決める」ことは変えていない。** 決める場所が CSS から TS へ移っただけで、
面ごとに違う幅を持つという性質はそのまま。`theme.js` がクラスを付け替えるだけなので、
片方だけ焼き込むと切り替えに追従しない——だから両方の面ぶんを渡す。

**色相だけは絶対値で返す。** 面によって変えない——同じ声が明暗で違う色に見えると、
一覧と音源の面で別の声に見える。

## 重心の測り方

`take_analysis` に列を1つ足し、録音停止時に測って保存する（`2026-09-07-000000_take_centroid`）。
書き出しと再開で WAV を読み直さないという方針（`TR-PKG-42`）に合わせる。

大きく鳴っているフレームだけを見て、フレームごとの重心の**中央値**を採る。
無音区間まで混ぜるとノイズフロアの平坦なスペクトルが重心を帯域の真ん中へ引き寄せ、
平均にすると破裂音の1フレームが全体を引き上げる。上限は 8000 Hz——
上を切らないと、息と摩擦音の帯域が「声の明るさ」ではなく「s の多さ」を測ることになる。

**この列より前に録ったテイクは値を持たない。** そのとき彩度は中央に落ちる。
色を出さないほうが情報を失う。

## 声が無ければ色も無い

有声フレームが1つも無ければ色を作らない。 まだ録っていない音源に声は無いので、
空いた席に色を付けない（`docs/design/direction.md` の「欠け」）。
そのとき環も1本も描かれないので、色を決める必要がそもそも無い。
