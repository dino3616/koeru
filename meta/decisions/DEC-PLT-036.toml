## 決めたこと

application から見える継続的な流れは、すべて GraphQL Subscription にする。
Tauri Channel が残るのは、GraphQL の実行結果を運ぶ汎用の経路（execute / subscribe /
unsubscribe）の中だけ。React の feature は Channel を import しない。

Subscription は1 operation に1つの root field で、寿命の持ち主ごとに分ける。
巨大な「全部のイベント」を作らない。 届け方は source ごとに決め、1つに揃えない。

| 流れ | 持ち主 | 届け方 |
|---|---|---|
| project の変更通知 | ProjectRuntime | 落とさない。欠けたら Query の snapshot で取り直す |
| ジョブの経過 | JobRuntime | 今の状態 ＋ 以後の変化。今の状態は Query でも読める |
| 入力の包絡 | 入力の lease | 捨ててよい。詰まったら古い観測を捨て、新しいものを送る。再送しない |
| 再生の経過 | 再生の lease | 捨ててよい。再送しない |

GraphQL は背圧を自動では解かない。 持ち主が件数とバイトの上限を持つ。

## 観測の取消と作業の取消を分ける

unsubscribe は「もう観測しない」で、ジョブも収録も止めない。 作業を止めるのは
`cancelAnalysis` のような Mutation。画面を離れて Subscription が閉じても、裏のジョブは
止まらない。

## realtime callback からは遠ざける

callback は GraphQL も直列化も IPC もしない（`TR-REC-40`）。 callback →
事前確保のリング → pump → 有界の観測 → Subscription の順に渡す。

待ち数（`TR-SYN-33`）は今、返ってから次を予約する問い合わせで回している。
