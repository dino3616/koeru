**個人開発として、配布のために年額の商用ライセンスを前提にしない。**
それが必要になった時点で、開発が止まったときに配布も止まる。
「渡した先で続けられる」という原則と両立しない。

DEC-PLT-001 で実装スタックは Rust + Tauri と決まっており、GUI 基盤の代替は既にある。
'''
