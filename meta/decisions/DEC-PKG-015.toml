selected = '収録方式と収録音高を別の節に分け、収録音高は単音階でも出す'
rationale = '''
**下位方式へ降りて書き出しても、readme は元の方式を名乗っていた。**
連続音の音源から単独音を作って配ると、受け取った人は「収録方式：連続音」と
読んで開き、中身は単独音。KOERU の中の配布の記録は降りた方式を書いているので、
記録と配布物の説明も食い違っていた。

readme に出せる方式の名前は、manifest の4つ（単独音 / 連続音 / CVVC /
多音階連続音）だった。**「多音階単独音」が無い**ので、多音階の連続音から
降りた音源を名乗れない。いまも多音階で作った単独音と CVVC は、readme に
「単独音」「CVVC」とだけ書いていて、多音階であることが読めなかった。

## 方式と音高を分ける

- 「収録方式」は作り方だけ。単独音 / 連続音 / CVVC の3つ
- 「収録音高」は録った高さ。`A3` や `G3 / D4 / A4` のように音名で並べる

受け取る人が知りたい「作り方」と「高さ」が、どの方式でも同じ形で読める。
KOERU の中で方式と収録音高を別の選択に分けた判断（`DEC-RCL-014`）とも揃う。
下位方式で出すときは、降りた先の方式を名乗る（`TR-PKG-24`）。

**単音階でも収録音高を出す。** 単音階の音源でも、何の高さで録ったかは
受け取った人が音域を決める手がかりになる。多音階のときだけ出すと、
節の有無で「多音階か」を読ませることになり、単音階の音源は高さを一切伝えない。

`character.yaml` の `subbanks.tone_ranges`（`TR-PKG-29`）とは役割が違う。
あちらは担う範囲（floor 割り当ての結果）を機械可読に出すもので、単音階では持たない。
こちらは録った高さを人に伝えるもので、KOERU が持っている情報なので必ず出す
（`TR-PKG-28` の「KOERU が持っている情報なので必ず出す」側）。

## 採らなかった案

**収録音高は多音階だけ出す**。 上のとおり、単音階の音源が高さを伝えない。

**「単独音」と書く**。 最小の変更だが、多音階であることが readme から読めない。

**方式の名前を足す**。 筋を通すなら多音階の CVVC も書き分けることになり、
名前が組み合わせの数だけ増える。音高の選び方をもう1つ足すたびに、また増える。
'''
