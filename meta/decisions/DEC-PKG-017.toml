前の控えを残す。 どこまで残すかを決めた。

## 決めたこと

- スナップショットは1プロジェクトにつき直近 20 件。 21 件目を取ったら最も古いものを消す
- 移行前の控えは、次の移行が成功するまで1つ残す。 スナップショットの件数には数えない
- **20 は仮の数。** 今のプロジェクトの台帳は 1MB 弱なので 20 件でも数十 MB に収まるが、
  録り終えたプロジェクトの台帳の大きさは測っていない。 測ってから直す

## 採らなかったもの

すべて残す案は戻れる範囲が最も広いが、ディスクの使用量を画面で見せて本人に消させる導線が要る。
期間で切る案は、しばらく開いていなかったプロジェクトで戻れる先が無くなる——破壊的操作の直後に
開き直したときこそ戻りたい。
'''
