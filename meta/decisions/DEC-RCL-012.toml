id = 'DEC-RCL-012'
constraint_label = 'USTX の取り込み'
constraint = '本人が持ち込む USTX を、黙って読み違えずに取り込めること'
title = 'USTX は yaml_serde で読む。YAML パーサを自前で書かない'
