rationale = '''
`TR-RCL-10` は「行ごとに実測を記録し、直近 20 行の中央値から残り時間を推定する」と
定めていた。実装もした——`row_measurements` 表、`estimate_pace`、10 行の慣らし。
**落とす。**

## 例外の手当てが増え続ける

実測に依存すると、実測でないものを数えないための条件が要る。
落とす前に既に3つ持っていた。

- 席を立った1行が全体を引っ張らないように中央値を採る
- 最初の数行が「残り3時間」にならないように 10 行まで固定値
- 窓を 20 行に切る

これで足りている保証が無い。 途中で方式を変えたら、多音階で音高を移ったら、
別の日に録り直したら——**そのたびに「この実測は数えない」を足すことになる。**
値の出どころが1本なら、この手当てが1つも要らない。

## 二重表示は条文自身が risk に挙げていた

`TR-RCL-10` の notes がこう書いている。

> 選択画面が固定値、進行中が実測値という二重表示がユーザーに矛盾として見える

同じ「残り」が画面によって別の式から出る。 片方だけ直しても、もう片方が古くなる。

## 精度を騙らない代わりに、件数を出す

固定の見積もりは桁しか合っていない（`DEC-RCL-008` の 12.0 秒は実務値で、
KOERU の録音 UI での実測ではない）。**時間だけを出すと、持っていない精度を
主張することになる。**

だから残りを2つで出す。

- 時間 — 固定の見積もり。「約 1 時間」
- 件数 — 残りの行数。多音階なら音高の本数を掛けた数。**数え上げなので正確**

件数は本人が自分のペースを当てはめられる。 1行にどれだけかかるかは
本人がいちばんよく知っている。アプリが推定するより確かで、外れようがない。

## 落としたもの

`row_measurements` 表、`Ledger::record_row_measurement` / `recent_measurements`、
`pace::Pace` / `RowMeasurement` / `estimate_pace`、`Studio` の `last_take_saved`、
`Progress::measured`、画面の「いまは見込みです」。

`pace::fixed_seconds` だけが残り、方式選択画面も残り時間も同じ式から出る。
'''
