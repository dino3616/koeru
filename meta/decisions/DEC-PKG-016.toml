## 今の置き場所

ライブラリは Tauri の `app_data_dir` の下（`TR-PKG-37`）で、本人は場所を選べない。

- macOS: `~/Library/Application Support/app.koeru.studio/library`（APFS）
- Windows: `%APPDATA%\app.koeru.studio\library`（**Roaming**）
- Linux: `~/.local/share/app.koeru.studio/library`

## 置き場所ごとに起きること

- 内蔵ドライブ（APFS / NTFS / ext4 系）: 手順どおりに守られる
- 外付けの exFAT / FAT32: 抜かれたときや電源断で、付け替えの途中のファイルや台帳が壊れやすい。
  FAT32 は 4GB を超えるファイルを置けない
- ネットワークドライブ: SQLite は WAL モードがネットワーク越しでは動かないと明記している
- 同期フォルダ（iCloud Drive / Dropbox / OneDrive）: 台帳と WAL が別々に同期され、壊れた組や
  競合の写しができる。容量の最適化で WAV が手元から追い出される

**Windows の Roaming が具体的な穴になっている。** 会社の PC ではフォルダのリダイレクトや
ローミングプロファイルで、Roaming がネットワーク上に置かれたり、ログオフのたびに同期されたり
する。本人が何もしなくても、録音（1プロジェクトで数百 MB）がネットワーク越しの場所に入る。

## 決めたこと

- 約束するのは内蔵ドライブの APFS / NTFS / ext4 系だけ。 保存の障害試験（電源断・異常終了・
  容量不足の注入）もこれらの上で行う
- 置き場所は今までどおり選ばせない。 別の PC への移動は `TR-PKG-47` のアーカイブで行う
- **Windows だけライブラリを `%LOCALAPPDATA%` の下へ移す。** 既にある Roaming のライブラリは、
  移行の手順（控えを取る → 別の世代へ写す → 確かめる → 切り替える）で移す。 両方に中身が
  あれば混ぜずに止める
- 起動時に、ライブラリがネットワーク上か FAT 系の上にあると分かったら知らせる。
  約束の外にいることを、壊れてから知らせない
- **通常の移し替え（Local に中身が無く、Roaming にある）は、写した中身を Roaming と
  突き合わせて確かめてから切り替え、そのあと Roaming 側を消す。** 確かめずに消すと、
  途中で壊れた写しに気づけないまま Roaming の控えを失う
- **両方に中身があるときは移し替えをせず、Local を開く。 Roaming には触らない**
  （消さない・名前も変えない）。 混ぜて1つに合わせる操作は、どちらが正か決める材料を
  本人しか持っていないので、機械が推測して行わない
- 知らせるのは検出と結果の保持まで。 画面への表示は別の作業（notices）で行う。
  ここで決めたのは「壊れてから知らせない」という要件で、表示の文言や UI は決めていない

## 採らなかったもの

外付けを約束する案は、容量の大きい外付けに録音を置きたい人に応える。 ただし置き場所を選ぶ
機能と、ファイルシステムごとの障害試験と、抜かれたときの回復手順が要る。 求める声が
出てから足せる。

同期フォルダとネットワークまで約束するには、SQLite の WAL を使わない設計へ変える必要がある。
