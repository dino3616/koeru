rationale = '''
**行が無いものは詰められない。** 7工程を数え直したところ、実際に無かったのは3件だけで、
2件は「予算なし・新設が必要」という空の行として既に在り、2件は行も目標値も揃っていた。
**論点のほうが移行時の追加に追いついていなかった。**

置いた目標値は、いずれも既存の枠からの割り算で出す。フレーズキャッシュ再構築は
TGT-ALN-002 の10分枠から推論の36秒を引いた残り、5値の再導出は推論を伴わないので
TGT-ALN-001 より2桁小さい、というように。**根拠が無い数字を置かない。**

**master WAV の読み直しだけは絶対値を置かず、アクセスパターンで縛った。**
総容量が SCALE-REF-001 の録り直し係数の実測待ちで確定しないため、帯域の数値が出せない。
かわりに「逐次読み出しとし、10分枠のうち読み込みに2分以上使わない」と書いた。
**回転ディスクでテイク単位のランダムアクセスにすると枠を使い切る**ので、
縛るべきはそこであって MB/s ではない。

包括的な余裕枠は採らない。**融通できる枠は、どの工程が食い潰したかが分からなくなる。**
'''
