selected = '''
## 進め方

1. **xtask の準備を先に、書き換えを後に。** 次の順で進める。
   - p0: この判断の記録。
   - a1: 読みと ID の認識。
   - a2: 検査を目標の形へ載せる。
   - a3: 移行エンジンの拡張。
   - a1〜a3 は meta を変えないので、T08 と並行で進める。
   - c0 → b → c1 → c2（事前の整理、移動だけ、ID の付け直し、要件の分割）は、T08 が一段落してから、他の PR を止めて1人が通す。
   - 分解（d1〜d4）、台帳の削除（e）、README と旧い口の削除（f）はその後。
2. **ID の付け直しは分解より先に行う。** 移行エンジンは1対1の写しだけを扱う。分解は付け直しの後に、新しい記録を作る作業として行う。

## 写し方

1. **要件。** 1件1ファイル（`REQ-xxxxxx.toml`）に割る。ID の付け直し（c1）とは別の PR（c2）にする。
   - `title`、`confidence`、`depends_on`、`formalized_as` は残す。`needs_component` は落とす。
   - 領域ごとの `domain_risks` は人が HYP・Q・DEC に分ける。
2. **旧 ID と新 ID の対応は、付け直しの PR の説明にだけ残す。** repo に対応表を置かない。
   - continuity の検査は、c1 の PR にだけ置く一時ファイルを読んで改名を許す。そのファイルは次の PR で消す。
   - 並行する PR が旧形の ID を足す危険は、止める期間と、最新の main への当て直しで防ぐ。
   - opaque ID の生成器 `new-id` は a1 で作る（形は `DEC-PLT-048` の 7）。
3. **FSL の ID。** `OBL-` / `INV-` / `FB-` / `ACC-` の opaque に付け直す。
   - fslc lint の ID 規約は、ID をリテラルで列挙した生成物で保つ。opaque 用の placeholder は上流に要望する。
   - `MODEL-*` は検証のための仮定で、製品の規則ではない。既存の書式のまま残す。
4. **両側に書く関係**（`superseded_by`、DEC の `question`、HYP の支持・反証の調査、REQ の `established_by`）は Mirror のまま残し、両側が一致することを `check-meta` で検査する。
5. **Human Verification Debt の欄。**
   - 影響の範囲（blast radius）と覆しやすさ（reversibility）は、それを抱える DEC に置く。
   - 同じ session で観察できる仮説は、HYP に置く。
6. **workload。**
   - `workload:<slug>` を正規の書き方にする。
   - workload は `schema = 'workload'` の1件1ファイルにする。
   - パスで書く形は `meta/verification/workloads/` に合わせる。
   - 調査の `derived_from` と Probe の `runs_with` は、この locator を指す edge にする。
7. **台帳を消したあとの `implements`。**
   - 主な供給元は、コードのコメントにある要件の引用から導く。
   - 要件ごとの明示の欄は、任意で足せるようにする。
8. **`check-coverage`** は D07b の Requirement Coverage に置き換え、合否の無い一覧にする。
9. **`meta/profiles`** は動かさない。
10. **TGT と CMP の分類。**
    - 分類表を機械可読の1ファイルにし、Agent が案を出して、人がドメイン単位で確かめる。
    - 確かめる単位は、TGT が領域のファイルごと、CMP が status ごと。
    - 他から引かれている TGT だけ、人が引用の向け先を選ぶ。
11. **SUITE の `contracts` のうち DEC・EVID を指すもの。**
    - その DEC が確立する要件を Probe の `targets` にする。無ければ HYP を足す。
    - 1本ずつ人が確かめる。
12. **置き場所の検査。** a1 で、直上のディレクトリ名だけを見る形から、パス全体を見る形に強める。
13. **BUDGET。**
    - 配分の各行に、属する group を明示する欄を足す。
    - 小計は View が計算し直し、書かれた値と並べる。
14. **SCALE の導出式。**
    - 入力（参照か値、単位）と演算（積か和）の組で持つ。
    - 係数を測っていない行は値を持たない。
15. **書き換えの走査範囲。**
    - `check-references` と移行エンジンで同じ集合を共有したまま、`sql`、`toml`、`yml`、`json`、`css`、`cc`、`h`、`sh`、`ps1`、`tsv` を足す。Diesel の migration が checksum を持つなら、`.sql` は外す。
    - `bindings.gen.ts` は手で直さず、作り直す。
    - 範囲の略記（`TR-REC-08〜12` など）は、c0 で1件ずつの列挙に展開する。
    - 提案書と実装計画の旧 ID の例示は、パスの除外で書き換えから外す。
16. **Q の resolved と closed** は、他と同じく付け直して残す。

採否を決めていない CMP、要件を支える EVID、`domain_risks` の行き先は、その分解の PR で1件ずつ決める。
'''
rationale = '''
## 進め方

meta を書き換える前に、xtask 側が目標の形を読めるようにしておく必要がある。そうしないと、切り替えた時点で次のことが起きる。

- **検査が空洞のまま緑になる。** `check-references`・`touched`・`context` は旧形の ID しか認識しないので、新しい引用を1つも拾わずに通る。
- **CI が落ちる。**
  - fslc lint が新形式の FSL ID を落とす。
  - continuity が改名を誤りにする。
  - `specs/` を移すと、ローダが FSL の manifest を知らない schema として落とす。

a1〜a3 はこれを直すだけで meta を変えないので、T08 と衝突しない。

repo 全体の書き換えは引用が約 9,700 箇所、約 557 ファイルある。並行する PR があると必ず衝突するので、止める期間を取る。

## 対応表を持たない

旧 ID を外から辿る手段より、repo に残る schema を1つ減らすほうを取った。そのため、並行する PR が足した旧形の ID の漏れは、検査では拾えない。止める期間の中で最新の main に当て直すことで拾う。

## 案ごとの見方

- **要件を割る:** 提案書のファイル名＝ID の約束に合い、1件ごとの履歴が追える。収集ファイルのままだと差分は小さいが、ID から領域が読めなくなったあと探しにくい。
- **fslc lint:** 止めない扱いにすると ID 規約の診断を失う。旧形に残すと `OBL-<opaque>` と矛盾する。
- **Mirror:** Inverse にすると、今は両側に書いてあるので edge が二重になる。支持・反証を `assesses` の逆にすると、支持か反証かが失われる。
- **implements:** 引用は満たしていることの証明ではないが、台帳の採用行も同じ程度の意味しか持っていなかった。DEC から張る形は関係表の変更と DEC の見直しが要る。欄で張る形は書く量が多い。
- **check-coverage:** 3軸のどれにも覆われない要件が 131 件ある。台帳を消して `implements` を供給しなければ 196 件になる。合否は持たせず、一覧として出す。
'''
