rationale = '''
`Q-RCL-004` を閉じる。 `TR-RCL-19` の「進捗表示」は音源を並べる面にも掛かる、と読む。

**中断して数週間後に戻る利用者（`UC-F03-02`）が最初に見るのはこの面**で、
そこに到達度が無いと、どの音源を再開すべきかを開くまで判断できない。
項目数は行の数であって、`TR-RCL-19` がカバレッジと区別している「行の消化率」の分母ですらない。

数だけでは足りない。 `DEC-PLT-025` が一覧を「声の並び」にすると決めていて、
名前と数字の行に畳むと**その位置に何も座らない**——UTAU の音源はキャラクターとして
記憶されている（`EVID-UX-004`）ので、絵を描かせない KOERU では声の形がその位置を引き受ける。

## 費用

`list_projects` が音源ごとに台帳を開く。 開くのは SQLite の接続1本と、
被覆・曲・採用テイクの観測を読む3〜4クエリ。**実測はまだ取っていない。**
音源が数十を超えたときに一覧の表示が待たされるなら、環と色だけ後から差し込む形
（先に名前を出し、育ち具合は追って埋める）へ移る。

読めない音源も席を残す。 manifest が壊れていても、台帳が開けなくても落とさない。
消すと、壊れていることに気づけないまま音源が消えたように見える。

## 完成の表示を兼ねる

`TR-PKG-36` は完成した音源を一覧で完成として表示することを求めている。
`DEC-PKG-007` が完成の条件を先に満たさせることにしたので、**被覆が満ちた瞬間には
必ず完成している**——環が閉じることがそのまま完成の表示になる。別の印を足さない。
「作りかけ」という見出しも置かない（完成と未完成で並びを割らない）。
'''
