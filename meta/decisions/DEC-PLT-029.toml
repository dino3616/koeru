rationale = '''
作り直した音源の面を実機で測ったところ、**宣言している最小の窓で右の列が 52px に
潰れ、「歌える曲」が1文字ずつ縦に改行されていた**（`EVID-PLT-002`）。
あわせて既定の窓（1280×840）で「録る」が下端に掛かり、押せない理由を書いた1行が
画面の外に出ていた。どちらも幅と高さの約束を持っていなかったことが原因。

## 幅

**中央を `flex-shrink-0` の固定幅にしていたので、縮み分を右が全部引き受けた。**
左は絞り込みの札3つが横並びで min-content が 320 近くあり縮めない。右は字なので
min-content がいくらでも小さくなる——**縮められる側が全部かぶる。**

3列に要るのは 左 288 ＋ 中央 460 ＋ 右 288 ＋ 余白 128 = 1164px。
**それを下回ったら中央と右を縦に積む**（段は 1200px）。左はそのまま横に残す
——収録項目の一覧は「次に何を録るか」の参照なので、作業帯と同時に見えている必要がある。

**隠さない。** 窓の大きさで読めるものが消えると、機能が窓の大きさで変わる。
縦に積むと縦スクロールは増えるが、消えるものは無い。

**最小の窓を広げる案は採らない。** 960×640 は `tauri.conf.json` が既に名乗っている
値で、上げると「その窓では動かない」と後から言うことになる。

## 高さ

**環を余った高さに合わせて縮める。** 一辺を面ごとの固定値（300 / 260）にしていたので、
下に積む「次に読む」が押し出されていた。18.75rem（300px）から 15rem（240px）まで
縮み、下限は**いちばん内側の環が中央の的に重ならない大きさ**で決まる。

`DEC-PLT-025` の「中央に常駐させる」は保つ。 順序も面ごとに変えない
——縮むのは大きさだけ。

## 内側の環の半径

`INNER_R` を 72 から 88 へ上げた。 中央の的は `size-19`（4.75rem = 76px）なので
半径 38px、いちばん小さい描画では viewBox で 73 相当になる。**72 では重なり、
隙間は実測 1.5px だった**（`EVID-PLT-002`）——環が「閉じているか」ではなく
的の輪郭に見えるので、あ行の被覆が図から読めない。

## 並び順

**見た目は左→中央→右のまま、DOM は中央→右→左にする。** Tab は DOM 順に進むので、
そうしないと主操作へ届くまでに収録項目 29 行を通る（**実測で 14 回押しても
まだ一覧の中だった**）。

見た目と DOM がずれるのは承知のうえ。 読む順としても「まず手を動かす場所、
次にその結果、最後に一覧」になるので、作業の順序とは合っている。
一覧へは領域移動（`Card` の landmark、`TR-PLT-29`）でも入れる。

## マイクの選択は Rust が持つ

**画面側の state に置いていたので、テイクの面へ入って戻るだけで選択が消えていた。**
`TR-REC-03` はマイクを音源に固定すると定めていて、`DEC-PLT-024` が準備を設定の面へ
移した理由は「一度で済むものを毎回同じ大きさで置かない」だった。**選択が毎回消えるなら、
その理由が成り立たない**——しかも経路は旧画面より長い。

`chosen_device` を足した。 開いていればアプリの状態から、開いていなければ
台帳の最後のセッションから返す。**専用の欄は足さない**——セッションは録音条件の
スナップショット（`TR-REC-30`）で、そこに既に `device_id` が入っている。

**開き直しは録る手前でやる。** 起動し直した直後は、選択が戻っていてもストリームは
閉じている。開くのを設定の面まで引っ張らず、最初のテイクの手前で開く。
開いているかは毎回 Rust に訊く——画面側で覚えると、抜き差し（`TR-REC-04`）で
閉じたことに追従できない。

**校正と回り込みの確認は「開いている」で判断する。** どちらも Rust 側でストリームを
要求するので、選ばれているだけでは押せてはいけない。

## 確定の途中に次を始めさせない

「録る」は `settling` で差し替わっていたが、**「続けて録る」は押せるまま残っていた**。
`TR-REC-42` の札は `use-recorder` 側にも足した——押せる的を出さないだけでは、
経路が1つ増えるたびに同じ抜けが起きる。
