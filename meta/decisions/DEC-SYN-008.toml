selected = '要件に範囲と格子を書き、型でも言わせる'
rationale = '''
**`TR-SYN-08` は周波数表の「範囲」と「格子」を書いていなかった。**
書いてあったのは「任意」「長さ0で無し」「無ければ推定する」の3つだけ。

**その沈黙のぶんを、呼び出し側と合成器が逆に読んだ。**

| | 範囲 | 格子 |
|---|---|---|
| 呼び出し側が渡していたもの（`.frq`、`TR-PKG-05`） | ファイル全体 | hop=256 サンプル |
| 合成器が読んでいたもの | oto で切り出した区間 | 5ms |

44100 Hz では hop=256 が 5.805ms なので **1フレームあたり 16% ずれる。**
さらに先頭が違うので、**offset 手前の無音（F0=0）が発声の先頭に当たる。**
F0=0 のフレームを WORLD は無声として合成するため、**声が雑音になり、
目標音高も乗らない。** 実測で1オクターブ下・周期性 0.31。

**単体試験はすり抜けた。** `周波数表を渡すと推定を省く` が
「使う区間ぶん・5ms 格子」で表を作っていたので、**合成器の読み方に合わせた
試験になっていた。** アプリだけが雑音を出す。

**型に言わせる側を採る。** 同じ間違いが `studio.rs` と `phrase.rs` の
2箇所で独立に起きており、**`&[f64]` という型が何も言っていなかった**ことが原因。
`FrequencyTable { f0, hop_samples }` にして、呼び出し側に格子を書かせる。
「長さ0で無し」も `Option` にする——**値の形で状態を表すのをやめる。**

**切り出しと載せ替えは合成器の側に置く。** 呼び出し側でやると、
外部 resampler を呼ぶとき（`TR-SYN-35`）に同じ処理が二重になる。
'''
