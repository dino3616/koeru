selected = 'ファイル確定 → DB コミット'
rationale = '''
逆順にすると、ファイルの無い行が DB に残る。テイクは録音という「やり直しが高い操作」の
成果物なので、行だけが残って音が無い状態は復旧できない。

`.wav.part` へストリーミング書き込みし、終了時に seek してサイズを確定させ、fsync 後に
アトミックな rename で最終ファイル名にする。**SQLite へのコミットは rename 成功後。**
異常終了で `.part` が残った場合は、次回起動時にファイル長からデータ長を復元して
復旧可能なテイクとして提示する。`masters/` の WAV は書き込み完了後に読み取り専用にする。

**進行中のテイクの扱いは原因で分ける。** 異常終了なら `.part` を復旧候補として提示し、
デバイス消失なら不完全としてマークして破棄する（TR-REC-04）。

**この順序は窓を1つ作る。** rename が成功したあと、コミットが済む前に落ちると、確定済みの
WAV がディスクにあるのに `index` に行が無い状態が残る。設計層の形式検証がこれを見つけた。
この孤児は `.part` と同じく**復旧候補として提示し、DB へ自動で書き戻さない**（TR-REC-31 の
「不整合は提示して自動修復しない」に揃える）。**本人が採るか捨てるかを選ぶまで消えない。**
逆順（DB 先行）ならこの窓は無いが、代わりに音の無い行が残る。**録り直しの高い操作では、
拾える音が残るほうが、行の整合より価値がある。**
'''
review_triggers = [
