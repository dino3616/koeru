selected = '確認時に行い、録り直し提案までに留める'
rationale = '''
align の領域リスクが「決める必要がある」と書いていた線を、ここで引く。
「録音品質のリアルタイム判定はスコープ外」（DEC-PLT-008）と「確信度が低い箇所だけ
確認させる」（TR-ALN-25）は部分的に衝突する。確信度が下がる主要因は録音品質であり、
確信度の提示は録音品質の問題を事後に露出させるため。

録音時には出さない。 TR-REC-16 は「計測して記録するが、判定も指摘もしない」と定めており、
収録画面には入力レベルの現在値だけを出す。この線は動かさない。

確認時には出す。 TR-ALN-24 の成分 (4) 音響異常度（クリッピング、レベル不足、
推定 SNR、F0 の不連続）を確信度に残す。**そこで oto の数値をどう直しても音は良くならないため、
確認 UI は「録り直す」を提案する。** 提案しないと、本人は直せない値をいじり続ける。

ただしスコアも評価も出さない。 出すのは「録り直す」という行動の提案だけで、
「小さすぎます」「歪んでいます」といった評価は出さない。TR-REC-16 の禁止は
録音画面に掛かるものだが、同じ言葉を確認画面で言えば禁止の意味が消えるので、
確認画面でも評価表現は出さない。

通常モードで主因ラベルを出す案は採らない。 TR-ALN-26 (3) の主因ラベル
（音が割れている 等）は上級モードに留める。通常モードで出すと、
「録音品質の指摘をしない」というビジョン側の方針が実質的に崩れる。
'''
