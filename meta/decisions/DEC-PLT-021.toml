schema = 'decision'
id = 'DEC-PLT-021'
constraint_label = '画面の分け方'
constraint = '初回起動から最初のフレーズを録るまでを、4操作以内に収めること'
title = 'OOUI はカード（面）の単位で採る。ルートはオブジェクトごとに分けない'
status = 'accepted'
owner = 'dino3616'
options = [
  'カードの単位で採る（ルートは 一覧 → 収録 の2枚）',
  'オブジェクトごとにルートを分ける（音源 / 録音リスト / テイク / 曲）',
  '採らない（タスク単位のまま）',
]
selected = 'カードの単位で採る（ルートは 一覧 → 収録 の2枚）'
rationale = '''
オブジェクト指向 UI の要点は「対象を選んでから操作を選ぶ」ことで、
それはルートの分割とは別のこと。 収録画面の中を、マイク・いま録るところ・
テイク・曲という面に分け、それぞれが名前つきの landmark を持つ形にした。

ルートを分けるのは採らない。 `meta/budgets/platform.toml` が
「初回起動から最初のフレーズまで4操作以内」を要求しており、
`specs/requirements/first-run.fsl` の `reachable ReachesFirstPhraseCleanly` が
その到達性を検証している。オブジェクトごとにルートを増やすと、
選ぶ操作がそのぶん増えて、この2つを同時に満たせない。

したがって、テイクや曲は URL を持たない。 これは制約から出た形であって、
OOUI を理解していないからではない。 M6（原音設定エディタ）でテイクを
単体で開く必要が出たときに、そこだけルートを足す。

順序としても、要件と FSL が先。 ルートを分けるなら、`platform.toml` の
操作数と `first-run.fsl` の到達性を先に書き換える（`AGENTS.md` の前提）。
'''
review_triggers = [
  'M6 でテイクを単体で開く必要が出たとき',
  '収録画面のカードが増えて、1画面に収まらなくなったとき',
  'platform.toml の操作数の上限を見直すとき',
]
