selected = 'TanStack Query（useSuspenseQuery / useMutation）'
rationale = '''
読みは `useSuspenseQuery`、押して初めて走るものは `useMutation`。 待ちは `Suspense`、
失敗は経路の受け口（`RouteError`）と `__root` の `ErrorBoundary` が受ける。

自前で書くと、部品ごとに3つの状態を書き下ろすことになる。 「まだ無い」「取れた」
「失敗した」を毎回書き分ければ、書き落としが出る——実際、成功時にエラーを消し忘れて、
一度失敗したあとは開いても赤字が残ったままになっていた。中断と境界に寄せると、
部品には「取れた」しか残らない。

`use()` は入れ物を持たない。 約束を投げるところまでは同じだが、同じ約束を
返し続ける仕組みが要る。それを自分で書くと、鍵・重複排除・無効化を作ることになる
——名前の違うキャッシュを1つ増やすだけになる。

鍵と取得口は `ui/src/lib/queries.ts` に集める。 部品の側に散らすと、同じものを
別の鍵で引いて二重に取りに行く。台帳から読むものは `ledgerKey` の下に置き、
テイクが確定したらまとめて無効化する——版番号を鍵に混ぜない。混ぜると変わるたびに
別の鍵になってキャッシュが積み上がる。

`open_project` は台帳の鍵の下に置かない。 あれは収録セッションを1つ始め直す
（`TR-REC-30`）ので、テイクが確定するたびに呼ぶとセッションが録音の途中で切り替わる。
開くのと読むのは別の部品に分け、境界を挟む。 同じ部品にフックを並べても順序は
保たれる（`EVID-PLT-001`）が、保たれるのは並び順によってなので、並べ替えても型は通り、
`app.no_project` が出て初めて分かる。境界で分ければ順序が木の形として残る。

取りに行く順序は測ってある（`EVID-PLT-001`）。 同じ部品に `useSuspenseQuery` を
2つ並べると直列、`useSuspenseQueries` で束ねると並行、兄弟をそれぞれの境界で
包んでも並行。関係の無いものを同じ部品で2つ読むと、待ち時間が足し算になる。

流し続けるものは載せない。 波形と待ち数は Channel と自前の予約で回す（`DEC-PLT-017`）。
あれは問い合わせではないし、取り直しにも重複排除にも意味が無い。

境界は「`api` に約束を繋いでいるか」で引く。 `api.…()` に `.then` / `.catch` /
`.finally` を繋いだら、その場で「走っている最中か」「結果」「失敗した」を state で
持ち直しているということ。3つ持つと、どれか1つを消し忘れる。`queryFn` と
`mutationFn` の中では繋がないので、この形だけを見れば構文木を組まずに見つかる。
検査は `bun run check:ipc`。例外は理由つきで allowlist に書く——Channel の開閉、
待ち数の予約、canvas の実測から幅が決まる描画要求の3つ。

MIT。 依存は `@tanstack/react-query` の1件で、ルータと同じ作者・同じ配布元。
'''
