schema = 'decision'
id = 'DEC-REC-001'
constraint_label = '音声 I/O'
constraint = 'OS 側の音声加工を無効化する経路へ到達できること'
title = '音声 I/O は各 OS の API を直接叩く。抽象レイヤを挟まない'
status = 'accepted'
owner = 'dino3616'
options = [
  "各 OS の API を直接叩く",
  "miniaudio (FFI)",
  "cpal",
]
selected = '各 OS の API を直接叩く'
rationale = '''
必要なのは OS 側の音声加工を無効化する経路へ到達できることで、特定のモードではない。
Windows でその経路は排他モードと、共有モード + AUDCLNT_STREAMOPTIONS_RAW の2つがある。
KOERU は後者を既定に採る（フォーマット一致を取りやすく、他アプリの音を止めない）。

cpal はそのどちらにも到達できない。 排他モードに未対応で、SetClientProperties のような
バックエンド固有の制御も露出していない。

miniaudio を経由する理由が薄い。 TR-REC-39(e) が「ネイティブハンドルへ公開 API から
到達できる」ことを要求しており、その先の TR-REC-08〜12 が要求するのは、
`IAudioEffectsManager` / `GetAudioEffects`、`IAudioClient2::SetClientProperties`、
`AVCaptureDevice.activeMicrophoneMode`、PipeWire のノード選択と `node.latency` 指定。
どれも抽象レイヤが出すものではない。 miniaudio が省いてくれるのはデバイス列挙と
コールバックの配管だけで、肝心なところは結局3回書く。

加えて、抽象レイヤを挟むと依存が1つ増える。 miniaudio はアーカイブされておらず活発だが、
個人のリポジトリ（owner が User）である。単一ヘッダの Public Domain / MIT-0 なので
放棄されても vendoring できるが、**もともと省ける配管しか省いてくれないなら、
その1つを持つ理由がない。**

束ねる相手は組織がメンテしているものに限る。
Windows は windows-rs（Microsoft、Apache-2.0 / MIT）、
macOS は coreaudio-rs（RustAudio org、Apache-2.0）、
Linux は pipewire-rs（freedesktop.org 公式、MIT）。

macOS だけは、束ねる相手が無い。 `coreaudio-rs` は RustAudio org だが、
中身は `objc2-core-audio` 族（個人のリポジトリ）で、依存木に16ノード入る。
Apple の interop で組織がメンテしている crate 族は存在しない。

そこで CoreAudio の HAL だけ自前で `extern "C"` を書いた。
`AudioObjectGetPropertyData` 系は Objective-C ではなく素の C API なので、
宣言は100行そこそこで足りる。依存を1つも増やさずにデバイス列挙と生死判定が通った。

**`AVCaptureDevice`（マイクモード検知 TR-REC-11、マイク権限 TR-PLT-18）だけは
Objective-C なので、自前では書けない。ここは objc2-av-foundation を足す。**

検知を諦める案は採らない。 macOS の voiceIsolation が有効だと OS が全キャプチャに
ノイズ抑制と音声強調をかけ、アプリから standard へ戻すことはできない（TR-REC-11）。
検知できないと、本人の声ではない音が本人の声として録れて、誰も気づかない。

[Risk] objc2 は個人のリポジトリ。 ただし **Tauri が objc2 / objc2-app-kit /
objc2-foundation / objc2-web-kit を既に引く**ので、アプリの依存木は増えない。
増えるのは koeru-audio 単体の木だけ。
'''
