rationale = '''
**同じ命題が2箇所にあった。** TR-PKG-22 が上下関係を有向グラフとして宣言し、
TR-PKG-23 が「エイリアス被覆が 100% のときのみ許可」と定めていた。**判定基準は後者だけで足りる。**
TR-RCL-21 も「可能性を台帳から判定する」と書いており、正本はカバレッジ台帳にある。

**多音階を方式に混ぜていたのも誤り。** TR-RCL-01 はプリセットを (a) 収録方式 CV/VCV/CVVC と
(c) 収録音高の本数に分けている。音階数は独立した軸で、削減は別のエイリアスを要求するのではなく
prefix.map の割り当てが減るだけ。旧仕様の ASSUME-1 は4つを対等な方式として並べていた。

**逆方向の禁止は、宣言しなくても構造上出てこない。** 連続音が要求する VCV エイリアスを
単独音の素材は決して持たないので、被覆が原理的に 100% にならない。
FSL は method-coverage.fsl でこの導出の側を検証する（proved）。

2軸として明示的に持つ案を採らなかったのは、**それでも被覆判定と二重になるから。**
意図の宣言は要件の文章が持てばよく、データとして持つ必要がない。
'''
