rationale = '''
**破綻の原因は数値の大きさではなく、足し方だった。** align 500 + synth 512 + editor 512 +
undo 200 = 1,724MB で上限 1,500MB を 15% 超えていたが、**収録中と編集中は同時に成り立たない。**
同時に常駐しない工程を足していた。

モードで割ると山は編集中の 1,456MB になる（共通 616 + editor 512 + undo 200 + synth 縮退 128）。
収録中は 1,176MB。**上限内に収まる。**

**align の 500MB は 64MB へ落とした。** 実測（4秒テイクで 13.5ms、重み 1.25MB）から見て2桁過大で、
これだけで 436MB が浮いた。**過大確保は予算を守っているように見えて、他の工程を圧迫する。**

**WebView の 400MB は実測ではなく枠。** Tauri のフロントは OS の WebView を別プロセスで持つので
（DEC-PLT-001 の帰結）、ここが空欄のままでは他をいくら詰めても意味がない。数値を置いて
検算できる形にした。**残る余裕は 44MB しかない。**

上限を引き上げる案は採らない。8GB 搭載機で他アプリと共存するという前提そのものが、
ミナの利用環境（学生、専用機材なし）から来ている。

`check-budgets` に `mode` の集計を足し、モードごとの合計の最大値を上限と比べるようにした。
'''
