selected = 'M5（方式を広げる）へ送る'
rationale = '''
Julius が本来効くのは連続音・CVVC で、M3 は単独音だけ。 単独音は音素列が
`[pau, C, V, pau]` の2〜3境界しかなく、`segment.rs` の音響モデルを使わない実装でも
oto は出ている（M2 の試唱がその上で動いている）。**M5 で連続音に広げるとき、
Julius が効く領域と一緒に入れるのが順序として自然。**

Julius は、想定しているリスクに対して弱い保険だった。 DEC-ALN-008 の撤回条件は
2つあり、そのうち「学習コーパスの条件が派生モデルへ及ぶという法的見解が定まったとき」に対しては、
Julius も同じ問題を抱えている。 models.toml のとおり Julius は
`corpus_status = "unverified"`（出所そのものが未確認）で、MFA は「何が問題か分かっている」状態。
見解が定まったら、未確認のほうが弱い立場になる（確認できるまで最悪を仮定するしかない）。

Julius が実際に守るのは「MFA だけが個別に引っ込む」場合に限られる
（MFA がモデルを取り下げる、GlobalPhone / TEDxJP-10K の権利者が MFA を名指しする）。
その筋のためだけに、MFA でやったのと同じ量の作業をもう一度払うのは早い。

licensing の筋で本当に独立な戻り先は2つ。 モデルを一切使わない `segment.rs` と、
重みが Public Domain 宣言の snfa（CMP-001、採用候補のまま）。
前者はもう動いている。 後者へ差し替える判断は、必要になったときに取る。

落とさないのは、連続音で効く見込みが残っているから。 TR-ALN-04 を削除すると、
M5 で「音響モデルの戻り先が要る」と気づいたときに、何を検討したのかが文書から消える。
'''
