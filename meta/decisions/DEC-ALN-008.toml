selected = 'MFA を同梱し、Kaldi を Rust から直接リンクする'
rationale = '''
**MFA は精度が最良と実測されている唯一のアライナである。** TR-ALN-01 notes が
「この境界を守ると、精度が最良と実測されている MFA のランタイムを使えなくなる」と書いていたのは、
Python / Conda / Kaldi ランタイムを前提にしていたため。**その前提が MFA 3.0 で変わった。**

**Python は要らない。** MFA 3.0 は Kaldi のバイナリを呼ぶ方式をやめ、kalpy（pybind11）経由で
**Kaldi の共有ライブラリを直接呼ぶ**形になった。pybind11 でできることは C シムを書けば Rust からもできる。
**Kaldi は Apache-2.0 で `deny.toml` の allow に載っており、OpenFst も Apache-2.0。**
PostgreSQL も MFA 3.x では既定オフで、標準は SQLite。
**TR-ALN-01 の実行時ランタイム境界（Python / conda / 外部 DB サーバ / 常駐プロセスを含めない）は
そのまま守れる。**（→ EVID-ALN-001）

**ライセンスは DEC-SYN-004 と同じ判断で通す。** モデル自身の表示は CC BY 4.0 で明示されている。
**[Risk] 学習コーパスに GlobalPhone Japanese（ELRA の有償ライセンス、再配布不可）と
TEDxJP-10K（TED / TEDx は CC BY-NC-ND、非商用かつ改変不可）が含まれる。**
Common Voice ja は CC0、JVS は比較的軽い。Microsoft Speech Language Translation Japanese は未確認。

**学習コーパスの条件が派生した重みへ及ぶかは法的に定まっていない。** AGENTS.md の
破ってはいけないもの #4 は「上書きできるとは限らない」と注意を促すもので、禁止ではない。
**この件では配布者の表示を額面どおり受け取る。判断であって、確実性の主張ではない。**
SwiftF0（DEC-SYN-004）、Julius の `.binhmm`（DEC-ALN-004）に続く3件目で、扱いを揃える。
**TR-ALN-31 の例外条項に MFA を加える。黙って通さない。**

**CC BY 4.0 は MIT と違い帰属表示が義務である。** アプリ内のライセンス表記に、MFA 本体と
5つの学習コーパスを載せ、変更の有無を明示する。TR-ALN-31 の台帳がその置き場になる。

**予算は上げる。** 展開後 97.0 MiB（うち 95.8 MiB が `final.alimdl` と `final.mdl`）。
Julius の 3.6MB、snfa の 1MB とは桁が違う。
- 同梱物: 50MB → **100MB**（TR-ALN-02 / TGT-ALN-003 / TGT-PLT-003）
- align のピークメモリ: 64MB → **160MB**。**2つのモデルを常駐させる**（TGT-ALN-004）。
  逐次ロードなら 112MB で済むが、TR-ALN-10 の逐次推定でテイクごとに 48MiB を読み直すことになり、
  TGT-ALN-001（1テイク p95 300ms）と TGT-ALN-005（ロード → 初回推定 200ms）を割る
- **配分は BUDGET-MEMORY-001 の editor（512MB → 416MB）から回す。** note が
  「枠を割るならここから削る」と名指ししていた行で、Q-EDT-001 が既にディスクキャッシュ前提への
  変更を要求している。**上限 1500MB と「8GB 搭載機で他アプリと共存」という scope は動かさない。**
  編集中の山は 1456MB のまま変わらない
- インストーラ: 120MB / 110MB → **300MB / 250MB**（TGT-PLT-001 / TGT-PLT-002）。
  モデル 88MiB ＋ Kaldi 約30MiB ＋ 本体 ＋ Windows は WebView2 固定版。**実測ではなく枠**

**Julius と単独音ヒューリスティックは退避として残す。** DEC-ALN-001 / DEC-ALN-004 / DEC-ALN-006 を
撤回しない。MFA が覆ったときの戻り先が2段残り、**MFA の統合が終わるまで M2 の試唱も止まらない**
（いまの oto は `koeru-synth` の segment が出している）。同梱物は 97MiB ＋ Julius 3.6MB になる。

**到達水準は宣言しない。** TR-ALN-05 は MFA を「研究・評価の基準線としてのみ用いる」と定めていたが、
**MFA 自身が本番になると、比較する上位の基準線が消える。** TGT-ALN-007 の暫定参照値
（MFA の CSJ 実測 10ms 以内 63.44%）も、自分自身の数字になるため成立しない。
**基準線を持たず、精度を対外的に宣言しない。** 根拠にするのは
「最も良いと実測されているものを使っている」という事実だけにする。DEC-ALN-007（評価ハーネスを M6 へ）と整合する。
'''
