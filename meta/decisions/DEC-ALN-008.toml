constraint_label = '強制アライメントの一次経路'
constraint = '同梱するモデルは、配布者の表示が明示されていること。実行時に外部ランタイムを要求しないこと'
title = 'MFA 日本語音響モデルを同梱し、Kaldi を Rust から直接叩く。上流コーパスの条件は判断で通す'
status = 'accepted'
owner = 'dino3616'
options = [
  'MFA を同梱し、Kaldi を Rust から直接リンクする',
  'Julius のまま進む（DEC-ALN-001）',
  'MFA は開発時の基準線としてのみ使い、同梱しない（TR-ALN-05 の従来案）',
  'snfa を移植する',
