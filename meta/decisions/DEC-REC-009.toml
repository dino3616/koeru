rationale = '''
`Q-REC-004` と `Q-REC-003` を、画面を作り直す機会にまとめて閉じる。

## 入力レベル（`Q-REC-004`）

`DEC-REC-008` は観測をフラットに報告するだけと決めたのに、**ライブのメーターだけが
「割れている」「小さすぎる」「ちょうどよい」を出していた**。確定したテイクには生の数値しか
出さないので、同じ画面の中で鳴っている音は判定され、録れた音は判定されない状態だった。

**語だけ外すと、判定が色だけに残る**（`TR-PLT-28` を割る）。だから区分ごと外す。
`<meter>` の `low` / `high` / `optimum` を持たせない——持たせると支援技術に
「よい範囲かどうか」が届き、`DEC-REC-008` と食い違う。色も1色（段 11）にした。

残すのは観測だけ。 いちばん大きいところ（%）と、割れた回数。
**「いちばん右まで届くと、音が割れます」は残す**——評価ではなく、起きることの説明。

**校正だけは別扱い。** `TR-REC-14` は目標範囲（ピーク -12〜-6 dBFS）を持つ工程として
定義されているので、そこで範囲を示すのは判定ではなく手順。合ったかどうかも工程の結果として出す。

## 行 ID（`Q-REC-003`）

`TR-REC-18` の「発声を待っている面」を、**収録に関わる面すべて**と読む。
行 ID（`s001` など）は画面のどこにも出さない。読み上げの名前にも入れない。

行はテキストと並び順で指す。 同じ読み上げ文字列の行が複数あるときに区別できなくなるが、
**単独音の録音リストでは仮名が一意**（`koeru_core::inventory` の `仮名は一意` が検査している）
なので、いまの方式では起きない。方式が増えて同じテキストの行が並ぶようになったら、
人間向けの通し番号（(c) 案）へ移る。

**識別子は経路の引数としては持つ。** `/take?row=…` は画面ではない——Tauri に
アドレスバーは無く、本人の目には触れない。横移動（`TR-PKG-51`、`TR-ALN-27`、`TR-RCL-17`）が
行を名指しできないと成立しないので、ここまでは削らない。

## 原音設定の5値も言い換える

同じ規則を oto の5値へも当てる。 既定では「頭の余白 / 歌い出しの位置 / 前の音との重なり /
伸ばさないところ / 終わりの余白」と書き、エイリアスも `offset` などの語も出さない。

**本人が「数値で見る」へ切り替えられる。** 上級者が数値を直接触れることは
`docs/product-vision.md` が求めていて、切り替えた先では元の語と生値を出す。
**この切り替えは要件に無い**ので、ここで決める：既定は言い換え、切り替えは本人の操作、
切り替えた状態を音源に保存しない（次に開くと言い換えへ戻る）。
'''
