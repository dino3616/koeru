## 決めたこと

録る対象は次の3つの組で決まる。 綴りの規則（`presamp.ini`、`TR-SYN-36`）を通さずに、
方式と行の並びだけから導ける。

- 音高（`TR-RCL-26`）
- 方式の上の役割。CV・渡り（VC）・語尾（`TR-RCL-05`）
- 音素の文脈。CV なら直前の母音か語頭か文脈なし、渡りなら母音と次の子音、語尾なら母音

エイリアスは、この鍵を作成時に固定した rules（`DEC-SYN-013`）で描いた表現。
rules が2つの鍵を同じ綴りに畳むとき（CVVC の2音目以降の CV は直前の母音を問わず素の
CV になる、など）は、被覆の上で同値として数える。 同値かどうかは、鍵と rules を
受け取る明示の関数が決め、文字列の比較に任せない。

## 段取り

T02 は純粋な型と関数だけを `koeru-model` に作る。 今の行の綴り
（`reclist::row_entries`）は、この鍵を描いて重ねを除いたものと一致することを試験で
固定する。 台帳の鍵（`row_aliases` / `oto_values` / `take_boundaries` の alias の列）を
差し替えるのは、T04 の移行で行う。

## 採らなかったもの

番号を振る案は、改名にも同値にも強い。 ただし既存のプロジェクトを移すとき、どの綴りを
どの番号に写すかを綴りから推し量ることになり、構造の鍵を一度作るのと同じ仕事が要る。
構造の鍵はいつでも導き直せるので、番号が要ると分かってから足せる。

文字列を型にするだけの案は変更が最小だが、改名のたびに全部の表の鍵を付け替える
処理が要る。 付け替えを1つ忘れると、そこだけ別の綴りを指す。
'''
