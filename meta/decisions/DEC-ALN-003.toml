selected = '合計所要時間5分'
rationale = '''
**件数で切ると、方式ごとに別の数を持つことになる。** 単独音と連続音では1件の重みが違い、
多音階では件数がそのまま音階数倍に膨らむ。時間で切れば、方式が変わっても本人の負担は
変わらない。定義は TR-ALN-25 に一本化し、editor 側（TR-EDT-07 / TR-EDT-45）は参照だけにする。

**5分は「怪しいところだけ確認すれば済む」を成り立たせる側の値。** KOERU は原音設定の
自動化を中核方針に置いているので、確認が長いほど方針そのものが崩れる。15分は拾いを
厚くできるが、自動化の意味が薄れる。

上限を超える件数が低確信度と判定されたときは、個別確認ではなく「まとめて確認」または
「録り直し提案」に切り替える。**上限を超えたぶんを黙って捨てない。**

数値を置かずに待つ案を採らなかったのは、置かないと ALN / EDT の両方が別々の想定で
実装に入るから。**実測が出たら書き換える。それが review_triggers の役目。**
'''
