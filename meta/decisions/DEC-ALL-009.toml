rationale = '''
実コードで発火するのは5規則のうち1つ。 本人の能力状況の記録が、残り4つは
手書きの決済フィクスチャ専用で「任意の実コードでは発火しない」と書いている。
モデル連携は未実装（登録されたモデル評価数 0）で、所見を人の見る面へ昇格できない。
v0.1.0 の公開は 2026-09-15。

読めるのは Rust の本番コードだけで、構文どまり。 型解決・trait・crate 跨ぎの
参照は対象外。KOERU の WebView 側は最初から範囲の外にある。TypeScript 対応は
着手されたと聞いているが、公開リポジトリにはまだ出ていない。

持ち場が被る。 ReviewSpace と EvidenceSpace は、KOERU では `meta/` と FSL が
持っている面。並べると同じ命題が2箇所に住み、片方だけが変わる。

出自も違う。 KOERU の ID は人が採番する意図の台帳で、ReviewGraphen の obligation は
正規化したタプルから決定論的に導出される。同じ空間に混ぜると ID の意味が壊れる。
乗せるなら一方向——meta を入力（profile / policy）として写すだけで、
出力を meta へ書き戻さない。ただし外部 TOML の形は未定義で、書くのは利用側になる。
rule pack も今は固定なので、写す先が無い。

作者への経路はある。 同じ Slack にいるので、詰まったら聞ける。これは alpha を
触る判断では効く材料だが、今はまだ「触って得るもの」の側が無い。

Apache-2.0。 取り込むなら `deny.toml` の許可リストに載っている。
'''
