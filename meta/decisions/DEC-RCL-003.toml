schema = 'decision'
id = 'DEC-RCL-003'
constraint_label = '進捗と課題曲'
constraint = '本人が、いま音源がどこまで届いているかを常に読めること'
title = 'カバレッジと歌える曲を常時両方見せ、曲は入口としてだけ使う'
status = 'accepted'
owner = 'dino3616'
options = [
  'カバレッジと歌える曲を常時両方',
  '歌える曲の数を主指標にする',
  'カバレッジのみ',
]
selected = 'カバレッジと歌える曲を常時両方'
rationale = '''
**「歌える曲の数」を主指標に置くと、曲バンクを持つことになる。** そこに無理がある。
同梱できるのはパブリックドメインの伝承曲か自前のオリジナルに限られ（TR-RCL-12）、
**それが「本人が知っている歌」である保証はない。** 数を揃えるほど権利と選曲の負担が増え、
しかも増やしたぶんだけ本人に刺さるとは限らない。

**曲は入口としては強いが、到達点ではない。** 録り始めのとっかかりで「自分の声が歌った」を
届けるのは、この製品の中核そのもの（HMW 2）。だがカバレッジが上がってくると、本人が欲しいのは
**残りを最短で埋める順番**であって、次にどの曲が歌えるかではない。

**旧設計はそこで本人の利益に反していた。** TR-SYN-19 が「課題曲と録音リストの順序を同時に設計する」
と定めており、**録る順番が最後まで曲に最適化されたままだった。** 2段構えに変える。
**曲バンクを満たすまでは曲に合わせ、バンクの全曲が完全になったら被覆効率の順へ切り替わる。**
本人はいつでも明示的に切り替えられ、**切り替えは可逆。** 戻したくなる場面が実際にある
（新しい曲を足した、特定の曲を先に仕上げたい）ので、片道にしない。

**カバレッジを隠していたのも行きすぎだった。** TR-REC-18 の「進捗は録音リストの用語で見せない」は、
用語を隠す規則として書かれたのに、到達度そのものを隠す規則として効いていた。
**隠すのは内部表現の名前であって、進み具合ではない。**

曲バンクは KOERU が持たず、**本人が持ち込む UST / USTX から構成できるようにする。**
ファイル全体でも任意のノート群でもよく、複数をまとめて自分の曲バンクにできる。
**選曲の判断が本人に戻るので、権利の問題も「知らない曲ばかり」の問題も同時に消える。**
持ち込んだ曲データは配布パッケージにも利用計測にも載せない。
'''
