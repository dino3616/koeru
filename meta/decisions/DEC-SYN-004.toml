selected = 'SwiftF0 を採用する（重みの MIT 表示を受け取る）'
rationale = '''
**重みは MIT で明示されている。** `lars76/swift-f0` の LICENSE は MIT で例外規定が無く、
`model.onnx`（398KB）がリポジトリ内にあり、`MANIFEST.in` が `recursive-include swift_f0 *.onnx` で
明示的に同梱している。**著者は重みを MIT として配っている。**

**性能差は実在する。** 12手法のベンチマーク（lars76/pitch-benchmark）で SwiftF0 は平均 90.2% と最良。
最良の古典手法 Praat が 84.7%。**歌声（MIR1K / Vocadito）では差が 2〜4 ポイントだが、
雑音下（PTDBNoisy）では 74.0% 対 65.3% で約 9 ポイント開く。**
KOERU の想定録音条件（イヤホンマイク・家庭のノイズ）は後者に近い。

**[Risk] 学習コーパスに非商用限定が含まれる。** MDB-stem-synth は CC BY-NC 4.0（元の MedleyDB は
CC BY-NC-SA 3.0）、MIR-1K はライセンス非公開で利用には著者への直接連絡が要る。
NSynth（CC BY 4.0）と PTDB-TUG（ODbL）は問題ない。

**「学習コーパスの条件が派生した重みへ及ぶか」は法的に定まっていない。** AGENTS.md の
破ってはいけないもの #4 は「上書きできるとは限らない」と注意を促すもので、禁止ではない。
**この件では著者の表示を受け取る。** 判断であって、確実性の主張ではない。

学習し直す案は採らない。95,842 パラメータと小さいが、**学習コードが公開されておらず、
論文からの再実装になる。** 個人開発で払う量ではない。

**この決定で ONNX Runtime を積む。** SwiftF0 の推論に要る（TR-PLT-19 の配布サイズに効く）。
'''
