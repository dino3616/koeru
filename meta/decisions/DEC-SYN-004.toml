rationale = '''
**DEC-SYN-001 が「学習コーパスのライセンス監査を前提条件とし、不合格なら Harvest に戻る」と
書いてあった。監査した結果、不合格。** 予定どおり戻す。

SwiftF0 の学習コーパスは NSynth / PTDB-TUG / MIR-1K / MDB-STEM-Synth / SpeechSynth の5つ。
このうち2つが通らない。

- **MDB-stem-synth は CC BY-NC 4.0（非商用限定）。** 元の MedleyDB も CC BY-NC-SA 3.0
- **MIR-1K はライセンスが公開されておらず、利用には著者への直接連絡が要る。**
  「調査中」ではなく「全権利留保」として扱う（EVID-LIC-001 の方針）

NSynth（CC BY 4.0）と PTDB-TUG（ODbL）は問題ない。SpeechSynth は SwiftF0 自身の合成データ。

**重み側に CC BY 4.0 の表示がある、という前提も正確ではなかった。** arXiv 上の CC BY 4.0 は
**論文の**ライセンスで、配布されている重みの条項は示されていない。
仮に重みが CC BY 4.0 だとしても、**モデル側の表示ライセンスが学習コーパスの条件を
上書きできるとは限らない**（AGENTS.md の破ってはいけないもの #4）。

初回ダウンロードにする案は採らない。オフライン完結（TR-PLT-20）に反し、
配布物に入れないだけで利用者が非商用限定のモデルを使う状態は変わらない。

**この選択で ONNX Runtime を積む理由が消える。** TR-ALN-02 が「ONNX Runtime を同梱した推論は、
将来 ONNX を必要とする別の機能が入った場合にのみ再検討する」と定めており、アライナは
自前実装が既定（Julius / DEC-ALN-001）。**SwiftF0 が唯一の理由だった。配布サイズが縮む。**

**失うもの: ノイズ耐性。** SwiftF0 を選んだ理由は、イヤホンマイクと家庭のノイズという
録音条件で効くと見たからだった。Harvest でその条件にどこまで耐えるかは実測していない。
'''
