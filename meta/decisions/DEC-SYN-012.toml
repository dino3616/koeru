rationale = '''
`TR-SYN-15` は「課題曲全体を半音単位で自動移調する。**ユーザーにキーを
選ばせない**」と定めていた。実装もした——`range_fit` が -12〜+12 を探索し、
いちばん収まるものを当てていた。**やめる。**

## 本人の判断を欺いている

試唱の目的は「この曲でこの子の声はどう聴こえるか」を確かめること。
入れた曲を黙って別の調にすると、**確かめた結果が別の曲のものになる。**
本人は自分が入れた曲を聴いたつもりでいる。

実装はもっと悪かった。 移調量を `SongView.transpose` で画面まで返していたのに、
**画面がそれを1文字も出していなかった。** 裏で -12 して「いま歌えます」と
出していたことになる。

## 閾値に根拠が無い

そもそも何のために動かしていたのか。「最大シフト量 ±7 半音以内、
二乗平均 4 半音以内」に収めるため。**この数字に実測の裏付けが無い。**

`reclist.toml` の領域リスクがこう書いている。

> 単一音高で録った素材のピッチシフト許容幅（半音何個まで実用に足るか）が未確認。
> …resampler ごとの劣化量を測定した公開データは見つからなかった。
> TR-RCL-22 の +7 / -3 半音は推定値である

`TR-SYN-15` 自身も `confidence = 'Assumption'` で、notes に「±7 半音が実際には
広すぎ、単一音階音源での初回試唱が不自然に聞こえる可能性がある」と書いてある。
**根拠の無い数字を満たすために、本人の入力を書き換えていた。**

## 勧めるのは続ける

閾値が推定であることは、勧めてはいけないことを意味しない。 出すのは3つ。

- **いまのキーで何が起きるか** — 「録った高さから遠い音があります。
  引き伸ばすぶん、声が変わって聞こえます」。良し悪しは言わない（`TR-SYN-20`）
- **どのキーなら近いか** — 従来の探索をそのまま推奨値として出す。
  押せば当たる。押さなければ動かない
- **どの収録音高があれば、このキーのまま届くか** — キーを動かしたくない人の道。
  収録音高は作成時に確定する（`TR-REC-25`）ので、次に作るときの目安として出す

## 鳴らすことを禁じない

以前は `previewable` が偽なら「歌わせる」の的ごと消し、`sing_song` も
`synth.out_of_range` で断っていた。**どちらもやめる。**

根拠の無い線で「聴かせない」と決めていたことになる。 どうなるかは画面が
先に出していて、押すかどうかは本人。遠い音がどう聞こえるかは、
聴いてみるのがいちばん早い。

## 音符ごとのシフトは残る

単音階で A3 の素材から C4 を鳴らすには、その音符を上げるしかない。
**これは消せない。** 消したのは「曲全体のキーを勝手に変えること」だけで、
収録音高からのシフト（`tone::shift_for` の floor 割り当て）は変わらない。
