selected = '退避を持たず、無いときは名指しで欠かす'
rationale = '''
`DEC-ALN-015` で Julius を落とし、退避を `segment.rs` の1段に削った。
**その1段も落とす。**

## 退避が働く場面が、こちらの失敗しかない

MFA のモデルは配布物に同梱している（`DEC-ALN-012`）。読めないのは2つだけ。

1. submodule を取っていない開発ビルド
2. 梱包が壊れている配布物

どちらも**利用者の環境の問題ではなく、こちらの問題**。退避で埋めると、
その問題が見えないまま出荷される。

**実際に見えなくなっていた。** macOS の配布物で資源の場所を1箇所しか
探しておらず、全員が黙って退避経路で動いていた。退避が無ければ、
最初のテイクで気づく。

## 退避が扱えるのは単独音だけだった

`DEC-ALN-015` の時点で、`segment.rs` の退避は音素3つ以上を断るようにしてある。
連続音・CVVC では退避へ落ちた時点で oto が出ない。**単独音のときだけ
劣化した結果が出る**という、方式によって挙動の違う非対称な経路になっていた。

## 無いのはエラー

**退避を足さないだけでなく、無い状態で動かさない。** モデルが読めないのは
ビルドの失敗であって、利用者の環境の問題ではない。開発でも submodule を
取ってくるのが前提（`setup-koeru`）。

`Chosen::detect` は失敗を返し、`Studio::open` がそれを上げる。 起動で止まる。

一度は「起動は止めず、自動原音設定だけ行わない」形にした。 **それも駄目。**
収録を一通り終えてから「原音設定が1つも無い」と気づくことになり、
退避で埋めていたときと同じく、こちらの失敗が利用者の時間で払われる。

## 移植していない OS でも起動しない

MFA が使えない理由は2つある。 **どちらもエラーにする。**

| 種別 | 何が起きているか |
|---|---|
| `align.model_not_found` | submodule を取っていない、梱包が壊れている |
| `mfa.unsupported_platform` | その OS 向けの Kaldi をまだ組んでいない（`mfa/unsupported.rs`） |

後者はビルドのミスではない。 それでもエラーにするのは、**自動原音設定が
無いまま収録だけ進む形を作らないため。** 一通り録ってから「原音設定が1つも
無い」と気づくのは、退避で埋めていたときと同じ損の出方。

**`TR-PLT-01` と衝突する。** あちらは Windows を第一級の対応環境とし
「全機能が動作する」と定めているが、Kaldi を macOS にしか組んでいない
いまは Windows で起動しない。**隠さない**——`align.rs` の単体試験が、
組んでいない OS で名指しで失敗することを固定している。

解くのは Kaldi の移植。 席は用意してある（`mfa/unsupported.rs`。
「Windows と Linux は BLAS の引き方を書けば通る見込み」）。
退避を戻すのではなく、そちらを書く。

## 発声区間の検出は残る

`segment::detect_single` は残す。 これはアライナではなく、
波形のどこが発声かを見る道具で、次の2つが使っている。

- MFA が特定のテイクを追えなかったときの境界（`align_take` の中）
- 収録画面の表示

**落としたのは `HeuristicAligner`（アライナとしての顔）だけ。**
`AlignError::MultiMoraUnsupported` も、それを返すものが無くなったので消した。

## 戻り先は残っている

snfa（`CMP-001`、重みが Public Domain 宣言、採用候補のまま）。
MFA のモデルが取り下げられたときは、そちらへの差し替えを判断する。
'''
