## 1. 解析は同じプロセスの作業スレッドで走らせる

解析（F0・アライメント・oto）は同じプロセスの作業スレッドで走らせる。別プロセスにはしない。
ただし `JobRuntime` が受け取るのは計算の closure だけで、エンジンを知らない。
計算する口は差し替えられる——別プロセスへ移す日が来ても、`JobRuntime` の表・受理・
取消の手続きは変わらず、closure の中身が子プロセスへの要求に変わるだけ。

**走り始めた外部エンジンの呼び出しは止められない。** 取消は合図を立てるだけで、
区切りで合図を見る計算だけが早く抜ける。止められなかったことは、状態に
`JobCancelled.computationStopped = false` と正直に出す。`spawn_blocking` や
join を強制取消と呼ばない。

### 採らなかった案（別プロセス）

別プロセスは、kill で必ず止められ、落ちても本体を巻き込まない。一方で、入力と結果の
受け渡し・起動の確認・落ちたあとの起こし直し・試験が増える。今は、解析が固まる・落ちる
という記録が無い。無い実績のために先に払う費用ではないと判断した。
`catch_unwind` が C++ の segfault を回復できるとは考えていない（`00-architecture-report.md`
§7）——落ちる実績が出たら、そのとき別プロセスへ移す。見直しの条件は下の
`review_triggers`。

## 2. テイクの確定は当面、解析を待つ

テイクの確定の応答は当面、解析を待つ（同期待ち）。解析の完了を待たずに応答する形
（`AnalysisPending` と `jobEvents`）は T09 / T12 が決める。そのため `JobRuntime` は
完了を受ける口を2つ持つ。待つ口（`JobTicket::wait`）と、作業スレッドで回す口
（`JobRuntime::submit_notify` の callback）。どちらも同じ受理の手続きを通る。

## 3. 上限と期限は仮の値で、実測で決め直す

lane ごとの待ちの件数・申告バイト数・固まったスレッドの上限・終わった仕事の保持は、
定数で置いた**仮の値**で、根拠が無い。コメントにもそう書いた。決め直す手順は
`Q-PLT-006`。

期限を過ぎた仕事は、**失敗として返し、自動でやり直さない。** 走っていたなら、そのスレッドは
固まったと見なして lane から外し、代わりを1本立てる（固まったスレッドの数に上限を置く。
超えた lane は仕事を断る）。遅れて戻った結果は公開しない。

**保存済みテイクの解析は、上限に当たっても失敗にしない。** 上限を超えた仕事は
`OverflowPolicy::Defer` で脇に置き、空いたら昇格させる（`DEC-PLT-038` の「保存済みのものを
失敗と見せない」）。チャートのように誰も待たないものは断り（`Reject`）、同じ対象の再計算は
まとめる（`Coalesce`）。

## 4. lane の分け方

既定は2本。前景（`PostRecording`、`PreviewRequest`）と背景（`Reestimate`、
`ChartPrecompute`）。確定の応答が解析を待つので、長い背景の仕事の後ろに解析を並ばせない
（`00-architecture-report.md` §7 の「重要 control は別 lane」）。各 lane の作業スレッドは
1本で、増やす根拠は試験で示せたときだけ。重いエンジンの状態を複製しないため。

優先度の並びと意味は `TR-SYN-34` のまま、`workers.rs` から移した。**厳密な優先度で、
同じ段は先に積んだものから回す。** 高い段が途切れずに来れば低い段は待ち続ける（飢餓）。
これは今の意味の帰結として受け入れる。低い段は誰も待っていないので、待たされても困る人が
いない。待たせたくない仕事を低い段に置かない。

## 5. 公開の線形化点

結果の受理は `JobRuntime::publish` に集める。表のロックの下で、取消が先に確定していない・
試行が最新・貸与の仕事がまだ有効・計算が読んだ入力の印（`BasedOn`）が今の値と一致、を
1度に確かめて `Publishing` に遷移させる。そのあとロックを外し、呼び出し側の `admit` が
`ProjectRuntime::writer` を取って台帳へ書く。

- **計算に書き込み権限を渡さない。** 計算の closure が受け取るのは取消の合図だけ
- **ロックの順序は「表 → writer」の一方向。** `admit` は表のロックの外で走る。writer を
  握ったまま `cancel` を呼ぶと、公開の途中の取消が公開の終わりを待つので輪ができる。
  待ちには上限を置いてある
- **断る理由は値で返し、エンジンの失敗にしない。** 古い・取り消された・やり直された・
  貸与が閉じた、は `PublishRefused`。入力の印の不一致は仕事を `Failed`（`Conflict`）にする
- **貸与が生きているかの最終確認は `admit` の中の `ProjectRuntime::writer`
  （`RuntimeError::LeaseExpired`）が担う。** `JobRuntime` は `cancel_lease` 済みかしか知らない
- **成功済みを取り消しと偽らない。** 公開のあとの取消は `AlreadyCommitted` で、公開が返した
  受領証を返す。公開の途中の取消は、公開が終わるのを待って同じ形で返す

`BasedOn` は、計算が実際に読んだ入力だけを、名前と指紋の文字列で持つ。`JobRuntime` は
解釈しない。project 全体の版だけを比べると、無関係な編集で全部の仕事が捨てられる
（`DEC-PLT-034`）。計算が読んでいない入力が `current` に増えても古くならない。

## 最大の欠点

closure が `Arc<ProjectRuntime>` を自分で捕まえて書くことは、型では止められない。
止められるのは `JobRuntime` の側が書き手へ繋がる型を持たないことまでで、
`tests/jobs.rs` が `src/jobs/` を読んで見る。計算の側の規律は、呼び出し側のレビューが持つ。
