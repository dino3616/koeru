rationale = '''
**TR-RCL-02 と TR-RCL-03 が噛み合っていなかった。**
TR-RCL-02 は「OpenUtau の presamp 既定値（母音 7 / 子音 30、MIT）から機械的に導出する」と定め、
TR-RCL-03 は「141 または 168」と数を断言していた。

**実物を数えたら合わなかった。** presamp の子音表が担う仮名は 149 種で、
母音始まり5 + 撥音1 を足すと 149。**141 にも 168 にもならない。**

導出手順のほうを正本にする。**141/168 という数字は出どころが追えず、
「除外理由を音韻的な根拠として個別に書く」（TR-RCL-02）を満たせない。**

外したのは5拍で、いずれも音韻的な根拠がある。
- **ゐ / ゑ** — 歴史的仮名遣い。現代日本語の拍として出現しない
- **うぅ / いぃ** — 母音の重複表記。CV として独立した拍ではない
- **ヴぅ** — 「ヴ」と同じ拍。表記の揺れ

残り 144 を、外来語専用かどうかで分ける。**中核 102 / 拡張 144。**

**presamp の子音行の末尾フラグを読み違えていた。** `r=r,ら,る,れ,ろ=1` の `1` は
「1文字目を伸ばすか」であって無声破裂音の印ではない。**「ら」が無声破裂音になっていた。**
TR-ALN-16 が挙げる k / t / p / ky / ty / py から直接判定する形に直した。
ts / ch は破擦音で、閉鎖を持つが破裂音そのものではないので含めない。
'''
