rationale = '''
FSL は「再推定しても、固定した値は残る」（`REQ-ALN-007`）と言い、録り直しでも
固定した値が残る（`align-review.fsl` の `rerecord`）。 **何が残るかを決めていなかった。**

## 今の形で起きていること

`enqueue_take` は、古いテイクの固定した値を新しいテイクへそのまま写している。
5値のうち `offset` だけがファイル先頭からの絶対位置で、残りは `offset` からの相対
（`koeru_core::oto::Oto`）。 録り直すと、発声が始まる時刻はテイクごとに違う。
写した `offset` は新しい録音の別の場所を指し、固定しなかった値は新しい録音から
作り直すので、2つの録音の値が混ざる。

## 決めたこと

固定した `offset` を「発声の始まりからの距離」として持ち、新しいテイクで揃えた
発声の始まりに当て直す。 発声の始まりは、その綴りが乗るモーラの境界
（`TR-ALN-34` で残している境界）の `voice_start`。

- 相対の4値（子音部・先行発声・オーバーラップ・負の右ブランク）は、固定していれば
  そのまま写す。どれも `offset` からの距離で、当て直した `offset` に付いていく
- 正の右ブランク（ファイル末尾から）は、末尾からの距離としてそのまま写す
- どちらかのテイクで発声の始まりが分からないとき（揃えられなかった、境界が無い）は、
  絶対位置のまま写し、確認キューへ戻す。 黙って当て直したことにしない

`REQ-ALN-007` の「固定した値は残る」を「録音の中の同じ意味の位置が残る」と読む。
FSL は値を抽象しているので、命題は変えない。

## 採らなかったもの

絶対位置のまま写すと、発声の始まりが 100ms ずれただけで、固定した左ブランクが
子音の途中や無音の中を指す。 本人は「直したのに録り直したら壊れた」と見る。

値を写さない案は、固定した値が残らないので `REQ-ALN-007` と食い違い、FSL を
変えることになる。
'''
