selected = '''
指紋を内容の SHA-256 の型（`koeru_model::fingerprint::Digest`）にし、マスターの内容ハッシュを
`takes.master_sha256` に持つ。

- **値** — バイト列の SHA-256。 パスも更新時刻も混ぜない。 複数の欄は `Canonical` が
  「名前の長さ・名前・型の印・値の長さ・値」で並べ、先頭に用途の名前（版つき）を入れる。
  欄の意味を変えるときは用途の名前の版を上げる
- **入力の指紋**（`InputFingerprint`） — マスターの内容、読み、プリセット、計算器の識別
  （モデルの版を含む）、計算器のパラメータ、綴りの表の版。 どれかが変われば別の値になる
- **出力の指紋**（`OutputFingerprint`） — oto の5値、境界、`.frq` のバイト列を、綴りの順に
  並べ直して畳む。 計算が出した順や台帳から読んだ順で動かない
- **マスターの内容ハッシュ** — `takes.master_sha256`（NULL 可、64字の16進）。 確定の直後に1度
  だけ計算して書く。 書いたあとは変えず、先に書かれた値が残る
- **既存のテイク** — 移行では埋めず、NULL のまま残す。 要るとき（試唱の素材の鍵、推定し直しの
