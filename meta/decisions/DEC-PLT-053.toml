rationale = '''
`TR-ALN-29` は「入力のハッシュ・モデルバージョン・プリセットバージョン」を保存して再計算の
可否を決めると定めている。 `TR-SYN-02` は合成結果の鍵に素材の内容ハッシュを混ぜる。 どちらも
「同じ中身か」を言う値だが、実装は3通りに分かれていた。

- 推定の指紋 — 標本（`f64`）の SHA-256。 台帳に置いてある
- ジョブの入力の印（`BasedOn`） — `DefaultHasher`。 同じプロセスの中でしか比べられない
- 試唱の素材の鍵 — パス・大きさ・更新時刻の `DefaultHasher`。 中身を見ない

3つ目は、中身が変わっても大きさと更新時刻が同じなら鍵が動かず、古い合成結果が鳴りうる。
2つ目は、`DefaultHasher` の値が版や起動で変わりうるので、受領証や台帳へ置けない
（T08e が書き出しの受領証に指紋を載せる）。

## 採った案の理由

- 値が環境に依らず、受領証や台帳へ置いても意味が変わらない
- 試唱の素材の鍵が、毎回ファイルを開かずに済む。 試唱は1曲で数百音符を引くので、使うたびに
  マスターを読み直す案（案2）は、大きな WAV を何度も読む
- 1つの型で、台帳・ジョブ・受領証が同じ「同じ中身」の語彙を持つ

## 採らなかった案

### 案2: マスターの内容ハッシュを使うたびに計算する

移行も列も要らず、いちばん簡単。 採らなかったのは、試唱の鍵を引くたびにマスターを全部読み
直すことになるため。 キャッシュ（パスと更新時刻で引く）を挟むと、更新時刻だけを見る元の
鍵と同じ穴（中身が変わっても気づかない）が戻る。

### 案3: 永続化する値だけ SHA-256 にする

型が2種類になる。 「同じ中身か」を言う値のうち、どれが比べられてどれが比べられないかを
呼び出し側が覚える必要があり、ジョブの印を受領証へ載せたくなったときに置き換えることに
なる。 後から統一するより、先に1つにするほうが安い。

## 最大の欠点

台帳の値を信じるので、確定したあとのマスターを外から書き換えても、台帳の指紋は動かない。
試唱の鍵もジョブの印も古いまま残る。 マスターは確定したら変えない（`TR-REC-21` の
「既存のテイクを削除・上書きせず」）前提に立つ。 ファイルと台帳の食い違いを見つけるのは、マスターと台帳の
整合を確かめる側（`T04` の manifest、`T08e` の書き出し）の仕事で、ここでは見ない。

## 移行

`master_sha256` は NULL 可の列で、既存のテイクは NULL のまま残る。 SQL はファイルを読めない
ので、移行で埋めない。 埋めるのはアプリで、要ったときに1度だけ計算して書く。 移行の手順
（控え、別世代へ写す、確かめる、切り替える。 `DEC-PLT-041`）は変えない。 列を足す前に
録ったテイクの指紋は、最初の試唱か推定し直しで埋まる。

## 未決

- 出力の指紋を台帳へ永続化するか。 今は計算して試験で使うだけ。 受領証へ載せる（`T08e`）
  ときに、何を載せるかと合わせて決める
- 確定したマスターの中身を、使うときに台帳の値と照合するか。 照合すると、使うたびに読み直す
  ので速さが失われる。 整合の検査（manifest）を別に持つほうが安いが、その頻度は決めていない
- 入力の指紋を、既に置いてある推定の指紋（`take_fingerprints`）の代わりに使うか。 今は
  並べて持つ。 置き換えるには、移行と、再推定の判断（`TR-ALN-29` の「モデル更新時は、
  既存プロジェクトの推定結果を自動で上書きせず」）の読み替えが要る
