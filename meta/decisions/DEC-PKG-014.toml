rationale = '''
**下位方式では、同じ綴りを複数の素材が出せる。** 連続音の行はどれも複数の
モーラを含むので、単独音へ降りると `い` を出せる行が 30 以上並ぶ。
全部出すと `oto.ini` 横断でエイリアスが重なり、`TR-PKG-19` に反する
——書き出しの検査が `DuplicateAlias` で止める。

`TR-PKG-24` は「5値は下位方式の規約プリセットで再導出する」までを定めていて、
**どの素材から採るかを書いていない。** そこを埋める。

## 行頭は単独音の録り方にいちばん近い

行頭のモーラは無音に続く。 単独音の収録は1音ずつ間をあけて読むので
（`TR-RCL-03`）、前に音が無い状態がそのまま単独音の姿。

行の途中のモーラは先行母音から渡ってくる。 子音の立ち上がりが前の母音に
埋もれるので、単独音として切り出すと頭の欠けた音になる。

出どころが一意に決まるのも行頭のほう。 連続音の第1段は全単位を1度ずつ
行頭に置くので（`TR-RCL-21`）、綴りごとに行頭の素材はちょうど1つある。
途中のモーラを採ると、どの行のどのモーラかを別の規則で決めることになる。

## 未検証のまま残るもの

`TR-PKG-24` の notes が既に書いている——**連続音の語頭 CV は前後の文脈を
含むため、単独音として使ったときの先行発声・オーバーラップの許容幅が
実用に足るかは未検証。** ここで採る側を決めても、その問いは解けない。

`TR-RCL-21` の `- CV` をそのまま複製するのではない。 5値は対象方式の
規約プリセットで作り直す（`TR-ALN-34`）ので、語頭の子音区間を持ったままの
oto が単独音として配られることはない。残っているのは波形そのものの文脈。

## 本人に選ばせるのは、既定を置いてから

**既定は行頭。差し替えは後から。** 単独音は 144 綴りあるので、
最初から1つずつ聴き比べさせると、降りるだけで収録1回ぶんの手間になる。
既定で1本出せるようにして、気になった綴りだけ差し替えられる形を後で足す。

差し替えの操作面はまだ無い。 置くときは、綴りごとに候補（その綴りを出せる
素材とモーラ）を並べ、選んだものを台帳に持つ形になる。**選んだ事実は
台帳に持つ**——書き出しのたびに選び直させると、同じ台帳から違う配布物が出る。

## 同じ深さなら素材の名前で決める

並びが実行ごとに変わると、同じ台帳から違う配布物が出る（`TR-RCL-27` と
同じ向き）。行頭のモーラを持つ素材が複数あることは第1段の作りからは
起きないが、**選び方が決まっていないことと、起きないことは別。**

## 音高ごとに選ぶ

多音階は音高ごとに区画と `oto.ini` を分けるので（`TR-ALN-22`）、
音高を跨いで1つに絞ると、残りの区画からその綴りが消える。
`DEC-ALN-017` と同じ鍵の切り方。
'''
