rationale = '''
実測は着手前には済まない。 `Q-RCL-003` の閉じ方は「自分で各方式を録って実測する」で、
録音 UI が動いてからでないと取れない。方式選択画面はその前に要る。

1行 12.0 秒（6モーラ以下）で固定する。 超過ぶんはモーラ単位で足す。
単独音は「1単位あたりの実測サイクル × 単位数」の別式のまま（`TR-RCL-09`）。

この数が弱いことは承知の上で採る。 `Q-RCL-003` は、元の算出式
（1行あたり固定オーバーヘッド 8.3 秒＋発声 0.6 秒/モーラ）が OREMO のガイド BGM 制御ファイル
1つに全面依存していて反証されている、と記録している。12.0 秒もそこから導いた実務値で、
KOERU の録音 UI で測ったものではない。**`review_triggers` の1つ目がこの弱さを引き受ける。**

画面が成立するのは、主軸が時間ではないから。 `DEC-RCL-001` が方式選択の主軸を
「手作業が必要かどうか」に移している。所要時間は併記する1個の数で、`TR-RCL-11` が
レンジではなく代表値を出すと定めている。桁が合っていれば選択の役には立つ。

残り時間もこの値から出す。 一度は実測から推定していたが、落とした
（`DEC-RCL-013`）。出どころを1本にする代わりに、残りは時間だけでなく
行数でも示す——時間は桁しか合っていないが、行数は数え上げなので正確。
'''
review_triggers = [
  '各方式を実際に録って所要時間を実測したとき。そこでこの数を置き換える',
  '方式選択の主軸が「手作業が必要かどうか」から動いたとき',
]
