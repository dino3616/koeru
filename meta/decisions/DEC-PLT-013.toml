schema = 'decision'
id = 'DEC-PLT-013'
constraint_label = '文字符号化'
constraint = 'CP932 の読み書きで、化けたものを黙って通さない'
title = 'CP932 は encoding_rs を採る。個人アカウントだが実質の保守主体は Mozilla'
status = 'accepted'
owner = 'dino3616'
options = [
  'encoding_rs を採る',
  'CP932 だけ自前実装する',
  '判定だけ自前で、変換は先送り',
]
selected = 'encoding_rs を採る'
rationale = '''
依存は組織が保守しているものを選ぶ、という方針の例外にあたる。
`encoding_rs` のリポジトリは hsivonen 個人アカウントにある。

それでも採る理由は、このコードが Firefox の符号化層そのもので、Gecko に vendored され、
ブラウザの実運用で叩かれ続けていること。個人が趣味で書いた小物ではなく、
実質の保守主体は Mozilla にある。**「個人リポジトリを避ける」の目的は
保守が止まる risk を避けることであって、アカウントの種別そのものではない。**

自前実装は可能で、KOERU が要るのは CP932 1つだけ（WHATWG の全符号化は要らない）。
表は Unicode Consortium の CP932.TXT から生成できる。それでも採らなかったのは、
変換表そのものより、化けたときの扱いが本体だから。置換文字を出さずに失敗させる、
書けない文字を全部挙げる、判定の順序を守る——ここを自前で正しく積む価値が薄い。

WHATWG の Shift_JIS は CP932 と完全に同一ではない（未定義バイトの扱いが違う）。
UTAU が読み書きする範囲では一致するが、これは検証で確かめるべき仮定として残す。
'''
review_triggers = [
  'encoding_rs の保守が止まったとき（自前実装へ切り替える。表は公有データから生成できる）',
  'WHATWG Shift_JIS と CP932 の差が、実際の UTAU 音源で表面化したとき',
]
