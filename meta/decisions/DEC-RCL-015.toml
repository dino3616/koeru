rationale = '''
`DEC-RCL-007` は「声質は検知せず、素材の由来を提示する」と決めた。
その由来が、下位方式の書き出し画面にこう出ていた。

```
録った回    4 回 · 12 日のあいだ
何回かに分けて録った音が混ざります。声の揃い具合は確かめていません。
```

**この数字を見せる理由が、声質の推測以外に無い。** 「4 回・12 日」から読めるのは
「声が揃っていないかもしれない」だけ。判定しないと言いながら、判断材料だけ置いて
本人に推測させている。**声質に関与していないのは字面だけだった。**

## 検知しないなら、材料も置かない

`DEC-RCL-007` の「検知できないものを、検知したかのように見せない」という制約は
正しい。**その制約を、こちらが破っていた。** 提示をやめるのが筋。

落とすもの——`Ledger::adopted_session_span`、`downgrade::Provenance`、
`Downgrade` の `sessions` / `span_days`、画面の「録った回」の欄と
「声の揃い具合は確かめていません」の1行、`TR-PKG-24` の由来の節。

残すもの——下位方式の書き出しそのもの（`DEC-RCL-002` が既に方向を決めている）と、
書き出し前の容量の提示（`TR-PKG-24` の別の要求）。

## 日時はテイクに置く

代わりに、テイクごとの録音日時を画面に出す。 `takes.recorded_at` は元からあり、
新しい計測は要らない。

**集計しない。** 「何回に跨るか」「何日空いたか」は出さない——それは由来の提示に
戻ることになる。1テイクに1つの事実として置き、どう読むかは本人が決める。
'''
