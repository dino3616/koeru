title = 'M2 では Harvest のまま進む。SwiftF0 は実測で差が聞こえてから入れる'
status = 'accepted'
owner = 'dino3616'
options = [
  'Harvest のまま進む',
  'M2 で SwiftF0 を入れる',
  '実測してから決める',
