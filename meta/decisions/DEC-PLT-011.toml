schema = 'decision'
id = 'DEC-PLT-011'
constraint_label = 'OpenUtau との関係'
constraint = 'OpenUtau で読み込めて、同じ音が鳴ること'
title = 'OpenUtau のコードは取り込まず、仕様として参照し、互換は CI で検証する'
status = 'accepted'
owner = 'dino3616'
options = [
  '自前実装のみ。互換は CI で検証',
  'OpenUtau のソースを vendoring する',
  '日本語 phonemizer だけ移植する',
]
selected = '自前実装のみ。互換は CI で検証'
rationale = '''
**KOERU は Rust、OpenUtau は C#。コード再利用と呼べる形が実際には存在しない。**
「移植」は結局のところ仕様を読んで書き直す作業で、成果物は自前実装と変わらない。
残るのは由来の明示と上流追従（手動マージ）のコストだけ。**払う理由がない。**

**互換性はコードの出所ではなく、出力で担保する。** CI に2つ置く。
(1) 生成した音源が OpenUtau の最新リリースで読み込めること。
(2) **同一の USTX・同一の音源・同一の合成エンジンで、OpenUtau と KOERU の出力が一致すること。**

**(2) がこれまで無かった。** 従来の保証は「読み込める」だけで、KOERU の試唱が OpenUtau で
鳴る音と一致する保証はどこにも無かった。KOERU の利用者は UTAU / OpenUtau の利用者なので、
**試唱は「この音源はあちらでこう鳴る」という約束**であり、約束が外れると F02 が嘘をつく。

エイリアス解決順（TR-SYN-12）とカバレッジ判定（TR-RCL-20）が OpenUtau の候補探索順と
一致することは、仕様参照として保つ。これはコードではなく振る舞いの互換。
'''
