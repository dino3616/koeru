rationale = '''
`DEC-RCL-005` が M2 から外して M5 へ送っていた。 その M5 に来て、積む理由が
見当たらなかった。

## 使う場面が無い

**`TR-RCL-14` を `depends_on` に持つ要件がゼロだった。** 参照しているのは
部品台帳と `DEC-RCL-005` とプロファイルだけで、どの機能もこれに載っていない。
画面の条文も無い。

想定していた入口は `TR-RCL-12` の「曲を持ち込む」経路の2本目。 いまは
UST / USTX ファイルだけ。**しかし歌詞を貼るだけでは課題曲にならない。**
`TR-RCL-12` は曲に「ノートごとの MIDI ノート番号と長さ」を要求していて、
歌詞テキストには音高もリズムも無い。

`TR-RCL-14` の notes が自分でそう書いていた——「同梱曲を UST / USTX で持てば
g2p は不要になるため、この機能が投資に見合わない可能性がある」。

## 戻す条件が引かれていない

`DEC-RCL-005` の `review_triggers` は2つだった。

- 漢字混じりの歌詞を貼り付けたいという要望が実際に出たとき → 出ていない
- アライナやアクセント推定で、同じ辞書が別の理由でも要ることになったとき →
  アライナは MFA に決まった（`DEC-ALN-008`）ので、この筋は消えた

## 代償

**漢字のまま書かれた UST は読めないままになる。** `mora::parse("桜")` は
`UnknownSyllable` で落ち、その曲は「歌詞を読めない」として弾かれる。

受け入れる。 UST の歌詞欄は「鳴らすエイリアス」なので、漢字のままでは
UTAU でも歌えない。そういうファイルは下ごしらえが済んでいない UST で、
KOERU がそれを救う理由は、いまのところ無い。

配布物は 20MB 増えずに済む。 辞書（naist-jdic で約 20MB、IPADIC で約 50MB）は
`TGT-PLT-001` のインストーラ予算に直接効く。そこには既に MFA のモデル 88MiB が乗っている。

## 消すのであって、送るのではない

送り続けると「いつか作る予定」が文書に残り、読む側はそれを前提に設計する。
**要る場面が示されたときに、そのとき要るものとして書き直すほうがよい。**
下調べの結果（jpreprocess が第一候補であること、辞書の大きさ）は
`DEC-RCL-005` の本文に残っていて、git が持っている。
'''
