rationale = '''
設問から定型文を生成する方式（旧 `TR-PKG-30`）を採らない。 生成した文面を
KOERU が出す以上、その文面が何を許して何を許さないかを KOERU が決めることになる。
法的有効性を表明しないと言いながら条文を書くのは、責任の所在が曖昧なまま
本人の名前で配られる文章を作ることになる。

**未記入でも書き出しを止めない。** 非公開のまま完成できることが製品の前提で
（`docs/product-vision.md`）、手元で確かめるだけの人に規約を書かせる理由が無い。
`TR-PKG-35` が「公開」「配布」「作者」を必須ステップにしないと定めているのと同じ線。

readme.txt の規約節は、書いたときだけ出す。 空の節を置くと、受け手には
「規約が無い」ではなく「書き忘れた」に見える。節ごと出さないほうが正直。
'''
