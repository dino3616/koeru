selected = '中央に「育っていく声」を置き、周りを操作にする'
rationale = '''
**目指すのはゲームのキャラクリエイトの感覚。** 中央に作っているものがいて、周りが操作で、
触るたびに反応が返る。現行の画面も、質感だけ差し替える案も、どれも作業画面だった——
次に読む文字があって、押す的があって、結果が下に並ぶ。**キャラクリは作業画面ではない。**

**中央にいる「声」は、本人の声の確認ではなく、その音源というキャラクター。**
`docs/product-vision.md` の Where が定めるとおり、KOERU は音源を育てる場であると同時に、
その音源と初めて出会う場でもある。**「私の声だ」と気づかせることは目的ではない。**

キャラクリの機構が本当に成立するのは原音設定のほう。 エイリアスが格子に並び、5値をいじると
声の出方が変わる（`TR-EDT-26`、`TR-EDT-18`、`TR-EDT-24`）。VRoid Studio の
「左に選択肢の格子、右にスライダー、中央にキャラクター」と構造が同じ（`EVID-UX-004`）。
**録音は生成なので、録る前は選べるものが1つも無い。格子が成立するのは録ったあとだけ。**

読み替えは製品の方針と噛み合う。 録音の途中でも歌が聴けるのはリアルタイムプレビューそのもの、
カバレッジと歌える曲が増えるのはステータスが育つこと、Own your voice は所有感のこと。

**環は子音行、閉じ具合が被覆。** 単独音の録音リストは子音行が揃うように生成される
（`TR-RCL-03`）ので、被覆を同心の環として描くと**声の形と音の地図が同じ図になる**。
中央の「聴く」はいつでも押せて、押すたびに歌う。

いじれるのは採用テイクの切り替え。 世代は既に積んである（`TR-REC-21`）。切り替えても
被覆は変わらない（`TR-RCL-25`）ので、**声の表情を選ぶ操作として安全に開放できる。**

**色と形は声から決定的に生成し、録るほど更新する。** 本人ごとに違う形になり、
一覧が名前と数字の羅列でなくなる（`Q-RCL-004` に効く）。UI のアクセントは固定で、
声の形の色だけが音源ごとに変わる——**ブランドは本人の声の色を名乗らない。**

写すのは複数の特徴で、色相・彩度・明度のすべてを使う。 音高帯・共鳴の重心・発声の長さを
まとめて色へ落とす。見分けがつきやすくなる代わりに、**なぜその色なのかを本人に
説明できなくなる。**

**[Risk] 彩度と明度に差が出ると、優劣に見える余地が生まれる。** 色相は一周するので
優劣が無いが、彩度と明度は素直に強弱として読まれる。`TR-SYN-20` が禁じているのは
比較を製品が出すことで、利用者が推し量ることまでは禁じていない——**違反ではなく残存リスク**
として引き受ける。

**[Risk] 環の大きさも同じことをする。しかも彩度や明度より強い。** 欠けに軌道を置かない
（1本も録れていない環は描かない）ので、描かれる環の外径が被覆に比例する。
**一覧では、被覆の違う音源が格子に並んで大小の比較図に見える**——実機では
14% の音源と 100% の音源が隣に座り、外径が 3 倍違っていた（`EVID-PLT-002`）。

**大きさは彩度や明度より強い量の手がかりだが、それでも引き受ける。** 環の順序を
外→内へ変えれば外径は一定になるが、そのとき「あ行から順に外へ育つ」という
図の読み方が失われる。育っていく様子が一覧でも見えることを取った。
撤回条件を下に足してある。

**ロゴは同じ視覚言語で、別に作る。** 生成規則のインスタンスにはしない。KOERU には声が
無いので、規則へ通す入力を作為的に決めることになり、「声から生まれた」という物語が
かえって薄くなる。**ブランドの形と、本人の声の形が、同じ列に並んで混ざらない。**

形式はシンボルとワードマークで、分離できる。 アプリアイコンと favicon にはシンボルだけを使う。
ワードマークの字面は KOERU のラテンのみ——リポジトリ名・パッケージ名・コマンド名と揃う。

**環は使わない。共有するのは線質だけ。** 環は本人の声の形の語彙なので、ロゴが使うと混ざる。

**シンボルに最優先で求めるのは、声の気配がすること。** 意味の正確さでも、覚えやすさでも、
小ささへの強さでもない。形そのものはまだ決まっていない（`Q-PLT-005`）。

既定は暗い面。 ミナもソラも深夜の自室で使う。明るい面も作るが、設計の基準は暗い側に置く。
Radix は段を両方に持っているので実装費用は変わらない（`DEC-PLT-022`）。

本文の書体も同梱する。 3 OS で顔を揃える。**日本語フォントの容量（サブセット必須）と、
AGPL-3.0-or-later に取り込めるライセンスかの判断記録が別途要る。**

演出は短く。 確定した瞬間にその行の環が伸びるのが見える程度。連続収録（`TR-REC-20`）では
数秒ごとに確定するので、毎回大きく動くとうるさい。

## 触れてはいけない線

`TR-SYN-20` が品質スコア・良し悪しの判定・他音源との比較・上達度を禁じ、`DEC-REC-008` が
観測をフラットに報告するだけと決めている。**スコア、ランク、実績、比較は出せない。**
環が閉じるのは「うまくなった」ではなく「録った」なので、収録量の表示として禁止に当たらない。

**キャラクリが楽しいのは評価されないからで、そこは製品の思想と同じ側にいる。**

## 実装で踏むもの

**声の形は SVG で描く。canvas では描かない。** 強制カラーモードでは OS が CSS の色だけを
差し替え、canvas へ描いたピクセルには触らない——図が元の色のまま取り残される
（`globals.css` に既に記録がある）。

環が伸びる演出には `prefers-reduced-motion` の経路が要る（`TR-PLT-33`）。

**環は五十音の行で、子音の音素ではない。** 中核セットの音素は 28 種あり
（`k` と `ky`、`s` と `sh` を別に数えるため）、そのまま同心の環にすると
線が 28 本になって、**閉じ具合が読めないモワレの円盤になった。** 拗音を親の行へ
畳んで 15 本にする（`koeru_core::inventory::kana_row`）。ここに書いてある
「あ行・か行・さ行……」も、画面の言葉（「ら行を録ると歌えます」）も、
もともと音素ではなく行を指している。

**並びは五十音順にする。** 録音リストの並びは presamp から機械的に導いた順で、
内側から 母音・ち・ぎ・つ・ぴ…… になる。どの環がどの行かを人が数えられない。

**線の本数は録っても増えない。** 増えるのは閉じ具合だけ。1音1本の目盛りにすると
100% で 102 本になり、同じ圧迫感が戻る。

## 完成との関係

環が表すのは `TR-PKG-34` の3条件のうち被覆だけで、そのままでは**環が閉じても完成しない
状態**が作れてしまう。`DEC-PKG-007` で条件を先に満たさせることにしたので、
**被覆が満ちた瞬間に必ず完成している。** 環が閉じることが完成の表示を兼ねる。

`handoff` を画面に出すかは `Q-PKG-002` に残す。
