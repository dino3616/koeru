selected = 'OS のファイルマネージャで見せる'
rationale = '''
`TR-PKG-45` の到達経路 (1) が未実装だった。 配り物は作れるのに、置き場所が
UUID のディレクトリ配下で、画面はファイル名しか出さない。**手渡せる形にする
（`PROFILE-M4`）と言いながら、手が届かない。**

書き出し先を選ばせる案を採らない。 `TR-PKG-45` が「フォルダ操作を要求しない」
と定めている。要求しないが到達経路は残す、というのがあの要件の形。

置き場所を画面に出す案も採らない。 同じ要件が「通常モードの画面にパスを
表示しない」と定めている。パスはアプリ層の中だけで解決し、画面へは
連番だけを渡す。

`tauri-plugin-opener` を足す。 tauri-apps org、MIT / Apache-2.0。
**JS へは口を開けず、Rust から関数を呼ぶだけ。** 画面から任意のパスを
開けるようにすると、パスを画面へ渡す経路ができてしまう。

`TR-SYN-01` の「外部プロセスを起動しない」には触れない。 あれは試唱の
7工程についての条文で、ファイルマネージャを開くことを禁じてはいない。
'''
