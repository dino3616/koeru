constraint = '録っている本人が、声が入っているかをその場で見て気づけること（TR-REC-43）。 見せるのは観測だけで、評価・警告・スコアを出さないこと（TR-REC-16）'
title = '収録画面から入力レベルの現在値と割れた回数の表示を外し、入力は中央の波形の欄だけで見せる'
status = 'accepted'
owner = 'dino3616'
options = [
  '入力レベルの現在値（メーター）と割れた回数を、波形の欄とは別に出す',
  '入力レベルの表示を外し、波形の欄だけで見せる（S04 のボード）',
  'メーターを残し、波形の欄を外す',
]
selected = '''
2つ目。 刷新のボード `S04-Record` を選ぶ。 波形の欄は、テイクが無いあいだは入っている音を流し、
確定したテイクがあればそのテイクの山を描く。
'''
rationale = '''
## なぜ外すか

S04 のボードは入力レベルのメーターを置いていない。 中央の欄に波形を大きく出し、録っている
あいだはその場で棒が伸びる。 声が入っていなければ棒が伸びないので、`TR-REC-43` の notes にある
「声が入っていないテイクが採用された」事故は、メーターが無くても波形の欄で気づける。

メーターを残すと、同じ観測（いま入っている音の大きさ）を2つの部品が別の形で言う。
しかもメーターは目盛りの色と針の位置で、事実上の判定として読まれやすい
（`TR-REC-16` の notes「レベル表示は目に入るだけで事実上の判定として機能してしまう」）。
波形だけにすれば、見えるのは形で、良し悪しを言う目盛りが無い。

割れた回数を収録中に出すのもやめる。 計測はテイクごとに続け、メタデータに残す（`TR-REC-16`）。
書き出し直前の関門（フルスケール到達の集計）も残す。 収録中に回数を出さなくても、壊れた成果物が
完成に届く経路はそこで塞がる。

## テイクが無いあいだ

`TR-REC-43` は「収録していない間も止めない」と書いていた。 これを、テイクが無いあいだは入っている
音を流し、確定したテイクがあればそのテイクの山を出す、に変える。 テイクを選んでいるのに入力を
流すと、欄に出ているのがどちらの音かが読めない。 入力を見たいときは新しいテイクを選べば流れる。

## 変えないもの

- テイクごとの計測（ピーク、RMS、フルスケール到達、DC、ノイズフロア）と、その保存
- 書き出し直前の関門
- 校正の画面のメーター（`InputLevel` の部品そのもの）。 外すのは収録画面に置いた1つだけ
'''
review_triggers = [
