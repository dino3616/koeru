selected = 'story を書き、@storybook/addon-vitest で実ブラウザに描いて axe を当てる'
rationale = '''
手書きの検査はやめる。 以前は accessible name の算出を自前で書いて11件を
assert していた。axe-core の規則の網羅には遠く及ばず、当たらない規則があることも
見えていなかった。story を書けば、その部品が自動で検査範囲へ入る。

実ブラウザで走らせる。 `color-contrast` は計算済みの色が要る規則で、
擬似 DOM では「判定不能」になり違反として上がってこない。実ブラウザなら
実際に画面へ出る色を測るので、計算した値と食い違う余地が無い。

`scripts/check-contrast.ts` は廃止した。 Radix パッケージの値を読んで
自前で比を計算していたが、実際に描いた色を測るほうが確か。段の網羅は
`palette.stories.tsx` が受け持つ——明暗を入れ子で並べて1つの story で測る。
story を分けない。 vitest 統合は既定の globals で1回ずつ走らせるので、
`theme` を切り替えた story を別に置いても片方しか回らない。

ここへ着くまでに踏んだもの。 どれも「検査が通っているのに何も見ていない」形で、
気づかないまま進める余地があった。

1. `@vitest/browser-playwright` を直接引くと、`vp check --fix` が
   `vite-plus/test/browser-playwright` からの import を自動で足し、
   識別子が衝突して設定が読めなくなる。tester が起動しないまま60秒で諦める。
   vite-plus が再輸出しているほうを使う。
2. vitest を上位に別途入れると、vite-plus 同梱（4.1.11）と二重になる。
   版を揃える。
3. 試験側の設定に Tailwind のプラグインを入れ忘れると、ユーティリティが
   生成されず背景色が解決できない。axe は `color-contrast` を「判定不能」と
   して報告し、検査は通る。
4. 設定を `vitest.config.ts` という名前で置くと `vp test` がそれを読み、
   擬似 DOM 側の試験を1つも拾わないまま緑になる。
5. `addon-vitest` を `addons` から外すと tester が配線されない。
6. `import "vite-plus/test/optional-types.js"` は実行時に解決できない。

試験ファイルを別に置かない。 axe が見る規則（`button-name` / `heading-order` /
`tabindex`）は story を描くだけで当たる。axe に規則が無い性質——`Card` が
名前つきで landmark になるか、`<meter>` が値と範囲を持つか、色だけで
伝えていないか——は `play` に書き、部品と同じ場所に置く。

`play` の `expect` は await する。 `storybook/test` の `expect` は Promise を
返すので、await しないと違反があっても落ちないことがある。lint の
`no-floating-promises` が拾う。

`region` は切る。 「ページの内容はすべて landmark の中にある」を見る規則で、
部品を1つだけ描いた story では常に違反する。画面全体の landmark は
`accessibility.test.tsx` が見ている。

CI ではブラウザをキャッシュする。 `~/.cache/ms-playwright` を lockfile の
ハッシュで引く。OS のライブラリはそこに入らないので、当たっても入れ直す。

## 追記: 段の網羅を書き直した（`DEC-PLT-028`）

押せるものの塗りとフォーカス環を無彩色へ移したので、cyan と jade で書かれていた
実測の並びを slate と声の色で作り直した。そのときに **`palette.story.tsx` が
声の色を1つも測っていなかった**ことが分かっている——`getComputedStyle` は
指定した色空間のまま返すので、`oklch(…)` で書いた色を `rgb(…)` の正規表現で拾うと
全部 0 になる。明るい面はそれでも 3:1 を超えるので、検査は緑のまま通っていた。

**7つ目の「検査が通っているのに何も見ていない」形。** 直し方は既に
`take-inspector` に書いてあった（1×1 の canvas へ塗って画素を読む）。
同じ落とし穴を、別の場所でもう一度踏んだ。
'''
