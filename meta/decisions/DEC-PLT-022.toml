constraint_label = 'アクセシビリティの自動検査'
constraint = '名前・役割・値とフォーカス順序を CI で検査すること（TR-PLT-25）'
title = 'Storybook の story を検査範囲にし、axe を実ブラウザで当てる。自前の配色検査は廃止する'
status = 'accepted'
owner = 'dino3616'
options = [
  'story を書き、composeStories で擬似 DOM に描いて axe を当てる',
  'story を書き、@storybook/addon-vitest で実ブラウザに描いて axe を当てる',
  '検査を手で書く（部品ごとに名前と役割を assert する）',
