schema = 'decision'
id = 'DEC-REC-008'
constraint_label = '録音の観測をどこまで出すか'
constraint = 'レベルとフルスケール到達を計測して記録するが、判定も指摘もしない（TR-REC-16）'
title = '機材と設定の不備も指摘しない。観測をフラットに報告するだけにする'
status = 'accepted'
owner = 'dino3616'
options = [
  'TR-REC-16 を改訂し、機材と設定の不備（音量不足・クリッピング）はテイク確定時に指摘する',
  'クリッピングだけ指摘する（後から直せない破綻はこれだけなので）',
  'TR-REC-16 を維持し、観測をフラットに報告するだけにする',
]
selected = 'TR-REC-16 を維持し、観測をフラットに報告するだけにする'
rationale = '''
制作者の公開記録に「マイクの位置取りが悪くて全部録り直ししないといけない」
「発音が間違ってて修正が効かない」が当たり前にあると書かれていて（`EVID-UX-003`）、
失敗の発見が試唱まで遅れる構造が実際に踏まれていることが分かった。
これを受けて `TR-REC-16` の禁止を緩めるかを検討し、緩めないことにした。

技術的には判定できる。 `TR-REC-16` は既にサンプルピーク・区間 RMS・フルスケール到達
サンプル数・DC オフセット・推定ノイズフロアの計測を義務づけており、クリッピングの規則は
要件の中に数式で書かれている。画面側にも閾値がある。**できないから出さないのではない。**

**割れた音や小さい音を特徴として使う制作者がいるかもしれないから、出さない。**
これが判断の理由。`TR-REC-16` が元々持っていた理由（`UC-F02-03` の「評価されずに
自分の声を聴ける」、ソラのカウンターペルソナ）よりも広い。上手い／下手を持ち込まないだけでなく、
**何が「不備」かを製品が決めない。** 音量不足もクリッピングも、KOERU から見れば観測値であって、
それが望ましいかどうかは本人が決める。

`TR-REC-16` が既に置いている1つの例外（フルスケール到達サンプル数を書き出し直前に一度だけ
集計して提示する関門）は維持する。あれは収録中の判定ではなく、壊れた成果物が完成に
到達する経路を塞ぐためのもので、性質が違う。

**同要件が `[Risk] 収録中の破綻検知は依然としてスコープ外` と書いている残存リスクは、
残ったままになる。** 引き受けた上で残す。

いまの画面はこの判断と一貫していない。 ライブの入力メーターが「割れている」「小さすぎる」
「ちょうどよい」を表示している。扱いは `Q-REC-004`。
'''
