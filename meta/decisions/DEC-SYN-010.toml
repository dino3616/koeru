rationale = '''
前提をひとつ崩してから選んだ。 「利用者が手元に持っている phonemizer をそのまま使う」は、
どの機構を選んでも成立しない。OpenUtau の phonemizer は C# のアセンブリで、
共有ライブラリの ABI でも WASM でも読み込めない。UTAU のプラグインは exe か
Python スクリプトで、後者は `TR-PLT-07` に当たる（`EVID-SYN-001`）。
動くのは常に「KOERU のために新しく書かれたもの」だけになる。

選定条件は `Q-SYN-004` が定めていた——既定の phonemizer 自体をその機構で書けるか。
presamp.ini はこれを満たす。`alias.rs` が持つ規則は、母音クラスと子音の所属表、
VCV / BEGINING_CV / CROSS_CV / VC / CV / LONG_V / ENDING のテンプレートに落ちる。

決め手は、受け取った側へ規則が伝わる唯一の案であること。 `TR-RCL-24` が
presamp.ini の書き出しを既に要求しており、`character.yaml` に `default_phonemizer` を
宣言すれば、受け取った OpenUtau が同じ表を読む。共有ライブラリと WASM は KOERU の中でしか
効かず、配布物には何も伝わらない——利用者が両側を自力で揃えた場合しか一致しない。

WASM を採らなかった理由はもう2つある。 macOS で JIT を使うと
`com.apple.security.cs.allow-jit` が要り、hardened runtime の W^X を外すことになる。
他人のコードを安全に走らせるために選んだ機構が、OS 側の防御を1段外す取り引きになる。
インタプリタなら避けられるが、常駐ぶんが `BUDGET-MEMORY-001` の編集中モードの余裕
（1456MB に対して上限 1500MB）を削る。

書けないものを2つ認める。 (1) 音素の時間位置。presamp.ini は綴りの表で、
CVVC の VC をいつ差し込むかを持たない。ここは KOERU の規約プリセットが持つ
（`TR-ALN-23` と同じ形で外部化する）。差し替えられるのは綴りまで。
(2) 辞書引きを本体とする phonemizer。Arpasing は CMUdict 系の辞書で ARPAbet の音素列を作るので、
仮名の所属表では表せない。ただしこれは phonemizer だけの話ではない——録音リストも
カバレッジ判定も `TR-RCL-02` の仮名インベントリの上に建っている。別の軸になる。

## 一致をどう確かめるか

目標は音素レベルの一致に置く。 同じ音源と同じ UST なら、KOERU も OpenUtau も
同じエイリアスを同じ位置で鳴らす、まで。波形の一致は目標にしない——
合成コアと音の接続が別実装で、`TR-PLT-10` がコードの移植を禁じている以上、
ビット単位では一致しない。`TR-SYN-35` の notes が既に同じことを書いている。

3層に分けて確かめる。

- 層A（KOERU の内部整合）— 解決と、書き出す presamp.ini が同じ定義から出ていること。
  `TR-RCL-24` の「別定義を持たない」がそのまま試験になる。OpenUtau は要らない
- 層B（相手の解釈）— OpenUtau が同じ表から同じ綴りを出すこと
- 層C（時間位置）— 代表点のみ

層A は入力空間の全体で確かめられる。 phonemizer が見るのは直前・直後の音符だけで
（`TR-SYN-11` の抽象）、日本語のモーラ体系は有限。単独音 144、連続音 (7+1)×144 = 1,152、
CVVC の VC 6×30 = 180。長音・促音・撥音・拗音の組み合わせを足しても数千で尽きる。
**サンプリングではなく全数になる。**

層C は全数にできない。 音符長とテンポが連続量なので代表点にしかならない。
綴りと時間位置で保証の強さが違うことは、要件の側にも書く。

層B は CI で毎回突き合わせる。 OpenUtau に公式の CLI が無いので（`EVID-SYN-001`）、
配布物の中の .NET アセンブリを `pwsh` から直接読み込んで phonemizer を呼ぶ
（`scripts/openutau-parity.ps1`）。

**Windows は要らない。** 綴りを決めるのは managed なコードで、Linux 向け配布物に
入っている `OpenUtau.Core.dll` / `OpenUtau.Plugin.Builtin.dll` と同じ IL。
配布物から DLL 2本だけを取り出す。

## チャンネルは OpenUtau の区分に合わせる

OpenUtau は3つのチャンネルを持つ（`OpenUtau/ViewModels/UpdaterViewModel.cs` の
`IsReleaseForChannel`）。

| | 何を見るか |
|---|---|
| stable | prerelease でないもの。**`Preferences.Default.Channel` の既定** |
| beta | prerelease のうち `-alpha` で終わらないもの |
| alpha | prerelease すべて（beta を含む上位集合） |

**stable と alpha の両方を突き合わせる。** stable は多くの人が動かしている版
（いま `0.1.565`）で、alpha は綴りが変わるなら先に出る側。beta は alpha に
含まれるので別に見ない。

一度「OpenUtau は安定版を出さない」と書いた。 **嘘だった。** 直近の3件だけを見て
決めつけていた。実際には 34 件中2件が安定版で、しかもそれが既定のチャンネル。
**既定を外して突き合わせても、多くの人の手元と一致しているとは言えない。**

## 版と指紋の両方を固定する

`fslc` と同じ運用（`DEC-PLT-033`）。 片方だけだと、同じ札のまま中身を
差し替えられる。版は Renovate が上げ、指紋は `nix-hash-fix` ワークフローが
上流の digest から当てる。GitHub の API が資産の digest を返すので、
100 MB 超を落とさずに取れる。

一度「指紋は入力ではなく記録にする」と書いた。 **これも間違い。**「Renovate に
任せるから指紋は固定できない」と思い込んでいたが、`fslc` は Renovate に任せた
うえで指紋も固定している。仕組みは既にあった。

配布物の名前はチャンネルで違う。 stable は zip、alpha は tar.gz。
共通の名前が無いので、資産名も固定する。

## どの KOERU がどの OpenUtau と突き合わされたか

`crates/koeru-core/fixtures/phonemizer-parity/openutau.toml` がその記録。
