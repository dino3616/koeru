constraint = '表示名を何に変えても、保存と再開が壊れない'
title = 'プロジェクトを UUID 名のディレクトリにし、人間可読な manifest を平文で添える'
status = 'accepted'
owner = 'dino3616'
options = [
  'UUID ディレクトリ ＋ 平文 manifest',
  '表示名をディレクトリ名にする',
  '単一ファイルにパックする',
]
selected = 'UUID ディレクトリ ＋ 平文 manifest'
rationale = '''
表示名をディレクトリ名にすると、名前が壊れた瞬間にプロジェクトが開けなくなる。
音源名は本人の創作物で、絵文字・記号・CP932 外の漢字が普通に入る。改名も頻繁に起きる。
FS 側の制約（長さ、禁止文字、大小の扱い、正規化形）を表示名に持ち込むと、
その全部が「名前を変えたら壊れた」という形で利用者に降ってくる。

単一ファイルにパックする案は、録音中のクラッシュに弱い。 3時間ぶんの WAV を
一つのコンテナに抱えると、書き込み途中の異常終了で全部を失う経路ができる。
ディレクトリなら、壊れるのは書きかけの1本だけで済む（TR-PKG-39、DEC-REC-004）。

代償は「ライブラリ配下を人が見ても中身が判別できない」こと。
これは実在する不便なので、各プロジェクト直下に人間可読な manifest を平文で置いて埋め合わせる。
manifest は TOML で、先頭に「正本は project.db」と書いたコメントを付ける。
コメントを保つために toml_edit を使う（CMP-120）。
'''
consequences = [
  '表示名の改名がディレクトリ移動を伴わない',
  'ライブラリを直接見た人は UUID 名しか見えないので、manifest を読む必要がある',
  'manifest と DB で表示名が二重化する。正本は DB 側とし、manifest は写しとして扱う',
]
