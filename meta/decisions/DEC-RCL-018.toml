rationale = '''
## 何が足りなかったか

今の音源は方式を1つだけ持ち、収録音高の集合を作るときに決め切る（`TR-REC-25` の旧い条文）。
1本で始めて足りないと分かったら、作り直すしかなかった。 声色（Normal / Whisper など）は
持てなかった。

刷新のボード（P4b「新しい音源から収録まで」、P4e「音源のページとサブバンクのページ」）は、
音源を「サブバンクの枠の並び」として描いている。 最短は「新しい音源 → 収録をはじめる」の
2操作で、構成はあとから同じ画面で変える。

## 別の音源に分けない理由

声色ごとに音源を分けると、配るときに束ねる操作が要り、立ち絵・名前・アクセントカラーが
音源の数だけ複製される。 OpenUtau も UTAU も、1つの音源の中に声色と音階の区画を持つ形を
採っている。 書き出す先の形に合わせて持つほうが、往復で壊れない。

## 枠の形

- 枠は（声色・方式・収録音階）の組で、音源の中で重複しない（`TR-RCL-28`）。 識別子は枠が持ち、
  3つは属性。 綴りで引かない（`DEC-RCL-017`）
- 声色は自由に打つ名前で、空は「声色なし」。 声色は実体を持たず、同じ綴りの枠の束として読む
- 方式と方式プリセットは枠ごと。 枠の並びが録る順の既定
- 録ってある枠の方式は変えない。 声色と収録音階は付け替えとして変えられる（`TR-RCL-30`）
- 枠は本人が消せる。 録ってある枠は、消えるテイクの数を示して確認してから、テイクごと消す（`TR-RCL-29`）

## テイクが消える道を1つ開けた

`INV-REC-005` は「確定したテイクは削除も上書きもされない」だった。 枠を消すとテイクも消えるので、
これを「確定したテイクが減るのは、本人がその枠を消したときだけ」に変えた
（`specs/requirements/project-lifecycle.fsl`）。 録り直しでは今までどおり消えない（`TR-REC-21`）。

消す手は、録っている途中と、復旧候補が残っているときには使えない。 候補が残ったまま
消せると、本人が採るか捨てるかを選んでいない候補が消える（`REQ-REC-007`）。

FSL では1項目を1枠として扱った。 1つの枠の項目が束になって足され、消えることは設計層の話で、
設計層（`specs/design/project-storage.fsl`）はまだ枠を足すことも消すこともしない。 継ぎ目では
「枠はいつもある」に写している。 実装（刷新の R30）で設計層に手を足す。

## 担当音域

枠ごとに下端と上端を持ち、既定は今の floor 割り当て（`TR-RCL-06`）のまま（`TR-RCL-31`）。
ボード P4e は「隣の音階との中間で分ける」を既定に描いていたが、採らなかった。
floor は歌えるかの判定・代用・シフト量の許容・試唱・書き出しの6か所が前提にしていて、
中間にすると下へのシフトが `TR-RCL-22` の下限を超え、今は歌える曲が音域外になる。
中間にしたい人は、枠ごとに直せる。 直した範囲は、判定・試唱・書き出しのすべてが同じく使う。

同じ声色の範囲が重なったときと隙間ができたときの規則は決めていない（`Q-RCL-005`）。
範囲を直す画面を作る前に決める。

## 既存の project の移し方

声色なしの枠を、作ったときの収録音高ごとに1つずつ作る。 方式とプリセットは project のもの、
並びは収録音高の昇順。 行とテイクは、その音高の枠へそのまま属させる。 画面からは今までと
同じに見える。

## 名前の衝突

コードの `koeru_model::voice::VoiceColor` と SDL の `VoiceColor` は、声から作る画面の色
（`DEC-PLT-027`）を指していた。 ボードの語彙では「声色」が声の出し方で、画面の色は
「アクセントカラー」と呼んでいる。

声色を `VoiceColor` と呼ぶ。 キャンバスの `model/schema.graphql` と、書き出す `character.yaml` の
`color` に合わせる。 画面の色の側を `VoiceTint` に改名する。 SDL はこの変更で改名した。
SDL を実行する経路（T09）はまだ無く、読んでいる consumer は見本の operation だけなので、
型の改名で壊れる相手はいない。 コードの型の改名は実装（R30）で行う。

## M5 のまま前倒しする

枠の要件（`TR-RCL-28`〜`31`）は `PROFILE-M5`（方式を広げる）に置いたままにする。 実装は
画面の刷新で入るが、リリースの判定は M5 が持つ。 M2 と M4 の判定は、枠が1つの音源で
今までどおり成り立つ。

## 変えた条文

- `TR-REC-25`: 「収録音高の集合は作成時に確定し、途中で増減させない」を、枠が持ち作ったあとも足し引きできる、に変えた
- `TR-RCL-06`: floor 割り当てが担当音域の既定であり、枠ごとに直せることを足した
- `TR-RCL-26`: 行集合と台帳を、収録音高ごとから枠ごとに変えた
- `reclist` の領域の不明点から「収録音高を途中から足せるか」を外した。 ここで決めた
'''
