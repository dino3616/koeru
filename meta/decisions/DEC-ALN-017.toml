selected = '（収録音高, 綴り）を鍵にし、同じ音高の中の重複は生成側で潰す'
rationale = '''
確認キューの鍵が綴りだけだった。 `BTreeMap<String, Entry>` に綴りで入れるので、
同じ綴りが2度来ると**あとに読んだものが前のものを置き換える**。落ちたほうは
確認もされず `oto.ini` にも出ない（`INV-ALN-003` が禁じている状態）。

綴りが重なる経路が2つあった。 どちらも実測で確かめてある。

| 経路 | 重なるもの |
|---|---|
| 多音階（`TR-RCL-26`） | 全部。2音階で `あ` を録ると `あ` が2つ |
| 連続音の第2段 | `Core` で `- い` `- え` `- ん` の3つ。159 行が重ねて名乗る |

## 多音階は「重なり」ではない

`TR-ALN-22` が「音階ごとにフォルダと oto.ini を分け、アライメント・確信度・
**確認キューも音階単位で独立に管理する**」と既に定めている。音高を見ずに
数えていたのは実装の取りこぼしで、要件の側は最初から音高で分けている。

配布物では綴りが一意に戻る。 区画の接頭辞・接尾辞が音高を綴りへ織り込むので
（`koeru_package::tree` の `decorate`）、`TR-PKG-19` の「全 oto.ini 横断で一意」は
そちらで満たされる。**台帳の中だけが（音高, 綴り）。** `docs/design/ooui-model.md`
の同一性の欄はこれに合わせて直した。

**`あ` を2音階で録っただけで、書き出しの関門が二度と開かなかった。**
`adopted_conflicting_aliases` が全部の綴りを衝突として返すので、
多音階の音源は `review.conflicting_alias` を越えられない。

## 連続音の重なりは生成側で潰す

こちらは同じ音高の中で起きるので、鍵を変えても消えない。

連続音の生成は2段構えで、第1段が全 102 単位を1度ずつ行頭に置く。
第2段は拾えなかった辺を回収するが、**辺へ入るには始点の母音を作る単位を
行頭に置くしかなく**、その単位の語頭は第1段で既に出ている。carrier の選び方が
「その母音を持つ表の最初の単位」なので、`i` なら必ず `い`、`e` なら `え`、
`n` なら `ん` が選ばれ、3つの語頭 CV が 159 行から重ねて名乗ることになる。

**持ち主は第1段の行。** あちらはその単位を歌うために置かれた行で、
第2段の行頭は辺へ入るための運び役でしかない。決めるのは録音リストを
台帳へ入れる時点（`Ledger::install_reclist_for_tones`）で、`ordinal` の順に
先に名乗ったものが持つ。

生成器は重複を出したままにする。 `reclist` は「その行を歌うと何が録れるか」を
答えるもので、**音源の中で誰がその綴りを持つかは録音リスト全体の話**。
生成器に持たせると、行1つを見ても答えが出ない関数になる。

`row_aliases` が正本になる。 アライメントも試験用の種置きも、綴りを
行から導き直さずに台帳へ訊く。導き直すと、名乗らなかった行にも5値が生える。

## 境界は名乗らなかった綴りのぶんも残す

`take_boundaries` は落とさない。 下位方式への書き出しはモーラ順に境界を
並べ直し、**1つでも欠けたらその素材を丸ごと落とす**（`packaging::rederived_entries`）。
名乗らなかった行頭の境界まで捨てると、その行の綴りが全部消える。
捨てるのは `oto_values` の側だけ。

## 採らなかった案

**綴りに音高を織り込んでから台帳へ入れる**（案2）。 配布物と同じ
接頭辞・接尾辞を台帳の綴りにも当てる形。採らないのは、接頭辞・接尾辞が
配布時に選べる値だからで、**録ったあとに変えると台帳の鍵が全部変わる。**
確認済みの5値も境界も、`(take_id, alias)` の下から引けなくなる。

**重複する行を録音リストから外す**（案3）。 第2段の行は辺の回収のために
要るので、外すと `TR-RCL-04` の全辺被覆が崩れる。
'''
