selected = '両方 slate へ移す'
rationale = '''
`docs/design/direction.md` は「道具は色相を持たない。**押せるものにも色相を与えない**」と
定めている。**画面上で色相を持つものが、本人の声か危ないことだけ**になるのが狙いで、
teenage engineering が無彩色の筐体に画面の中だけ色を許していたのと同じ構造（`EVID-UX-004`）。

現行は主ボタンが `cyan-11`、フォーカス環も `cyan-11`、入力メーターの「良い範囲」が `jade-11`
だった。**これを全部 slate へ移す。** cyan と jade は `globals.css` の import ごと落とす
——段だけ残しておくと、使ってよいものに見える。

**段の選び方は変えない。** 塗りに段 9 を使わない理由（明るい面で 4.5:1 に届かない）は
色相ではなく段の話なので、そのまま生きる。塗りは段 11、hover は段 12。

**フォーカス環は段 12 にした。** Radix が「フォーカス環」に充てているのは段 8 だが、
面 1〜3 のどれに乗っても 3:1 を満たすのは上の段のほう（`TR-PLT-28`）。段 11 でも足りるが、
押せるものの塗りが段 11 になったので、**塗りとフォーカス環が同じ色になる**——
環が出ていることが分からない。

**輪郭だけで的だと分かるものは段 11 を使う。** 段 7 は面 2 の上で 1.5:1 しかない。
塗りを持つ部品は面と字が的を示していて輪郭は情報を持たないので 3:1 の対象にならないが、
塗りを持たない的（空いた席、まだ決めていない枠）は輪郭で識別されている。

## 検査をやり直した

`DEC-PLT-022` の実測は cyan で書かれていたので、`palette.story.tsx` を書き直して
slate と声の色で測り直した。**そのときに、検査が何も見ていなかったことが分かった。**

`getComputedStyle().backgroundColor` は、指定した色空間のまま返る。 `oklch(…)` で書いた
声の色は `oklch(…)` の文字列で返るので、`rgb(…)` だけを読む正規表現が外れて
**全部 0 として測られていた**。明るい面はそれでも 3:1 を超えるので、検査は緑のまま通った。
1×1 の canvas へ塗って画素を読む形に直した——`take-inspector` が同じ落とし穴を
踏んでいて、そこには既に対処が書いてあった。**同じ間違いを別の場所でもう一度した。**
'''
