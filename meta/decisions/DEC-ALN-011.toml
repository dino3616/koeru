selected = 'M5（方式を広げる）へ送る'
rationale = '''
**M3 は単独音だけで、`excludes` が「連続音以上の到達水準」。**
TR-ALN-19（CVVC の VC 切り出し規約）と TR-ALN-22（多音階を音階単位で独立に扱う）は、
まさに連続音・CVVC・多音階の領域にある。**M3 では一度も通らない経路になる。**

**通らない経路の規約は、書いても検証できない。** VC の5値規約は
「先行発声 = 前モーラの母音の終わり」のような並びの前提を持つので、
単独音（1ファイル1モーラ）では成立を確かめる材料が無い。
多音階の `prefix.map` 生成も、音階が1つなら出力が退化する。

**DEC-ALN-010 で Julius を M5 へ送ったのと同じ筋。** 効く方式と一緒に入れる。

**残すもの。** 一貫性補正の集団鍵に音階を含める部分（TR-ALN-22 の
「集団統計は音階内に閉じる」）は、`consistency.rs` に実装して残す。
**音階が1つでも鍵の形は同じ**で、後から音階が増えたときに集団が混ざらない。
規約プリセットも方式ごとに3つ用意してあり（TR-ALN-23）、
**CVVC の CV 側の係数は入っている。** 足りないのは VC 側の規約セット。
'''
