selected = '既定要件（WCAG 2.2 Level AA）'
rationale = '''
すべてのプロダクトで既定で必要な要件であり、選択的な追加機能ではない。
ショートカット中心の設計はキーボード操作と親和的なので、要件化のコストは低い。
Tauri を選んだのは、日本語 IME と OS のアクセシビリティ API への対応が最も確実だったことも理由になっている。

**適合水準は WCAG 2.2 Level AA。** 水準を言わずに「既定要件」とだけ決めていたため、
何を満たせば満たしたことになるかが無く、要件が1件も書かれないまま残っていた。

キーボードとコントラストだけに絞る案を採らなかったのは、**KOERU で最も効く基準が
WCAG 2.2 で追加された 2.5.7（ドラッグ操作の代替）と 2.5.8（ターゲットサイズ）だから。**
原音設定の境界はドラッグが中心で、波形上のハンドルは密集する。ここを外すと、
アクセシビリティを既定要件と言いながら、この製品固有の一番きつい所を避けることになる。

**適用されない基準は「対象外」ではなく理由を記録する**（TR-PLT-25）。
アカウントもログインも持たないので 3.3.8 は適用されない。

**要件は M7 ではなく M2 と M6 に置いた。** 既定要件とは、最後に足すものではないという意味。
アプリ全体に効くもの（キーボード完結・フォーカス・コントラスト・支援技術への公開）は
最初の画面が出る M2 に、エディタ固有のもの（ドラッグの代替・ターゲットサイズ・波形の代替）は M6 に置く。
'''
review_triggers = [
  'WCAG が 3.0 へ移り、2.2 の達成基準の対応関係が変わったとき',
  'Tauri の WebView が3 OS のアクセシビリティ API へ同じ情報を渡せないと実測で分かったとき',
