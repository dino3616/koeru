selected = '録る前に予定を台帳へ残す段を足す（テイクの行は WAV の確定後のまま）'
rationale = '''
今の保存の段は「WAV を確定してから台帳にテイクの行」（`specs/design/project-storage.fsl` の
ASSUME-5〜7）。 台帳への記録の前に落ちた確定済みの WAV は孤児として残り、本人が採るか捨てるかを
選ぶ（`REQ-REC-006`、`REQ-REC-007`）。 **その孤児がどの行の、どの条件の録音だったかは、
ファイル名から推し量るしかない。** 応答が画面へ届く前に落ちたとき、確定したかどうかを
画面から確かめる手段も無い。

## 決めたこと

- 録音を始める前に、録る予定（どの行を、どの収録セッション・条件で）を台帳に1行残す。
  これはテイクではない
- テイクの行は今までどおり、WAV を確定してから台帳へ入れる（ASSUME-5 は変えない）
- 孤児は、この予定の行と突き合わせて、どの録音だったかを示す
- 応答が失われても、予定の行と確定の受領証から、確定したかどうかを回復できる
- `project-storage.fsl` に段を足し、`fslc` で確かめる。 書く前に形式化の覚え書きを出して
  確認を取る（`AGENTS.md`）

## 採らなかったもの

今の段のままにすると FSL を変えずに済む。 ただし孤児の出どころと、応答が失われたときの
確定の有無を、推し量りで埋めることになる。
'''
