selected = 'M3 では持たず、TR-ALN-32 を M6 へ移す'
rationale = '''
参照データの作成コストを払わない判断である。 TR-ALN-32 の評価ハーネスは
手ラベルの原音設定を参照データとして要求し、Q-ALN-003 は作成者を複数にすることを
求めている。単独音102項目を複数人ぶん揃える作業は、**M3 が自動化しようとしている
その作業を手で繰り返すことにあたる。**

その結果、M3 の性格が変わる。 これまでの M3 は
「単独音なら編集画面を開かずに済むが成り立つかの答えを出す」判定マイルストーンだった。
この決定で M3 は「Julius を統合して単独音の oto が自動で出る」実装マイルストーンになる。
到達水準の判定は M6（原音設定エディタ）へ移る。**エディタを作るときには
「どれだけ編集が要るか」がそのまま要件になるので、そこで測るのが意味の上で自然である。**

覚悟しておく副作用を並べる。

- TGT-ALN-007 の境界誤差は M6 まで実測されない。合否の線（確認の合計5分から
  逆算した編集率、DEC-ALN-003）は定義だけ置かれ、計算するものが無い
- TR-ALN-28 の「単独音について確認キューが空になりうるという宣言は実測まで保留する」が
  M6 まで解けない。単独音でも「開かずに済む」と宣言できない
- TR-ALN-24 の4成分の合成重みは、根拠を持たないまま実装の値が既定になる
- DEC-ALN-001 の review_trigger「境界精度が編集の手間を減らさないと判明したとき」が
  M6 まで発火しない。Julius の選択が、検証されないまま既定で続く
- 5値の導出規約（TR-ALN-13〜19）の係数を変えたとき、良くなったか悪くなったかを
  測る手段が無い。回帰を止められない
- docs/product-vision.md の「実測精度も未確認」が M6 まで残る

要件ごと削除する案は採らない。 測る選択肢を文書から消すと、
後から測りたくなったときに何を測るのかが分からなくなる。
'''
