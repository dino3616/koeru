constraint_label = '到達水準の判定時期'
constraint = '「原音設定を自分でやらずに済む」が成り立つかを、いつ・何で判定するか'
title = 'M3 では評価ハーネスを持たない。到達水準の判定は M6 へ回す'
status = 'accepted'
owner = 'dino3616'
options = [
  'M3 で参照データと評価ハーネスを作り、実測で判定する',
  'M3 では持たず、TR-ALN-32 を M6 へ移す',
  'TR-ALN-32 を要件ごと削除し、恒久的に測らない',
  '主観評価で M3 の答えを出す',
