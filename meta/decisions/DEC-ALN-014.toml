schema = 'decision'
id = 'DEC-ALN-014'
constraint_label = 'oto の再導出の担当'
constraint = '5値を作る式を、1箇所からしか呼ばないこと'
title = 'アライメント境界を保存し、下位方式の5値の再導出を align に置く'
status = 'accepted'
owner = 'dino3616'
options = [
  'align に置き、境界を保存する',
  'align に置き、書き出しのたびに再アライメントする',
  'packaging に置く',
]
selected = 'align に置き、境界を保存する'
rationale = '''
担当が無かった。 `TR-PKG-24` は「5値は下位方式の規約プリセットで再導出する（align の
新設要件）」と括弧書きしているが、その要件が存在しない。`TR-RCL-21` も同じ場所を指している。
担当が無いまま実装に入ると、どの領域も作らない（`Q-PKG-001`）。

align に置く。 導出の式は `derive.rs` にあり、規約は `preset.rs` が方式ごとに持つ。
packaging に置くと同じ式が2箇所に分かれる（`AGENTS.md` の禁止事項6）。

境界を保存する。 ここが今の穴で、下位方式の再導出とは別に既に踏んでいる。
DB が持っているのは導出後の5値だけで、発声開始・母音開始・母音定常区間終端は
どこにも残っていない。一方 `take_fingerprints` は指紋にプリセットを含めるので、
プリセットを編集すると指紋が変わって再計算が走る。境界が無いので、その再計算は
再アライメントになる。**`TR-ALN-23` の「プリセットの変更は再計算だけで反映され、
再アライメントを要求しない」と食い違ったままだった。**

境界を残すと両方が同時に閉じる。 プリセット編集も、下位方式の規約プリセットでの
再導出も、境界から5値を作り直すだけで済む。`TR-ALN-13` の三分法が前提にしている形そのもの
——アライナが出すのは境界で、規約はそこから先を決める。

代償は DB のマイグレーション1本と、テイクあたり数十バイト。 モーラごとに3つの境界を持つ。

毎回再アライメントする案を採らなかったのは、書き出しが分単位で遅くなるうえ、
`TR-ALN-23` の食い違いが残るため。`TR-ALN-29` の決定性も、アライナを2度通すと
浮動小数点の再現性に依存しはじめる。
'''
review_triggers = [
  '境界だけでは足りない5値が出てきたとき（emission 行列そのものを要する導出など）',
