selected = '用意し、素材の由来を提示する'
rationale = '''
用意する。 `DEC-RCL-002` が方向を既に決めている（上位から下位への書き出しだけを見込み、
逆は採らない）。残っていたのは、提供するかどうかと、声質不連続の扱い（`Q-RCL-002`）。

声質不連続は検知しない。 セッションをまたいだ声質の変化を測る手段が現在のスコープに無い。
`TR-REC-16` は録音品質のリアルタイム判定をスコープ外にしており、`DEC-ALN-005` は
判定を確認時に限っている。ここで新しい判定を足すと、その線を引き直すことになる。

代わりに事実だけを出す。 その ZIP が参照するテイクが跨ぐ収録セッションの数と、
最初と最後の間隔を、書き出し前の確認画面に容量と並べて提示する。
`takes.session_id` が既にあるので新しい計測は要らない。

**「声質が揃っている」とは言わない。** 言えるのは「何回のセッションに跨っているか」だけ。
判定に見える言い方をすると、検知していないものを検知したことにしてしまう。

由来も出さない案を採らなかったのは、下位方式の書き出しが「語頭 CV を各行の先頭から集める」
形になるため。単独音として1つのフォルダに並ぶ音が、実際には収録リストの各行の先頭から
集まったものになる。素材の出どころが元の方式より散るので、そのことは見えているべき。
'''
