rationale = '''
録る対象の identity を綴りから構造の鍵へ移す（`DEC-RCL-017`）。 台帳の（テイク, 綴り）は、
そのテイクの行の並びを通して対象へ写す（`koeru_model::target::in_row`）。 行の並びが
その綴りを生まないとき（rules を固定する前に作ったプロジェクト、手で足した綴りなど）は
写す先が決まらない。 アーキテクチャの段取りは「曖昧なら止める」とだけ決めていて、
止めたあと本人に何が見えるかが決まっていなかった。

## 決めたこと

- 写せないエントリが1つでもあれば、そのプロジェクトの移行を止める
- 元の台帳と控えには手を付けない。 移行は別の世代へ写してから切り替えるので、止めても
  元はそのまま残る
- そのプロジェクトは開かず、一覧に「移行できない」と理由の code を出す
- 救済の画面は作らない。 実際に起きた件数と形を見てから決める

## 採らなかったもの

「対応なし」として開く案は作業を止めないが、対応なしのエントリを扱う道筋が確認・書き出し・
試唱のあちこちに要る。 読み取り専用で開く案は、選ばせる画面が要る。 どちらも、起きる件数が
分からないうちに作る費用に見合わない。
'''
