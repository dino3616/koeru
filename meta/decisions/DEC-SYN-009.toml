rationale = '''
**`resolve_phrase` が長音と促音を出力から落としていた。**

```rust
MoraKind::LongVowel | MoraKind::Geminate => continue,
```

ところが `sing_song` は **結果の添字で `song.notes` を引いている。**
落とされたぶんだけ添字がずれるので、**長音や促音より後ろの音符が、
すべて1つ前の音高と長さで鳴る。**

`resolve_phrase` は自分の doc に「**解決できた音符と、できなかった音符の
両方を返す**」と書いていた。**書いてあるとおりに動いていなかった。**

# 実データで確かめた

さくらさくら（14音符）は末尾が `ー` なので、ずれは起きず**最後の音符が消えた。**
合成 7694 ms に対し譜面は 9000 ms。**1000 ms の音符が丸ごと無音。**
直したら 8687 ms（残差はクロスフェードの重なり）。

「かーさ」で検証すると、音符3に対して解決2件だった。

# 長音は直前母音を伸ばす

`MoraKind::LongVowel` の定義が既に「**直前モーラの末尾母音の継続**」と言っている。
その母音の単独単位（あ/い/う/え/お）へ解決する。**`prev_vowel` は据え置く**
——長音のあとも母音は変わらないので、連続音の前母音がずれない。

# 促音は休符

`MoraKind::Geminate` は閉鎖であって素材を持たない（子音部は次のモーラの
エイリアスが持っている）。**素材の不足ではないので、鳴らせないとは数えない**
——`PhraseUnit::Rest` を返し、`Singability` では鳴らせる側に数える。

**`required_aliases` は今までどおり長音も促音も飛ばす。** あちらは
「何を録れば完全になるか」を答えるもので、新しい単位を要求しない
（`TR-RCL-13` (b)(c)）。**数える対象が違う。**

# 型で1対1を言わせる

`Vec<Result<Resolved, Missing>>` は「拍を落としてよいか」について何も言わない。
`PhraseUnit`（`Sound` / `Rest` / `Missing`）にして、**休符を表せる形**にした。
`Rest` が無いと、促音を `Missing` にするしかなく、
**「っ を録れ」という嘘のカバレッジ**になる。
'''
