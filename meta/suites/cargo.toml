# cargo の試験 binary の登録（`DEC-PLT-039`）。 欄の意味は `meta/README.md` の「試験の登録」。
#
# `min_cases` は、件数を求めるどの環境でも下回らない数にしてある。 書いていない OS の席では
# macOS の backend と Kaldi の試験が cfg で外れるので、lib の床はそちらの件数で決まる。

# ## koeru-model

