name: DCO

on:
  pull_request:

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit has a Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # マージコミットは対象外（作者の表明ではないため）
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$sha に Signed-off-by がありません"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "git commit -s で追加できます。既存のコミットには git rebase --signoff を使ってください。"
            exit 1
          fi
          echo "すべてのコミットに Signed-off-by があります"
