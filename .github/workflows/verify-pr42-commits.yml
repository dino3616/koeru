name: One-shot verified replay for PR 42

on:
  push:
    branches:
      - docs/design-system-proposal

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source range
        run: |
          set -euo pipefail
          test "$(git rev-list --count fe2fdeb2a70065dfd666314a8c29dbdaf7c5a439..68fa9452c9a5192e6eefdcffc24c24ff89d1035a)" = 25

      - name: Replay as GitHub-verified commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx -y push-signed-commits@1.2.0 \
            dino3616/koeru \
            verified-replay-pr42 \
            fe2fdeb2a70065dfd666314a8c29dbdaf7c5a439..68fa9452c9a5192e6eefdcffc24c24ff89d1035a
