name: One-shot verified replay for PR 42

on:
  push:
    branches:
      - docs/design-system-proposal

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source range
        run: |
          set -euo pipefail
          test "$(git rev-list --count fe2fdeb2a70065dfd666314a8c29dbdaf7c5a439..68fa9452c9a5192e6eefdcffc24c24ff89d1035a)" = 25

      - name: Replay as GitHub-verified commits
        uses: pgaskin/push-signed-commits@5055c5f30c4dca7aa847ed2f07683d7359b8ff2b
        with:
          branch: verified-replay-pr42
          revision: fe2fdeb2a70065dfd666314a8c29dbdaf7c5a439..68fa9452c9a5192e6eefdcffc24c24ff89d1035a
