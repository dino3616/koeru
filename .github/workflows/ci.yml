name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ枝で新しい push が来たら、走っている検査は捨てる。
# main だけは畳まない（履歴の各点が緑だったことを残したい）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    # ubuntu で回す。 音声のバックエンドは macOS しか無いので、
    # ここでは `backend::current` がスタブを指す。
    # 「書いていない OS でもアプリが組み立つか」を見ているのはこのジョブ。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # C / C++ とモデルは submodule で調達している（DEC-PLT-016, DEC-ALN-012）。
          # 取らないと build.rs が手順を出して止まる。
          submodules: recursive
          # MFA のモデルは HuggingFace の LFS に入っている（DEC-ALN-012）。
          # これが無いと clone が `git-lfs: command not found` で途中で死ぬ。
          lfs: true
      # Tauri は Linux で WebKitGTK を要る（DEC-PLT-014）。
      - uses: ./.github/actions/linux-webview
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: rustfmt
        run: cargo fmt --all --check
      # リポジトリ全体で clippy::all を deny する。設定は Cargo.toml の
      # [workspace.lints] にあり、ここは通過を強制するだけ。
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 理由は lint ジョブの同じ箇所。Rust をビルドする job だけが要る。
          submodules: recursive
          lfs: true
      # Linux だけ WebKitGTK が要る（上と同じ理由）。
      - uses: ./.github/actions/linux-webview
        if: matrix.os == 'ubuntu-latest'
      # 音声デバイスを要るテストは、実機ハーネスとして自分で戻る。
      # CI のランナーにマイクは無いので、通らないのではなく通り抜ける。
      - run: cargo test --workspace --all-features

  specs:
    name: specs (FSL + meta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # xtask の依存は toml だけで koeru-* を引かない。submodule も LFS も要らない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 配布バイナリはバージョンと SHA-256 の両方で固定する。
      # 更新は Renovate 任せにせず、semantic diff を確認してから上げること。
      - name: Install fslc
        env:
          FSL_VERSION: v4.0.0
          FSL_SHA256: 5c818a952d0cdddba060e68f255b361865a08c9d48621d9ee410c2b5c29aeefa
        run: |
          set -euo pipefail
          curl -fsSL -o fslc \
            "https://github.com/ymm-oss/fsl/releases/download/${FSL_VERSION}/fslc-linux-x64"
          echo "${FSL_SHA256}  fslc" | sha256sum -c -
          chmod +x fslc && sudo mv fslc /usr/local/bin/fslc
          fslc --version
      # ID 規約と edition の診断。仕様そのものの検査ではない。
      - name: fslc lint
        run: fslc lint specs/ --project specs/fsl-project.toml
      # manifest 1つにつき層ごと1仕様なので、スコープごとに chain を回す。
      # 層が1つでも落ちれば exit 1 になる（実際に落ちることを確認済み）。
      - name: fslc chain
        run: |
          set -euo pipefail
          for m in specs/fsl-*.toml; do
            echo "== $m"
            fslc chain "$m"
          done
      # 生成した要件文書が仕様とずれていないか。Markdown から FSL への逆同期はしない。
      # 直すのは常に FSL 側で、文書は再生成する。
      - name: document drift
        run: |
          set -euo pipefail
          # 仕様の側から回す。文書が無いことを黙って見逃さないため。
          # 設計層も含める。 読ませる仕様なのに網から外れていた。
          for f in specs/requirements/*.fsl specs/design/*.fsl; do
            b="$(basename "$f" .fsl)"
            # method-coverage は fslc document generate が関係の空リテラルを扱えない。
            # 検証は通るが文書だけ作れない（fslc 4.0.0）。
            if [ "$b" = "method-coverage" ]; then
              echo "== $b は文書生成の対象外"
              continue
            fi
            fslc document check "$f" "docs/generated/$b.md"
          done
      # FSL が扱わない情報が、FSL と技術要件の ID へ実際に繋がっているか。
      - name: meta registries
        run: |
          cargo run --package xtask -- check-meta
          cargo run --package xtask -- check-budgets
          cargo run --package xtask -- check-coverage
          # 手書き文書とソースコメントの ID 参照が実体に解決するか。
          # check-meta は TOML の中しか見ないので、ここが Markdown とコメントを受け持つ。
          cargo run --package xtask -- check-references
          # 判断記録の索引は生成物。手で足すと片方だけ古くなる。
          cargo run --package xtask -- index-decisions --check

  ui:
    name: ui (format + lint + type + contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # WebView 側は crates/koeru-app/ui にまとめてある。
        # ここだけで完結する bun パッケージなので、ワークスペースを跨がない。
        working-directory: crates/koeru-app/ui
    steps:
      # bun しか使わない。submodule も LFS も要らない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: crates/koeru-app/ui/package.json
      - name: Install
        run: bun install --frozen-lockfile
      # story を実ブラウザで描いて axe を当てる（TR-PLT-25、DEC-PLT-022）。
      # ブラウザは毎回落とさない。 lockfile が変わったときだけ入れ直す。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crates/koeru-app/ui/bun.lock') }}
      # ブラウザ本体だけをキャッシュする。 OS のライブラリは
      # ~/.cache/ms-playwright の外にあるので、当たっても入れ直す。
      - name: Install Playwright（ブラウザとライブラリ）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright（ライブラリだけ）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # 整形・lint・型 ＋ story の網羅 ＋ story の axe と play。
      # --fix を付けない。CI は直す場所ではない。
      - name: vp check
        run: bun run check:ci
      # ビルドと型と npm のライセンス。
      - name: build
        run: bun run build

  licenses:
    name: license policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # cargo deny はマニフェスト解決だけでビルドしない。submodule も LFS も要らない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # AGPL-3.0-or-later に取り込めないライセンスを持つ依存が入ったら落とす。
      # 外部 PR に対する防波堤。
      - name: cargo-deny
        run: cargo deny check
