name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ枝で新しい push が来たら、走っている検査は捨てる。
# main だけは畳まない（履歴の各点が緑だったことを残したい）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # `RUSTFLAGS: -D warnings` と同じく rustc の警告で落とすが、こちらは
  # ビルドの指紋に入らない。 `RUSTFLAGS` を変えると依存まで全部組み直す。
  # build.rs の `cargo::warning`（cc が流す C++ の警告）では落ちない。
  CARGO_BUILD_WARNINGS: deny
  # CI の作業ツリーは毎回使い捨てなので、incremental の中間物は書くだけ無駄になる。
  CARGO_INCREMENTAL: 0
  # パニックの行番号は残し、変数の情報は捨てる。 target が縮み、リンクも速くなる。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # 開発環境は flake が持つ（`DEC-PLT-033`）。 Rust も Linux の
        # WebKitGTK 一式も devShell から出るので、apt は要らない。
        # `ci` はブラウザと編集機の道具を持たない devShell で、取りに行く量が 1 GiB 余り減る。
        shell: nix develop .#ci --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # C / C++ とモデルは submodule で調達している（DEC-PLT-016, DEC-ALN-012）。
          # 取らないと build.rs が手順を出して止まる。
          submodules: recursive
          # MFA のモデルは HuggingFace の LFS に入っている（DEC-ALN-012）。
          # これが無いと clone が `git-lfs: command not found` で途中で死ぬ。
          lfs: true
      # Nix は daemon を立てない単一ユーザーで入れる。 macOS で導入が約 1 分から数秒になる。
      # ストアは cache.nixos.org から引く。 magic-nix-cache は置かない。
      # ストアパスごとに1件ずつ書き、Actions のキャッシュの枠を埋めていた（`DEC-PLT-059`）。
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # Rust の組み立ては OS ごとに1つの鍵で持つ。 保存は main だけで、PR は main のものを読む。
      # PR で保存したものはその PR からしか読めず、10 GB の枠を食い合う（`DEC-PLT-059`）。
      # 鍵に入れる rustc の版は devShell のものを読む。
      #
      # `flake.lock` は鍵の先頭に入れる。 build.rs の実行ファイルは nixpkgs の glibc の
      # ローダを指していて、nixpkgs が上がるとそのローダはランナーに無い。 rustc の版が
      # 同じなら cargo は古い実行ファイルを使い回し、pkg-config の環境変数が変わった
      # `glib-sys` などで build.rs を走らせ直そうとして「No such file」で落ちる。
      # 末尾に入れると前方一致で古いものを読むので効かない。 `key` は `shared-key` と
      # 併せると無視される。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}
          shared-key: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          cmd-format: nix develop .#ci -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Show toolchain
        run: rustc --version && cargo --version
      # 整形と Nix の lint は OS に依らないので、ubuntu で1回だけ見る。
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # 整形の契約を持たないファイルを作らない。形式は RFC 166（nixfmt）。
      # git から数えるので、`.nix` が増えても漏れない。
      - name: nixfmt
        if: runner.os == 'Linux'
        run: git ls-files -z '*.nix' | xargs -0 --no-run-if-empty nixfmt --check
      # 反パターン（statix）と未使用の束縛（deadnix）。
      # Rust の clippy と同じ規律で、機械で見えるものは機械に見せる。
      # `errfmt` で出す。 既定の span 描画は日本語コメントの桁を
      # バイト数で数えるので、指している場所がずれて読めない。
      - name: statix
        if: runner.os == 'Linux'
        run: git ls-files -z '*.nix' | xargs -0 --no-run-if-empty -n1 statix check -o errfmt
      - name: deadnix
        if: runner.os == 'Linux'
        run: git ls-files -z '*.nix' | xargs -0 --no-run-if-empty deadnix --fail
      # リポジトリ全体で clippy::all を deny する。設定は Cargo.toml の
      # [workspace.lints] にあり、ここは通過を強制するだけ。
      #
      # 音声のバックエンドは macOS しか無いので、ubuntu では `backend::current` が
      # スタブを指す。 macOS では CoreAudio と Kaldi の経路を見る。
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # MFA のモデルは submodule ＋ LFS で入る。 実体が来ていないと実モデルの
      # 試験が中身を実行せずに ok と出るので、走らせる前にここで落とす。
      # LFS を引けていないときは 130 バイト程度のポインタが置かれるだけで、
      # ファイルの有無では見分けられない。
      - name: MFA のモデルの実体が来ているか
        # devShell を要さない。Nix の起動を挟まずに落としたい。
        shell: bash
        run: |
          f=crates/koeru-align/models/japanese_mfa/acoustic/final.mdl
          test -f "$f" || { echo "モデルが無い: $f"; exit 1; }
          n=$(wc -c < "$f")
          test "$n" -gt 1000000 || { echo "LFS のポインタのまま: $f ($n バイト)"; exit 1; }
      # 試験 binary を1本ずつ走らせ、件数を `meta/suites/` の登録と突き合わせる
      # （`DEC-PLT-039`）。 0 件で通った・登録の無い試験・黙って外した試験で落ちる。
      # マイクや実音声が要るハーネスは `#[ignore]` で、ここでは無視として数える。
      # 一度は自分で戻っていて、マイクの無いランナーで「通過」と数えられていた。
      - run: cargo xtask test-receipt
      # 「書いていない OS の席」を macOS で強制して組む。 Linux では自然に選ばれるが、
      # `target_os = "macos"` の下で cfg を書き忘れると、ここでしか分からない。**一度やった。**
      # 試験は走らせない。 席の振る舞いは ubuntu と Windows が見ていて、ここでしか
      # 赤くならないのは「組み立たない」ことだけ（`DEC-PLT-059`）。
      #
      # 最後に置く。 `RUSTFLAGS` を変えると build.rs も組み直されて走り直し、
      # koeru-align が Kaldi を最初からコンパイルし直す。 試験より前に置くと、
      # 試験の組み立てでもう一度 Kaldi を組むことになる。
      - name: clippy（書いていない OS の席）
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: --cfg koeru_force_unsupported_backend
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # 試験の作業場所はキャッシュに入れない。 残すと rust-cache の掃除が中の fixture を
      # target と取り違え、エラーの注記を出す。
      - name: 試験の作業場所を消す
        shell: bash
        run: rm -rf target/tmp

  test-windows:
    name: test (windows)
    # Nix は Windows をネイティブに支えない。公式経路は WSL2 で、
    # WSL 上の Nix は Linux 環境なので Windows ネイティブの検証にならない。
    # `TR-PLT-01` は Windows を第一級の対象としているので、ここが唯一の
    # 検証経路として残る——devShell では覆えない（`DEC-PLT-033`）。
    #
    # **いま Windows では KOERU が起動しない**（`DEC-ALN-016`）。Kaldi を
    # macOS にしか組んでいないので、`Studio::open` が名指しで失敗する。
    # ここが見ているのは、Windows ネイティブで組み立つことと、
    # アライナを要さないドメイン層が通ること。`Studio` を要する試験は
    # `cfg` で外してあり、失敗する契約そのものは `align.rs` が固定している。
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
      - name: MFA のモデルの実体が来ているか
        shell: bash
        run: |
          f=crates/koeru-align/models/japanese_mfa/acoustic/final.mdl
          test -f "$f" || { echo "モデルが無い: $f"; exit 1; }
          n=$(wc -c < "$f")
          test "$n" -gt 1000000 || { echo "LFS のポインタのまま: $f ($n バイト)"; exit 1; }
      # ツールチェーンはランナーの rustup が `rust-toolchain.toml` を読んで揃える。
      # キャッシュの扱いは test ジョブと同じ。 Nix を通らないので、rustc もそのまま呼ぶ。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 件数の突き合わせは他の OS と同じ（`DEC-PLT-039`）。
      - run: cargo xtask test-receipt
      # 理由は test ジョブの同じ段。
      - name: 試験の作業場所を消す
        shell: bash
        run: rm -rf target/tmp

  specs:
    name: specs (FSL + meta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci --command bash -eo pipefail {0}
    steps:
      # xtask の依存は toml と serde_json と apollo-compiler で、koeru-* を引かない。
      # submodule も LFS も要らない。
      #
      # 全履歴を取る。 `check-meta` が前の版と比べる（採用済みの判断の上書き、ID の付け直し）。
      # PR は `origin/main` との merge-base、main への push は親コミットが基準で、浅い clone
      # （既定の `fetch-depth: 1`）ではどちらも引けず、`check-meta` は比べずに通さず落ちる
      # （`DEC-PLT-039`）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # 組むのは xtask だけで、ui ジョブと同じ鍵を使う。 `flake.lock` を鍵に入れる理由は
      # test ジョブと同じ。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}
          shared-key: xtask
          cmd-format: nix develop .#ci -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fslc は版と SHA-256 の両方で `flake.nix` が固定している。
      # Renovate が追うのは版だけで、hash は `nix-hash-fix` が PR の中で当てる
      # （`DEC-PLT-033`）。
      - name: Show fslc
        run: fslc --version
      # ID 規約と edition の診断。仕様そのものの検査ではない。
      - name: fslc lint
        run: fslc lint specs/ --project specs/fsl-project.toml
      # manifest 1つにつき層ごと1仕様なので、スコープごとに chain を回す。
      # 層が1つでも落ちれば exit 1 になる（実際に落ちることを確認済み）。
      - name: fslc chain
        run: |
          set -euo pipefail
          for m in specs/fsl-*.toml; do
            echo "== $m"
            fslc chain "$m"
          done
      # FSL が扱わない情報が、FSL と技術要件の ID へ実際に繋がっているか。
      # `check-meta` は前の版とも比べ、どの基準と比べたかを1行出す。
      - name: meta registries
        run: |
          cargo xtask check-meta
          cargo xtask check-budgets
          cargo xtask check-coverage
          # 手書き文書とソースコメントの ID 参照が実体に解決するか。
          # check-meta は TOML の中しか見ないので、ここが Markdown とコメントを受け持つ。
          cargo xtask check-references
          # 判断記録の索引は生成物。手で足すと片方だけが古くなる。
          cargo xtask index-decisions --check
          # 試験 binary がどれも `meta/suites/` に登録されているか（`DEC-PLT-039`）。
          # 組み立てずに `cargo metadata` だけで見る。
          cargo xtask check-portfolio
      # consumer への契約（`DEC-PLT-035`）。 Rust の実装も画面も組み立てずに、
      # canonical SDL と見本の operation と能力の表を検査する（`DEC-PLT-040`）。
      - name: application contract
        run: cargo xtask check-schema
      # AGPL-3.0-or-later に取り込めないライセンスを持つ依存が入ったら落とす。
      # 外部 PR に対する防波堤。 マニフェストを解決するだけで組み立てないので、
      # submodule も LFS も要らないこのジョブに置く。
      - name: cargo-deny
        run: cargo deny check

  ui:
    name: ui (format + lint + type + story)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # WebView 側は crates/koeru-app/ui にまとめてある。
        # ここだけで完結する bun パッケージなので、ワークスペースを跨がない。
        working-directory: crates/koeru-app/ui
        # flake はリポジトリの根にあるので、明示して指す。
        # シェルの作業ディレクトリは上の working-directory のまま。
        shell: nix develop ${{ github.workspace }} --command bash -eo pipefail {0}
    steps:
      # bun しか使わない。submodule も LFS も要らない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # 受領証を作る xtask だけを組む。 specs ジョブと同じ鍵を使う。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}
          shared-key: xtask
          cmd-format: nix develop -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # story は実ブラウザに描いて axe を当てる（TR-PLT-25、DEC-PLT-022）。
      # ブラウザは nixpkgs の playwright-driver から出す。 npm の版と
      # nixpkgs の版が揃っていないと、入っていないブラウザを探して落ちる。
      # npm 側は nixpkgs が上がった PR の中で `playwright-follow` が揃える。
      - name: Playwright の版が揃っているか
        run: |
          set -euo pipefail
          if [ "$KOERU_PLAYWRIGHT_FROM_PACKAGE_JSON" != "$KOERU_PLAYWRIGHT_FROM_NIXPKGS" ]; then
            echo "::error::Playwright の版がずれている。package.json=$KOERU_PLAYWRIGHT_FROM_PACKAGE_JSON nixpkgs=$KOERU_PLAYWRIGHT_FROM_NIXPKGS"
            exit 1
          fi
          echo "Playwright $KOERU_PLAYWRIGHT_FROM_PACKAGE_JSON で揃っている"
      - name: Install
        run: bun install --frozen-lockfile
      # 整形・lint・型 ＋ story の網羅 ＋ IPC の呼び方。
      # --fix を付けない。CI は直す場所ではない。
      - name: vp check
        run: bun run check:static
      # story の axe と play。 件数を `meta/suites/ui.toml` と突き合わせる（`DEC-PLT-039`）。
      # 手元の `bun run check:ci` は上と合わせて同じものを走らせる。
      - name: story（受領証つき）
        run: cargo xtask test-receipt --runner bun
      # ビルドと型と npm のライセンス。
      - name: build
        run: bun run build

  talks:
    name: talks (dek lint + HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # 発表資料は talks/ で完結する dek のプロジェクト。ui と同じく bun だけで閉じる。
        working-directory: talks
        shell: nix develop ${{ github.workspace }} --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # dek は描画を Playwright で測る。ブラウザは nixpkgs から出るので、ui と同じく版を揃える。
      - name: Playwright の版が揃っているか
        run: |
          want=$(bun -e 'console.log((await Bun.file("package.json").json()).devDependencies.playwright)')
          if [ "$want" != "$KOERU_PLAYWRIGHT_FROM_NIXPKGS" ]; then
            echo "::error::Playwright の版がずれている。talks/package.json=$want nixpkgs=$KOERU_PLAYWRIGHT_FROM_NIXPKGS"
            exit 1
          fi
      - name: Install
        run: bun install --frozen-lockfile
      # 型・lint（はみ出しとコントラストを含む）・コミットした HTML が台本とスライドから
      # 作り直したものと一致するか。 PDF は書体と生成日時が環境で変わるので突き合わせない。
      - name: check
        run: bun run check

  phonemizer-parity:
    name: phonemizer parity (${{ matrix.channel }})
    # Windows は要らない。 綴りを決めるのは managed なコードで、
    # Linux 向け配布物に入っているアセンブリと同じ IL（`DEC-SYN-010` の層B）。
    # pwsh は GitHub のランナーに最初から入っている。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # OpenUtau のチャンネルに合わせる（`UpdaterViewModel.IsReleaseForChannel`）。
        # **stable は既定のチャンネル**——多くの人が動かしているのはこれ。
        # alpha は prerelease の上位集合で、綴りが変わるなら先に出る。
        channel: [stable, alpha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版・資産名・指紋は1箇所で持つ。 Renovate が版を上げ、
      # nix-hash-fix が指紋を当てる（`.github/renovate.json`）。
      - name: 固定した OpenUtau を読む
        id: pin
        shell: bash
        run: |
          f=crates/koeru-core/fixtures/phonemizer-parity/openutau.toml
          # `sub(/.*"/)` は使わない。 貪欲なので最後の引用符まで消える。
          awk -v want='${{ matrix.channel }}' '
            /^name *=/ { split($0, a, "\""); c = a[2] }
            c == want && $1 == "version" { split($0, a, "\""); v = a[2] }
            c == want && $1 == "asset"   { split($0, a, "\""); s = a[2] }
            c == want && $1 == "sha256"  { split($0, a, "\""); h = a[2] }
            END {
              if (v == "" || s == "" || h == "") { print "固定が読めない: " want > "/dev/stderr"; exit 1 }
              print "version=" v; print "asset=" s; print "sha256=" h
            }' "$f" >> "$GITHUB_OUTPUT"

      # 期待値を版ごとにキャッシュする。 100 MB 超を毎回引かない。
      # 鍵が変われば（＝Renovate が版を上げれば）作り直される。
      - name: 期待値のキャッシュ
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .openutau
          key: >-
            openutau-parity-${{ matrix.channel }}-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}-${{
              hashFiles('crates/koeru-core/fixtures/phonemizer-parity/**', '.github/scripts/openutau-parity.ps1') }}

      # 引いたものが固定した指紋と一致するか、ここで見る。
      # **版だけでは足りない。** 同じ札のまま中身を差し替えられる。
      - name: OpenUtau を引いて期待値を作る
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          ASSET: ${{ steps.pin.outputs.asset }}
          WANT: ${{ steps.pin.outputs.sha256 }}
        run: |
          mkdir -p .openutau/dll
          url="https://github.com/openutau/OpenUtau/releases/download/$VERSION/$ASSET"
          curl -fsSL "$url" -o "/tmp/$ASSET"
          got=$(sha256sum "/tmp/$ASSET" | cut -d' ' -f1)
          if [ "$got" != "$WANT" ]; then
            echo "指紋が固定と違う: $ASSET" >&2
            echo "  固定: $WANT" >&2
            echo "  実物: $got" >&2
            exit 1
          fi
          # **アセンブリを全部展開する。** 直に読むのは2つだが、そこから先の
          # 依存はこちらでは数え上げられない——`OpenUtau.Core.dll` だけを置くと
          # `Preferences` の静的初期化が `Serilog` を読めずに落ちる。**踏んだ。**
          case "$ASSET" in
            *.zip)    unzip -j -o "/tmp/$ASSET" '*.dll' -d .openutau/dll ;;
            *.tar.gz) tar -xzf "/tmp/$ASSET" -C .openutau/dll --wildcards '*.dll' ;;
            *)        echo "知らない形式: $ASSET" >&2; exit 1 ;;
          esac
          printf '%s\n%s\n%s\n' "${{ matrix.channel }}" "$VERSION" "$WANT" > .openutau/source.txt
          # **方式ごとに1つの音源**（`DEC-SYN-010`）。 presamp phonemizer は
          # 音符1つに綴り1つしか返さないので、1つの音源から3方式ぶんは出ない。
          for m in single sequential cvvc; do
            pwsh -NoProfile -File .github/scripts/openutau-parity.ps1 \
              -Assemblies .openutau/dll \
              -Voicebank "crates/koeru-core/fixtures/phonemizer-parity/$m" \
              -Out ".openutau/openutau-$m.tsv"
          done

      # 毎回突き合わせる。 キャッシュに当たった回も、KOERU 側の `expected.tsv`
      # は作業ツリーのものを読む——実装が変われば、ここで食い違いが出る。
      - name: KOERU の綴りと突き合わせる
        shell: bash
        run: |
          {
            echo '### 突き合わせた OpenUtau'
            echo '```'
            cat .openutau/source.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 方式ごとに見て、食い違った方式を全部出してから落とす。
          # 先頭で止めると、1回の CI で1方式しか直せない。
          bad=
          for m in single sequential cvvc; do
            diff -u "crates/koeru-core/fixtures/phonemizer-parity/$m/expected.tsv" \
                    ".openutau/openutau-$m.tsv" || bad="$bad $m"
          done
          if [ -n "$bad" ]; then
            echo "綴りが OpenUtau と食い違っている（DEC-SYN-010 の層B）:$bad"
            exit 1
          fi
