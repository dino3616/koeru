name: release gate

# リリース対象のプロファイルが、未決の論点に依存していないかを確かめる。
# 通常の CI では落とさない。未決が残っているのは開発中は正常だが、
# その状態でリリースするのは正常ではない、という線引き。
#
# プロファイルはまだ1つも無い（meta/profiles/README.md）。
# マイルストーンを立てて最初のプロファイルを作ったら、タグ push でも走らせる。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 検査するリリースプロファイルの ID
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: profile is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check profile
        run: cargo run --package xtask -- check-profile "${{ inputs.profile }}"
