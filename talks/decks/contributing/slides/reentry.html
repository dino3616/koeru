    <h2 class="slide-title">離れて、変わって、戻ってくる</h2>
    <dl class="facts">
      <dt>何をする</dt><dd>離れるときは、いまの版と次の一手を3点で残す。戻ったら、その時点といまを比べる</dd>
      <dt>どこにある</dt><dd><code>cargo xtask context --from &lt;checkpoint&gt; --at &lt;rev&gt;</code></dd>
      <dt>Agent は</dt><dd class="agent"><span class="tag" data-tone="agent">reentry</span>比べた出力を読んで説明する。何を覚えているはずかは推し量らない</dd>
      <dt>次へ</dt><dd>外で変わった見方は、新しい Signal になる</dd>
    </dl>
  </div>
