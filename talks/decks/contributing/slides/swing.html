<section class="slide" data-layout="default">
  <p class="kicker">1 — カタログの先</p>
  <h2 class="slide-title">ビートを保ったまま、ずらす</h2>
  <div class="stage body">
    <div class="lanes">
      <div class="lane" data-lane="rule">
        <p class="say"><b>規則どおり</b><span class="note">採ったから、確かめたことにする</span></p>
        <ol class="track" aria-hidden="true"><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li></ol>
      </div>
      <div class="lane" data-lane="random">
        <p class="say"><b>でたらめ</b><span class="note">確かめていないから、何も採らない</span></p>
        <ol class="track" aria-hidden="true"><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li></ol>
      </div>
      <div class="lane" data-lane="swing">
        <p class="say"><b class="grad">スウィング</b><span class="note">採ったまま、まだ確かめていないと書いて作り続ける</span></p>
        <ol class="track" aria-hidden="true"><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li><li class="pop"></li></ol>
      </div>
    </div>
    <div class="states" data-step="swing-states">
      <p class="label">KOERU の、ふつうの状態</p>
      <dl class="card state">
        <dt>判断</dt><dd>採用</dd>
        <dt>仮説</dt><dd><span class="absent" data-small>未検証</span></dd>
        <dt>範囲</dt><dd>戻せる範囲で試す</dd>
      </dl>
      <dl class="card state">
        <dt>仮説</dt><dd>ある条件では支持された</dd>
        <dt>判断</dt><dd>採らない</dd>
        <dt>理由</dt><dd>守る価値と合わない</dd>
      </dl>
    </div>
  </div>
  <p class="punch" data-step="swing-punch">採用状態と根拠状態を、混ぜない</p>
</section>
