    <h2 class="slide-title">UTAU は、分散して生きている文化です</h2>
    <p class="lede">本体にも更新があり、OpenUtau は今も開発とリリースが続く。録音も原音設定も試唱も、PC・スマホ・ブラウザで動く道具が育っている。</p>
    <p class="lede" data-step="alive-spread">一つの中心ソフトの文化から、<span class="hl">声とキャラクターと制作知識が、いくつもの環境で生きる文化</span>へ。</p>
    <p class="lede" data-step="alive-life">この分散は問題ではない。<span class="hl">道具がそれぞれ良くなれるのは、分散しているから。</span></p>
