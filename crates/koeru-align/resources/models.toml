# 同梱するモデル・辞書・音響モデルの台帳（TR-ALN-31）。
#
# > 出所 URL、ライセンス（SPDX 識別子または原文）、学習データの出所とそのライセンス、
# > 必要な帰属表示、商用配布の可否を台帳として持ち**ライセンス表記に反映する**。
# > **ライセンスまたは学習データの出所が確認できないモデルは同梱しない。**
# > 例外は、判断記録に「何を受け取ったか」と「何が未確認のままか」を書いて通したものに限る。
# > **台帳にはその判断記録の ID を併記し、未確認の項目を空欄にせず未確認と書く。黙って通さない。**
#
# **CC BY 系は帰属表示・ライセンスへのリンク・変更の明示が義務**なので、
# `attribution` を必ず埋め、アプリ内のライセンス表記へ出す。
#
# `corpus_status` に使う値:
#   ok        条件に問題がない
#   restricted 再配布禁止・非商用限定などが含まれる。**judgement が要る**
#   unverified 出所またはライセンスが未確認。**judgement が要る**
#
# **モデルの実体は submodule で持っている**（DEC-ALN-012）。
# `crates/koeru-align/models/japanese_mfa` が HuggingFace のリポジトリを指す。
# **上流がホストしているので、KOERU 自身が再配布しているわけではない。**

[[model]]
id = "mfa-japanese-acoustic"
name = "MFA 日本語音響モデル v3.3.0"
purpose = "日本語音素の強制アライメント（一次経路）"
source_url = "https://huggingface.co/MontrealCorpusTools/japanese_mfa"
license = "CC-BY-4.0"
attribution = "Montreal Forced Aligner — japanese_mfa v3.3.0 by Michael McAuliffe (CC BY 4.0)。KOERU は重みを改変せず、そのまま同梱している"
corpus_status = "restricted"
corpus = """
LaboroTV Japanese 1,915.43h（**LaboroTV Non-commercial。学習量の 91.7%**）/ Common Voice Japanese 71.54h（CC0）/ GlobalPhone Japanese 33.88h（**ELRA の有償ライセンス、再配布不可**）/ Japanese Versatile Speech 30.25h（CC BY-SA 4.0）/ MagicData ASR-SJapDuSC 18.71h（**CC BY-NC-ND 4.0**）/ Microsoft Speech Language Translation Japanese 9.85h（Microsoft Research Data License）/ TEDxJP-10K 8.85h（Apache-2.0）。**合計 2,088.51h のうち 1,968.02h（94.2%）が非商用または再配布不可**"""
commercial_ok = "unverified"
judgement = "DEC-ALN-012"
note = "**学習データの 94.2% が非商用・再配布不可。** DEC-ALN-008 の「配布者の表示を額面どおり受け取る」判断を、DEC-ALN-012 でこの重さを承知の上で継続した。**確実性の主張ではない。** → EVID-ALN-001"

[[model]]
id = "mfa-japanese-dictionary"
name = "MFA 日本語辞書（japanese_mfa.dict）"
purpose = "辞書 FST の語彙"
source_url = "https://huggingface.co/MontrealCorpusTools/japanese_mfa"
license = "CC-BY-4.0"
attribution = "Montreal Forced Aligner — Japanese MFA dictionary v3.0.0 (CC BY 4.0)"
corpus_status = "ok"
corpus = "辞書は語と読みの対応表で、音声コーパスから学習した重みではない"
commercial_ok = "yes"
judgement = "DEC-ALN-012"
note = ""

[[model]]
id = "julius-segmentation-kit"
name = "Julius セグメンテーションキットの日本語音響モデル"
purpose = "日本語音素の強制アライメント（退避経路）"
source_url = "https://github.com/julius-speech/segmentation-kit"
license = "MIT"
attribution = "Julius segmentation-kit (MIT) / Julius engine (BSD-3-Clause)"
corpus_status = "unverified"
corpus = "**未確認。** License.md は対象を \"the Software\" と定義するだけで、同梱の .binhmm を明示的に列挙していない"
commercial_ok = "unverified"
judgement = "DEC-ALN-004"
note = "**リポジトリ全体が MIT で配られている事実を受け取った判断。** 上流への問い合わせは継続中"
