# 綴りを突き合わせた OpenUtau（`DEC-SYN-010` の層B）。
#
# # チャンネルは OpenUtau の区分に合わせる
#
# OpenUtau は3つのチャンネルを持つ（`OpenUtau/ViewModels/UpdaterViewModel.cs` の
# `IsReleaseForChannel`）。**既定は stable**（`Preferences.Default.Channel`）。
#
#   stable  prerelease でないもの
#   beta    prerelease のうち `-alpha` で終わらないもの
#   alpha   prerelease すべて（beta を含む上位集合）
#
# stable を見るのは、既定のチャンネルだから——多くの人が動かしているのはこれ。
# alpha を見るのは、綴りが変わるならそちらに先に出るから。beta は alpha に
# 含まれるので別に見ない。
#
# # 版と指紋の両方を固定する
#
# 片方だけだと、同じ札のまま中身を差し替えられる。 `fslc` と同じ運用
# （`DEC-PLT-033`）——版は Renovate が上げ、指紋は `nix-hash-fix` ワークフローが
# 上流の digest から当てる（`.github/scripts/update-hashes.sh`）。
#
# 配布物の名前は上流が版をまたいで変える。 チャンネル間で揃う保証も無いので、
# 資産名も固定する。
#
# # これは互換性の記録でもある
#
# 「どの KOERU がどの OpenUtau と突き合わされたか」は、この commit の
# この内容が答える。 配布物の readme にも出る（`koeru_package::readme`）。

