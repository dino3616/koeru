[package]
name = "koeru-formats"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "KOERU の外部形式。oto.ini・周波数表・WAV・ZIP の構文と符号化、無損失の往復。ファイルを開かない"

[lints]
workspace = true

# バイト列と `Read` / `Write` / `Seek` だけを扱う（DEC-PLT-034）。 ファイルを開くのは
# 呼び出し側で、採用・台帳・確信度の方針もここに持ち込まない。 `tests/purity.rs` が見る。
[dependencies]
# CP932 と UTF-8 の読み書き（TR-PLT-08）。
encoding_rs.workspace = true
koeru-failure = { path = "../koeru-failure" }
# `oto.ini` の1エントリが持つ5値（`IniEntry.oto`）。 台帳と書き出しが同じ型を渡すので、
# ここで別の形を作らない。
koeru-model = { path = "../koeru-model" }
thiserror.workspace = true
# 符号化の span。 載せるのは符号化の名前とバイト数だけ。
tracing.workspace = true
# CP932 で書けない字の代替案を作る互換分解（TR-PKG-17）。
unicode-normalization.workspace = true
# USTX（OpenUtau の曲）の構文。 別名の展開と入れ子の深さに上限を持つ。
yaml_serde.workspace = true
# 配布 ZIP の符号化と読み戻し（`TR-PKG-26`、`TR-PKG-52`）。 deflate だけに絞ってある
# （ルートの `Cargo.toml`）。 ワークスペースが既に引いているもので、新しい crate は入らない。
zip.workspace = true
