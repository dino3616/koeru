[package]
name = "koeru-audio"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "KOERU の音声入出力。各 OS の API を直接叩き、抽象レイヤを挟まない"

[lints]
workspace = true

[dependencies]
koeru-failure = { path = "../koeru-failure" }
thiserror.workspace = true
tracing.workspace = true

# macOS の AVFoundation。マイクモード検知と権限だけ。
# CoreAudio の HAL は自前束縛（backend/macos/sys.rs）で、こちらは Objective-C なので届かない。
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-av-foundation.workspace = true

# リングの push / pop の交差を網羅する（`ring.rs` の「並行性の検査」）。
# `--cfg loom` を立てた試験の組み立てにだけ入り、製品には入らない。 tokio-rs、MIT。
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"
