[package]
name = "koeru-app"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "KOERU のアプリケーション層。Tauri のコマンドと、ドメイン層の組み立て"

# Tauri の慣例は src-tauri/ だが、ここでは crates/ に置く。
# ワークスペースのメンバは crates/* で、音声・合成・ドメインと並べたほうが
# 「どの層か」が場所から読める。tauri.conf.json をこのディレクトリに置けば動く。
[lib]
name = "koeru_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 統合テストから、音声デバイス無しで台帳を進めるための入口。
# 既定では入らない。
test-hooks = []

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
koeru-align = { path = "../koeru-align" }
koeru-audio = { path = "../koeru-audio" }
koeru-core = { path = "../koeru-core" }
koeru-failure = { path = "../koeru-failure" }
koeru-model = { path = "../koeru-model" }
koeru-package = { path = "../koeru-package" }
koeru-synth = { path = "../koeru-synth" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# 書き出したものを OS のファイルマネージャで見せる（`TR-PKG-45` の到達経路 (1)）。
# tauri-apps org、MIT / Apache-2.0。JS へは口を開けず、Rust から関数を呼ぶだけ。
tauri-plugin-opener = "2.5.5"

[dev-dependencies]
# 合成結果の音高を測る。鳴らせただけでは音高が合っているか分からない。
koeru-synth = { path = "../koeru-synth" }

# 保存先の残量を引く（REQ-REC-110）。libc は rust-lang org。
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
