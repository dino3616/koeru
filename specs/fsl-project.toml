# KOERU の検証チェーン。
#
# FSL が形式的に持つのは、いまはプロジェクトのライフサイクル1本だけ。
# 録音 → テイク確定 → 完成 → 非公開のまま終了 → ZIP 書き出し。
# 他の要件は meta/requirements が持つ。
#
# business 層はまだ書いていない。ビジョンの3原則を形式化できるかは未検証で、
# 先に requirements と design の継ぎ目が有効かを確かめる段階にある。

[requirements]
file = "requirements/project-lifecycle.fsl"
depth = 12

[design]
file = "design/project-storage.fsl"
depth = 12
refine_against = "requirements"
mapping = "refinement/project-design-refines-requirements.fsl"
