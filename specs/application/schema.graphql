}

"今は書き出せない。 何が足りないかは `readiness`。"
type ExportBlocked implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  readiness: ExportReadiness!
}

input CommitExportInput {
  lease: ProjectLease!
  operationId: OperationId!
  plan: ExportPlanId!
}

type CommitExportPayload {
  receipt: MutationReceipt!
  outcome: CommitExportOutcome!
}

union CommitExportOutcome =
  | ReleasePublished
  | RevisionConflict
  | ReferenceNotFound
  | StorageProblem
  | RecoveryRequired
  | ProjectLeaseExpired
  | OperationIdReused

type ReleasePublished {
  release: Release!
}

input ExportSettingsFileInput {
  lease: ProjectLease!
  operationId: OperationId!
  encoding: TextEncoding!
}

type ExportSettingsFilePayload {
  receipt: MutationReceipt!
  outcome: ExportSettingsFileOutcome!
}

union ExportSettingsFileOutcome =
  | SettingsFileExported
  | ActionRejected
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SettingsFileExported {
  fileName: String!
  entryCount: Int!
}

# ### 背後の仕事

input RetryAnalysisInput {
  lease: ProjectLease!
  operationId: OperationId!
  take: TakeId!
}

type RetryAnalysisPayload {
  receipt: MutationReceipt!
  outcome: RetryAnalysisOutcome!
}

union RetryAnalysisOutcome =
  | AnalysisRequeued
  | ReferenceNotFound
  | ResourceBusy
  | CapabilityUnavailable
  | ProjectLeaseExpired
  | OperationIdReused

type AnalysisRequeued {
  job: BackgroundJob!
}

input CancelJobInput {
  lease: ProjectLease!
  job: JobId!
}

type CancelJobPayload {
  outcome: CancelJobOutcome!
}

union CancelJobOutcome =
  | JobCancelRequested
  | JobAlreadyFinished
  | ReferenceNotFound
  | ProjectLeaseExpired

"止める要求を受けた。 止まったかは `jobEvents` と `JobQueue.job` で見る。"
type JobCancelRequested {
  job: BackgroundJob!
}

"止める前に終わっていた。 結果は公開済みで、取り消していない。"
type JobAlreadyFinished implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  job: BackgroundJob!
}

# ## 観測
#
# 1つの operation に1つの root。 持ち主ごとに分け、届け方も持ち主ごとに違う
# （`DEC-PLT-036`）。 unsubscribe は観測をやめるだけで、作業を止めない。

type Subscription {
  "project の変更の通知。 落とさない。 欠けたら Query で取り直す。"
  projectEvents(lease: ProjectLease!, after: EventCursor): ProjectEvent!
  "仕事1件の今の状態と、以後の変化。"
  jobEvents(lease: ProjectLease!, job: JobId!, after: EventCursor): JobEvent!
  "待っている仕事の数（`TR-SYN-33`）。 捨ててよく、再送しない。"
  jobQueue(lease: ProjectLease!): JobQueueEvent!
  "入力の包絡（`TR-REC-43`）。 捨ててよい。 詰まったら古い観測を捨て、新しいものを送る。"
  inputEnvelope(input: InputLeaseId!): InputEnvelopeEvent!
  "再生の経過。 捨ててよく、再送しない。"
  playbackEvents(playback: PlaybackId!): PlaybackEvent!
}

union ProjectEvent = ProjectChanged | EventGap | ProjectLeaseExpired

type ProjectChanged {
  cursor: EventCursor!
  revision: Revision!
}

"続きが欠けた。 Query で取り直してから `resumeAfter` の続きを読む。"
type EventGap {
  resumeAfter: EventCursor!
}

union JobEvent = JobUpdated | EventGap | ProjectLeaseExpired

"最初の1件は今の状態。"
type JobUpdated {
  cursor: EventCursor!
  job: BackgroundJob!
}

union JobQueueEvent = JobQueueCounts | ProjectLeaseExpired

type JobQueueCounts {
  pending: Int!
  running: Int!
}

union InputEnvelopeEvent = InputEnvelopeFrame | InputLeaseEnded

type InputEnvelopeFrame {
  "この貸与で数えた標本の通算。 進んでいないフレームは送らない。"
  position: SampleCount!
  "目盛りごと。 割り切れない本数へ畳まない。"
  steps: [EnvelopeStep!]!
  "この貸与で、フルスケールに達した回数（`TR-REC-16`）。 画面に数えさせない。"
  clippedRuns: Int!
  "溜まっているプリロール（`TR-REC-19`）。"
  prerollMs: Float!
  "前のフレームから、詰まって捨てた観測の数。"
  dropped: Int!
}

union PlaybackEvent = PlaybackProgress | PlaybackEnded

type PlaybackProgress {
  positionMs: Float!
}

type PlaybackEnded {
  reason: PlaybackEndReason!
}

enum PlaybackEndReason {
  COMPLETED
  STOPPED
  DEVICE_LOST
}
