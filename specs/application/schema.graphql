# KOERU が consumer に約束する application の言葉（`DEC-PLT-035`）。
#
# Rust の型からも画面の部品からも作らない。 読みは Query、利用者の意図は Mutation、
# 続いていく観測は Subscription（`DEC-PLT-036`）。 product の規則は FSL と meta が
# 持ち、ここは語彙・形・予期できる結果だけを持つ。 規則は description に写さず、ID で引く。
#
# 何を持つか、変え方、旧コマンドからの移行表は `README.md`。
# 検査は `cargo xtask check-schema`。
#
# `暫定（人が決める）` の印は、決まっていない語彙に置いた仮の選択。 印の一覧は `README.md`。

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ## 識別子
#
# 取り違えると別のものを指す識別子は、それぞれ別の scalar にする（`DEC-PLT-034`）。
# operation の検査で、テイクの識別子を行の欄へ渡すと落ちる。 wire ではどれも文字列で、
# consumer は中身を解釈しない。 表示文・エイリアス・並びの位置から作らない（`DEC-RCL-017`）。
#
# 暫定（人が決める）: 識別子ごとに scalar を分けるか、組み込みの ID にまとめるか。

"永続する project。 表示名を変えても、開き直しても変わらない。"
scalar ProjectId

"""
開いた project への貸与。 閉じて開き直すと別の値になり、同じ値を二度と振らない。
画面の mount では作り直さない（`DEC-PLT-037`）。
"""
scalar ProjectLease

"project の版。 等しいかだけを比べ、大小を比べない。"
scalar Revision

"""
呼び出し側が振る、確定を伴う意図の識別子（`DEC-PLT-035`）。
同じ値・同じ要求には同じ受領証を、同じ値・違う要求には衝突を返す。
"""
scalar OperationId

"Subscription を続きから読むための位置。"
scalar EventCursor

"録音リストの行。 読み上げる文字列でも並びの位置でもない。"
scalar RowId

"録る対象（`DEC-RCL-017`）。 構造の鍵から導くので、エイリアスを改名しても変わらない。"
scalar TargetId

"録音を始めてから、確定するか捨てるまでの1回。 テイクとは別。"
scalar CaptureId

"確定したテイク。 同じ音でも、別の録音なら別のテイク。"
scalar TakeId

"エントリ（原音設定の1件）。"
scalar EntryId

scalar SongId

scalar NoteId

scalar JobId

scalar ReleaseId

"書き出しの計画。 確定するまで project を変えない。"
scalar ExportPlanId

"入力デバイスの永続識別子（`TR-REC-03`）。"
scalar DeviceId

"開いている入力ストリームへの貸与。 包絡・プリロール・収録はこれに属する。"
scalar InputLeaseId

"鳴らしている1回。"
scalar PlaybackId

"編集の区間。 操作のモードを持つ。 project のデータではない（`TR-EDT-03`）。"
scalar EditingSessionId

# ## 値
#
# GraphQL の Int は 32 bit で、超えうる量だけを scalar にする。 wire では JSON の数で、
# 2^53 まで正確に届く。
#
# 暫定（人が決める）: 32 bit を超えうる量を scalar にするか、Float で運ぶか。

"バイト数。 0 以上の整数。"
scalar ByteCount

"マスターのレート（`ApplicationInfo.masterSampleRate`）で数えた標本の数。 0 以上の整数。"
scalar SampleCount

scalar DateTime @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339")

# 暫定（人が決める）: ファイルの中身を base64 で運ぶか、desktop host が発行する
# 不透明な許可（選んだファイルを指す札）で渡すか。 どちらでもパスは契約に入らない。
"ファイルの中身そのもの。 base64 で運ぶ。"
scalar Base64Bytes

# ## 予期できる結果（`DEC-PLT-038`）
#
# 呼び出し側が分岐する結果は payload の union で返す。 `errors[]` は不正な文書・
# 実装の欠陥・想定外の不変条件の破れだけで、null の伝播を状態の代わりにしない。

"呼び出し側の次の手。"
enum CallerAction {
  FIX_INPUT
  MEET_CONDITION
  REFRESH
  NOTHING
  SHOW_RECEIPT
  WAIT
  RECONNECT
  GRANT
  RETRY_SAME
  FREE_SPACE
  RECOVER
  USE_AVAILABLE
  REBUILD
  REPORT
}

"失敗の分類。 内部の不変条件の破れはここに無く、`errors[]` に出る。"
enum FailureClass {
  INVALID_INPUT
  REJECTED
  CONFLICT
  CANCELLED
  ALREADY_COMMITTED
  BUSY
  DEVICE_UNAVAILABLE
  TRANSIENT_IO
  STORAGE
  CORRUPT
  UNSUPPORTED
  ENGINE_FAILED
}

"確定の状態。"
enum CommitState {
  NOT_STARTED
  NOT_COMMITTED
  COMMITTED
  UNKNOWN
}

"""
予期できる失敗の共通の形。 consumer は `code` と `class` と `actions` で分岐し、
`message` を解析しない。 `message` は固定の文で、利用者のデータを含まない。
"""
interface Problem {
  "点区切りの固定の文字列。 変えることは契約の変更になる。"
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"project への貸与がもう生きていない。 閉じた、開き直した、別の project に切り替えた。"
type ProjectLeaseExpired implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"入力への貸与がもう生きていない。 デバイスを選び直した、外れた、project を閉じた。"
type InputLeaseEnded implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"編集の区間がもう閉じている。 閉じた区間の遅れて届いた操作は当てない。"
type EditingSessionEnded implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"読んだ版が古い。 最新を読み直す。 古い要求を当て直さない。"
type RevisionConflict implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  expected: Revision!
  actual: Revision!
}

"同じ操作の識別子で、違う要求が来た。 payload の受領証は先に処理した操作のもの。"
type OperationIdReused implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  operationId: OperationId!
}

"入力が不正。 直さずに送り直しても同じ結果になる。"
type InvalidRequest implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  violations: [InputViolation!]!
}

type InputViolation {
  "入力の中の場所。 欄の名前を . でつなぐ。"
  field: String!
  code: String!
}

"要求は正しいが、今の状態では受けられない。 足りない条件は `code` が示す。"
type ActionRejected implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"指したものが、この版に無い。"
type ReferenceNotFound implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"混んでいる。 待つか、明示してやり直す。"
type ResourceBusy implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"マイクや出力が使えない。 無音を録音として扱わない。"
type DeviceUnavailable implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  "どのデバイスか分かるときだけ。"
  device: DeviceId
}

"容量が足りない、または権限が無い。 確定したものと受領証は守る。"
type StorageProblem implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"この環境では使えない。 使える能力だけを使う。"
type CapabilityUnavailable implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"保存されたものが壊れている、または確定したか分からない。 自動で正常化しない。"
type RecoveryRequired implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"外部エンジン（アライナ・合成）の失敗。 元のデータは残る。"
type EngineFailed implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

"""
確定を伴う意図の受領証（`DEC-PLT-035`）。 応答が失われても、同じ `operationId` で
同じ受領証が返る。
"""
type MutationReceipt {
  operationId: OperationId!
  commit: CommitState!
  "処理したあとの版。 確定しなかったときは、処理した時点の版。"
  revision: Revision!
  "先に処理した操作の受領証を返したか。"
  replayed: Boolean!
}

# ## 共通の形

"一覧の窓。 `limit` の上限は `ContractLimits.maxWindow`。 超えたら InvalidRequest。"
input WindowInput {
  offset: Int!
  limit: Int!
}

# 暫定（人が決める）: consumer が選んだファイルの名前を契約へ入れてよいか。 曲の題の
# 候補を作るためだけに要る。
"consumer が選んだファイル。"
input FileInput {
  "題の候補を作るための名前。 ディレクトリを含めない。"
  name: String!
  content: Base64Bytes!
}

"音高（`TR-REC-25`）。 画面に出すのは `name` で、MIDI 番号は出さない。"
type Tone {
  midi: Int!
  name: String!
}

"作り方。"
enum RecordingMethod {
  SINGLE
  SEQUENTIAL
  CVVC
  MULTI_PITCH_SEQUENTIAL
}

"上と下の組。 畳まずにそのまま渡す。"
type EnvelopeStep {
  low: Float!
  high: Float!
}

# ## 読み

type Query {
  "アプリと契約の版（`DEC-PLT-035`）。"
  application: ApplicationInfo!
  "ライブラリにある project。 開かずに読める要約だけ。"
  library: Library!
  "project を作るときに選べるもの。 project に属さない。"
  catalog: Catalog!
  "音声の入出力。 project に属さない。"
  audio: AudioEnvironmentResult!
  "開いた project を読む。 1つの operation の中の project 由来の欄は同じ版を観測する。"
  project(lease: ProjectLease!): ProjectResult!
  "テイクの見えている範囲の波形（`TR-PLT-04`）。 読む量は画素数で決まり、範囲の広さに比例しない。"
  waveformWindow(input: WaveformWindowInput!): WaveformWindowResult!
  "テイクの見えている範囲のスペクトログラム（`TR-PLT-04`）。 素材全体を先に計算しない。"
  spectrogramWindow(input: SpectrogramWindowInput!): SpectrogramWindowResult!
  "取り込む前の曲ファイルの中身（`TR-RCL-12`）。 台帳へ入れない。"
  songFileDrafts(input: SongFileDraftsInput!): SongFileDraftsResult!
}

type ApplicationInfo {
  version: String!
  "この実行が約束している契約の hash。 support bundle と受領証に結び付ける。"
  contractHash: String!
  "マスターのレート（`TR-REC-02`）。 標本位置をミリ秒へ直すのに使う。"
  masterSampleRate: Int!
  limits: ContractLimits!
  "同梱しているモデルのライセンス表記（`TR-ALN-31`）。"
  bundledModelNotice: String!
}

"要求の大きさの上限。 数は実行が決め、契約には書かない。"
type ContractLimits {
  maxWindow: Int!
  maxWaveformPixels: Int!
  maxSpectrogramCells: Int!
}

type Library {
  projects: [ProjectListing!]!
}

union ProjectListing = ProjectSummary | UnreadableProject

type ProjectSummary {
  id: ProjectId!
  displayName: String!
  method: RecordingMethod!
  rowCount: Int!
  voice: VoiceSummary!
}

"manifest か台帳が読めない project。"
type UnreadableProject implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  id: ProjectId!
  "manifest が読めたときだけ。"
  displayName: String
}

"""
音源の育ち具合（`DEC-PLT-025`, `DEC-PLT-027`）。 被覆と歌える曲は常に並べて出す
（`TR-RCL-19`）。
"""
type VoiceSummary {
  covered: Int!
  required: Int!
  "完成の状態。 書き出しの履歴を見ない（`INV-PKG-001`）。"
  completion: CompletionState!
  "手渡しの状態。 完成の判定はこれを見ない（`TR-PKG-33`）。"
  handoff: HandoffState!
  singableSongs: Int!
  songsInBank: Int!
  "内側から順。 五十音の行ごとの被覆。"
  rings: [CoverageRing!]!
  "声から作った色。 1つも録れていなければ null。"
  color: VoiceColor
}

enum CompletionState {
  INCOMPLETE
  AWAITING_SETTINGS
  COMPLETE
}

enum HandoffState {
  NOT_EXPORTED
  EXPORTED
}

type CoverageRing {
  covered: Int!
  total: Int!
}

"彩度と明度は 0〜1 の位置。 面ごとの幅への写しは画面が持つ（`DEC-PLT-027`）。"
type VoiceColor {
  hue: Float!
  chroma: Float!
  lightness: Float!
}

type Catalog {
  "選べる作り方（`TR-RCL-11`）。 収録音高の本数は所要時間にだけ効く。"
  methodPresets(toneCount: Int!): [MethodPreset!]!
  "収録音高の出発点（`TR-RCL-06`）。 制約ではない。"
  toneSuggestions: [ToneSuggestion!]!
  "選べる収録音高（`TR-RCL-06`）。"
  toneOptions: [Tone!]!
}

type MethodPreset {
  id: ID!
  method: RecordingMethod!
  label: String!
  summary: String!
  rowCount: Int!
  unitCount: Int!
  "全部読み終えるまでの固定の見積もり（`TR-RCL-09`）。"
  estimatedSeconds: Int!
  passes: Int!
  "読み終えると何ができるか（`TR-RCL-11`）。"
  reach: String!
  reading: String!
}

type ToneSuggestion {
  label: String!
  why: String!
  tones: [Tone!]!
}

union AudioEnvironmentResult =
  | AudioEnvironment
  | CapabilityUnavailable
  | DeviceUnavailable

type AudioEnvironment {
  inputDevices: [InputDevice!]!
  "出力先の種別（`TR-REC-24`）。 ドライバの申告で、回り込みが無いことの根拠にしない。"
  outputRoute: OutputRoute!
}

type InputDevice {
  id: DeviceId!
  name: String!
}

enum OutputRoute {
  HEADPHONES
  SPEAKERS
  UNKNOWN
}

union ProjectResult = Project | ProjectLeaseExpired

"""
開いた project の1つの版。 欄は領域ごとの面に分け、同じ版から遅延して読む。
面をまたいで1つの巨大な読みにしない。
"""
type Project {
  id: ProjectId!
  lease: ProjectLease!
  "この読みが観測した版。"
  revision: Revision!
  displayName: String!
  method: RecordingMethod!
  tones: [Tone!]!
  notices: [ProjectNotice!]!
  voice: VoiceSummary!
  recording: RecordingFacet!
  review: ReviewFacet!
  repertoire: RepertoireFacet!
  editor: EditorFacet!
  distribution: DistributionFacet!
  jobs: JobQueue!
}

enum ProjectNoticeKind {
  RULES_FILE_RESTORED
}

"本人が下ろすまで残る知らせ。"
interface ProjectNotice {
  kind: ProjectNoticeKind!
}

"""
開いたときに綴りの規則を作成時のものへ戻した（`DEC-SYN-013`）。 書き換えられていた
中身は `keptAs` の名前で project の中に残してある。
"""
type RulesFileRestored implements ProjectNotice {
  kind: ProjectNoticeKind!
  keptAs: String!
}

# ### 収録

type RecordingFacet {
  order: RecordingOrder!
  rows(window: WindowInput!): RowPage!
  "この版に無ければ null。"
  row(id: RowId!): RecordingRow
  "この版に無ければ null。"
  take(id: TakeId!): Take
  "残りの見積もり（`TR-RCL-09`, `DEC-RCL-013`）。"
  remaining: RemainingWork!
  "音高ごとの消化率（`TR-RCL-26`）。"
  byTone: [ToneProgress!]!
  "この音源で使うと選んだマイク（`TR-REC-03`）。 一度も選んでいなければ null。"
  chosenDevice: DeviceId
  "開いている入力。 開いていなければ null。"
  input: InputLease
  "いま録っている1回。 録っていなければ null。"
  activeCapture: Capture
  "残量の見積もり（`TR-REC-41`）。"
  space: SpaceEstimate!
  "次のフレーズへ進むまでの長さ（`TR-REC-20`）。"
  autoAdvanceMs: Float!
}

"録る順（`TR-SYN-19`）。 どちらの順でいるかを常に表示する。"
type RecordingOrder {
  mode: RecordingOrderMode!
  "次に録る順。 収録済みの行は入らない。"
  upcoming(window: WindowInput!): RowPage!
}

enum RecordingOrderMode {
  SONG_BANK_FIRST
  COVERAGE_EFFICIENCY
}

type RowPage {
  total: Int!
  offset: Int!
  items: [RecordingRow!]!
}

type RecordingRow {
  id: RowId!
  "読み上げる文字列。 識別子ではない。"
  prompt: String!
  state: RowState!
  "この行から取れる音の数。 被覆は行ではなくこれで数える（`TR-RCL-19`）。"
  unitCount: Int!
  "モーラ数と難読音の数（`TR-RCL-07`）。 重みを合成したスコアは返さない。"
  moraCount: Int!
  hardMoraCount: Int!
  "この行を読むと録れる対象。"
  targets: [RecordingTarget!]!
  "世代順。 採用していないものも含む（`TR-REC-21`）。"
  takes: [Take!]!
  "採用しているテイク。 まだ無ければ null。"
  adoptedTake: TakeId
}

enum RowState {
  UNRECORDED
  RECORDED
  NEEDS_RETAKE
  EXCLUDED
}

"""
録る対象（`DEC-RCL-017`）。 identity は音高・方式の上の役割・音素の文脈の組で、
`renderedAlias` はそれを作成時の規則で描いた表現。
"""
type RecordingTarget {
  id: TargetId!
  tone: Tone!
  shape: TargetShape!
  "作成時に固定した規則で描いた綴り。 鍵にしない。"
  renderedAlias: String!
}

union TargetShape = CvTarget | TransitionTarget | EndingTarget

enum CvPosition {
  ISOLATED
  PHRASE_HEAD
  AFTER_VOWEL
}

type CvTarget {
  kana: String!
  position: CvPosition!
  "`position` が AFTER_VOWEL のときだけ。"
  precedingVowel: String
}

"隣り合う2モーラのあいだの渡り。"
type TransitionTarget {
  vowel: String!
  consonant: String!
}

"行末の母音が消えていく区間。"
type EndingTarget {
  vowel: String!
}

type Take {
  id: TakeId!
  row: RowId!
  "何本目か。 1 から。"
  generation: Int!
  "録った時刻（`DEC-RCL-015`）。 事実だけで、間隔を集計しない。"
  recordedAt: DateTime!
  durationMs: Float!
  validity: TakeValidity!
  capture: CaptureReport!
  "派生物の状態。 テイクの確定とは別に進む。"
  analysis: AnalysisState!
  "このテイクから作ったエントリ（`TR-ALN-33`）。"
  entries: [SettingEntry!]!
}

enum TakeValidity {
  VALID
  "取りこぼしで自動的に無効にした（`TR-REC-07`）。 同じ行がもう一度出てくる。"
  INVALIDATED_BY_DROPOUT
}

type CaptureReport {
  "押した瞬間より前から遡れた長さ（`TR-REC-19`）。"
  prerollMs: Float!
  "取りこぼしの回数（`TR-REC-07`）。"
  discontinuities: Int!
  "サンプルピーク（dBFS）。 無音なら null。"
  peakDbfs: Float
  "フルスケールに達した回数（`TR-REC-16`）。"
  clippedRuns: Int!
  "前後の無音（`TR-REC-38`）。 足りなくてもテイクは有効。"
  leadingMarginMs: Float!
  trailingMarginMs: Float!
  hasRequiredMargins: Boolean!
}

union AnalysisState =
  | AnalysisReady
  | AnalysisPending
  | AnalysisFailed
  | AnalysisUnavailable

type AnalysisReady {
  "境界の確信度。"
  confidence: Float!
  "推定したあとでモデルが変わった（`TR-ALN-29`）。"
  staleModel: Boolean!
}

type AnalysisPending {
  job: JobId!
}

"解析が落ちた。 テイクは確定したまま残る。"
type AnalysisFailed implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  job: JobId!
