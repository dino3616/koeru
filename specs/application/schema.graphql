# ## 意図
#
# 名前は利用者の意図で、DB の行の作成・更新・削除を写さない。 どれも `input` を1つ取り、
# `outcome` の union を持つ payload を返す。 確定を伴うものは `operationId` を取り、
# payload に受領証を持つ（`DEC-PLT-035`）。

type Mutation {
  # ### project
  createProject(input: CreateProjectInput!): CreateProjectPayload!
  renameProject(input: RenameProjectInput!): RenameProjectPayload!
  "開くと収録の区間が始まる（`TR-REC-30`）。 読みの寿命に隠さない（`DEC-PLT-037`）。"
  openProject(input: OpenProjectInput!): OpenProjectPayload!
  closeProject(input: CloseProjectInput!): CloseProjectPayload!
  dismissProjectNotice(input: DismissProjectNoticeInput!): DismissProjectNoticePayload!

  # ### 収録
  "マイクを選んでストリームを開く（`TR-REC-03`）。 選んだことは音源に残る。"
  armInput(input: ArmInputInput!): ArmInputPayload!
  "入力が届いているかを確かめる（`TR-REC-17`）。 成否ではなくピークを見る。"
  probeInput(input: ProbeInputInput!): ProbeInputPayload!
  "入力レベルを校正する（`TR-REC-14`）。 関門にしない。"
  calibrateInput(input: CalibrateInputInput!): CalibrateInputPayload!
  "保存してあるゲインへ戻す（`TR-REC-15`）。 本人が選んだときだけ。"
  restoreSavedGain(input: RestoreSavedGainInput!): RestoreSavedGainPayload!
  "全チャンネルを混ぜる（`TR-REC-06`）。"
  mixInputChannels(input: MixInputChannelsInput!): MixInputChannelsPayload!
  "ガイドを鳴らしながら録って、回り込みを確かめる（`TR-REC-24`）。"
  checkGuideLeak(input: CheckGuideLeakInput!): CheckGuideLeakPayload!
  "音高を鳴らす（`TR-REC-23`）。 回り込みを確かめていなければ鳴らさない。"
  playGuidePitch(input: PlayGuidePitchInput!): PlayGuidePitchPayload!
  "行を指して録り始める。 行を省くと、録る順の先頭。 録った行なら世代を1つ足す（`TR-REC-21`）。"
  startTake(input: StartTakeInput!): StartTakePayload!
  "録り終えてテイクを確定する。 解析が保留でも失敗でも、確定は確定（`DEC-PLT-038`）。"
  finishTake(input: FinishTakeInput!): FinishTakePayload!
  "録る順を切り替える（`TR-SYN-19`）。 可逆。"
  chooseRecordingOrder(input: ChooseRecordingOrderInput!): ChooseRecordingOrderPayload!
  "採用するテイクを切り替える（`TR-RCL-25`）。 被覆は変わらない。"
  adoptTake(input: AdoptTakeInput!): AdoptTakePayload!
  "録れたものをそのまま鳴らす（`TR-REC-43`）。 合成を通さない。"
  playTake(input: PlayTakeInput!): PlayTakePayload!
  "テイクを指定した音高で鳴らす。"
  auditionTake(input: AuditionTakeInput!): AuditionTakePayload!
  stopPlayback(input: StopPlaybackInput!): StopPlaybackPayload!

  # ### 確認
  "1件を確かめて確定する（`REQ-ALN-008`）。"
  confirmEntry(input: ConfirmEntryInput!): ConfirmEntryPayload!
  "確認待ちをまとめて確定する（`REQ-ALN-010`）。"
  confirmPendingEntries(input: ConfirmPendingEntriesInput!): ConfirmPendingEntriesPayload!
  "個別確認をやめる（`REQ-ALN-010`, `INV-ALN-004`）。"
  switchReviewMode(input: SwitchReviewModeInput!): SwitchReviewModePayload!
  "値を直すのではなく録り直す（`REQ-ALN-009`）。"
  requestRetake(input: RequestRetakeInput!): RequestRetakePayload!
  "書き出し前の検証（`TR-ALN-20`）。 直せるものは直し、直せないものは止める。"
  validateEntries(input: ValidateEntriesInput!): ValidateEntriesPayload!

  # ### 編集
  beginEditing(input: BeginEditingInput!): BeginEditingPayload!
  "通常と上級を切り替える。 データも履歴も変えない（`TR-EDT-03`）。"
  switchEditingMode(input: SwitchEditingModeInput!): SwitchEditingModePayload!
  endEditing(input: EndEditingInput!): EndEditingPayload!
  "境界を1本動かし、その値を固定する（`REQ-ALN-005`）。 ドラッグ中の途中は送らない。"
  moveBoundary(input: MoveBoundaryInput!): MoveBoundaryPayload!
  "固定を解いて推定へ戻す（`REQ-ALN-006`）。"
  revertBoundary(input: RevertBoundaryInput!): RevertBoundaryPayload!
  "一括編集を当てる（`TR-EDT-27`）。 何件に及んでも undo 1件。"
  applyBulkEdit(input: ApplyBulkEditInput!): ApplyBulkEditPayload!
  undoEdit(input: UndoEditInput!): UndoEditPayload!
  redoEdit(input: RedoEditInput!): RedoEditPayload!

  # ### 曲
  "UST / USTX を取り込む（`TR-RCL-12`）。 題は本人が決める。"
  importSongs(input: ImportSongsInput!): ImportSongsPayload!
  renameSong(input: RenameSongInput!): RenameSongPayload!
  "曲のキーを決める（`TR-SYN-15`）。 自動では動かさない（`DEC-SYN-012`）。"
  transposeSong(input: TransposeSongInput!): TransposeSongPayload!
  addSongToBank(input: AddSongToBankInput!): AddSongToBankPayload!
  "曲をバンクから外す。 曲そのものは消さない。"
  removeSongFromBank(input: RemoveSongFromBankInput!): RemoveSongFromBankPayload!
  "選んだノートから録音リストを詰め直す（`TR-RCL-16`）。"
  repackRecordingList(input: RepackRecordingListInput!): RepackRecordingListPayload!
  "曲を歌わせる（`TR-SYN-18`）。 先頭のフレーズができた時点で鳴りはじめる。"
  singSong(input: SingSongInput!): SingSongPayload!

  # ### 配布
  saveDistributionSettings(input: SaveDistributionSettingsInput!): SaveDistributionSettingsPayload!
  "アイコンか立ち絵を入れ替える（`TR-PKG-07`）。 受け取った時点で使える画像かを確かめる。"
  replaceDistributionImage(input: ReplaceDistributionImageInput!): ReplaceDistributionImagePayload!
  removeDistributionImage(input: RemoveDistributionImageInput!): RemoveDistributionImagePayload!
  "書き出しの計画を作る。 project を変えない。"
  prepareExport(input: PrepareExportInput!): PrepareExportPayload!
  "計画どおりに書き出して、履歴に1件足す（`TR-PKG-44`）。"
  commitExport(input: CommitExportInput!): CommitExportPayload!
  "原音設定のファイルだけを書き出す（`TR-ALN-21`）。 確認が残っていれば通らない（`INV-ALN-003`）。"
  exportSettingsFile(input: ExportSettingsFileInput!): ExportSettingsFilePayload!

  # ### 背後の仕事
  "解析をやり直す。 元のテイクには触らない。"
  retryAnalysis(input: RetryAnalysisInput!): RetryAnalysisPayload!
  "仕事を止める。 観測をやめること（unsubscribe）とは別（`DEC-PLT-036`）。"
  cancelJob(input: CancelJobInput!): CancelJobPayload!
}

