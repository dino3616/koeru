# 収録（`Project.recording`）。 録る順と行を読み、テイクを録って確定し、採用を切り替える。
# テイクの波形とスペクトログラムは、見えている範囲だけを root の窓の欄で読む。

# ## 読み

extend type Query {
  "テイクの見えている範囲の波形（`TR-PLT-04`）。 読む量は画素数で決まり、範囲の広さに比例しない。"
  waveformWindow(input: WaveformWindowInput!): WaveformWindowResult!
  "テイクの見えている範囲のスペクトログラム（`TR-PLT-04`）。 素材全体を先に計算しない。"
  spectrogramWindow(input: SpectrogramWindowInput!): SpectrogramWindowResult!
}

type RecordingFacet {
  "サブバンクの枠。 並びが録る順の既定（`TR-RCL-28`）。 0 個もありうる。"
  subbanks: [Subbank!]!
  "声色ごとに枠を束ねたもの。 並びは、その声色の枠が最初に現れた順。"
  voiceColors: [VoiceColor!]!
  order: RecordingOrder!
  "`subbank` を指すと、その枠の行だけ。 省くと全部の枠の行を、枠の並びの順に。"
  rows(window: WindowInput!, subbank: SubbankId): RowPage!
  "この版に無ければ null。"
  row(id: RowId!): RecordingRow
  "この版に無ければ null。"
  take(id: TakeId!): Take
  "残りの見積もり（`TR-RCL-09`, `DEC-RCL-013`）。"
  remaining: RemainingWork!
  "音高ごとの消化率（`TR-RCL-26`）。"
  byTone: [ToneProgress!]! @deprecated(reason: "声色の違う枠が同じ音高を持てる（`DEC-RCL-018`）。 `subbanks` の `progress` を読む")
  "この音源で使うと選んだマイク（`TR-REC-03`）。 一度も選んでいなければ null。"
  chosenDevice: DeviceId
  "開いている入力。 開いていなければ null。"
  input: InputLease
  "いま録っている1回。 録っていなければ null。"
  activeCapture: Capture
  "残量の見積もり（`TR-REC-41`）。"
  space: SpaceEstimate!
  "次のフレーズへ進むまでの長さ（`TR-REC-20`）。"
  autoAdvanceMs: Float!
}

"""
サブバンクの枠（`DEC-RCL-018`）。 声色・方式・収録音階の組は、音源の中で重複しない
（`TR-RCL-28`）。 識別子は付け替えても変わらない。
"""
type Subbank {
  id: SubbankId!
  "声色の名前。 null は声色なし。 本人が打った綴りのままで、鍵にしない。"
  voiceColor: String
  method: RecordingMethod!
  "作ったときの方式プリセット。 古い project は持たない。"
  preset: MethodPresetId
  "収録音階（`TR-RCL-06`）。"
  tone: Tone!
  "担当音域（`TR-RCL-31`）。"
  toneRange: ToneRange!
  progress: SubbankProgress!
  "確定したテイクがあれば true。 方式を変えられない（`TR-RCL-30`）。"
  hasTakes: Boolean!
}

type ToneRange {
  low: Tone!
  high: Tone!
  "本人が直した範囲なら true。 false なら floor 割り当ての既定（`TR-RCL-06`）。"
  edited: Boolean!
}

type SubbankProgress {
  "採用テイクのある行。"
  recordedRows: Int!
  rows: Int!
  "固定の見積もり（`DEC-RCL-013`）。"
  remainingSeconds: Int!
}

"声色（`DEC-RCL-018`）。 同じ綴りの声色を持つ枠の束。 識別子を持たない。"
type VoiceColor {
  "null は声色なし。"
  name: String
  "枠の並びの順。"
  subbanks: [Subbank!]!
}

"録る順（`TR-SYN-19`）。 どちらの順でいるかを常に表示する。"
type RecordingOrder {
  mode: RecordingOrderMode!
  "次に録る順。 収録済みの行は入らない。"
  upcoming(window: WindowInput!): RowPage!
}

enum RecordingOrderMode {
  SONG_BANK_FIRST
  COVERAGE_EFFICIENCY
}

type RowPage {
  total: Int!
  offset: Int!
  items: [RecordingRow!]!
}

type RecordingRow {
  id: RowId!
  "この行が属する枠。"
  subbank: SubbankId!
  "読み上げる文字列。 識別子ではない。"
  prompt: String!
  state: RowState!
  "この行から取れる音の数。 被覆は行ではなくこれで数える（`TR-RCL-19`）。"
  unitCount: Int!
  "モーラ数と難読音の数（`TR-RCL-07`）。 重みを合成したスコアは返さない。"
  moraCount: Int!
  hardMoraCount: Int!
  "この行を読むと録れる対象。"
  targets: [RecordingTarget!]!
  "世代順。 採用していないものも含む（`TR-REC-21`）。 窓で読む。"
  takes(window: WindowInput!): TakePage!
  "採用しているテイク。 まだ無ければ null。"
  adoptedTake: TakeId
}

enum RowState {
  UNRECORDED
  RECORDED
  NEEDS_RETAKE
  EXCLUDED
}

"""
録る対象（`DEC-RCL-017`）。 identity は音高・方式の上の役割・音素の文脈の組で、
`renderedAlias` はそれを作成時の規則で描いた表現。
"""
type RecordingTarget {
  id: TargetId!
  tone: Tone!
  shape: TargetShape!
  "作成時に固定した規則で描いた綴り。 鍵にしない。"
  renderedAlias: String!
}

union TargetShape = CvTarget | TransitionTarget | EndingTarget

enum CvPosition {
  ISOLATED
  PHRASE_HEAD
  AFTER_VOWEL
}

type CvTarget {
  kana: String!
  position: CvPosition!
  "`position` が AFTER_VOWEL のときだけ。"
  precedingVowel: String
}

"隣り合う2モーラのあいだの渡り。"
type TransitionTarget {
  vowel: String!
  consonant: String!
}

"行末の母音が消えていく区間。"
type EndingTarget {
  vowel: String!
}

type TakePage {
  total: Int!
  offset: Int!
  items: [Take!]!
}

type Take {
  id: TakeId!
  row: RowId!
  "何本目か。 1 から。"
  generation: Int!
  "録った時刻（`DEC-RCL-015`）。 事実だけで、間隔を集計しない。"
  recordedAt: DateTime!
  durationMs: Float!
  validity: TakeValidity!
  capture: CaptureReport!
  "派生物の状態。 テイクの確定とは別に進む。"
  analysis: AnalysisState!
  "このテイクから作ったエントリ（`TR-ALN-33`）。"
  entries: [SettingEntry!]!
  "本人が付けた名前。 付けていなければ null で、画面は既定の表示（何本目か）を出す。 鍵にしない。"
  label: String
  """
  確定のあとの解析が出した音高の記録。 解析がまだ置いていない（保留・失敗・取消）あいだは null。
  録っている途中には流さない（`DEC-PLT-036`）。
  """
  pitch: PitchTrack
}

enum TakeValidity {
  VALID
  "取りこぼしで自動的に無効にした（`TR-REC-07`）。 同じ行がもう一度出てくる。"
  INVALIDATED_BY_DROPOUT
}

type CaptureReport {
  "押した瞬間より前から遡れた長さ（`TR-REC-19`）。"
  prerollMs: Float!
  "取りこぼしの回数（`TR-REC-07`）。"
  discontinuities: Int!
  "サンプルピーク（dBFS）。 無音なら null。"
  peakDbfs: Float
  "フルスケールに達した回数（`TR-REC-16`）。"
  clippedRuns: Int!
  "前後の無音（`TR-REC-38`）。 足りなくてもテイクは有効。"
  leadingMarginMs: Float!
  trailingMarginMs: Float!
  hasRequiredMargins: Boolean!
}

union AnalysisState =
  | AnalysisReady
  | AnalysisPending
  | AnalysisFailed
  | AnalysisUnavailable

type AnalysisReady {
  "境界の確信度。"
  confidence: Float!
  "推定したあとでモデルが変わった（`TR-ALN-29`）。"
  staleModel: Boolean!
}

type AnalysisPending {
  job: JobId!
}

"解析が落ちた。 テイクは確定したまま残る。"
type AnalysisFailed implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  job: JobId!
}

"この環境には解析のエンジンが無い。"
type AnalysisUnavailable implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
}

type Capture {
  id: CaptureId!
  row: RowId!
  startedAt: DateTime!
}

type RemainingWork {
  "固定の見積もり。 実測では書き換えない（`DEC-RCL-013`）。"
  seconds: Int!
  "数え上げなので正確。 多音階では音高の本数を掛けた数。"
  rows: Int!
}

type ToneProgress {
  tone: Tone!
  done: Int!
  total: Int!
}

type SpaceEstimate {
  remainingRows: Int!
  rowsThatFit: Int!
  sufficient: Boolean!
  requiredBytes: ByteCount!
  "保存先の空き。 引けなければ null。"
  availableBytes: ByteCount
}

input WaveformWindowInput {
  lease: ProjectLease!
  take: TakeId!
  fromMs: Float!
  toMs: Float!
  pixels: Int!
}

union WaveformWindowResult =
  | WaveformWindow
  | ProjectLeaseExpired
  | ReferenceNotFound
  | InvalidRequest

type WaveformWindow {
  take: TakeId!
  "画素ごと。"
  columns: [EnvelopeStep!]!
}

input SpectrogramWindowInput {
  lease: ProjectLease!
  take: TakeId!
  fromMs: Float!
  toMs: Float!
  columns: Int!
  rows: Int!
}

union SpectrogramWindowResult =
  | SpectrogramWindow
  | ProjectLeaseExpired
  | ReferenceNotFound
  | InvalidRequest

type SpectrogramWindow {
  take: TakeId!
  columns: Int!
  rows: Int!
  "列を並べた強度。 1バイトで 0〜255。"
  intensities: Base64Bytes!
}

# ## 意図

extend type Mutation {
  "行を指して録り始める。 行を省くと、録る順の先頭。 録った行なら世代を1つ足す（`TR-REC-21`）。"
  startTake(input: StartTakeInput!): StartTakePayload!
  "録り終えてテイクを確定する。 解析が保留でも失敗でも、確定は確定（`DEC-PLT-038`）。"
  finishTake(input: FinishTakeInput!): FinishTakePayload!
  "録る順を切り替える（`TR-SYN-19`）。 可逆。"
  chooseRecordingOrder(input: ChooseRecordingOrderInput!): ChooseRecordingOrderPayload!
  "採用するテイクを切り替える（`TR-RCL-25`）。 被覆は変わらない。"
  adoptTake(input: AdoptTakeInput!): AdoptTakePayload!
  "サブバンクの枠を足す（`TR-RCL-28`）。 作ったあとでも足せ、足した枠は未収録から始まる。"
  addSubbank(input: AddSubbankInput!): AddSubbankPayload!
  "枠の声色・収録音階・方式を付け替える（`TR-RCL-30`）。 録ってある枠の方式は変えられない。"
  reviseSubbank(input: ReviseSubbankInput!): ReviseSubbankPayload!
  "枠を並べ替える。 並びが録る順の既定になる（`TR-RCL-28`）。"
  reorderSubbanks(input: ReorderSubbanksInput!): ReorderSubbanksPayload!
  "枠の担当音域を直す。 範囲を省くと既定へ戻す（`TR-RCL-31`）。"
  setSubbankToneRange(input: SetSubbankToneRangeInput!): SetSubbankToneRangePayload!
  "枠を消す。 その枠のテイクも消える（`TR-RCL-29`）。 ほかの枠は変わらない。"
  removeSubbank(input: RemoveSubbankInput!): RemoveSubbankPayload!
}

input StartTakeInput {
  lease: ProjectLease!
  input: InputLeaseId!
  "省くと録る順の先頭。"
  row: RowId
  "`row` を省いたとき、この枠の録る順の先頭から。 両方省くと、全部の枠の録る順の先頭。"
  subbank: SubbankId
}

type StartTakePayload {
  outcome: StartTakeOutcome!
}

union StartTakeOutcome =
  | TakeStarted
  | ActionRejected
  | ReferenceNotFound
  | StorageProblem
  | ResourceBusy
  | DeviceUnavailable
  | InputLeaseEnded
  | ProjectLeaseExpired

type TakeStarted {
  capture: Capture!
}

input FinishTakeInput {
  lease: ProjectLease!
  operationId: OperationId!
  capture: CaptureId!
}

type FinishTakePayload {
  receipt: MutationReceipt!
  outcome: FinishTakeOutcome!
}

union FinishTakeOutcome =
  | TakeCommitted
  | ActionRejected
  | RecoveryRequired
  | StorageProblem
  | DeviceUnavailable
  | ProjectLeaseExpired
  | OperationIdReused

"""
テイクを確定した。 取りこぼしで無効にしたかは `take.validity`、解析の進みは
`take.analysis` が持つ。
"""
type TakeCommitted {
  take: Take!
}

input ChooseRecordingOrderInput {
  lease: ProjectLease!
  operationId: OperationId!
  mode: RecordingOrderMode!
}

type ChooseRecordingOrderPayload {
  receipt: MutationReceipt!
  outcome: ChooseRecordingOrderOutcome!
}

union ChooseRecordingOrderOutcome =
  | RecordingOrderChosen
  | ProjectLeaseExpired
  | OperationIdReused

type RecordingOrderChosen {
  order: RecordingOrder!
}

input AdoptTakeInput {
  lease: ProjectLease!
  operationId: OperationId!
  "画面が読んでいた版。 別の版で当てない。"
  baseRevision: Revision!
  row: RowId!
  take: TakeId!
}

type AdoptTakePayload {
  receipt: MutationReceipt!
  outcome: AdoptTakeOutcome!
}

union AdoptTakeOutcome =
  | TakeAdopted
  | RevisionConflict
  | ReferenceNotFound
  | ActionRejected
  | ProjectLeaseExpired
  | OperationIdReused

type TakeAdopted {
  row: RecordingRow!
}

# ### サブバンクの枠（`DEC-RCL-018`）

"""
同じ声色・方式・収録音階の枠が、もうある。 声色は綴りが同じなら同じ声色として比べる。
"""
type SubbankConflict implements Problem {
  code: String!
  class: FailureClass!
  commit: CommitState!
  actions: [CallerAction!]!
  message: String!
  existing: SubbankId!
}

input AddSubbankInput {
  lease: ProjectLease!
  operationId: OperationId!
  "省くと声色なし。"
  voiceColor: String
  "`Catalog.methodPresets` の `id`。 方式はプリセットが決める。"
  preset: MethodPresetId!
  "収録音階（MIDI）。"
  tone: Int!
  "この枠の後ろに置く。 省くと末尾。"
  after: SubbankId
}

type AddSubbankPayload {
  receipt: MutationReceipt!
  outcome: AddSubbankOutcome!
}

union AddSubbankOutcome =
  | SubbankAdded
  | SubbankConflict
  | ReferenceNotFound
  | InvalidRequest
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SubbankAdded {
  subbank: Subbank!
}

"省いた欄は変えない。 声色を声色なしへ戻すときは `clearVoiceColor` を使う。"
input ReviseSubbankInput {
  lease: ProjectLease!
  operationId: OperationId!
  "画面が読んでいた版。 別の版で当てない。"
  baseRevision: Revision!
  subbank: SubbankId!
  voiceColor: String
  clearVoiceColor: Boolean
  "収録音階（MIDI）。 付け替えても音声は変えない（`TR-RCL-30`）。"
  tone: Int
  "録ってある枠では断る（`TR-RCL-30`）。"
  preset: MethodPresetId
}

type ReviseSubbankPayload {
  receipt: MutationReceipt!
  outcome: ReviseSubbankOutcome!
}

union ReviseSubbankOutcome =
  | SubbankRevised
  | SubbankConflict
  | RevisionConflict
  | ActionRejected
  | ReferenceNotFound
  | InvalidRequest
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SubbankRevised {
  subbank: Subbank!
}

input ReorderSubbanksInput {
  lease: ProjectLease!
  operationId: OperationId!
  "画面が読んでいた版。 別の版で当てない。"
  baseRevision: Revision!
  "すべての枠を、新しい並びで。 欠けや重複は `InvalidRequest`。"
  order: [SubbankId!]!
}

type ReorderSubbanksPayload {
  receipt: MutationReceipt!
  outcome: ReorderSubbanksOutcome!
}

union ReorderSubbanksOutcome =
  | SubbanksReordered
  | RevisionConflict
  | InvalidRequest
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SubbanksReordered {
  subbanks: [Subbank!]!
}

input ToneRangeInput {
  "MIDI。"
  low: Int!
  "MIDI。"
  high: Int!
}

input SetSubbankToneRangeInput {
  lease: ProjectLease!
  operationId: OperationId!
  "画面が読んでいた版。 別の版で当てない。"
  baseRevision: Revision!
  subbank: SubbankId!
  "省くと既定（floor 割り当て）へ戻す。"
  range: ToneRangeInput
}

type SetSubbankToneRangePayload {
  receipt: MutationReceipt!
  outcome: SetSubbankToneRangeOutcome!
}

union SetSubbankToneRangeOutcome =
  | SubbankToneRangeSet
  | RevisionConflict
  | ActionRejected
  | ReferenceNotFound
  | InvalidRequest
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SubbankToneRangeSet {
  "直した枠と、既定が動いた同じ声色の枠。"
  subbanks: [Subbank!]!
}

"""
録ってある枠を消すと、テイクも消える（`TR-RCL-29`）。 画面は消えるテイクの数を示して
確認を取り、その数を `acknowledgedTakes` に入れる。 数が今の版と違えば `RevisionConflict`。
"""
input RemoveSubbankInput {
  lease: ProjectLease!
  operationId: OperationId!
  "画面が読んでいた版。 別の版で当てない。"
  baseRevision: Revision!
  subbank: SubbankId!
  "本人に示した、消えるテイクの数。"
  acknowledgedTakes: Int!
}

type RemoveSubbankPayload {
  receipt: MutationReceipt!
  outcome: RemoveSubbankOutcome!
}

"""
録っている途中の枠と、復旧候補が残っている枠は消せない（`ActionRejected`）。 先に録り終えるか、
候補を採るか捨てる。
"""
union RemoveSubbankOutcome =
  | SubbankRemoved
  | RevisionConflict
  | ActionRejected
  | ResourceBusy
  | ReferenceNotFound
  | StorageProblem
  | ProjectLeaseExpired
  | OperationIdReused

type SubbankRemoved {
  subbank: SubbankId!
  removedTakes: Int!
}

# ### テイクの名前と音高の記録

"""
テイクの音高の記録（F0）。 周波数表（`.frq`）と同じ系列で、テイクの先頭から末尾までを
等間隔の格子で覆う（`TR-PKG-05`, `DEC-SYN-008`）。 `hz` の `i` 番目は、テイクの先頭から
`hop` × `i` 標本の位置の音高。
"""
type PitchTrack {
  "格子の間隔。"
  hop: SampleCount!
  "格子ごとの F0（Hz）。 無声・無音のところは null で、前後の値で埋めない。"
  hz: [Float]!
}

extend type Mutation {
  "テイクに名前を付ける。 付け直せ、消すと既定の表示へ戻る。 録音もエントリも変えない。"
  renameTake(input: RenameTakeInput!): RenameTakePayload!
}

input RenameTakeInput {
  lease: ProjectLease!
  operationId: OperationId!
  take: TakeId!
  "省くか、前後の空白を除いて空なら、名前を消す。"
  label: String
}

type RenameTakePayload {
  receipt: MutationReceipt!
  outcome: RenameTakeOutcome!
}

union RenameTakeOutcome =
  | TakeRenamed
  | ReferenceNotFound
  | ProjectLeaseExpired
  | OperationIdReused

type TakeRenamed {
  take: Take!
}
