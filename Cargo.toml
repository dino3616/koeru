[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dino3616/koeru"

# リポジトリ全体の lint 方針。各クレートは [lints] workspace = true で継承する。
# clippy::all は priority = -1 にしてあるので、個別の lint 指定が常に優先される。
# 例外は「行単位・ブロック単位の #[allow(...)]」で入れる。理由をコメントで残すこと。
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# エラーハンドリングの規律。unwrap は禁止、expect はブートストラップ層で許可する。
unwrap_used = "deny"
expect_used = "allow"

# 出力は tracing に統一する。println! / eprintln! / dbg! を通さない。
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# 未実装の置き忘れは警告に留める（実装中に手を止めないため）。
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }

# macOS の AVFoundation。**マイクモード検知（TR-REC-11）とマイク権限（TR-PLT-18）だけに使う。**
# CoreAudio の HAL は素の C API なので自前で束縛しており、ここは Objective-C なので届かない。
# **[Risk] 個人のリポジトリ（madsmtm）。ただし Tauri が既に objc2 を引いている。**
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# 権限要求の完了ブロックを組み立てるために要る（objc2 族）。
block2 = "0.6"

# WORLD（同梱の C++）をビルドする。**cc は rust-lang org**。
cc = "1"

# プロジェクトの永続化。**SQLite を bundled で同梱**し、OS の libsqlite3 に依存しない
# （TR-PLT-20 のオフライン完結、TR-PLT-07 の外部インストール禁止）。
# diesel-rs は Organization、Apache-2.0。
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

