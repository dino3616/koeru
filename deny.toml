# cargo-deny の設定。AGPL-3.0-or-later のプロジェクトとして取り込めるライセンスだけを許可する。
# 外部からの PR が非互換の依存を持ち込んだとき、CI がここで止める。

[licenses]
# 許可リスト方式。ここに無いライセンスは「不明」として失敗させる。
# 判定を人手に委ねないことが目的なので、allow に足すときは理由を PR に書くこと。
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "BSL-1.0",
  # コピーレフト系。AGPL-3.0-or-later なので取り込める。
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-2.0-or-later",
  "GPL-3.0-or-later",
  "AGPL-3.0-or-later",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# 非商用限定・再配布禁止・独自条項は allow に載らないので自動的に失敗する。
# 意図的に例外を作る場合はここに明示し、理由を書く。
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ワークスペース内の path 依存は版を書かない。**外から引くものではないので、
# ここを deny の対象にしても意味が無い。**
allow-wildcard-paths = true

[advisories]
# すべて unmaintained で、脆弱性は1件も無い（`cargo deny check advisories` で確認）。
# 出どころは Tauri の Linux バックエンド（GTK3 系）と、その手続きマクロ。
# Tauri を採ると決めた以上（TR-PLT-03）、ここは差し替えられない。
# Tauri 側は Servo / CEF での置き換えを進めており、そこが動けばこの一覧は消える
# （DEC-PLT-014 の review_triggers）。
#
# 脆弱性が出たら止める。 ここに足してよいのは unmaintained だけ。
ignore = [
  # gtk-rs の GTK3 束縛（atk / gdk / gtk / gdkwayland / gdkx11 と各 -sys）
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # proc-macro-error（gtk3-macros 経由）
  "RUSTSEC-2024-0370",
  # unic-* （手続きマクロの識別子判定）
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
